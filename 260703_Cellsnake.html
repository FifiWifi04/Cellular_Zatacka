                                p.targetMode = (p.targetMode === 'self') ? 'attack' : 'self';
                            }
                        }
                        netState.remoteInput[msg.from] = { left: !!msg.left, right: !!msg.right, toggle: !!msg.toggle };
                    }
                    return; // 30Hz -- never worth a lobby-panel rebuild
                case 'state':
                    // T30: client-only. Discards a snapshot older than the newest
                    // already applied -- see Verification item 8; today's WS relay
                    // happens to deliver in order already, but this is what makes
                    // a future unreliable channel safe (see docs/BACKLOG.md's
                    // WebRTC migration note).
                    if (netState.role === 'client') {
                        netState.lastStateAt = performance.now();
                        if (msg.tick > netState.lastAppliedTick) {
                            netState.lastAppliedTick = msg.tick;
                            netApplyStateSnapshot(msg);
                        }
                    }
                    return; // 20Hz -- never worth a lobby-panel rebuild
                case 'world':
                    if (netState.role === 'client') netApplyWorldSnapshot(msg); // T30: client-only
                    return; // 5Hz -- never worth a lobby-panel rebuild
                case 'roundEnd':
                    netEndOnlineRoundLocally(); // T30: only ever received by clients (the host drives its own end locally)
                    return;
                case 'ping':
                    netSend({ t: 'pong', ts: msg.ts, to: msg.from });
                    return; // no render needed for a bounced ping
                case 'pong':
                    netState.rtt[msg.from] = Math.round(performance.now() - msg.ts);
                    break;
                default:
                    return;
            }
            renderNetPanel();
        }

        // T32: classifies elapsed silence per docs/tasks/T32-net-resilience.md's
        // design table. Shared by the host (per client) and every client
        // (for the host).
        function netHealthClass(elapsedMs) {
            if (elapsedMs > NET_GONE_MS) return 'gone';
            if (elapsedMs > NET_DROP_MS) return 'dropped';
            if (elapsedMs > NET_LAG_MS) return 'lagging';
            return 'ok';
        }

        // T32: host-only, idempotent. Hands the given roster peer's player to
        // the bot AI (design's recommended option, now that T03's bot is
        // competent) instead of freezing it in place as a lethal stationary
        // wall or an unexplained straight-line drive. Never un-kills an
        // already-dead player -- a drop doesn't reverse a real death.
        function netApplyClientDrop(peerId) {
            if (!netOnlineActive) return;
            let p = players.find(pl => pl.netPeerId === peerId);
            if (p && p.alive) p.isBot = true;
        }

        // T32: host-only. Hands control back once a dropped/gone peer's
        // heartbeat recovers (silent same-connection recovery) or it rejoins
        // with a new connection (netHandlePeerRejoined() calls this too).
        function netApplyClientRejoinControl(peerId) {
            let p = players.find(pl => pl.netPeerId === peerId);
            if (p) p.isBot = false;
        }

        // T32: run at NET_HEALTH_HZ (see netStartPingTimer()) for the whole
        // room lifetime, not just mid-round -- classification is cheap and
        // harmless before a round starts, and this way RTT-adjacent staleness
        // is visible in the lobby too. Host classifies every non-bot, non-self
        // ROSTER slot (not the live netState.players lobby list, which drops a
        // departed peer the instant they leave -- the fixed roster is what
        // still matters for a round in progress, and netHandlePeerRejoined()
        // keeps its peerId fields current across a reconnect). A client only
        // ever classifies the host.
        function netCheckHealth() {
            if (!netState.role) return;
            let now = performance.now();
            if (netState.role === 'host' && netOnlineActive && netState.roster) {
                for (const slot of netState.roster) {
                    if (slot.isBot || slot.peerId === netState.id) continue;
                    if (netState.confirmedGone[slot.peerId]) continue; // relay already confirmed the close -- a stray in-flight message must not un-drop them
                    let last = netState.lastSeenAt[slot.peerId];
                    if (last == null) continue; // no traffic yet this room -- don't guess
                    let cls = netHealthClass(now - last);
                    let prev = netState.peerHealth[slot.peerId];
                    netState.peerHealth[slot.peerId] = cls;
                    if (cls !== prev) {
                        if (cls === 'dropped' || cls === 'gone') netApplyClientDrop(slot.peerId);
                        else if (cls === 'ok' && (prev === 'dropped' || prev === 'gone')) netApplyClientRejoinControl(slot.peerId);
                    }
                }
            } else if (netState.role === 'client' && netState.hostId != null) {
                let last = netState.lastSeenAt[netState.hostId];
                if (last != null) {
                    let cls = netHealthClass(now - last);
                    let prev = netState.peerHealth[netState.hostId];
                    netState.peerHealth[netState.hostId] = cls;
                    // T32: a hung host (process frozen/asleep, socket never
                    // actually closes) never sends 'hostLeft' -- this is the
                    // only thing that catches that case instead of a silent
                    // freeze. A clean close is still faster (netHandleHostGone()
                    // itself guards against handling it twice).
                    if (cls === 'gone' && prev !== 'gone') netHandleHostGone('Host connection lost -- match ended.');
                }
            }
            netUpdateStatusBar();
        }

        // T32: shared by the relay-reported 'hostLeft' message and this
        // client's own heartbeat detecting a hung host -- both need the same
        // "stop, say what happened, show final standings, go back to the room
        // picker" handling (design §3/§6: never a frozen canvas). Idempotent.
        function netHandleHostGone(reason) {
            if (netState.role !== 'client' || netState.hostGoneHandled) return;
            netState.hostGoneHandled = true;
            netStopTimers();
            netState.started = false;
            // Final standings from whatever this client's own screen last knew
            // (alive flags + survivalTime, both kept current by 'state'
            // snapshots up to the moment the host vanished) -- honest without
            // inventing a stats-transfer message the host never got to send.
            let standings = players.map(p => `P${p.id}: ${p.alive ? 'alive' : 'eliminated'}`).join(' · ');
            netState.statusText = reason + ' Final -- ' + standings + ` (${survivalTime.toFixed(1)}s)`;
            netState.statusIsFinal = true;
            netState.role = null; // T32: reuses the "no role" panel branch (message + a button back to host/join) -- the lobby, not a frozen canvas
            netEndOnlineRoundLocally();
            toggleNetPanel(true); // force the panel open -- a message nobody can see is as bad as a freeze
        }

        // T32: host-only. A departed peer's cid matched within the relay's
        // rejoin window (tools/relay_server.js's REJOIN_WINDOW_MS, kept equal
        // to NET_GONE_MS). Remap every place the old peerId was recorded to the
        // new connection, hand control back, and catch the rejoiner up exactly
        // like a fresh join (reusing 'start' verbatim, targeted so nobody
        // else's round restarts) followed by a downsampled trace snapshot --
        // ordered after 'start' on purpose, since messages on one WebSocket
        // connection arrive in send order, and the client's own startRound()
        // (from 'start') must build a fresh players[] before rejoinSnapshot
        // has anywhere to write trace points.
        function netHandlePeerRejoined(oldId, newId) {
            if (!netOnlineActive || !netState.roster) return;
            let slot = netState.roster.find(r => r.peerId === oldId);
            if (slot) slot.peerId = newId;
            let p = players.find(pl => pl.netPeerId === oldId);
            if (p) p.netPeerId = newId;
            netApplyClientRejoinControl(newId);
            netState.remoteInput[newId] = netState.remoteInput[oldId] || { left: false, right: false, toggle: false };
            delete netState.remoteInput[oldId];
            netState.lastInputSeqSeen[newId] = netState.lastInputSeqSeen[oldId] || 0;
            delete netState.lastInputSeqSeen[oldId];
            delete netState.peerHealth[oldId];
            delete netState.confirmedGone[oldId]; // T32: the only place this ever clears -- a real rejoin, not mere silence
            netState.peerHealth[newId] = 'ok';
            netState.lastSeenAt[newId] = performance.now();
            delete netState.backgroundedPeers[oldId];
            netSend({ t: 'start', config: netState.startConfig, seed: 0, to: newId });
            netSend(Object.assign({ t: 'rejoinSnapshot', to: newId }, netBuildRejoinSnapshot()));
        }

        // T32: host-only, built on demand (a rejoin/resnapshot request is a
        // rare, one-off event -- not the per-frame hot path §5 governs).
        // Downsamples every player's trace to every NET_REJOIN_TRACE_STRIDE-th
        // point (plus each segment's true last point, so the growing tip is
        // still exactly where the live 'state' stream will next place it) --
        // sending the full trace (thousands of points in a long round)
        // contradicts T30's whole low-bandwidth design.
        function netBuildRejoinSnapshot() {
            return {
                players: players.map(p => {
                    let pts = [];
                    for (const seg of p.traceSegments) {
                        for (let i = 0; i < seg.length; i += NET_REJOIN_TRACE_STRIDE) pts.push([Math.round(seg[i].x), Math.round(seg[i].y)]);
                        let last = seg[seg.length - 1];
                        let lastRounded = last ? [Math.round(last.x), Math.round(last.y)] : null;
                        if (lastRounded && (pts.length === 0 || pts[pts.length - 1][0] !== lastRounded[0] || pts[pts.length - 1][1] !== lastRounded[1])) pts.push(lastRounded);
                    }
                    return { pts, isGap: p.isGap };
                })
            };
        }

        // T32: client-only. Replaces a player's local trace geometry wholesale
        // from a downsampled snapshot -- used both for a genuine rejoin (fresh
        // players[] from netStarted()'s startRound()) and for the
        // visibilitychange "catch me up" request (existing players[], stale
        // geometry). Collision is unaffected either way -- the host never reads
        // this, see the T30-era "trace-append subtlety" note above
        // netApplyStateSnapshot().
        function netApplyRejoinSnapshot(msg) {
            msg.players.forEach((entry, i) => {
                let p = players[i];
                if (!p || !entry || !entry.pts || entry.pts.length === 0) return;
                let seg = [];
                let d = 0, prevX = null, prevY = null;
                for (const [x, y] of entry.pts) {
                    if (prevX != null) d += Math.hypot(x - prevX, y - prevY);
                    seg.push({ x, y, d });
                    prevX = x; prevY = y;
                }
                seg.id = 0;
                p.traceSegments = [seg];
                p.traceDist = d;
                p.nextSegId = 1;
                p.isGap = !!entry.isGap;
            });
            traceRTNeedsFullRedraw = true; // T25: geometry replaced wholesale, must redraw
        }

        // T32: small always-in-DOM readout (hidden unless netOnlineActive) for
        // the design's "shown as" column -- a dimmed name isn't practical
        // without touching drawPlayerBars()' PIXI draw path for a per-frame
        // concern that only changes a couple times a second, so this reuses
        // the cheaper DOM route the rest of the lobby UI already uses. Only
        // lists peers NOT currently 'ok', so it stays empty and invisible
        // through ordinary play -- see netCheckHealth(), which calls this at
        // NET_HEALTH_HZ, never from the render/gameLoop hot path.
        function netUpdateStatusBar() {
            let el = document.getElementById('netStatusBar');
            if (!el) return;
            if (!netOnlineActive) { el.style.display = 'none'; return; }
            let lines = [];
            if (netState.role === 'host' && netState.roster) {
                for (const slot of netState.roster) {
                    if (slot.isBot || slot.peerId === netState.id) continue;
                    let cls = netState.peerHealth[slot.peerId] || 'ok';
                    if (cls === 'ok') continue;
                    let p = players.find(pl => pl.netPeerId === slot.peerId);
                    let label = p ? ('P' + p.id) : ('Player ' + slot.peerId);
                    let bg = netState.backgroundedPeers[slot.peerId] ? ' (backgrounded)' : '';
                    lines.push(`${label}: ${cls}${bg}`);
                }
            } else if (netState.role === 'client' && netState.hostId != null) {
                let cls = netState.peerHealth[netState.hostId] || 'ok';
                if (cls !== 'ok') lines.push(`Host: ${cls}`);
            }
            el.style.display = lines.length ? 'block' : 'none';
            el.textContent = lines.join(' · ');
        }

        // T30: applied on the client, every 'state' message that passes the
        // staleness check above. Writes straight into the same players[]/
        // traceSegments/activeCell fields stepSimulation() would have -- so
        // renderFrame()/drawTraces()/drawPlayerBars()/updateCamera() all run
        // completely unmodified, unaware they're driven by the network. Trace
        // points are reconstructed from head position + isGap using the exact
        // append rule updatePlayers() uses (segment ends on the isGap
        // true->false edge, points append to the last segment while !isGap) --
        // see the task's own "trace-append subtlety": this is cosmetic only,
        // collision is decided entirely by the host.
        function netApplyStateSnapshot(msg) {
            netState.frozen = !!msg.fr;
            if (msg.st != null) survivalTime = msg.st;
            if (msg.gn != null) activeCell.generation = msg.gn;
            msg.p.forEach((snap, i) => {
                let p = players[i];
                if (!p) return;
                // matches netBuildStateMessage()'s per-player array order exactly
                let [alive, x, y, angle, isGap, attack, ghostTimer, hunterTimer, golgiTimer, speedTimer, speedLevel, ack] = snap;
                // T31: only this client's own row gets predicted -- capture what
                // it was showing (already-applied prediction) before this
                // snapshot overwrites p.x/p.y/p.angle below, so
                // netReconcileLocalPlayer() has something to compare the
                // rewind-and-replay result against.
                let isLocalRow = netOnlineActive && netState.role === 'client' && i === netState.myIndex;
                let preX = p.x, preY = p.y, preAngle = p.angle;
                p.alive = !!alive;
                if (!p.alive) return; // nothing else about a dead player matters
                let wasGap = p.isGap;
                p.angle = angle;
                p.targetMode = attack ? 'attack' : 'self';
                p.effects.ghostTimer = ghostTimer;
                p.effects.hunterTimer = hunterTimer;
                p.effects.golgiTimer = golgiTimer;
                p.effects.speedTimer = speedTimer;
                p.effects.speedLevel = speedLevel;
                p.isGap = !!isGap;
                if (wasGap && !p.isGap) p.traceSegments.push(newTraceSegment(p)); // gap just ended -- start a fresh segment
                if (!p.isGap) {
                    let seg = p.traceSegments[p.traceSegments.length - 1];
                    let prevD = seg.length > 0 ? seg[seg.length - 1].d : p.traceDist;
                    p.traceDist = prevD + Math.hypot(x - p.x, y - p.y);
                    seg.push({ x: x, y: y, d: p.traceDist });
                    trimTraceToCap(p, MAX_TRACE_POINTS);
                }
                p.x = x; p.y = y;
                // T22 step 5's bar snapshot -- drawPlayerBars() reads these, not
                // p.x/p.effects.* directly. No pre/post-pickup ordering subtlety
                // to preserve here (unlike updatePlayers()): a single network
                // snapshot IS this frame's value.
                p.barX = p.x; p.barY = p.y;
                p.barGhostTimer = p.effects.ghostTimer; p.barHunterTimer = p.effects.hunterTimer;
                p.barGolgiTimer = p.effects.golgiTimer; p.barSpeedTimer = p.effects.speedTimer; p.barSpeedLevel = p.effects.speedLevel;
                // T31: p.x/p.y/p.angle right here are the host's raw, un-predicted
                // truth (just assigned above) -- exactly the "rewind" half of
                // rewind-and-replay. Every other row instead gets buffered for
                // netInterpolateRemotePlayers() to smooth between on the next
                // rendered frame(s); it must NOT be overwritten with this raw
                // value, so isLocalRow gates it out here.
                if (isLocalRow) netReconcileLocalPlayer(p, preX, preY, preAngle, ack || 0);
                else netRecordSnapshotSample(i, p.x, p.y, p.angle);
            });
        }

        // T31: called only for this client's own row (netApplyStateSnapshot()
        // has just rewound p.x/p.y/p.angle to the host's raw snapshot values).
        // Replays every locally-applied input newer than what the host had
        // already incorporated as of this snapshot (ackSeq), using the exact
        // same computeMovementStep() the host itself steps players with, then
        // either keeps the pre-snapshot prediction (preX/preY/preAngle) if the
        // replay landed close to it, or snaps to the replayed result.
        function netReconcileLocalPlayer(p, preX, preY, preAngle, ackSeq) {
            let inputs = netState.predInputs;
            let i = 0;
            while (i < inputs.length && inputs[i].seq <= ackSeq) i++;
            if (i > 0) inputs.splice(0, i); // those inputs are already reflected in this snapshot -- discard

            for (let j = 0; j < inputs.length; j++) {
                let inp = inputs[j];
                let step = computeMovementStep(p, inp, inp.dt);
                p.angle = step.angle; p.x = step.x; p.y = step.y;
            }

            let dx = p.x - preX, dy = p.y - preY;
            if (dx * dx + dy * dy < NET_RECONCILE_SNAP_THRESHOLD_SQ) {
                p.x = preX; p.y = preY; p.angle = preAngle; // replay agrees with what was already shown -- keep it, no jitter
            }
            // else: keep the replayed (corrected) position -- a bounded, one-shot visible correction
        }

        // T31: buffers a raw (un-interpolated) snapshot sample for a
        // non-local player index, timestamped on THIS machine's clock (not
        // the host's tick) so netInterpolateRemotePlayers() can render a
        // point in local wall-clock time regardless of network jitter.
        function netRecordSnapshotSample(i, x, y, angle) {
            let buf = netState.snapBuffer[i] || (netState.snapBuffer[i] = []);
            buf.push({ t: performance.now(), x, y, angle });
            if (buf.length > NET_SNAP_BUFFER_MAX) buf.shift();
        }

        // T31: wraps a-b into (-PI, PI] -- the shortest-arc angle delta, so
        // interpolating across the +-PI boundary doesn't spin the long way
        // around.
        function shortestAngleDelta(a, b) {
            let d = (b - a) % (Math.PI * 2);
            if (d > Math.PI) d -= Math.PI * 2;
            if (d < -Math.PI) d += Math.PI * 2;
            return d;
        }

        // T31: every rendered frame, for every player row this client is NOT
        // predicting (remote peers and bots -- both only ever move via 'state'
        // snapshots on a client), overwrite p.x/p.y/p.angle with a position
        // interpolated between the two buffered samples that bracket
        // NET_INTERP_DELAY_MS ago. Deliberately never extrapolates past the
        // newest sample (holds there instead) -- interpolating between two
        // known-good states is far more robust than guessing past the last one.
        function netInterpolateRemotePlayers() {
            let renderTime = performance.now() - NET_INTERP_DELAY_MS;
            for (let i = 0; i < players.length; i++) {
                if (i === netState.myIndex) continue;
                let p = players[i];
                if (!p || !p.alive) continue;
                let buf = netState.snapBuffer[i];
                if (!buf || buf.length === 0) continue;
                let s0 = buf[0], s1 = buf[buf.length - 1];
                if (buf.length > 1) {
                    if (renderTime <= s0.t) { s1 = s0; }
                    else if (renderTime >= s1.t) { s0 = s1; }
                    else {
                        for (let k = 0; k < buf.length - 1; k++) {
                            if (buf[k].t <= renderTime && renderTime <= buf[k + 1].t) { s0 = buf[k]; s1 = buf[k + 1]; break; }
                        }
                    }
                }
                if (s0 === s1) {
                    p.x = s0.x; p.y = s0.y; p.angle = s0.angle;
                } else {
                    let t = (renderTime - s0.t) / (s1.t - s0.t);
                    p.x = s0.x + (s1.x - s0.x) * t;
                    p.y = s0.y + (s1.y - s0.y) * t;
                    p.angle = s0.angle + shortestAngleDelta(s0.angle, s1.angle) * t;
                }
            }
        }

        // T31: the network client's twin of the host's `keys`-driven branch in
        // updatePlayers() -- applies input to the local head the instant it is
        // made, every rendered frame, instead of waiting a round trip for the
        // host to echo it back. Always reads the arrow keys directly (online
        // play is one keyboard per machine; see netStartTimers()'s inputTimer,
        // which sends the same keys regardless of roster slot). Records what
        // it applied, tagged with the input seq most recently sent, so
        // netReconcileLocalPlayer() can replay exactly this once the host acks
        // an earlier seq. Never predicts death/collection/effects -- those stay
        // host-authoritative and only ever change via netApplyStateSnapshot().
        function netPredictLocalPlayer(deltaSec) {
            if (netState.frozen) return;
            let p = players[netState.myIndex];
            if (!p || !p.alive) return;
            let input = { left: !!keys['ArrowLeft'], right: !!keys['ArrowRight'] };
            let delta = deltaSec * 60; // frame-units, matching FIXED_DT's own delta=1 per 1/60s tick
            let step = computeMovementStep(p, input, delta);
            p.angle = step.angle; p.x = step.x; p.y = step.y;
            netState.predInputs.push({ seq: netState.mySeq, left: input.left, right: input.right, dt: delta });
            if (netState.predInputs.length > NET_PRED_BUFFER_MAX) netState.predInputs.shift();
        }

        // T30: applied on the client, every 'world' message (no staleness
        // tracking -- a dropped or reordered one just means organelle/vesicle
        // positions jump slightly instead of drifting smoothly, self-corrected
        // within one more tick; nothing depends on strict ordering here the way
        // trace reconstruction does above). Organelle count/order is fixed for
        // a Gen 1 round with no mitosis event yet (see Findings), so sprites
        // are created once and then just have their fields updated in place;
        // vesicles are redrawn from scratch every frame by drawVesicles() (no
        // persistent sprite), so that array can just be replaced wholesale.
        function netApplyWorldSnapshot(msg) {
            if (msg.rx != null) { activeCell.radiusX = msg.rx; activeCell.radiusY = msg.ry; }
            for (let i = 0; i < msg.o.length; i++) {
                // matches netBuildWorldMessage()'s per-organelle array order exactly
                let [x, y, radius, isMito, rotation, necrotic] = msg.o[i];
                let type = isMito ? 'mitochondria' : 'lysosome';
                let o = organelles[i];
                if (!o) {
                    o = { x, y, radius, type, color: isMito ? C_MITO : C_LYSO, rotation, necrotic: !!necrotic, vx: 0, vy: 0, rotSpeed: 0 };
                    attachOrganelleSprite(o, createOrganelleGraphics(o, !!necrotic));
                    organelles[i] = o;
                } else {
                    o.x = x; o.y = y; o.rotation = rotation; o.necrotic = !!necrotic;
                }
            }
            while (organelles.length > msg.o.length) destroyOrganelleSprite(organelles.pop());
            vesicles = msg.v.map(([x, y, radius, typeCode, rotation]) => {
                let type = typeCode === 1 ? 'mitochondria' : (typeCode === 2 ? 'lysosome' : 'membrane');
                let color = typeCode === 1 ? C_MITO : (typeCode === 2 ? C_LYSO : C_MEMB);
                return { x, y, radius, type, color, rotation, vx: 0, vy: 0 };
            });
        }

        // T30: shared by the host (called directly from stepSimulation()'s two
        // round-end branches) and the client (called from the 'roundEnd'
        // message case above) -- both need the same "stop treating this as an
        // online round, show the menu" cleanup; only the host also has to tell
        // everyone else.
        function netHandleRoundEnd() {
            if (!netOnlineActive) return;
            if (netState.role === 'host') netSend({ t: 'roundEnd' });
            netOnlineActive = false;
        }

        // T30: the client-side twin of the line above -- isPlaying/uiElement
        // are host-owned in an online round (stepSimulation() never runs here),
        // so a client only learns the round ended from an explicit message
        // ('roundEnd') or the host disconnecting ('hostLeft'), not from its own
        // simulation returning {ended:true}.
        function netEndOnlineRoundLocally() {
            if (!netOnlineActive) return;
            isPlaying = false;
            uiElement.classList.remove('hidden-ui');
            netOnlineActive = false;
        }

        // T30: builds the round roster identically on every peer, from data
        // every peer already has by the time 'start' arrives -- netState.players
        // (broadcast by the relay in insertion order: host first, then joiners
        // in join order, see relay_server.js's Map) and the config the host
        // just broadcast alongside it. No extra round-trip needed. Bots are
        // clamped so peers+bots never exceeds the 4 playerConfigs slots.
        function netBuildRoster(config) {
            let bots = Math.max(0, Math.min(config.ai, 4 - netState.players.length));
            let roster = netState.players.map(p => ({ peerId: p.id, isBot: false }));
            for (let i = 0; i < bots; i++) roster.push({ peerId: null, isBot: true });
            return roster;
        }

        // T30: fires on the host right after it sends 'start', and on every
        // client the moment the relayed 'start' arrives -- neither waits for an
        // echo of its own broadcast. Builds the shared roster, adopts the
        // host's chosen speed/camera (gameplay-critical, must match exactly;
        // config is the single source of truth for every peer, not each
        // machine's own menu selects), and launches the round exactly like the
        // offline Start button does, just sourced from the network roster
        // (see startRound()'s netOnlineActive branch) instead of currentMode/aiCount.
        function netStarted(config) {
            netState.started = true;
            netState.roster = netBuildRoster(config);
            netState.myIndex = netState.roster.findIndex(r => r.peerId === netState.id);
            netState.snapBuffer = []; // T31: a room can host more than one round -- drop any prior round's samples
            netState.predInputs = [];
            netOnlineActive = true;
            currentSpeed = config.speed;
            cameraMode = config.camera;
            document.getElementById('netOverlay').classList.add('hidden-help');
            startRound();
            netStartTimers();
            renderNetPanel();
        }

        // Runs from the moment a room is created/joined (not gated on
        // "started") so RTT is visible in the plain lobby list too.
        function netStartPingTimer() {
            clearInterval(netState.pingTimer);
            netState.pingTimer = setInterval(() => {
                if (netState.role === 'client') {
                    netSend({ t: 'ping', ts: performance.now(), to: netState.hostId });
                } else {
                    for (const p of netState.players) {
                        if (p.id !== netState.id) netSend({ t: 'ping', ts: performance.now(), to: p.id });
                    }
                }
            }, 1000 / NET_PING_HZ);
            // T32: same lifetime as the ping timer above -- classification is
            // meaningful from the moment a room forms, not just mid-round.
            clearInterval(netState.healthTimer);
            netState.healthTimer = setInterval(netCheckHealth, 1000 / NET_HEALTH_HZ);
        }

        // Runs once the host actually starts the round (netStarted()). Clients
        // sample their own held keys and send input; the host broadcasts real
        // gameplay snapshots at two rates (see netBuildStateMessage()/
        // netBuildWorldMessage()) -- always arrow keys regardless of which
        // roster slot this peer landed in, since online play is one keyboard
        // per machine, not local multiplayer's shared-keyboard slot mapping.
        function netStartTimers() {
            clearInterval(netState.inputTimer);
            clearInterval(netState.stateTimer);
            clearInterval(netState.worldTimer);
            if (netState.role === 'client') {
                netState.inputTimer = setInterval(() => {
                    netState.mySeq++;
                    netSend({
                        t: 'input', seq: netState.mySeq,
                        left: !!keys['ArrowLeft'], right: !!keys['ArrowRight'], toggle: !!keys['ArrowDown']
                    });
                }, 1000 / NET_INPUT_HZ);
            }
            if (netState.role === 'host') {
                netState.stateTimer = setInterval(() => {
                    netState.mySeq++;
                    netSend(netBuildStateMessage());
                }, 1000 / NET_STATE_HZ);
                netState.worldTimer = setInterval(() => {
                    netSend(netBuildWorldMessage());
                }, 1000 / NET_WORLD_HZ);
            }
        }

        // T30: host-only, called from the stateTimer above. Per-player snapshot
        // in netState.roster order -- every peer computed that same order
        // independently from the same 'lobby'+'start' data (see
        // netBuildRoster()), so no per-entry id is needed on the wire. Traces
        // are never sent -- see the "trace-append subtlety" note above
        // netApplyStateSnapshot(). Positional arrays (not objects) and rounded
        // numbers, not verbose keys -- an early object-keyed version measured
        // ~12KB/s combined with netBuildWorldMessage() below, well past the
        // design note's "low single-digit KB/s"; see Findings for the before/after.
        function netBuildStateMessage() {
            return {
                t: 'state', tick: netState.mySeq,
                fr: lastIsCellFrozen ? 1 : 0, st: Math.round(survivalTime * 10) / 10, gn: activeCell.generation,
                // per player: [alive, x, y, angle, isGap, attackMode, ghostTimer, hunterTimer, golgiTimer, speedTimer, speedLevel, ack]
                // T31: ack is the highest 'input' seq the host has received from this player's own peer (0 for a
                // bot or the host's own local row, neither of which reconcile) -- lets that one peer's client
                // replay only the inputs the host hasn't incorporated yet.
                p: players.map(p => [
                    p.alive ? 1 : 0, Math.round(p.x), Math.round(p.y), Math.round(p.angle * 1000) / 1000,
                    p.isGap ? 1 : 0, p.targetMode === 'attack' ? 1 : 0,
                    Math.round(p.effects.ghostTimer * 10) / 10, Math.round(p.effects.hunterTimer * 10) / 10,
                    Math.round(p.effects.golgiTimer * 10) / 10, Math.round(p.effects.speedTimer * 10) / 10, p.effects.speedLevel,
                    p.netPeerId != null ? (netState.lastInputSeqSeen[p.netPeerId] || 0) : 0
                ])
            };
        }

        // T30: host-only, called from the worldTimer above. Full-list
        // reconciliation for organelles/vesicles (see this file's message
        // envelope comment for why that differs from the task's literal
        // "events" wording for vesicles) plus the membrane radii (Gen 2+
        // calcification -- cheap, and without it a long-enough round would
        // show clients a membrane in the wrong place even though nothing dies
        // to it incorrectly, since collision stays host-only). ER/Golgi
        // geometry and every other Gen2+ hazard system are NOT included --
        // documented gap, see Findings/BACKLOG. Positional arrays, rounded
        // numbers, no color (createOrganelleGraphics()/drawVesicles() already
        // derive color purely from type -- see Findings) -- same bandwidth
        // reasoning as netBuildStateMessage() above.
        function netBuildWorldMessage() {
            return {
                t: 'world',
                rx: Math.round(activeCell.radiusX), ry: Math.round(activeCell.radiusY),
                // per organelle: [x, y, radius, isMitochondria(0/1, else lysosome), rotation, necrotic(0/1)]
                o: organelles.map(o => [Math.round(o.x), Math.round(o.y), Math.round(o.radius), o.type === 'mitochondria' ? 1 : 0, Math.round(o.rotation * 100) / 100, o.necrotic ? 1 : 0]),
                // per vesicle: [x, y, radius, type(1=mitochondria,2=lysosome,0=membrane), rotation]
                v: vesicles.map(v => [Math.round(v.x), Math.round(v.y), Math.round(v.radius), v.type === 'mitochondria' ? 1 : (v.type === 'lysosome' ? 2 : 0), Math.round(v.rotation * 100) / 100])
            };
        }

        window.netHostRoom = function () {
            let name = (document.getElementById('netNameInput').value || 'Player').slice(0, 16);
            localStorage.setItem('cz_netName', name);
            netConnect(() => netSend({ t: 'create', v: NET_PROTOCOL_VERSION, name, cid: netClientId() }));
        };

        window.netJoinRoomClick = function () {
            let name = (document.getElementById('netNameInput').value || 'Player').slice(0, 16);
            let room = (document.getElementById('netRoomInput').value || '').toUpperCase().trim();
            localStorage.setItem('cz_netName', name);
            if (!room) {
                netState.statusText = 'Enter a room code.'; netState.statusIsFinal = true;
                renderNetPanel();
                return;
            }
            // T32: cid lets the relay recognise a reconnect within the rejoin
            // window (tools/relay_server.js) as the same player instead of a
            // brand-new one -- see netHandlePeerRejoined().
            netConnect(() => netSend({ t: 'join', v: NET_PROTOCOL_VERSION, name, room, cid: netClientId() }));
        };

        window.netLeaveRoom = function () {
            netSend({ t: 'bye' });
            netEndOnlineRoundLocally(); // T30: abandoning mid-round must not leave isPlaying stuck true
            resetNetState();
            renderNetPanel();
        };

        // T29: is the online panel currently up? Mirrors helpIsOpen()/
        // highScoreIsOpen()/shopIsOpen() -- Escape/P and the outside-click
        // resume both have to defer to it while it's open.
        function netIsOpen() {
            return !document.getElementById('netOverlay').classList.contains('hidden-help');
        }

        // Same pause/resume contract as toggleHelpPanel/toggleHighScorePanel/toggleShopPanel.
        window.toggleNetPanel = function (show) {
            let overlay = document.getElementById('netOverlay');
            if (show) {
                renderNetPanel();
                uiElement.classList.add('hidden-ui');
                overlay.classList.remove('hidden-help');
                if (isPlaying) paused = true;
            } else {
                overlay.classList.add('hidden-help');
                if (isPlaying) paused = false;
                else uiElement.classList.remove('hidden-ui');
            }
        };

        function renderNetPanel() {
            let el = document.getElementById('netContent');
            if (!el) return; // overlay not open yet this session -- nothing to draw into

            if (!netState.ws) {
                el.innerHTML = `
                    <p class="shop-note">Play with others in different browsers over a small WebSocket relay
                    (<code>tools/relay_server.js</code>). The host is authoritative; everyone else renders what the host sends.</p>
                    <p class="shop-note">A dropped player is handed to the bot AI and can rejoin their slot within 15s.
                    If the host disconnects, the match ends for everyone -- there is no host handoff yet.</p>
                    <label class="net-field">Name<input id="netNameInput" maxlength="16" value="${netDefaultName()}"></label>
                    <div class="net-row">
                        <button onclick="netHostRoom()">Host a room</button>
                    </div>
                    <div class="net-row">
                        <input id="netRoomInput" maxlength="6" placeholder="ROOM CODE" style="text-transform:uppercase">
                        <button onclick="netJoinRoomClick()">Join</button>
                    </div>
                    ${netState.statusText ? `<p class="shop-note">${netState.statusText}</p>` : ''}
                `;
                return;
            }

            if (!netState.role) {
                el.innerHTML = `<p class="shop-note">${netState.statusText}</p><button onclick="netLeaveRoom()">Cancel</button>`;
                return;
            }

            let rows = netState.players.map(p => {
                let you = p.id === netState.id;
                let label = p.name + (p.isHost ? ' (Host)' : '') + (you ? ' -- you' : '');
                let extra;
                if (you) {
                    extra = '';
                } else if (netState.role === 'host') {
                    extra = netState.started ? `input seq ${netState.lastInputSeqSeen[p.id] ?? '-'}` : (netState.rtt[p.id] != null ? netState.rtt[p.id] + 'ms' : '...');
                } else {
                    extra = netState.rtt[p.id] != null ? netState.rtt[p.id] + 'ms' : '...';
                }
                return `<div class="shop-row"><div class="shop-row-info"><b>${label}</b></div><span class="shop-owned">${extra}</span></div>`;
            }).join('');

            // T30: this panel closes itself the instant netStarted() launches
            // the round (see netStarted()), so `netState.started` is only ever
            // true here for the brief window between clicking Start and the
            // overlay hiding -- this branch is effectively unreachable in
            // normal play, but kept truthful rather than left describing the
            // old pre-T30 transport-only demo.
            let demoLine = '';
            if (netState.started) {
                demoLine = netState.role === 'host' ? 'Starting...' : 'Joining the round...';
            }

            el.innerHTML = `
                <p><b>Room ${netState.room}</b> -- ${netState.statusText}</p>
                ${rows}
                ${netState.started
                    ? `<p class="shop-note">${demoLine}</p>`
                    : (netState.role === 'host' ? `<button onclick="netHostStart()">Start round</button>` : `<p class="shop-note">Waiting for the host to start.</p>`)}
                <button onclick="netLeaveRoom()">Leave</button>
            `;
        }

        window.netHostStart = function () {
            if (netState.role !== 'host') return;
            let seed = Math.floor(Math.random() * 0xffffffff); // not yet consumed -- reserved for a future shared-map-geometry pass, see BACKLOG
            // Read the DOM selects directly, not the currentMode/aiCount/
            // cameraMode/currentSpeed globals -- those are only set once
            // updateUI() has run at least once, which is not guaranteed here
            // (a host can open Online and start without ever touching the main
            // menu; see the "updateUI() is not called at startup" comment above
            // renderControlSplash()). config.ai is the *requested* bot count --
            // netBuildRoster() clamps it to fit the 4 playerConfigs slots.
            let config = {
                mode: parseInt(modeSelect.value), ai: parseInt(aiSelect.value),
                camera: document.getElementById('cameraSelect').value,
                speed: parseFloat(speedSelect.value)
            };
            netState.startConfig = config; // T32: resent (targeted) to a rejoining peer -- see netHandlePeerRejoined()
            netSend({ t: 'start', config, seed });
            netStarted(config); // the host does not wait for an echo of its own broadcast
        };

        // T32: backgrounding must not look like a silent freeze or an
        // unexplained disconnect. Distinct from T23's touch-release listener
        // above (same event, different concern) -- both must fire, so this is
        // a second listener, not a replacement.
        document.addEventListener('visibilitychange', () => {
            if (!netOnlineActive) return;
            netSend({ t: 'bg', hidden: document.hidden });
            if (!document.hidden && netState.role === 'client') netSend({ t: 'requestSnapshot' });
        });

    </script>
</body>

</html>
