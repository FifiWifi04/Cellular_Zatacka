                            if (target.effects.redCount >= 5) {
                                target.effects.hunterTimer = 10.0;
                                target.effects.redCount = 0;
                            } else if (target.effects.redCount === 3) {
                                deleteOldestTrace(target, 0.5); // 50% wipe
                            }
                            if (target.traceSegments.length > 1) {
                                // T42: depolymerisation burst -- sample the segment
                                // before it's shifted away and scatter loose dimers
                                // from it, reusing T17's pool (no second particle system).
                                let removed = target.traceSegments[0];
                                let sampleStep = Math.max(1, Math.floor(removed.length / 6));
                                for (let ri = 0; ri < removed.length; ri += sampleStep) {
                                    let rp = removed[ri];
                                    emitParticles(rp.x, rp.y, 2, { speed: 3.5, spread: Math.PI * 2, life: 0.5, size: 2, color: (ri & 1) ? target.color : target.coreColor });
                                }
                                target.traceSegments.shift(); traceRTNeedsFullRedraw = true; // T25: front geometry removed, RT must be redrawn
                            }
                        }
                        else if (v.type === 'mitochondria') {
                            if (target.effects.speedLevel === 2) {
                                target.effects.speedTimer = Math.min(10.0, target.effects.speedTimer + 3.0);
                                target.effects.lastMitoHit = survivalTime;
                            } else {
                                if (target.effects.lastMitoHit && (survivalTime - target.effects.lastMitoHit) < 3.0) target.effects.speedLevel = 2;
                                else target.effects.speedLevel = 1;

                                target.effects.speedTimer = Math.min(15.0, target.effects.speedTimer + EFFECT_DURATION);
                                target.effects.lastMitoHit = survivalTime;
                            }
                        }
                        emitParticles(v.x, v.y, 12, { speed: 2.5, spread: Math.PI * 2, life: 0.6, size: 3, color: v.color }); // T17
                        vesicles.splice(i, 1);
                    }
                }

                // 3.5 ATP Granule Collection (T51) -- the membrane and its shrink are
                // shared by every player in the cell, so unlike the vesicles above this
                // is a global effect: no boostTarget() redirect, every pickup adds to
                // the one calcifyPauseTimer, capped at ATP_PAUSE_MAX.
                for (let i = atpGranules.length - 1; i >= 0; i--) {
                    let g = atpGranules[i];
                    if (Math.hypot(nextX - g.x, nextY - g.y) < g.radius + TRACE_WIDTH + 6 + p.upgrades.pickupRadiusBonus) { // T55
                        calcifyPauseTimer = Math.min(ATP_PAUSE_MAX, calcifyPauseTimer + ATP_PAUSE_DURATION);
                        emitParticles(g.x, g.y, 10, { speed: 2.5, spread: Math.PI * 2, life: 0.6, size: 3, color: ATP_COLOR }); // T17
                        atpGranules.splice(i, 1);
                    }
                }

                // 4. Trace Drawing & Gap Management
                // T28: gap chance/length are world-distance triggers now (see
                // GAP_DISTANCE_MEAN/GAP_LENGTH_DIST), not per-frame counters --
                // stepDist is this step's actual travel distance, so gap
                // spacing/length no longer depend on frame rate or speed setting.
                // T31: nextX/nextY -> p.x/p.y is exactly actualSpeed*delta long in
                // both branches above (each computes it via cos/sin * actualSpeed *
                // delta), so this hypot is identical to the old shared-scope
                // `actualSpeed * delta` -- computed this way since actualSpeed
                // itself is no longer in scope here (it's local to each movement
                // branch above, including inside computeMovementStep()).
                let stepDist = Math.hypot(nextX - p.x, nextY - p.y);
                if (p.isGap) {
                    p.gapDist -= stepDist;
                    if (p.gapDist <= 0) {
                        p.isGap = false;
                        p.traceSegments.push(newTraceSegment(p));
                    }
                } else if (!isGhost) {
                    p.distSinceGap += stepDist;
                    if (p.distSinceGap >= p.nextGapAt) {
                        p.isGap = true;
                        p.gapDist = GAP_LENGTH_DIST;
                        p.distSinceGap = 0;
                        p.nextGapAt = GAP_DISTANCE_MEAN * (0.5 + Math.random()); // jitter, mean-preserving
                    }
                }

                if (isGhost) {
                    if (!p.wasGhost) p.wasGhost = true;
                } else if (p.wasGhost) {
                    p.wasGhost = false;
                    p.traceSegments.push(newTraceSegment(p)); // Start a fresh line after Ghost Mode ends
                }

                // 5. Apply Final Movement
                if (!p.isGap && !isGhost) {
                    let seg = p.traceSegments[p.traceSegments.length - 1];
                    // prevD falls back to p.traceDist (not 0) for a freshly-started
                    // segment, so the neck-immunity distance stays continuous across
                    // a gap or ghost-mode break instead of resetting at the seam.
                    let prevD = seg.length > 0 ? seg[seg.length - 1].d : p.traceDist;
                    p.traceDist = prevD + Math.hypot(nextX - p.x, nextY - p.y);
                    seg.push({ x: nextX, y: nextY, d: p.traceDist });
                }
                trimTraceToCap(p, MAX_TRACE_POINTS);

                // T53: unconditional (unlike p.traceDist above, which only tracks
                // drawn-trace length) so gap/ghost movement still counts toward the
                // anti-turtling distance term -- actualSpeed*delta already accounts
                // for elapsed real time (see stepHeadless's comment), so this stays
                // frame-rate independent without a separate deltaSec multiply.
                p.stats.distance += Math.hypot(nextX - p.x, nextY - p.y);

                p.x = nextX;
                p.y = nextY;

                // T17: locomotion splash, throttled to one particle every
                // LOCOMOTION_PARTICLE_INTERVAL frames per player (see the pool-load
                // comment at its declaration).
                if (!p.isGap && !isGhost) {
                    p.particleTick = (p.particleTick + 1) % LOCOMOTION_PARTICLE_INTERVAL;
                    if (p.particleTick === 0) {
                        // T42: alternate alpha/beta tubulin colour, keyed off the same
                        // .d-based parity as stampDimer() -- reads as dimers assembling
                        // onto the trace as it forms.
                        let dimerColor = (Math.floor(p.traceDist / DIMER_SPACING) & 1) ? p.color : p.coreColor;
                        emitParticles(p.x, p.y, 1, { speed: 1.0, spread: 0.6, angle: p.angle + Math.PI, life: 0.4, size: 2, color: dimerColor });
                    }

                    // T56: incoming tubulin dimers -- free subunits spawn just off
                    // the tip and drift inward, "docking" as they fade, the mirror
                    // of the depolymerisation burst above (lysosome pickup, same
                    // sampled-outward-from-a-point-and-scattered shape, opposite
                    // direction). Same pooled emitParticles() as everything else in
                    // this file -- no second particle system. Gated on useDimerLOD
                    // (the lattice motif itself being visible) so nothing spawns
                    // toward a tip nobody can see, and hard-capped per player via
                    // assemblyLiveCount regardless of spawn cadence.
                    if (world.scale.x >= DIMER_LOD_ZOOM) {
                        p.assemblyTick = (p.assemblyTick + 1) % assemblyDimerInterval;
                        if (p.assemblyTick === 0 && assemblyLiveCount[pi] < ASSEMBLY_DIMERS_MAX) {
                            let side = (Math.floor(p.traceDist / DIMER_SPACING) & 1) ? 1 : -1;
                            let spawnAngle = p.angle + side * (0.5 + Math.random() * 0.4);
                            let sx = p.x + Math.cos(spawnAngle) * ASSEMBLY_SPAWN_DIST;
                            let sy = p.y + Math.sin(spawnAngle) * ASSEMBLY_SPAWN_DIST;
                            let toTipAngle = Math.atan2(p.y - sy, p.x - sx);
                            let dockColor = (Math.floor(p.traceDist / DIMER_SPACING) & 1) ? p.coreColor : p.color;
                            emitParticles(sx, sy, 1, {
                                speed: ASSEMBLY_SPEED, spread: 0.15, angle: toTipAngle,
                                life: ASSEMBLY_LIFE, size: 2.2, color: dockColor, assemblyOwner: pi
                            });
                        }
                    }
                }

                // --- DEATH RING COLLISION ---
                if (mitosis.state !== 'idle' && p.alive && !isGhost) {
                    let sweepProgress = (survivalTime - mitosis.eventStartTime) / MITOSIS_SWEEP_DURATION;
                    let caught = false;

                    if (mitosis.direction === 0) {
                        let ringX = activeCell.x - activeCell.radiusX + (activeCell.radiusX * 2 * sweepProgress);
                        if (p.x < ringX) caught = true;
                    } else if (mitosis.direction === 1) {
                        let ringY = activeCell.y - activeCell.radiusY + (activeCell.radiusY * 2 * sweepProgress);
                        if (p.y < ringY) caught = true;
                    } else if (mitosis.direction === 2) {
                        let ringX = activeCell.x + activeCell.radiusX - (activeCell.radiusX * 2 * sweepProgress);
                        if (p.x > ringX) caught = true;
                    } else {
                        let ringY = activeCell.y + activeCell.radiusY - (activeCell.radiusY * 2 * sweepProgress);
                        if (p.y > ringY) caught = true;
                    }

                    if (caught && !godMode) { p.alive = false; addShake(0.5, 0.4); } // T16: player elimination; <-- Added !godMode
                }
            });
        }

        // T22 step 5: draw half of the split -- pure reads of the barX/barY/
        // barGhostTimer/etc. snapshot updatePlayers() just wrote, plus the
        // shared ATP-pause readout (which needs no snapshot: the original fused
        // loop drew it once, after every player had already been processed, so
        // it always reflected the full frame's pickups -- reading
        // calcifyPauseTimer here, after updatePlayers() has returned, is the
        // same value at the same point in the frame).
        function drawPlayerBars() {
            uiBarsLayer.clear();
            players.forEach(p => {
                if (!p.alive) return;

                let barOffset = 20;

                // 1. Ghost Mode Bar (Highest Priority - Flashes White/Purple!)
                if (p.barGhostTimer > 0) {
                    let ghostColor = Math.floor(survivalTime * 10) % 2 === 0 ? 0xffffff : 0xa29bfe;
                    uiBarsLayer.beginFill(ghostColor);
                    // Ghost mode maxes at 10 seconds, so we divide by 10.0 to get the percentage
                    uiBarsLayer.drawRect(p.barX - 15, p.barY - barOffset, 30 * (p.barGhostTimer / 10.0), 5);
                    uiBarsLayer.endFill();
                    barOffset += 8; // Push the next bar up
                }

                // 1.5 Hunter Mode Bar (High Priority - Flashes Yellow/Orange)
                if (p.barHunterTimer > 0) {
                    let hunterColor = Math.floor(survivalTime * 10) % 2 === 0 ? 0xf1c40f : 0xe67e22;
                    uiBarsLayer.beginFill(hunterColor);
                    // Hunter mode maxes at 10 seconds, so we divide by 10.0 to get the percentage
                    uiBarsLayer.drawRect(p.barX - 15, p.barY - barOffset, 30 * (p.barHunterTimer / 10.0), 5);
                    uiBarsLayer.endFill();
                    barOffset += 8;
                }

                // 2. Golgi Timer Bar (Membrane crossing)
                if (p.barGolgiTimer > 0) {
                    uiBarsLayer.beginFill(0x00cec9);
                    // Golgi mode maxes at 15 seconds
                    uiBarsLayer.drawRect(p.barX - 15, p.barY - barOffset, 30 * (p.barGolgiTimer / 15.0), 5);
                    uiBarsLayer.endFill();
                    barOffset += 8; // Push the next bar up
                }

                // 3. Speed Timer Bar
                if (p.barSpeedTimer > 0) {
                    if (p.barSpeedLevel === 2 && Math.floor(survivalTime * 10) % 2 === 0) uiBarsLayer.beginFill(0xf1c40f);
                    else uiBarsLayer.beginFill(0xe17055);
                    // Speed maxes at 15 seconds
                    uiBarsLayer.drawRect(p.barX - 15, p.barY - barOffset, 30 * (p.barSpeedTimer / 15.0), 5);
                    uiBarsLayer.endFill();
                }
            });

            // T51: global ATP-pause readout, drawn once (not per player, unlike the
            // bars above) since the effect belongs to the one shared membrane --
            // anchored above the nucleus, next to the thing it's protecting.
            if (calcifyPauseTimer > 0) {
                uiBarsLayer.beginFill(ATP_COLOR);
                uiBarsLayer.drawRect(activeCell.x - 30, activeCell.y - NUCLEUS_RADIUS - 30, 60 * (calcifyPauseTimer / ATP_PAUSE_MAX), 6);
                uiBarsLayer.endFill();
            }
        }

        // T60: converts a per-frame-at-60fps lerp constant k into a time-based
        // factor -- v += (target-v) * camLerpFactor(k, deltaSec) converges in
        // the same *game* time at any frame rate/step count, and is identical
        // to the old `* k` when deltaSec is exactly 1/60 (so 60fps feel is
        // unchanged; see docs/tasks/T60 Defect 2).
        function camLerpFactor(k, deltaSec) {
            return 1 - Math.pow(1 - k, deltaSec * 60);
        }

        // --- Dynamic Camera Overrides ---
        // cameraDeltaSec is the total game-time simulated since the last call --
        // may span zero, one, or several stepSimulation() catch-up steps (T28),
        // so lerps advance proportionally to actual game time, not to how often
        // this happens to be called (Defect 2). See gameLoop() for how it's built.
        function updateCamera(cameraDeltaSec) {
            let alivePlayers = players.filter(p => p.alive);
            let isVirus = (infection.state === 'warning');

            // T60: only the initial hold shows the wide two-cell framing; the
            // zoomback/countdown sub-phases fall through to the normal
            // follow-camera branch below so the camera settles back to normal
            // framing *before* control returns, instead of snapping the instant
            // isCellFrozen goes false (the old Defect 1 bug).
            let isMitosisWideReveal = mitosis.revealPhase === 'hold';

            let isEmergency = isVirus || isMitosisWideReveal;

            // --- CAMERA ENGINE (Shared vs. Split-Screen) ---
            if (cameraMode === 'shared' || alivePlayers.length <= 1 || isEmergency) {
                world.visible = true;
                splitSprites.forEach(s => s.visible = false);

                if (isEmergency) {
                    let camCenterX = activeCell.x;
                    let camCenterY = activeCell.y;
                    let viewSpanX = 3000, viewSpanY = 3000;

                    if (isMitosisWideReveal) {
                        // T60: frame the two cells' actual bounding box (plus a
                        // margin) instead of a fixed square viewSpan -- the old
                        // fixed 6500 letterboxed a wide viewport because the true
                        // layout is elongated along the split axis (~3400px gap)
                        // but not across it.
                        let minX = Math.min(activeCell.x - activeCell.radiusX, mitosis.cellB.x - activeCell.radiusX);
                        let maxX = Math.max(activeCell.x + activeCell.radiusX, mitosis.cellB.x + activeCell.radiusX);
                        let minY = Math.min(activeCell.y - activeCell.radiusY, mitosis.cellB.y - activeCell.radiusY);
                        let maxY = Math.max(activeCell.y + activeCell.radiusY, mitosis.cellB.y + activeCell.radiusY);
                        camCenterX = (minX + maxX) / 2;
                        camCenterY = (minY + maxY) / 2;
                        viewSpanX = (maxX - minX) * MITOSIS_REVEAL_MARGIN;
                        viewSpanY = (maxY - minY) * MITOSIS_REVEAL_MARGIN;
                    }

                    let targetZoom = Math.min((app.screen.width - 100) / viewSpanX, (app.screen.height - 100) / viewSpanY);
                    let camFactor = camLerpFactor(0.05, cameraDeltaSec);
                    world.scale.x += (targetZoom - world.scale.x) * camFactor;
                    world.scale.y += (targetZoom - world.scale.y) * camFactor;

                    let targetX = (app.screen.width / 2) - (camCenterX * world.scale.x);
                    let targetY = (app.screen.height / 2) - (camCenterY * world.scale.y);

                    world.x += (targetX - world.x) * camFactor;
                    world.y += (targetY - world.y) * camFactor;

                    cameraAtTarget = Math.abs(world.scale.x - targetZoom) < CAMERA_SETTLE_SCALE_EPS &&
                        Math.abs(world.x - targetX) < CAMERA_SETTLE_POS_EPS &&
                        Math.abs(world.y - targetY) < CAMERA_SETTLE_POS_EPS;
                } else if (alivePlayers.length > 0) {
                    let minX = Math.min(...alivePlayers.map(p => p.x));
                    let maxX = Math.max(...alivePlayers.map(p => p.x));
                    let minY = Math.min(...alivePlayers.map(p => p.y));
                    let maxY = Math.max(...alivePlayers.map(p => p.y));

                    let targetCenterX = (minX + maxX) / 2;
                    let targetCenterY = (minY + maxY) / 2;

                    let distX = maxX - minX;
                    let distY = maxY - minY;

                    let zoomX = (app.screen.width - 200) / (distX || 1);
                    let zoomY = (app.screen.height - 200) / (distY || 1);
                    // T47: floor the shared-camera zoom at DIMER_LOD_ZOOM so the trace
                    // motif (and the rest of the arena) doesn't shrink to noise once
                    // players separate -- players beyond this can go off-screen, same
                    // as split-screen already allows.
                    let targetZoom = Math.max(Math.min(zoomX, zoomY, 1.2), DIMER_LOD_ZOOM);

                    let camFactor = camLerpFactor(0.1, cameraDeltaSec);
                    world.scale.x += (targetZoom - world.scale.x) * camFactor;
                    world.scale.y += (targetZoom - world.scale.y) * camFactor;
                    let targetX = (app.screen.width / 2) - (targetCenterX * world.scale.x);
                    let targetY = (app.screen.height / 2) - (targetCenterY * world.scale.y);
                    world.x += (targetX - world.x) * camFactor;
                    world.y += (targetY - world.y) * camFactor;

                    cameraAtTarget = Math.abs(world.scale.x - targetZoom) < CAMERA_SETTLE_SCALE_EPS &&
                        Math.abs(world.x - targetX) < CAMERA_SETTLE_POS_EPS &&
                        Math.abs(world.y - targetY) < CAMERA_SETTLE_POS_EPS;
                }
            } else {
                // FIX 1: The world MUST be visible for the renderTexture to "see" it
                world.visible = true;

                let w = app.screen.width;
                let h = app.screen.height;
                let columns = alivePlayers.length > 2 ? 2 : 2;
                let rows = alivePlayers.length > 2 ? 2 : 1;
                let viewW = Math.floor(w / columns);
                let viewH = Math.floor(h / rows);
                // T44: the RenderTexture is rasterised at viewW/viewH * splitRenderScale
                // and the sprite is upscaled to the full on-screen viewport size -- the
                // fill-rate lever from the task file. High keeps this at 1.0 (no
                // downscale) so split stays pixel-comparable to shared mode; low/medium
                // trade sharpness for fewer shaded pixels per viewport per frame.
                let rtW = Math.max(1, Math.floor(viewW * splitRenderScale));
                let rtH = Math.max(1, Math.floor(viewH * splitRenderScale));

                while (splitSprites.length < alivePlayers.length) {
                    // multisample fixes the "lower resolution" look: RenderTexture does
                    // not inherit the app's antialias:true, so split-screen edges were
                    // jagged versus shared mode. resolution matches the renderer's so
                    // the two paths cannot silently drift apart later.
                    let rt = PIXI.RenderTexture.create({ width: rtW, height: rtH, resolution: app.renderer.resolution, multisample: splitMultisample });
                    let sprite = new PIXI.Sprite(rt);
                    splitScreenLayer.addChild(sprite); // Add to screen
                    splitTextures.push(rt);
                    splitSprites.push(sprite);
                }

                // T34: bloom was being paid for on every one of these per-viewport
                // captures (world.filters applies inside app.renderer.render below),
                // i.e. once per alive player per frame. Suspend it for the captures
                // and let splitScreenLayer.filters (set in applyQuality) apply it
                // once to the composited result instead.
                let savedWorldFilters = world.filters;
                world.filters = null;

                for (let i = 0; i < alivePlayers.length; i++) {
                    let p = alivePlayers[i];
                    let sprite = splitSprites[i];
                    let rt = splitTextures[i];

                    if (rt.width !== rtW || rt.height !== rtH) rt.resize(rtW, rtH);

                    sprite.x = (i % columns) * viewW;
                    sprite.y = Math.floor(i / columns) * viewH;
                    sprite.width = viewW;   // T44: stretch the (possibly smaller) capture up to viewport size
                    sprite.height = viewH;
                    sprite.visible = true;

                    // Center the invisible world on this specific player. Scale/centre
                    // are expressed in RT-pixel space (rtW/rtH), not viewW/viewH, so the
                    // world-space span the viewport shows stays constant regardless of
                    // splitRenderScale -- only the pixel density of the capture changes.
                    let splitZoom = splitRenderScale;
                    world.scale.set(splitZoom);
                    world.x = (rtW / 2) - (p.x * splitZoom);
                    world.y = (rtH / 2) - (p.y * splitZoom);

                    // SNAPSHOT: Because world is visible, this now captures the graphics!
                    app.renderer.render(world, { renderTexture: rt });

                    // Draw a subtle border around each viewport. splitBorderGraphics is
                    // a single reused Graphics instance (T44) -- this used to allocate a
                    // new PIXI.Graphics() per viewport per frame.
                    splitBorderGraphics.clear();
                    splitBorderGraphics.lineStyle(2, 0x00d2d3, 0.5);
                    splitBorderGraphics.drawRect(0, 0, rtW, rtH);
                    app.renderer.render(splitBorderGraphics, { renderTexture: rt, clear: false });
                }

                world.filters = savedWorldFilters; // T34: restore for the shared-mode path

                // FIX 2: Now that snapshots are taken, hide the main world so it doesn't draw over our split UI
                world.visible = false;

                for (let i = alivePlayers.length; i < splitSprites.length; i++) {
                    splitSprites[i].visible = false;
                }
            }
        }


        // --- 7. Main Loop & Input ---
        // T35: single source of truth for the dev-mode hotkeys -- the keydown
        // handler below and the legend text both read this list, so they cannot
        // drift apart the way the old hand-written legend did. `g`/`h`/`j` are
        // Player 3's steer/toggle keys (playerConfigs), so god mode and the
        // legend stay on the free keys `,`/`.` rather than the "G" a naive
        // mnemonic would suggest -- see T35's `## Findings`.
        const DEV_KEYS = [
            {
                label: 'god mode', display: ',', match: k => k === ',', status: () => godMode,
                action: () => { godMode = !godMode; }
            },
            {
                label: 'fuzzer', display: 'f', match: k => k === 'f' || k === 'F', status: () => fuzzActive,
                action: () => {
                    fuzzActive = !fuzzActive;
                    if (fuzzActive) {
                        fuzzStartWallTime = performance.now();
                        fuzzStats.rounds = 0;
                        fuzzTopUpTimer = 0;
                        fuzzToggleTimer = 0;
                        fuzzStatsTimer = 0;
                        // Maximise trace count -- the main driver of grid rebuild cost.
                        if (players.length < 4) {
                            document.getElementById('modeSelect').value = '1';
                            document.getElementById('aiSelect').value = '3';
                            updateUI();
                            startRound();
                        }
                    }
                }
            },
            {
                label: 'shake', display: 'k', match: k => k === 'k' || k === 'K', status: () => window.shakeEnabled,
                action: () => { window.shakeEnabled = !window.shakeEnabled; }
            },
            {
                // Jump straight to a generation without running a mitosis event --
                // Phase 3 content is otherwise untestable (T11).
                label: 'gen +1', display: 'n', match: k => k === 'n' || k === 'N', status: null,
                action: () => { activeCell.generation++; }
            },
            {
                label: '+15 s', display: 'Tab', match: k => k === 'Tab', status: null,
                action: () => { survivalTime += 15.0; }
            },
            {
                label: 'legend', display: '.', match: k => k === '.', status: null,
                action: () => { legendVisible = !legendVisible; }
            }
        ];

        function updateDevIndicator() {
            let el = document.getElementById('devIndicator');
            el.style.display = (devMode && legendVisible) ? 'block' : 'none';
            if (!devMode || !legendVisible) return;

            let lines = [`DEV MODE            [\`]`];
            for (const dk of DEV_KEYS) {
                let label = dk.label === 'gen +1' ? `gen ${activeCell.generation} +1` : dk.label;
                let state = dk.status ? `: ${dk.status() ? 'ON ' : 'OFF'}` : '';
                lines.push(`  ${label.padEnd(12)}${state}   [${dk.display}]`);
            }
            let txt = lines.join('\n');
            if (fuzzActive) {
                let m = Math.floor(fuzzStats.elapsed / 60);
                let s = Math.floor(fuzzStats.elapsed % 60);
                txt += `\n\nfuzz: rounds ${fuzzStats.rounds} · ${m}m${s}s · ` +
                    `trace ${fuzzStats.tracePoints} · children ${fuzzStats.worldChildren} · ` +
                    `heap ${fuzzStats.heapMB !== null ? fuzzStats.heapMB.toFixed(0) + 'MB' : 'n/a'} · err ${fuzzStats.errors}`;
            }
            el.innerText = txt;
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "½"].includes(e.key)) e.preventDefault();
            if (devMode && e.key === 'Tab') e.preventDefault(); // only steal Tab while dev mode is on

            // T19: Enter on the landing menu triggers Quick Play; inert mid-round.
            if (e.key === 'Enter' && !isPlaying) {
                quickPlay();
            }

            // T20: `c` is free of every playerConfigs binding; inert mid-round like Enter above.
            if ((e.key === 'c' || e.key === 'C') && !isPlaying) {
                toggleControlSplash();
            }

            // T40: Escape/P are free of every playerConfigs binding (checked against
            // all four) -- primary pause/resume shortcut, mirrors pauseMenuBtn.
            if (isPlaying && (e.key === 'Escape' || e.key === 'p' || e.key === 'P')) {
                // T41/T54/T55: Escape/P closes whichever overlay is open
                // first, rather than also toggling the pause menu underneath it.
                if (helpIsOpen()) {
                    toggleHelpPanel(false);
                } else if (highScoreIsOpen()) {
                    toggleHighScorePanel(false);
                } else if (shopIsOpen()) {
                    toggleShopPanel(false);
                } else if (netIsOpen()) {
                    toggleNetPanel(false);
                } else {
                    togglePauseMenu();
                }
            }

            // --- DEBUG / DEV MODE HOTKEYS ---
            // Master toggle: `` ` ``/`~`/`½` are the documented keys; `\` kept as an alias.
            if (e.key === '\\' || e.key === '½' || e.key === '`' || e.key === '~') {
                devMode = !devMode;
                updateDevIndicator();
            }
            if (devMode) {
                for (const dk of DEV_KEYS) {
                    if (dk.match(e.key)) {
                        dk.action();
                        updateDevIndicator();
                        break;
                    }
                }
            }

            // --- DYNAMIC TOGGLE LOGIC ---
            players.forEach(p => {
                let isMitosisReveal = isMitosisFreezeActive();
                // T30: a net client never mutates targetMode locally (no
                // prediction -- see the task's own design note); it only sends
                // the held key, and the host flips it once on the rising edge
                // (netHandleMessage()'s 'input' case). p.netPeerId!=null skips a
                // host-side player whose human is a remote peer, not this keyboard.
                if (!p.alive || p.isBot || p.netPeerId != null || (netOnlineActive && netState.role === 'client') || infection.state === 'warning' || isMitosisReveal) return;

                if (e.key === p.controls.toggle || e.key === p.controls.toggleAlt) {
                    p.targetMode = (p.targetMode === 'self') ? 'attack' : 'self';
                }
            });

            // T55: Shed the Tail active ability. Single-player only (upgrades
            // don't apply once currentMode > 1, design §4), so this only ever
            // needs to drive players[0], the sole human in that mode. 'x' is
            // free of every playerConfigs binding and every dev hotkey.
            if (isPlaying && !paused && (e.key === 'x' || e.key === 'X')) {
                let p = players[0];
                if (p && p.alive && !p.isBot && p.upgrades.shedTail &&
                    survivalTime - p.effects.lastShedTail > SHED_TAIL_COOLDOWN) {
                    p.effects.lastShedTail = survivalTime;
                    deleteOldestTrace(p, SHED_TAIL_FRACTION);
                }
            }
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        // T23: touch steering. Feeds the existing `keys` object -- gameLoop's
        // `keys[p.controls.left]` checks work unchanged, and there is exactly
        // one input model to reason about. Mobile is solo-vs-bots only (see
        // task scope note), so touch always drives Player 1's controls.
        // pointerId -> 'left' | 'right'; module-level so no per-event allocation.
        const touchPointers = new Map();

        function touchHalf(clientX) {
            return clientX < window.innerWidth / 2 ? 'left' : 'right';
        }

        function recomputeTouchKeys() {
            let left = false, right = false;
            touchPointers.forEach(half => { if (half === 'left') left = true; else right = true; });
            let controls = playerConfigs[0].controls;
            keys[controls.left] = left;
            keys[controls.right] = right;
        }

        function releaseTouchPointer(e) {
            if (!touchPointers.has(e.pointerId)) return;
            touchPointers.delete(e.pointerId);
            recomputeTouchKeys();
        }

        app.view.addEventListener('pointerdown', e => {
            if (e.pointerType === 'mouse') return; // keyboard/mouse desktop users steer with keys, not clicks
            touchPointers.set(e.pointerId, touchHalf(e.clientX));
            recomputeTouchKeys();
            // Best effort: keep receiving moves once the finger leaves the canvas
            // bounds. Must run after the state update above -- capture can throw
            // (e.g. the pointer already released) and must not skip it.
            try { app.view.setPointerCapture(e.pointerId); } catch (err) { }
        });
        app.view.addEventListener('pointermove', e => {
            if (!touchPointers.has(e.pointerId)) return;
            touchPointers.set(e.pointerId, touchHalf(e.clientX));
            recomputeTouchKeys();
        });
        app.view.addEventListener('pointerup', releaseTouchPointer);
        // Fires when the browser takes over the gesture -- must release or the
        // player spins forever.
        app.view.addEventListener('pointercancel', releaseTouchPointer);

        // Backgrounding the page must not leave a touch-driven key stuck down.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && touchPointers.size > 0) {
                touchPointers.clear();
                recomputeTouchKeys();
            }
        });

        // T23: on-screen boost-target toggle for touch (no natural touch gesture
        // for the 3rd control). Always targets Player 1, same reasoning as above.
        const touchToggleBtn = document.getElementById('touchToggleBtn');
        if (isTouchDevice) touchToggleBtn.style.display = 'flex';
        // T24: bigger tap targets + de-emphasised player-count selector (see CSS).
        if (isTouchDevice) document.body.classList.add('touch-ui');
        window.toggleTouchTargetMode = function () {
            let p = players[0];
            if (!p || !p.alive || p.isBot) return;
            if (infection.state === 'warning' || isMitosisFreezeActive()) return;
            p.targetMode = (p.targetMode === 'self') ? 'attack' : 'self';
        };

        // T59: touch-only Shed the Tail activation. Visibility/cooldown display
        // is driven every frame by updateShedTailButtonHUD() (display §4.4a);
        // hidden by default here since ownership isn't known until a round has
        // resolved players[0].upgrades (see startRound()).
        const shedTailBtn = document.getElementById('shedTailBtn');
        // T55: same condition as the 'x' keyboard handler below and the bot's
        // own use of the ability in updatePlayers() -- single-player only, so
        // this always drives players[0], same reasoning as the toggle above.
        window.touchShedTail = function () {
            let p = players[0];
            if (!isPlaying || paused) return;
            if (p && p.alive && !p.isBot && p.upgrades.shedTail &&
                survivalTime - p.effects.lastShedTail > SHED_TAIL_COOLDOWN) {
                p.effects.lastShedTail = survivalTime;
                deleteOldestTrace(p, SHED_TAIL_FRACTION);
            }
        };

        // PEEK LOGIC: Show UI on hover, hide when leaving. T24: touch has no
        // hover concept, so this path is gated off entirely for touch devices --
        // they use pauseMenuBtn below instead (T61: uiCloseBtn was removed as
        // a redundant second close affordance, item 6b).
        if (!isTouchDevice) {
            uiTrigger.addEventListener('mouseenter', () => uiElement.classList.remove('hidden-ui'));
            uiElement.addEventListener('mouseleave', () => {
                // T46/T54/T55: toggleHelpPanel(true)/toggleHighScorePanel(true)/
                // toggleShopPanel(true) hide #ui, which slides the panel out
                // from under the cursor and fires this handler -- which then
                // resumed the very round the overlay had just paused. Whichever
                // overlay is open owns pause for as long as it stays open.
                if (helpIsOpen() || highScoreIsOpen() || shopIsOpen()) return;
                if (isPlaying) {
                    // Also clears any pause opened via pauseMenuBtn -- otherwise the
                    // mouse leaving would hide the menu but leave the round paused
                    // with no visible way to tell.
                    uiElement.classList.add('hidden-ui');
                    paused = false;
                }
            });
        }

        // T24: explicit menu/pause control. Opening pauses the round (survivalTime
        // and physics both stop, see gameLoop); tapping pauseMenuBtn again, the
        // in-menu close button, or anywhere outside the menu resumes it.
        window.togglePauseMenu = function () {
            let isHidden = uiElement.classList.contains('hidden-ui');
            if (isHidden) {
                uiElement.classList.remove('hidden-ui');
                if (isPlaying) paused = true;
            } else {
                uiElement.classList.add('hidden-ui');
                paused = false;
            }
        };

        // T40: shown once, on the first round of a session, to point at
        // pauseMenuBtn/the Escape+P shortcuts. Fades on its own, no dismiss needed.
        const pauseHintElement = document.getElementById('pauseHint');
        function showPauseHint() {
            if (pauseHintShown) return;
            pauseHintShown = true;
            pauseHintElement.classList.remove('pause-hint-fade');
            pauseHintElement.style.display = 'block';
            setTimeout(() => pauseHintElement.classList.add('pause-hint-fade'), 3000);
            setTimeout(() => { pauseHintElement.style.display = 'none'; }, 3600);
        }

        document.addEventListener('pointerdown', e => {
            if (!paused) return;
            if (uiElement.contains(e.target) || e.target === pauseMenuBtn) return;
            // T41/T54/T55/T29: each overlay owns its own outside-click close
            // (and its own resume-on-close logic) while it's open -- don't race it here.
            if (helpIsOpen() || highScoreIsOpen() || shopIsOpen() || netIsOpen()) return;
            uiElement.classList.add('hidden-ui');
            paused = false;
        });

        window.toggleFullScreen = function () {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => console.log(err));
            else if (document.exitFullscreen) document.exitFullscreen();
        };

        // T14: Gen 3+ malignant mass -- state only (§4.4a). Tries up to 200
        // random spots this frame; if none are valid, malignantMass stays
        // inactive and updateMalignantMass() retries next frame.
        function tryPlaceMalignantMass() {
            const half = malignantMass.blockSize / 2;
            for (let attempt = 0; attempt < 200; attempt++) {
                let x = activeCell.x + (Math.random() * 2 - 1) * activeCell.radiusX * 0.85;
                let y = activeCell.y + (Math.random() * 2 - 1) * activeCell.radiusY * 0.85;

                if (isOutsideCell(x, y, half)) continue;
                // Clear of the nucleus and the 380px organelle ring.
                if (Math.hypot(x - activeCell.x, y - activeCell.y) < 450) continue;

                let overlapsOrganelle = false;
                for (let o of organelles) {
                    if (Math.hypot(x - o.x, y - o.y) < o.radius + half + 20) { overlapsOrganelle = true; break; }
                }
                if (overlapsOrganelle) continue;

                let tooCloseToPlayer = false;
                for (let p of players) {
                    if (!p.alive) continue;
                    if (Math.hypot(x - p.x, y - p.y) < 300) { tooCloseToPlayer = true; break; }
                }
                if (tooCloseToPlayer) continue;

                malignantMass.origin.x = x;
                malignantMass.origin.y = y;
                malignantMass.blocks = [{ cx: 0, cy: 0, x: x, y: y, spawnTime: survivalTime }];
                malignantMass.nextGrowTime = survivalTime + massGrowInterval();
                malignantMass.active = true;
                return;
            }
        }

        // Clone one block 4-adjacent to the existing mass, if a valid spot exists.
        function growMalignantMass() {
            const half = malignantMass.blockSize / 2;
            const NEIGHBORS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

            let occupied = new Set();
            for (let b of malignantMass.blocks) occupied.add(b.cx + ',' + b.cy);

            let candidates = [];
            for (let b of malignantMass.blocks) {
                for (let n of NEIGHBORS) {
                    let ncx = b.cx + n[0], ncy = b.cy + n[1];
                    let key = ncx + ',' + ncy;
                    if (occupied.has(key)) continue;
                    occupied.add(key); // dedupe candidates reachable from multiple existing blocks

                    let x = malignantMass.origin.x + ncx * malignantMass.blockSize;
                    let y = malignantMass.origin.y + ncy * malignantMass.blockSize;

                    if (isOutsideCell(x, y, half)) continue;
                    if (Math.hypot(x - activeCell.x, y - activeCell.y) < 130 + half) continue; // nucleus

                    let onPlayerHead = false;
                    for (let p of players) {
                        if (!p.alive) continue;
                        if (Math.hypot(x - p.x, y - p.y) < half + 40) { onPlayerHead = true; break; }
                    }
                    if (onPlayerHead) continue;

                    candidates.push({ cx: ncx, cy: ncy, x: x, y: y });
                }
            }

            if (candidates.length === 0) return;
            let pick = candidates[Math.floor(Math.random() * candidates.length)];
            malignantMass.blocks.push({ cx: pick.cx, cy: pick.cy, x: pick.x, y: pick.y, spawnTime: survivalTime });
        }

        function updateMalignantMass() {
            if (!genAtLeast(3)) return;
            if (!malignantMass.active) {
                tryPlaceMalignantMass();
                return;
            }
            if (malignantMass.blocks.length >= MASS_MAX_BLOCKS) return;
            if (survivalTime >= malignantMass.nextGrowTime) {
                malignantMass.nextGrowTime = survivalTime + massGrowInterval();
                growMalignantMass();
            }
        }

        // T39: deterministic per-block hash (integer mix, no Math.random) so the
        // aggregate's blob shape is identical every frame -- re-randomising per
        // frame would shimmer. salt selects which of several draws for a block.
        function massHash(cx, cy, salt) {
            let h = (cx * 374761393 + cy * 668265263 + salt * 2654435761) | 0;
            h = Math.imul(h ^ (h >>> 15), 1 | h);
            h ^= h + Math.imul(h ^ (h >>> 7), 61 | h);
            return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
        }

        // Draw only (§4.4a) -- reads malignantMass.blocks, never mutates it.
        // T39: irregular amber/ochre blobs -- a protein aggregate, not a grid of
        // squares -- that merge into one clump: the outer-boundary outline skips
        // any edge shared with an occupied neighbour.
        function drawMalignantMass() {
            massLayer.clear();
            if (!malignantMass.active) return;
            const half = malignantMass.blockSize / 2;
            for (let b of malignantMass.blocks) {
                let isNew = (survivalTime - b.spawnTime) < 0.5;

                massLayer.lineStyle(0);
                massLayer.beginFill(isNew ? 0xffe6a8 : 0x8a6d2f, 1.0);
                for (let li = 0; li < 3; li++) {
                    let ox = (massHash(b.cx, b.cy, li * 3) - 0.5) * half * 0.9;
                    let oy = (massHash(b.cx, b.cy, li * 3 + 1) - 0.5) * half * 0.9;
                    let lr = half * (0.5 + massHash(b.cx, b.cy, li * 3 + 2) * 0.35);
                    massLayer.drawCircle(b.x + ox, b.y + oy, lr);
                }
                massLayer.endFill();

                // Faint inner glow, brighter on a freshly spawned block -- reads
                // as "wrong protein" alongside the scene's additive-glow trims
                // without changing massLayer's blend mode (smallest diff, §1.3).
                massLayer.beginFill(0xffdf9e, isNew ? 0.35 : 0.15);
                massLayer.drawCircle(b.x, b.y, half * 0.4);
                massLayer.endFill();
            }
        }

        // T38: state only (§4.4a) -- emission timers per cluster, larger clusters
        // emit more often (interval = DEBRIS_BASE_INTERVAL / memberCount).
        function updateNecroticClusters(delta, deltaSec) {
            if (genAtLeast(2)) {
                for (let [id, cluster] of necroticClusters) {
                    if (survivalTime >= cluster.nextEmitTime) {
                        cluster.nextEmitTime = survivalTime + DEBRIS_BASE_INTERVAL / cluster.members.length;
                        emitNecroticDebris(cluster);
                    }
                }
            }
            updateNecroticDebris(delta, deltaSec);
        }

        function emitNecroticDebris(cluster) {
            if (necroticDebris.length >= DEBRIS_MAX) return;
            let from = cluster.members[Math.floor(Math.random() * cluster.members.length)];
            let ang = Math.random() * Math.PI * 2;
            necroticDebris.push({
                x: from.x + Math.cos(ang) * from.radius,
                y: from.y + Math.sin(ang) * from.radius,
                vx: Math.cos(ang) * DEBRIS_SPEED,
                vy: Math.sin(ang) * DEBRIS_SPEED,
                radius: DEBRIS_RADIUS,
                life: DEBRIS_LIFETIME,
                maxLife: DEBRIS_LIFETIME
            });
        }

        // Movement/expiry only (state, §4.4a) -- drawNecroticDebris() reads this.
        function updateNecroticDebris(delta, deltaSec) {
            for (let i = necroticDebris.length - 1; i >= 0; i--) {
                let d = necroticDebris[i];
                d.x += d.vx * delta;
                d.y += d.vy * delta;
                d.life -= deltaSec;
                if (d.life <= 0 || isOutsideCell(d.x, d.y, d.radius)) necroticDebris.splice(i, 1);
            }
        }

        // Draw only (§4.4a) -- one persistent Graphics for every cluster (never one
        // per cluster). Angular/mineralised, deliberately unlike T39's soft amber
        // blobs: solid same-colour fills overlap seamlessly (no per-member stroke),
        // and an outline is drawn only on facet edges that don't face another
        // member, so the cluster reads as one stone instead of a pile. Facet jitter
        // is hashed from each member's frozen (never-moving) position, so it never
        // shimmers frame to frame. The faded original organelle sprite still shows
        // faintly through the fill's alpha, tying the mass back to what it ate.
        function drawNecroticClusters() {
            necroticClusterLayer.clear();
            const SIDES = 7;
            for (let [id, cluster] of necroticClusters) {
                let members = cluster.members;

                necroticClusterLayer.lineStyle(0);
                necroticClusterLayer.beginFill(0x5a6b78, 0.82);
                for (let m of members) necroticClusterLayer.drawCircle(m.x, m.y, m.radius * 0.92);
                necroticClusterLayer.endFill();

                necroticClusterLayer.lineStyle(2.5, 0x2c3a42, 0.95);
                for (let m of members) {
                    let seed = (Math.round(m.x) * 374761393) ^ (Math.round(m.y) * 668265263);
                    let prevX = 0, prevY = 0, havePrev = false;
                    for (let s = 0; s <= SIDES; s++) {
                        let a = ((s % SIDES) / SIDES) * Math.PI * 2;
                        let r = m.radius * (0.85 + massHash(seed, s) * 0.3);
                        let x = m.x + Math.cos(a) * r, y = m.y + Math.sin(a) * r;
                        if (havePrev) {
                            let mx = (prevX + x) / 2, my = (prevY + y) / 2;
                            let facesNeighbor = false;
                            for (let m2 of members) {
                                if (m2 === m) continue;
                                if (Math.hypot(mx - m2.x, my - m2.y) < m2.radius * 0.92) { facesNeighbor = true; break; }
                            }
                            if (!facesNeighbor) {
                                necroticClusterLayer.moveTo(prevX, prevY);
                                necroticClusterLayer.lineTo(x, y);
                            }
                        }
                        prevX = x; prevY = y;
                        havePrev = true;
                    }
                }
            }
        }

        // Draw only (§4.4a) -- lethal fragments, fading in the last third of life.
        function drawNecroticDebris() {
            necroticDebrisLayer.clear();
            for (let d of necroticDebris) {
                let alpha = Math.min(1, d.life / (DEBRIS_LIFETIME * 0.3));
                necroticDebrisLayer.lineStyle(0);
                necroticDebrisLayer.beginFill(0x8899aa, 0.85 * alpha);
                necroticDebrisLayer.drawCircle(d.x, d.y, d.radius);
                necroticDebrisLayer.endFill();
                necroticDebrisLayer.lineStyle(1.5, 0x3c4a52, 0.9 * alpha);
                necroticDebrisLayer.drawCircle(d.x, d.y, d.radius);
            }
        }

        // T22 step 6: sprite-only teardown/attach for organelles that stay in
        // `organelles[]` (necrosis repaint) or are spliced out by the caller
        // (mitosis death-ring shatter) -- unlike destroyNecroticOrganelle(),
        // neither touches `organelles[]`, `dead`, or emits particles, so both
        // call sites keep their existing (different) surrounding behaviour.
        // Pulled out purely so stepSimulation()'s own body stays free of direct
        // *Layer/.sprite references; the two blocks that call them are still
        // documented as not-fully-PIXI-free, same as T22 step 5's precedent.
        function destroyOrganelleSprite(org) {
            if (org.sprite) {
                organellesLayer.removeChild(org.sprite);
                org.sprite.destroy();
            }
        }
        function attachOrganelleSprite(org, sprite) {
            org.sprite = sprite;
            organellesLayer.addChild(sprite);
        }

        // T22 step 6: state only (§4.4a) -- see drawCalcification() for the
        // render half. calcifyLayer.clear() moved from before this state block
        // (its original position) to the start of drawCalcification(); clear()
        // has no state dependency, so redrawing after the shrink/cull instead of
        // before it produces identical pixels, just from the frame-final radii.
        function updateCalcification(deltaSec, isCellFrozen) {
            if (genAtLeast(2) && !isCellFrozen && mitosis.state === 'idle') {
                // T51: ATP pickups pause the shrink for a few seconds each, capped at
                // ATP_PAUSE_MAX -- ticks down here so it only moves while the shrink
                // itself would (frozen/mitosis states already suspend it above).
                if (calcifyPauseTimer > 0) calcifyPauseTimer = Math.max(0, calcifyPauseTimer - deltaSec);

                let floorX = activeCell.baseRadiusX * CALCIFY_FLOOR;
                if (calcifyPauseTimer <= 0 && activeCell.radiusX > floorX) {
                    let shrunkX = Math.max(floorX, activeCell.radiusX - CALCIFY_RATE * deltaSec);
                    activeCell.radiusY *= shrunkX / activeCell.radiusX;
                    activeCell.radiusX = shrunkX;
                }
                // T48: cull aggregate blocks the membrane has now retreated past --
                // otherwise they linger as unreachable dead geometry outside the cell.
                if (malignantMass.blocks.length > 0) {
                    let massHalf = malignantMass.blockSize / 2;
                    for (let i = malignantMass.blocks.length - 1; i >= 0; i--) {
                        let b = malignantMass.blocks[i];
                        if (isOutsideCell(b.x, b.y, massHalf)) malignantMass.blocks.splice(i, 1);
                    }
                    if (malignantMass.blocks.length === 0) malignantMass.active = false;
                }
            }
        }

        // T37: calcifyLayer draws the membrane ring every frame at every
        // generation (not just Gen 2+) since generateMap() no longer bakes a
        // ring into cellBg -- this is the only membrane boundary, ever.
        function drawCalcification() {
            calcifyLayer.clear();
            // T51: while a pause is live the inner ring glows the same colour as the
            // granule that bought it, pulsing, instead of its resting cyan.
            let atpPauseActive = calcifyPauseTimer > 0;
            let a = activeCell.radiusX, b = activeCell.radiusY;

            // T62 section 2: at the zoom the game is actually played at (~0.5-0.6)
            // a flat world-space stroke shrinks along with everything else and the
            // three-layer ring reads as one thin line -- boost stroke width as zoom
            // falls below 1.0, the same zoomBoost pattern T52 already uses for the
            // nucleus well in drawVesicles().
            let zoomBoost = Math.max(1, 1 / world.scale.x);

            // Soft glow falling from the membrane into the cytosol, so "inside"
            // reads as an enclosed space rather than just a line on screen.
            // Tier-driven (QUALITY_TIERS[tier].membraneGlowSteps) -- low drops it
            // entirely, same as T62 section 1's cytosolFillerCount.
            let glowSteps = QUALITY_TIERS[quality].membraneGlowSteps;
            for (let i = glowSteps; i >= 1; i--) {
                calcifyLayer.lineStyle(22 * zoomBoost, 0x1e3799, 0.045 * i);
                calcifyLayer.drawEllipse(activeCell.x, activeCell.y, a - 10 - i * 22, b - 10 - i * 22);
            }

            calcifyLayer.lineStyle(18 * zoomBoost, 0x1e3799, 0.4);
            calcifyLayer.drawEllipse(activeCell.x, activeCell.y, a + 8, b + 8);
            calcifyLayer.lineStyle(10 * zoomBoost, 0x4a69bd, 0.8);
            calcifyLayer.drawEllipse(activeCell.x, activeCell.y, a, b);
            calcifyLayer.lineStyle(4 * zoomBoost, atpPauseActive ? ATP_COLOR : 0x82ccdd, atpPauseActive ? (0.6 + 0.4 * Math.sin(survivalTime * 6)) : 1.0);
            calcifyLayer.drawEllipse(activeCell.x, activeCell.y, a - 3, b - 3);
        }

        // T22 step 6: fused pre-existing code (cytosolParticles/membraneProtrusionsList
        // entries are themselves PIXI.Graphics instances with plain fields hung on
        // them -- there is no separate physics-object/.sprite pair to split the way
        // organelles were in step 3). Out of scope for T22, which only ever named
        // vesicles/infection/organelles/mitosis/players as the systems to split (see
        // docs/tasks/T22-sim-render-split.md); noted in docs/BACKLOG.md instead of
        // attempted here. Called directly from gameLoop, not from stepSimulation() or
        // renderFrame(), so neither of those two is misrepresented as covering it.
        function updateAndDrawBackgroundElements(delta, deltaSec) {
            // T49: protrusions and cellBgSprite were baked once from the round-start
            // radii and never followed Gen 2+ calcification inward. Re-anchor them
            // from the current radii, but only redo the trig when the radii actually
            // moved since last frame (they only change while calcifying).
            if (activeCell.radiusX !== lastMembraneRadiusX || activeCell.radiusY !== lastMembraneRadiusY) {
                let a = activeCell.radiusX, b = activeCell.radiusY;

                cellBgSprite.clear();
                cellBgSprite.beginFill(0x0d0d1a);
                cellBgSprite.drawEllipse(activeCell.x, activeCell.y, a, b);
                cellBgSprite.endFill();

                membraneProtrusionsList.forEach(p => {
                    let t = p.angleRad;
                    p.normAngle = Math.atan2(a * Math.sin(t), b * Math.cos(t));
                    p.rotation = p.normAngle;
                    let a2_sin2 = Math.pow(a * Math.sin(t), 2);
                    let b2_cos2 = Math.pow(b * Math.cos(t), 2);
                    p.rc = Math.pow(a2_sin2 + b2_cos2, 1.5) / (a * b);
                    p.x = activeCell.x + a * Math.cos(t);
                    p.y = activeCell.y + b * Math.sin(t);
                });

                lastMembraneRadiusX = a;
                lastMembraneRadiusY = b;
            }

            cytosolParticles.forEach(blob => {
                blob.x += blob.vx * delta;
                blob.y += blob.vy * delta;
                // T49: pull drifting blobs back inside the current (possibly
                // shrunk) membrane instead of letting them wander past it.
                if (isOutsideCell(blob.x, blob.y)) {
                    let dx = blob.x - activeCell.x;
                    let dy = blob.y - activeCell.y;
                    let norm = Math.sqrt((dx * dx) / (activeCell.radiusX * activeCell.radiusX) + (dy * dy) / (activeCell.radiusY * activeCell.radiusY));
                    if (norm > 0) {
                        let pull = 0.98 / norm;
                        blob.x = activeCell.x + dx * pull;
                        blob.y = activeCell.y + dy * pull;
                    }
                    blob.vx *= -1;
                    blob.vy *= -1;
                }
                blob.scale.set(1.0 + Math.sin(survivalTime * 2 + blob.phase) * 0.1);
                blob.alpha = blob.baseAlpha + Math.sin(survivalTime + blob.phase) * 0.1;
            });

            membraneProtrusionsList.forEach(p => {
                p.phase += p.speed * deltaSec;
                let scale = Math.max(0, Math.sin(p.phase));
                p.redraw(p.maxRadius * scale);
            });
        }

        // T22 step 6: pure state. No PIXI calls whatsoever (see the two
        // documented exceptions below -- necrosis-promotion and the mitosis
        // death-ring shatter still call destroyOrganelleSprite()/
        // attachOrganelleSprite(), same class of pre-existing coupling T22
        // step 5 already accepted for updatePlayers()/destroyNecroticOrganelle()).
        // Returns { ended: true } on the two round-end paths (mirroring the old
        // gameLoop's own early `return;`s) so gameLoop knows to skip renderFrame()
        // this tick, exactly as it always skipped the rest of the frame here.
        // Otherwise returns { ended: false, isCellFrozen, delta, deltaSec } --
        // delta/deltaSec are the post-fuzz-dilation values, needed by
        // renderFrame() and updateAndDrawBackgroundElements().
        function stepSimulation(delta) {
            // Rebuild spatial grid once per frame at the start
            rebuildSpatialGrid();

            let deltaSec = app.ticker.deltaMS / 1000;

            // T26: adaptive quality sampler -- measures real (pre-fuzz-dilation)
            // frame time over the first QUALITY_SAMPLE_WINDOW seconds of a round and
            // promotes/demotes at most once per round. State only, no drawing here
            // (AGENT_CONDUCT 4.4a). Inert once qualitySampleDone or a manual tier
            // has been picked (qualityIsAuto false).
            if (qualityIsAuto && !qualitySampleDone) {
                qualitySampleElapsed += deltaSec;
                qualitySampleTotalMs += app.ticker.deltaMS;
                qualitySampleFrames++;
                if (qualitySampleElapsed >= QUALITY_SAMPLE_WINDOW) {
                    qualitySampleDone = true;
                    let meanMs = qualitySampleTotalMs / qualitySampleFrames;
                    if (meanMs < QUALITY_PROMOTE_MS) promoteQualityTier();
                    else if (meanMs > QUALITY_DEMOTE_MS) demoteQualityTier();
                }
            }

            // --- FUZZER SOAK-TEST UTILITY ---
            if (fuzzActive) {
                let realDeltaSec = deltaSec; // wall-clock, captured before dilation below
                delta *= 4.0;
                deltaSec *= 4.0;

                if (mitosis.state === 'idle') {
                    mitosis.nextTriggerTime = 0.1;
                }

                // Only force the next breach while under the natural per-breach max
                // (30, see the breach spawn loop below) -- that loop is unconditional,
                // so forcing breaches once already at the cap would grow it unbounded.
                if (infection.state === 'none' && infection.particles.length < 30) {
                    infection.nextWarningTime = Math.min(infection.nextWarningTime, survivalTime + 1.0);
                }

                // Top up hazards to their documented maximum. Gated on a timer so
                // this spawns at most once per (dilated) second, never per frame.
                fuzzTopUpTimer -= realDeltaSec;
                if (fuzzTopUpTimer <= 0) {
                    fuzzTopUpTimer = 1.0;

                    if (vesicles.length < 25 && window.golgiData) {
                        let vTypes = ['mitochondria', 'lysosome', 'membrane'];
                        for (let i = vesicles.length; i < 25; i++) {
                            let vAngle = Math.random() * Math.PI * 2;
                            let vDist = Math.random();
                            let vx = activeCell.x + Math.cos(vAngle) * activeCell.radiusX * vDist;
                            let vy = activeCell.y + Math.sin(vAngle) * activeCell.radiusY * vDist;
                            let vType = vTypes[Math.floor(Math.random() * vTypes.length)];
                            let vColor = vType === 'mitochondria' ? C_MITO : (vType === 'lysosome' ? C_LYSO : C_MEMB);
                            spawnVesicles(vx, vy, 1, vType, vColor);
                        }
                    }

                    // 30 particles per breach is the natural maximum updateInfection()
                    // ever produces (see its breach-spawn loop) -- do not invent a
                    // larger cap.
                    if (infection.particles.length < 30) {
                        for (let i = infection.particles.length; i < 30; i++) {
                            let pAngle = Math.random() * Math.PI * 2;
                            let pSpeed = 3.0 + Math.random() * 2.0;
                            infection.particles.push({
                                x: activeCell.x, y: activeCell.y,
                                vx: Math.cos(pAngle) * pSpeed, vy: Math.sin(pAngle) * pSpeed,
                                radius: 6
                            });
                        }
                    }
                }

                // Rapid state toggles, every 0.5s of fuzz time -- most likely to
                // expose splitSprites / RenderTexture lifecycle bugs.
                fuzzToggleTimer -= realDeltaSec;
                if (fuzzToggleTimer <= 0) {
                    fuzzToggleTimer = 0.5;
                    let aliveForToggle = players.filter(p => p.alive);
                    if (aliveForToggle.length > 0) {
                        let victim = aliveForToggle[Math.floor(Math.random() * aliveForToggle.length)];
                        victim.targetMode = (victim.targetMode === 'self') ? 'attack' : 'self';
                    }
                    cameraMode = (cameraMode === 'shared') ? 'split' : 'shared';
                }

                // fuzzStats HUD, once per second of fuzz wall-clock time -- not per frame.
                fuzzStatsTimer -= realDeltaSec;
                if (fuzzStatsTimer <= 0) {
                    fuzzStatsTimer = 1.0;
                    fuzzStats.elapsed = (performance.now() - fuzzStartWallTime) / 1000;
                    let tp = 0;
                    for (let p of players) for (let seg of p.traceSegments) tp += seg.length;
                    fuzzStats.tracePoints = tp;
                    fuzzStats.gridCells = spatialGrid.cells.size;
                    fuzzStats.worldChildren = countDisplayObjects(world);
                    fuzzStats.vesicles = vesicles.length;
                    fuzzStats.organelles = organelles.length;
                    fuzzStats.virusParticles = infection.particles.length;
                    fuzzStats.heapMB = performance.memory ? performance.memory.usedJSHeapSize / 1048576 : null;
                    updateDevIndicator();
                }
            }
            let isMitosisReveal = isMitosisFreezeActive();
            // T57: the transformation cutscene reuses this same freeze path
            // rather than adding a third mechanism. T60: the freeze now covers
            // NUCLEUS_TRANSFORM_FREEZE (hold) + REVEAL_COUNTDOWN (visible
            // 3-2-1) -- folds in what used to be a separate unfrozen
            // NUCLEUS_TRANSFORM_GRACE buffer (see updateNucleusChasers()'s
            // activeSince, which reads the same two constants).
            let nucleusHoldEnd = nucleusTransformTime + NUCLEUS_TRANSFORM_FREEZE;
            let nucleusRevealEnd = nucleusHoldEnd + REVEAL_COUNTDOWN;
            let isNucleusReveal = (nucleusTransformTime > -Infinity && survivalTime < nucleusRevealEnd);
            if (isNucleusReveal && survivalTime >= nucleusHoldEnd) {
                warningElement.innerText = String(Math.ceil(nucleusRevealEnd - survivalTime));
                warningElement.style.color = "#f1f2f6";
                warningElement.style.display = 'block';
            }
            let isCellFrozen = (infection.state === 'warning') || isMitosisReveal || isNucleusReveal;
            lastIsCellFrozen = isCellFrozen; // T30: read by the host's periodic state broadcast

            // T12/T37: Gen 2+ membrane calcification -- state only; see
            // drawCalcification() for the render half (T22 step 6).
            updateCalcification(deltaSec, isCellFrozen);

            if (!isCellFrozen) {
                globalRotation += 0.0015 * delta;
                updateDriftingOrganelles(delta); // T22 step 3
                updateVesicles(delta); // T22 step 1
                updateATP(deltaSec); // T51

                // T13: Gen 2+ organelle necrosis. Every NECROSIS_INTERVAL seconds of
                // un-frozen game time, freeze one random non-necrotic organelle into a
                // permanent grey static wall (capped at NECROSIS_MAX_FRAC of the total).
                // No new collision path: it stays in organelles[], so rebuildSpatialGrid(),
                // checkCollision() and raycast() already handle it unchanged.
                if (genAtLeast(2)) {
                    necrosisTimer += deltaSec;
                    if (necrosisTimer >= NECROSIS_INTERVAL) {
                        necrosisTimer -= NECROSIS_INTERVAL;

                        let necroticCount = 0;
                        for (let o of organelles) if (o.necrotic) necroticCount++;

                        if (necroticCount < Math.floor(NECROSIS_MAX_FRAC * organelles.length)) {
                            let candidates = organelles.filter(o => !o.necrotic);
                            if (candidates.length > 0) {
                                let pick = candidates[Math.floor(Math.random() * candidates.length)];
                                let tooClose = false;
                                for (let p of players) {
                                    if (!p.alive) continue;
                                    if (Math.hypot(p.x - pick.x, p.y - pick.y) < pick.radius + 120) { tooClose = true; break; }
                                }
                                if (!tooClose) {
                                    pick.necrotic = true;
                                    pick.vx = 0; pick.vy = 0; pick.rotSpeed = 0;
                                    pick.freezeTime = survivalTime;

                                    // Rebuild grey: a multiplicative tint on the live sprite
                                    // washes out to a dim version of the original hue rather
                                    // than grey, so redraw from the same x/y/rotation/bendY/
                                    // radius instead (createOrganelleGraphics respects a
                                    // pre-set bendY rather than re-randomizing it).
                                    destroyOrganelleSprite(pick);
                                    attachOrganelleSprite(pick, createOrganelleGraphics(pick, true));
                                }
                            }
                        }
                    }
                }

                // T14: Gen 3+ malignant mass. Spawn/growth is state only; see
                // drawMalignantMass() below for the render half of the split (§4.4a).
                updateMalignantMass();

                // T38: Gen 2+ necrotic cluster debris shedding + drift. State only;
                // see drawNecroticClusters()/drawNecroticDebris() below (§4.4a).
                updateNecroticClusters(delta, deltaSec);

                // T57: post-transformation homing enemies. State only; see
                // drawNucleusChasers() below (§4.4a).
                updateNucleusChasers(delta, deltaSec);
            }
            updateMitosis(deltaSec);
            updateInfection(delta, deltaSec); // T22 step 2
            updateShake(deltaSec); // T16 (state half, T22 step 6 -- draw half is drawShake())

            // The master clock must run in ALL modes so the virus and combos work!
            survivalTime += deltaSec;

            // T30: online play's totalPlayers is the lobby roster (peers + bots),
            // not the local menu's currentMode/aiCount -- see startRound().
            let totalPlayers = netOnlineActive ? netState.roster.length : (currentMode + aiCount);
            // Only update the UI text to show the timer if it's a Solo game and not frozen
            if (totalPlayers === 1 && !isCellFrozen) {
                if (!players.some(p => p.alive) && !godMode) {
                    uiElement.classList.add('visible');
                    uiElement.classList.remove('hidden-ui');
                    document.getElementById('scoreboard').innerText = `You Survived: ${survivalTime.toFixed(1)}s! · Gen ${activeCell.generation}`;
                    app.ticker.stop();
                } else {
                    scoreText.innerText = `Survival Time: ${survivalTime.toFixed(1)}s · Gen ${activeCell.generation}`;
                }
            }

            let activePlayers = players.filter(p => p.alive);
            if (totalPlayers === 1 && activePlayers.length === 0) {
                // A round ending here would set isPlaying = false and app.ticker is
                // already stopped above, so a fuzz restart must escape the current
                // tick via setTimeout rather than call startRound() inline (T04).
                if (fuzzActive) {
                    fuzzStats.rounds++;
                    setTimeout(startRound, 0);
                    return { ended: true };
                }
                isPlaying = false;
                uiElement.classList.remove('hidden-ui'); // SHOW MENU ON DEATH
                scoreText.innerText = `Game Over! Time: ${survivalTime.toFixed(1)}s · Gen ${activeCell.generation}`;
                recordRunsForRoundEnd(); // T54
                renderStatsCard(); // T53
                netHandleRoundEnd(); // T30
                return { ended: true };
            } else if (totalPlayers > 1 && activePlayers.length <= 1) {
                if (fuzzActive) {
                    fuzzStats.rounds++;
                    setTimeout(startRound, 0);
                    return { ended: true };
                }
                isPlaying = false;
                uiElement.classList.remove('hidden-ui'); // SHOW MENU ON DEATH
                if (activePlayers.length === 1) {
                    playerWins[activePlayers[0].id]++; // Add a point to the survivor
                }

                // Build the dynamic score string based on how many players there are
                let scoreStr = `P1: ${playerWins[1]} | P2: ${playerWins[2]}`;
                if (totalPlayers >= 3) scoreStr += ` | P3: ${playerWins[3]}`;
                if (totalPlayers >= 4) scoreStr += ` | P4: ${playerWins[4]}`;
                scoreText.innerText = scoreStr;
                recordRunsForRoundEnd(); // T54
                renderStatsCard(); // T53
                netHandleRoundEnd(); // T30
                return { ended: true };
            }

            // --- DEATH RING SHATTER LOGIC (Organelles & Golgi) ---
            if (mitosis.state !== 'idle') {
                let sweepProgress = (survivalTime - mitosis.eventStartTime) / MITOSIS_SWEEP_DURATION;
                let ringX = 0, ringY = 0;

                if (mitosis.direction === 0) ringX = activeCell.x - activeCell.radiusX + (activeCell.radiusX * 2 * sweepProgress);
                else if (mitosis.direction === 1) ringY = activeCell.y - activeCell.radiusY + (activeCell.radiusY * 2 * sweepProgress);
                else if (mitosis.direction === 2) ringX = activeCell.x + activeCell.radiusX - (activeCell.radiusX * 2 * sweepProgress);
                else ringY = activeCell.y + activeCell.radiusY - (activeCell.radiusY * 2 * sweepProgress);

                // Shatter Organelles
                for (let i = organelles.length - 1; i >= 0; i--) {
                    let org = organelles[i];
                    let caught = false;
                    if (mitosis.direction === 0 && org.x < ringX) caught = true;
                    else if (mitosis.direction === 1 && org.y < ringY) caught = true;
                    else if (mitosis.direction === 2 && org.x > ringX) caught = true;
                    else if (mitosis.direction === 3 && org.y > ringY) caught = true;

                    if (caught) {
                        spawnVesicles(org.x, org.y, 5, org.type, org.color);
                        destroyOrganelleSprite(org);
                        organelles.splice(i, 1);
                    }
                }

                // Shatter Golgi Arcs
                let arcsChanged = false;
                for (let i = activeArcs.length - 1; i >= 0; i--) {
                    let arc = activeArcs[i];
                    let caught = false;

                    if (arc.type === 'ER') {
                        let steps = 20;
                        for (let s = 0; s <= steps; s++) {
                            let a = -arc.span + (s / steps) * (arc.span * 2);
                            let px = activeCell.x + Math.cos(globalRotation + a) * arc.r;
                            let py = activeCell.y + Math.sin(globalRotation + a) * arc.r;

                            if (mitosis.direction === 0 && px < ringX) caught = true;
                            else if (mitosis.direction === 1 && py < ringY) caught = true;
                            else if (mitosis.direction === 2 && px > ringX) caught = true;
                            else if (mitosis.direction === 3 && py > ringY) caught = true;

                            if (caught) break;
                        }
                    } else if (arc.type === 'Golgi' && window.golgiData && window.golgiData.layers) {
                        let layerObj = window.golgiData.layers.find(l => l.radius === arc.r);
                        if (layerObj) {
                            for (let pt of layerObj.points) {
                                let rx = pt.lx * Math.cos(window.golgiData.rot) - pt.ly * Math.sin(window.golgiData.rot) + window.golgiData.x;
                                let ry = pt.lx * Math.sin(window.golgiData.rot) + pt.ly * Math.cos(window.golgiData.rot) + window.golgiData.y;
                                let px = activeCell.x + rx * Math.cos(globalRotation) - ry * Math.sin(globalRotation);
                                let py = activeCell.y + rx * Math.sin(globalRotation) + ry * Math.cos(globalRotation);

                                if (mitosis.direction === 0 && px < ringX) caught = true;
                                else if (mitosis.direction === 1 && py < ringY) caught = true;
                                else if (mitosis.direction === 2 && px > ringX) caught = true;
                                else if (mitosis.direction === 3 && py > ringY) caught = true;

                                if (caught) break;
                            }
                        }
                    }

                    if (caught) {
                        for (let v = 0; v < 10; v++) {
                            let a = Math.random() * Math.PI * 2;
                            spawnVesicles(activeCell.x + Math.cos(a) * arc.r, activeCell.y + Math.sin(a) * arc.r, 1, 'membrane', C_MEMB);
                        }
                        activeArcs.splice(i, 1);
                        arcsChanged = true;
                    }
