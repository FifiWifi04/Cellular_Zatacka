                }
                if (arcsChanged) {
                    drawArcs();
                    // drawArcs() rebuilds centralHitboxes from whatever remains in
                    // activeArcs; once the nucleus is destroyed those hitboxes must
                    // stay gone regardless (see updateMitosis(), T22 step 4).
                    if (mitosis.nucleusDestroyed) centralHitboxes = [];
                }
            }

            updatePlayers(delta, deltaSec, isCellFrozen); // T22 step 5

            // T17: state half only -- see renderFrame() for the particleLayer
            // clear-or-draw half of this same frozen/unfrozen split.
            if (!isCellFrozen) {
                updateParticles(delta, deltaSec);
            }

            return { ended: false, isCellFrozen, delta, deltaSec };
        }

        // T22 step 6: pure reads. Never mutates game state (see updateCamera()'s
        // and updateWarningFilter()'s own definitions -- both already read-only
        // despite their "update" names, which is why the task's own design
        // pseudocode places them here rather than in stepSimulation()).
        function renderFrame(isCellFrozen, deltaSec, cameraDeltaSec) {
            drawCalcification(); // T22 step 6

            if (!isCellFrozen) {
                rotatingContainer.rotation = globalRotation;
                // T43: while any local player can pass through the ER/Golgi walls,
                // dim them to show they are not solid right now. Cheap alpha flip
                // on the existing container -- no redraw, no allocation.
                rotatingContainer.alpha = players.some(p => p.alive && !p.isBot && p.effects.golgiTimer > 0) ? 0.35 : 1.0;
                drawOrganelles(); // T22 step 3
                drawVesicles(); // T22 step 1
                drawATP(); // T51
            }

            drawMitosisVisuals();
            drawMalignantMass();
            drawNecroticClusters();
            drawNecroticDebris();
            drawNucleusChasers(); // T57

            drawInfection(); // T22 step 2
            updateWarningFilter(deltaSec); // T18: ramp/toggle post-processing filter off infection.state transition -- must run after drawInfection() so infection.state reflects this frame
            updateCamera(cameraDeltaSec);
            drawShake(); // T16: after updateCamera() so shakeRoot's offset is never lerped into world

            drawPlayerBars(); // T22 step 5
            updateNucleusFeedHUD(); // T52
            updateShedTailButtonHUD(); // T59

            // T17: no splash particles during frozen states (infection warning /
            // mitosis reveal) -- clear rather than leaving the last frame's burst
            // sitting frozen on screen.
            if (isCellFrozen) {
                particleLayer.clear();
            } else {
                drawParticles();
            }
        }

        // T28: fixed-timestep accumulator. stepSimulation() always advances by
        // exactly FIXED_DT of simulated time regardless of how many real
        // display frames that takes, so gap/vesicle-spawn rolls and physics no
        // longer run at half rate on a 30fps device. Long frames (tab switch,
        // GC pause) are clamped before accumulating so a stall cannot queue a
        // burst of catch-up steps; MAX_STEPS_PER_FRAME is the same guard for
        // sustained low fps instead of a single stall. Render interpolation
        // between steps is deliberately not implemented -- see docs/BACKLOG.md.
        let simAccumulator = 0;
        let lastStepResult = null; // most recent completed step's { isCellFrozen, delta, deltaSec } -- reused to render real frames where no step ran (e.g. above-60Hz displays)

        function gameLoop(delta) {
            if (!isPlaying) return;
            // T24: freeze simulation (incl. survivalTime) without stopping the
            // ticker -- PIXI's own render pass stays registered on it, so the
            // canvas keeps being redrawn (just unchanged) instead of the
            // frozen/blank look app.ticker.stop() would give behind the menu.
            if (paused) return;

            // T30: a net client never simulates -- it just renders whatever the
            // host's last snapshots put into players[]/organelles[]/vesicles[]
            // (netApplyStateSnapshot()/netApplyWorldSnapshot()). No
            // stepSimulation(), no accumulator: the host already ran physics at
            // its own fixed rate and is the sole source of truth.
            if (netOnlineActive && netState.role === 'client') {
                let deltaSec = app.ticker.deltaMS / 1000;
                // T31: client-side prediction (own head, applied every frame from
                // live input) and interpolation (everyone else, smoothed between
                // buffered snapshots) -- both purely visual, reconciled/refreshed
                // for real by the next 'state' message in netApplyStateSnapshot().
                netPredictLocalPlayer(deltaSec);
                netInterpolateRemotePlayers();
                // T60: a net client has no fixed-step accumulator (see the
                // comment above), so its own per-call deltaSec already *is* the
                // real game time elapsed since the last camera update.
                renderFrame(netState.frozen, deltaSec, deltaSec);
                if (!netState.frozen) updateAndDrawBackgroundElements(delta, deltaSec);
                drawTraces();
                return;
            }

            simAccumulator += Math.min(app.ticker.deltaMS / 1000, 0.25); // clamp long frames
            let steps = 0;
            // T60: total game-seconds actually simulated this real frame -- 0 on
            // a high-refresh display outrunning FIXED_DT, 1 step normally, or up
            // to MAX_STEPS_PER_FRAME on a slow one. updateCamera() converges by
            // this, not by a single step's deltaSec, so the camera keeps pace
            // with real game time regardless of display frame rate (Defect 2).
            let stepsDeltaSec = 0;
            while (simAccumulator >= FIXED_DT && steps < MAX_STEPS_PER_FRAME) {
                // stepSimulation() reads deltaSec from app.ticker.deltaMS, not
                // from its delta param -- see stepHeadless's comment below.
                app.ticker.deltaMS = FIXED_DT * 1000;
                let result = stepSimulation(FIXED_DT * 60);
                if (result.ended) { simAccumulator = 0; return; }
                lastStepResult = result;
                stepsDeltaSec += result.deltaSec;
                simAccumulator -= FIXED_DT;
                steps++;
            }
            if (steps === MAX_STEPS_PER_FRAME) simAccumulator = 0; // give up, do not spiral

            if (!lastStepResult) return; // no step has completed yet this round

            renderFrame(lastStepResult.isCellFrozen, lastStepResult.deltaSec, stepsDeltaSec);

            // Animate Background Elements once per frame globally -- kept fused
            // (state + draw), see updateAndDrawBackgroundElements()'s own comment
            // for why (T22 step 6).
            if (!lastStepResult.isCellFrozen) updateAndDrawBackgroundElements(lastStepResult.delta, lastStepResult.deltaSec);

            drawTraces();
        }
        app.ticker.add(gameLoop);

        // --- 8. Start & UI ---
        window.updateUI = function () {
            currentMode = parseInt(modeSelect.value);
            aiCount = parseInt(aiSelect.value);
            if (currentMode + aiCount > 4) {
                aiCount = 4 - currentMode;
                aiSelect.value = aiCount.toString();
            }

            currentSpeed = parseFloat(speedSelect.value);
            cameraMode = document.getElementById('cameraSelect').value;
            // T26: 'auto' leaves the current (detected/sampled) tier in place and
            // re-enables the sampler; any explicit tier is a deliberate choice, so
            // it applies immediately and switches auto-adjustment off for the session.
            let qualityChoice = document.getElementById('qualitySelect').value;
            if (qualityChoice === 'auto') {
                qualityIsAuto = true;
            } else {
                qualityIsAuto = false;
                applyQuality(qualityChoice);
            }

            let totalPlayers = currentMode + aiCount;
            if (totalPlayers === 1) {
                document.getElementById('controlsText').innerHTML = "P1 (Blue): L/R Arrows | Toggle: Down Arrow";
                // T61 item 6c: no "Survival Time: 0.0s" placeholder before a
                // round has ever run -- gameLoop() takes over scoreText once
                // isPlaying, and the round-end paths set their own text.
            } else {
                let controls = "P1: L/R/Down | P2: A/D/S";
                if (totalPlayers >= 3) controls += " | P3: G/J/H";
                if (totalPlayers === 4) controls += " | P4: 4/6/5";

                // T61 item 2: the boost-target legend used to be restated here
                // AND in #splashHint (renderControlSplash() below), ~60px
                // apart in the same panel. Stated once now, attached to the
                // control cards (splashHint) -- see item 2's "Fix".

                document.getElementById('controlsText').innerHTML = controls;

                if (!isPlaying) {
                    let scoreStr = `P1: ${playerWins[1]} | P2: ${playerWins[2]}`;
                    if (totalPlayers >= 3) scoreStr += ` | P3: ${playerWins[3]}`;
                    if (totalPlayers >= 4) scoreStr += ` | P4: ${playerWins[4]}`;
                    scoreText.innerText = scoreStr;
                }
            }

            // T23: touch steering only drives Player 1 -- warn instead of silently
            // leaving P2-P4 unplayable on a phone.
            if (isTouchDevice && currentMode > 1) {
                document.getElementById('controlsText').innerHTML =
                    "<span style='color:#ff7675;'>Touch controls only drive Player 1 -- use Solo vs Bots on this device.</span><br>" +
                    document.getElementById('controlsText').innerHTML;
            }

            renderControlSplash(); // T20
        };

        // T20: control-mapping splash screen. Reads playerConfigs -- the single
        // source of truth also used by startRound() -- so the two can never drift.
        const KEY_GLYPHS = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓' };
        function keyDisplayName(key) {
            if (KEY_GLYPHS[key]) return KEY_GLYPHS[key];
            return key.length === 1 ? key.toUpperCase() : key;
        }

        // T41: factored out of renderControlSplash so the Help panel can show
        // the same player/key mapping without a second copy of this markup.
        // T61 item 6a: hideInactive skips the not-configured-this-round cards
        // entirely instead of dimming them -- renderControlSplash() (the live
        // menu) wants that; renderHelpPanel()'s static reference guide still
        // wants all 4 shown regardless of the currently selected mode, so it
        // leaves this false.
        function controlCardsHtml(totalPlayers, hideInactive) {
            let html = '';
            playerConfigs.forEach((config, i) => {
                let active = i < totalPlayers;
                if (!active && hideInactive) return;
                let dotColor = '#' + config.color.toString(16).padStart(6, '0');
                html += `<div class="splash-card${active ? '' : ' dimmed'}">` +
                    `<div class="splash-card-title"><span class="splash-dot" style="background:${dotColor}"></span>P${config.id}</div>` +
                    `<div class="splash-row"><kbd class="splash-key">${keyDisplayName(config.controls.left)}</kbd> turn left</div>` +
                    `<div class="splash-row"><kbd class="splash-key">${keyDisplayName(config.controls.right)}</kbd> turn right</div>` +
                    `<div class="splash-row"><kbd class="splash-key">${keyDisplayName(config.controls.toggle)}</kbd> toggle mode</div>` +
                    `</div>`;
            });
            return html;
        }

        function renderControlSplash() {
            let totalPlayers = currentMode + aiCount;
            document.getElementById('splashCards').innerHTML = controlCardsHtml(totalPlayers, true); // T61 item 6a: only configured players' cards
            // T36: the one place the boost-target legend is stated (T61 item 2).
            document.getElementById('splashHint').innerHTML = "3rd key toggles boost target: " + TARGET_MODE_LEGEND + ".";
        }

        window.toggleControlSplash = function () {
            splashVisible = !splashVisible;
            document.getElementById('controlSplash').classList.toggle('hidden-splash', !splashVisible);
        };

        function toHex(n) { return '#' + n.toString(16).padStart(6, '0'); }

        // T41: is the How-to-Play overlay currently up? Several other paths
        // (the #ui mouseleave peek, the outside-click resume, Escape/P) have to
        // defer to it while it is open, so they all ask through here.
        function helpIsOpen() {
            return !document.getElementById('helpOverlay').classList.contains('hidden-help');
        }

        // T41: opening pauses a round in progress (mirrors togglePauseMenu);
        // closing always resumes. Hides #ui while open so the pause menu and
        // the help overlay are never stacked, and restores it on close only
        // when there is no round to resume back into (the pre-round main menu).
        window.toggleHelpPanel = function (show) {
            let overlay = document.getElementById('helpOverlay');
            if (show) {
                uiElement.classList.add('hidden-ui');
                overlay.classList.remove('hidden-help');
                if (isPlaying) paused = true;
            } else {
                overlay.classList.add('hidden-help');
                if (isPlaying) paused = false;
                else uiElement.classList.remove('hidden-ui');
            }
        };

        // T41: static How-to-Play content, built once from the same constants
        // and helpers the game itself runs on (controlCardsHtml, TARGET_MODE_LEGEND,
        // EFFECT_DURATION, the generation-gate thresholds, etc.) so this guide
        // cannot silently drift from the game the way the control legend once did.
        // See docs/tasks/T41-tutorial.md.
        function renderHelpPanel() {
            let erColor = toHex(ARCS.find(a => a.type === 'ER').color);
            let golgiColor = toHex(ARCS.find(a => a.type === 'Golgi').color);
            let membColor = toHex(C_MEMB), mitoColor = toHex(C_MITO), lysoColor = toHex(C_LYSO);
            let traceGradient = 'linear-gradient(90deg, ' + playerConfigs.map(c => toHex(c.color)).join(',') + ')';

            // massGrowInterval() reads activeCell.generation -- borrow it briefly
            // to quote the real Gen-3 growth rate instead of restating its formula.
            let savedGen = activeCell.generation;
            activeCell.generation = 3;
            let gen3MassInterval = massGrowInterval();
            activeCell.generation = savedGen;

            let html = `
                <h3>Goal</h3>
                <p>Survive. The arena and everything in it is trying to kill you --
                touch nothing lethal and outlast the other players.</p>

                <h3>Controls</h3>
                <p>Each player steers with two turn keys and a 3rd key that toggles
                their boost target (see Target Mode below) -- the same mapping shown
                on the main menu:</p>
                <div class="splash-cards">${controlCardsHtml(4)}</div>

                <h3>What kills you</h3>
                <div class="help-swatch-row"><span class="help-swatch" style="background:#82ccdd"></span>
                    <span><b>The membrane</b> -- the glowing rim around the cell. Always lethal;
                    from Generation 2 it also slowly closes in (see Generations).</span></div>
                <div class="help-swatch-row"><span class="help-swatch" style="background:${traceGradient}"></span>
                    <span><b>Traces</b> -- every player leaves a solid trail behind them, colour-matched
                    to their head (see the cards above). Touching any trail is lethal, including your
                    own -- except for the last ${NECK_LENGTH}px right behind your head, so you can turn
                    tightly without self-destructing.</span></div>
                <div class="help-swatch-row"><span class="help-swatch round" style="background:${mitoColor}"></span>
                    <span><b>Organelles</b> -- green and pink blobs that drift around the arena. Touch
                    = death. From Generation 2 some freeze solid and grey, and fuse into clusters that
                    shed lethal debris (see Generations).</span></div>
                <div class="help-swatch-row"><span class="help-swatch round" style="background:#6c5ce7"></span>
                    <span><b>The nucleus</b> -- the dark core at the centre of every cell,
                    ${NUCLEUS_RADIUS}px of always-lethal radius.</span></div>
                <div class="help-swatch-row"><span style="display:flex; gap:3px; flex:none; margin-top:3px;">
                    <span class="help-swatch" style="background:${erColor}"></span><span class="help-swatch" style="background:${golgiColor}"></span></span>
                    <span><b>ER / Golgi walls</b> -- the ring structures inside the cell. Solid and
                    lethal unless you have an active Golgi Pass (see Vesicles).</span></div>
                <div class="help-swatch-row"><span class="help-swatch" style="background:${mitoColor}"></span>
                    <span><b>Microtubules</b> -- solid bars that appear across the bridge during a
                    cell division (see Events).</span></div>
                <div class="help-swatch-row"><span class="help-swatch round" style="background:#ff4757"></span>
                    <span><b>Virus particles</b> -- spawned by a viral infection breach (see Events).
                    In-game tip: hide behind lysosome organelles.</span></div>
                <div class="help-swatch-row"><span class="help-swatch" style="background:#8a6d2f"></span>
                    <span><b>Protein aggregate</b> -- a growing amber clump that appears from
                    Generation 3 onward (see Generations).</span></div>
                <div class="help-swatch-row"><span class="help-swatch round" style="background:#ff4757"></span>
                    <span><b>Nucleus chasers</b> -- once the NUCLEUS bar (Generation 4) fills
                    completely, the cell turns and starts spawning these from its core. They home
                    in on you, slower than you are, and are breakable in Attack mode (see Target
                    mode).</span></div>

                <h3>Vesicles</h3>
                <div class="help-swatch-row"><span class="help-swatch round" style="background:${membColor}"></span>
                    <span><b>Membrane vesicle (blue)</b> -- Golgi Pass: cross ER/Golgi walls unharmed
                    for up to ${EFFECT_DURATION}s per pickup, capped at 15s. Collect 3 within 10s and
                    you get Ghost Mode instead: pass through every trace and organelle (not the
                    membrane or nucleus) for up to 10s.</span></div>
                <div class="help-swatch-row"><span class="help-swatch round" style="background:${lysoColor}"></span>
                    <span><b>Lysosome vesicle (pink)</b> -- trims your own oldest trace on pickup;
                    your 3rd pickup within 10s wipes half of it outright. Your 5th within that window
                    grants Hunter Mode for 10s: pass through opponents' trails and eliminate anyone
                    you run into head-on.</span></div>
                <div class="help-swatch-row"><span class="help-swatch round" style="background:${mitoColor}"></span>
                    <span><b>Mitochondria vesicle (green)</b> -- speed boost for up to
                    ${EFFECT_DURATION}s, capped at 15s. Grab a second one within 3s of the last and
                    the boost doubles (capped at 10s).</span></div>

                <h3>Target mode</h3>
                <p>${TARGET_MODE_LEGEND}. Toggle it with the 3rd key shown on your player card above.</p>
                <table class="help-table">
                    <tr><th></th><th>Lethal</th><th>Moves</th><th>Breakable in Attack mode</th></tr>
                    <tr><td>Living organelle</td><td>yes</td><td>drifts</td><td>no</td></tr>
                    <tr><td>Necrotic organelle or cluster (Gen 2+)</td><td>yes</td><td>static</td><td>yes -- one organelle per hit</td></tr>
                    <tr><td>Protein aggregate (Gen 3+)</td><td>yes</td><td>static</td><td>yes -- one block per hit</td></tr>
                    <tr><td>Nucleus chaser (post-transformation)</td><td>yes</td><td>homes toward you</td><td>yes -- one per hit</td></tr>
                </table>

                <h3>Events</h3>
                <ul>
                    <li><b>Viral infection</b> -- roughly every ${INFECTION_INTERVAL / 60} minutes, a
                    virus attaches to the membrane and counts down ${INFECTION_WARNING}s before
                    breaching. On breach it scatters a swarm of small, lethal, roaming virus particles
                    into the cell.</li>
                    <li><b>Cell division (mitosis)</b> -- every ${MITOSIS_INTERVAL / 60} minutes the
                    cell starts dividing: a bridge grows toward a new cell, guarded by microtubule bars
                    in its outer two lanes (the middle lane stays clear). A red wave then sweeps across
                    the old cell over the following ${MITOSIS_SWEEP_DURATION / 60} minutes -- reach the
                    new cell before it catches you, or you die. Everyone who crosses carries on into
                    the next generation.</li>
                </ul>

                <h3>Generations</h3>
                <ul>
                    <li><b>Generation 2</b> -- the membrane starts slowly shrinking (down to
                    ${Math.round(CALCIFY_FLOOR * 100)}% of its original size), and organelles begin
                    randomly freezing solid roughly every ${NECROSIS_INTERVAL}s. Frozen ones fuse into
                    clusters (up to ${CLUSTER_MAX_MEMBERS} members) when they touch, and bigger
                    clusters shed lethal debris faster. Small pale yellow-green
                    <b>ATP granules</b> also start appearing near the shrinking edge -- collect one
                    to halt the shrink for ${ATP_PAUSE_DURATION}s (stacks up to a ${ATP_PAUSE_MAX}s cap;
                    the membrane glows while it's holding).</li>
                    <li><b>Generation 3</b> -- a protein aggregate spawns and keeps growing new blocks
                    (about every ${gen3MassInterval}s at first, faster each generation after), up to
                    ${MASS_MAX_BLOCKS} blocks.</li>
                    <li><b>Generation 4</b> -- an angiogenesis gravity well appears at the centre of
                    each cell. Every fresh vesicle drifts free for up to ${FREE_WINDOW_MAX}s before
                    the well starts pulling it in -- grab it in that window and the nucleus never
                    gets it. Left alone, it's consumed at the nucleus and fills the NUCLEUS bar at
                    the top of the screen (worth more for lysosome vesicles than mitochondria or
                    membrane ones); the bar only ever rises. Past ${Math.round(FREE_WINDOW_ZERO_FRAC * 100)}%
                    the free window shrinks to zero -- vesicles are pulled in from the moment they
                    spawn and can no longer be intercepted. Once the bar fills completely, the cell
                    turns: the sim freezes for ${NUCLEUS_TRANSFORM_FREEZE + REVEAL_COUNTDOWN}s (a
                    3-2-1 countdown plays for the last ${REVEAL_COUNTDOWN}s of it) while the nucleus
                    reveals itself, then it starts spawning
                    homing chasers (capped at ${CHASER_MAX} at once) from its core. They're slower
                    than you and breakable in Attack mode; survive ${Math.round(CHASER_SURVIVAL_TARGET)}s
                    of it and the nucleus stops hunting.</li>
                </ul>
            `;
            document.getElementById('helpContent').innerHTML = html;
        }

        // updateUI() is not called at startup (see applyQuality above), so seed
        // the cards here or they stay empty until a dropdown is touched.
        renderControlSplash();
        renderHelpPanel();

        // T19: one click into a playable 1-player-vs-1-bot round. Sets the
        // same selects the manual path reads, then reuses startRound() so the
        // two paths can never diverge.
        window.quickPlay = function () {
            modeSelect.value = '1';
            aiSelect.value = '1';
            document.getElementById('cameraSelect').value = 'shared';
            speedSelect.value = '1.5';
            updateUI();
            startRound();
        };

        // T53: score weights, named so the reasoning lives with the numbers
        // instead of scattered through scoreRun(). Generations dominate on
        // purpose -- reaching a new generation means surviving a mitosis
        // event, the single biggest jump in hazard density the game has, so
        // it outweighs a long but timid round. per100px is a mild
        // anti-turtling nudge, not a primary term. See docs/tasks/
        // T53-run-stats-and-score.md Findings for the three worked examples.
        const SCORE = { perSecond: 2, perGeneration: 750, perVesicle: 15, perBreak: 50, per100px: 1 };
        function scoreRun(stats, survivalSeconds) {
            let vesicleCount = stats.vesicles.membrane + stats.vesicles.lysosome + stats.vesicles.mitochondria;
            let breakCount = stats.clusterBreaks + stats.massBreaks;
            return Math.round(
                survivalSeconds * SCORE.perSecond +
                (stats.maxGeneration - 1) * SCORE.perGeneration +
                vesicleCount * SCORE.perVesicle +
                breakCount * SCORE.perBreak +
                (stats.distance / 100) * SCORE.per100px
            );
        }

        // T54: persistent run history, one localStorage key, versioned so a
        // future schema change can detect and discard an incompatible save
        // instead of misreading it. Every localStorage access is wrapped --
        // private browsing, a disabled-storage policy and a full quota all
        // throw on read *or* write, and a failure here must not stop the
        // player from finishing their round (see docs/tasks/T54-high-score-table.md).
        const HS_KEY = 'cellularZatackaHighScores';
        const HS_VERSION = 2; // T55: v2 adds balance/owned/preferredSpawnSlot -- see migrateV1ToV2()
        const HISTORY_MAX = 50; // oldest runs drop first once exceeded
        const HS_TABLE_TOP_N = 10;

        // T55: microtubule upgrades, bought with points banked from every
        // recorded run's score (T53/T54). Applied once at round start (see
        // resolvePlayerUpgrades()), single-player only (design §4) -- none of
        // these touch a hazard constant, only the player's own tools, per the
        // task's hard rule.
        const UPGRADES = {
            pickupRadius: { name: 'Wider Pickup Radius', cost: 600, desc: 'Vesicles and ATP granules can be collected from further away.' },
            // T59: desc is a function, not a string -- "Press X" was never true
            // on touch (there is no X key there), so the wording is derived
            // from isTouchDevice the same way T41's help panel derives its own
            // text from live state, instead of hardcoding either device's input.
            shedTail: { name: 'Shed the Tail', cost: 1000, desc: () => `Cut away the oldest third of your own trace with ${isTouchDevice ? 'the scissors button' : "'X'"}. Long cooldown.` },
            spawnChoice: { name: 'Choice of Spawn', cost: 400, desc: 'Pick which of the 4 starting positions you begin the round at (Shop panel).' }
        };
        const PICKUP_RADIUS_BONUS = 12; // px added to the vesicle/ATP collection distance
        const SHED_TAIL_FRACTION = 0.3; // fraction of own trace points cut per use
        const SHED_TAIL_COOLDOWN = 30; // seconds

        function freshHighScoreData() {
            return {
                v: HS_VERSION, runs: [], totals: { rounds: 0, bestGeneration: 0, vesicles: 0, breaks: 0, longestSurvival: 0 },
                balance: 0, owned: {}, preferredSpawnSlot: 0 // T55
            };
        }

        // T55: a v1 (T54-era) save has no balance/owned/preferredSpawnSlot --
        // keep its runs/totals, start the new fields at zero/empty rather than
        // discarding the whole save the way an unrecognised version would.
        function migrateV1ToV2(v1) {
            if (!v1 || !Array.isArray(v1.runs) || !v1.totals) return freshHighScoreData();
            return { v: 2, runs: v1.runs, totals: v1.totals, balance: 0, owned: {}, preferredSpawnSlot: 0 };
        }

        // Unknown/newer v, corrupt JSON, or a missing field -> fresh data,
        // never a crash and never a guess at another version's shape.
        function loadHighScores() {
            try {
                let raw = localStorage.getItem(HS_KEY);
                if (!raw) return freshHighScoreData();
                let data = JSON.parse(raw);
                if (data && data.v === 1) data = migrateV1ToV2(data);
                if (!data || data.v !== HS_VERSION || !Array.isArray(data.runs) || !data.totals ||
                    typeof data.balance !== 'number' || !data.owned || typeof data.preferredSpawnSlot !== 'number') return freshHighScoreData();
                return data;
            } catch (err) {
                return freshHighScoreData();
            }
        }

        function saveHighScores(data) {
            try {
                localStorage.setItem(HS_KEY, JSON.stringify(data));
            } catch (err) {
                console.warn('[T54] could not save run history (storage unavailable or full) -- this round will not be remembered', err);
            }
        }

        // T55: atomic purchase -- write to storage FIRST; the caller always
        // re-reads via loadHighScores(), so nothing in memory is ever mutated
        // ahead of a successful write. Returns false (no charge, no ownership)
        // on: already owned, insufficient balance, or a storage failure -- the
        // same failure that can leave a purchase un-persisted must also leave
        // it un-applied, never one without the other.
        function purchaseUpgrade(id) {
            let upgrade = UPGRADES[id];
            if (!upgrade) return false;
            let data = loadHighScores();
            if (data.owned[id] || data.balance < upgrade.cost) return false;
            let next = Object.assign({}, data, {
                balance: data.balance - upgrade.cost,
                owned: Object.assign({}, data.owned, { [id]: true })
            });
            try {
                localStorage.setItem(HS_KEY, JSON.stringify(next));
            } catch (err) {
                console.warn('[T55] purchase failed to persist (storage unavailable or full) -- balance and ownership unchanged', err);
                return false;
            }
            return true;
        }

        window.attemptPurchase = function (id) {
            purchaseUpgrade(id);
            renderShopPanel();
        };

        window.setPreferredSpawnSlot = function (slotStr) {
            let data = loadHighScores();
            data.preferredSpawnSlot = parseInt(slotStr, 10) || 0;
            saveHighScores(data);
        };

        // T55 design §2: the one place owned upgrades are read into plain
        // numbers, at round start -- movement/collision code never calls
        // hasUpgrade()-style checks of its own. Empty in local multiplayer
        // (currentMode > 1, design §4): upgrades are a single-player
        // progression, so a 2-4 human round stays symmetric.
        function resolvePlayerUpgrades() {
            if (currentMode > 1 || netOnlineActive) return { owned: {}, preferredSpawnSlot: 0 }; // T30: upgrades stay single-player-only, same as local multiplayer
            let data = loadHighScores();
            return { owned: data.owned, preferredSpawnSlot: data.preferredSpawnSlot };
        }

        // T54: mode is human/bot composition, not just player count -- a Quick
        // Play 1v1 and a 4-player round are not comparable (task design §2).
        function currentModeLabel() {
            return currentMode + 'h' + aiCount + 'ai';
        }

        // Records one human player's finished run. Bots are never recorded --
        // this is the human's high-score table, not a leaderboard of the AI.
        // Returns true if this run beat every prior score stored for the same
        // mode (a mode with no prior runs counts its first run as a new best).
        function recordRun(stats, survivalSeconds, score, mode) {
            let data = loadHighScores();
            let priorBest = -1;
            for (let r of data.runs) if (r.mode === mode && r.score > priorBest) priorBest = r.score;
            let isNewBest = score > priorBest;

            let vesicleCount = stats.vesicles.membrane + stats.vesicles.lysosome + stats.vesicles.mitochondria;
            let breakCount = stats.clusterBreaks + stats.massBreaks;
            data.runs.push({
                score: score, time: Math.round(survivalSeconds * 10) / 10, gen: stats.maxGeneration,
                stats: {
                    vesicles: { membrane: stats.vesicles.membrane, lysosome: stats.vesicles.lysosome, mitochondria: stats.vesicles.mitochondria },
                    clusterBreaks: stats.clusterBreaks, massBreaks: stats.massBreaks,
                    mitosisEvents: stats.mitosisEvents, distance: Math.round(stats.distance)
                },
                mode: mode, at: Date.now()
            });
            if (data.runs.length > HISTORY_MAX) data.runs.splice(0, data.runs.length - HISTORY_MAX);
            data.balance += score; // T55: every recorded run banks its score as spendable currency

            // Totals are tracked independently of the capped runs list, so they
            // stay true lifetime figures even after old runs age out of it.
            data.totals.rounds++;
            data.totals.bestGeneration = Math.max(data.totals.bestGeneration, stats.maxGeneration);
            data.totals.vesicles += vesicleCount;
            data.totals.breaks += breakCount;
            data.totals.longestSurvival = Math.max(data.totals.longestSurvival, survivalSeconds);

            saveHighScores(data);
            return isNewBest;
        }

        // Called once per round end (both branches of stepSimulation's
        // round-over check), before renderStatsCard() -- state only, no
        // PIXI/DOM (§4.4a). Stashes p.isNewHighScore for renderStatsCard() to
        // read; this is a round-end-only transient, not a per-round-reset
        // field, the same way playerWins[] is mutated directly at round end.
        function recordRunsForRoundEnd() {
            let mode = currentModeLabel();
            for (let p of players) {
                if (p.isBot) continue;
                let score = scoreRun(p.stats, survivalTime);
                p.isNewHighScore = recordRun(p.stats, survivalTime, score, mode);
            }
        }

        // T54: is the high-score panel currently up? Mirrors helpIsOpen()
        // (T41) -- Escape/P, the #ui mouseleave peek, and the outside-click
        // resume all have to defer to it while it's open.
        function highScoreIsOpen() {
            return !document.getElementById('highScoreOverlay').classList.contains('hidden-help');
        }

        // T54: same pause/resume contract as toggleHelpPanel (T41) -- opening
        // pauses a round in progress, closing always resumes. Rebuilds the
        // panel content on every open since, unlike the static Help panel,
        // the run history changes between rounds.
        window.toggleHighScorePanel = function (show) {
            let overlay = document.getElementById('highScoreOverlay');
            if (show) {
                renderHighScorePanel();
                uiElement.classList.add('hidden-ui');
                overlay.classList.remove('hidden-help');
                if (isPlaying) paused = true;
            } else {
                overlay.classList.add('hidden-help');
                if (isPlaying) paused = false;
                else uiElement.classList.remove('hidden-ui');
            }
        };

        // T54: per-run table (top N by score, mode-labelled per the task's
        // "filter or label" note) plus lifetime totals.
        function renderHighScorePanel() {
            let data = loadHighScores();
            let top = data.runs.slice().sort((a, b) => b.score - a.score).slice(0, HS_TABLE_TOP_N);
            let rows = top.map(r => {
                let vesicleCount = r.stats.vesicles.membrane + r.stats.vesicles.lysosome + r.stats.vesicles.mitochondria;
                let breakCount = r.stats.clusterBreaks + r.stats.massBreaks;
                return `<tr><td>${r.score}</td><td>${r.time.toFixed(1)}s</td><td>Gen ${r.gen}</td><td>${r.mode}</td><td>${vesicleCount}</td><td>${breakCount}</td></tr>`;
            }).join('');
            let t = data.totals;
            let html = `
                <h3>Best runs</h3>
                ${top.length ? `<table class="help-table">
                    <tr><th>Score</th><th>Time</th><th>Gen</th><th>Mode</th><th>Vesicles</th><th>Breaks</th></tr>
                    ${rows}
                </table>` : '<p>No runs recorded yet -- play a round to start your history.</p>'}
                <h3>Lifetime totals</h3>
                <table class="help-table">
                    <tr><td>Rounds played</td><td>${t.rounds}</td></tr>
                    <tr><td>Best generation reached</td><td>${t.bestGeneration}</td></tr>
                    <tr><td>Total vesicles collected</td><td>${t.vesicles}</td></tr>
                    <tr><td>Total breaks</td><td>${t.breaks}</td></tr>
                    <tr><td>Longest survival</td><td>${t.longestSurvival.toFixed(1)}s</td></tr>
                </table>
            `;
            document.getElementById('highScoreContent').innerHTML = html;
        }

        // T54: destructive, so it asks first -- it is the player's data on
        // their device, but a slipped click must not silently wipe it.
        window.confirmClearHighScores = function () {
            if (!confirm('Clear all saved run history? This cannot be undone.')) return;
            saveHighScores(freshHighScoreData());
            renderHighScorePanel();
        };

        // T55: is the shop panel currently up? Mirrors helpIsOpen()/highScoreIsOpen().
        function shopIsOpen() {
            return !document.getElementById('shopOverlay').classList.contains('hidden-help');
        }

        // T55: same pause/resume contract as toggleHelpPanel/toggleHighScorePanel.
        window.toggleShopPanel = function (show) {
            let overlay = document.getElementById('shopOverlay');
            if (show) {
                renderShopPanel();
                uiElement.classList.add('hidden-ui');
                overlay.classList.remove('hidden-help');
                if (isPlaying) paused = true;
            } else {
                overlay.classList.add('hidden-help');
                if (isPlaying) paused = false;
                else uiElement.classList.remove('hidden-ui');
            }
        };

        const SPAWN_SLOT_NAMES = ['West (default)', 'East', 'North', 'South'];

        // T55: balance, one row per upgrade (cost/description/buy-or-owned),
        // and -- only once Choice of Spawn is owned -- the spawn-slot picker.
        // No currency purchase, no ads (design §5): the only way to a Buy
        // button being enabled is a balance banked from real recorded runs.
        function renderShopPanel() {
            let data = loadHighScores();
            let rows = Object.keys(UPGRADES).map(id => {
                let u = UPGRADES[id];
                let owned = !!data.owned[id];
                let afford = data.balance >= u.cost;
                let action = owned ? '<span class="shop-owned">Owned</span>' :
                    `<button class="shop-buy-btn" ${afford ? '' : 'disabled'} onclick="attemptPurchase('${id}')">Buy (${u.cost})</button>`;
                let desc = typeof u.desc === 'function' ? u.desc() : u.desc; // T59: shedTail's desc varies by input device
                return `<div class="shop-row"><div class="shop-row-info"><b>${u.name}</b><span>${desc}</span></div>${action}</div>`;
            }).join('');
            let spawnPicker = data.owned.spawnChoice ? `
                <h3>Spawn position</h3>
                <select class="shop-spawn-select" onchange="setPreferredSpawnSlot(this.value)">
                    ${SPAWN_SLOT_NAMES.map((n, i) => `<option value="${i}" ${data.preferredSpawnSlot === i ? 'selected' : ''}>${n}</option>`).join('')}
                </select>` : '';
            document.getElementById('shopContent').innerHTML = `
                <p>Balance: <b>${data.balance}</b> points</p>
                ${rows}
                ${spawnPicker}
                <p class="shop-note">Upgrades apply to single-player rounds only (bots get the same loadout). Not available in local multiplayer (2+ human players).</p>
            `;
        }

        // T53: end-of-round card, built into #ui/#scoreboard's existing spot
        // (AGENT_CONDUCT.md 4.4a -- draw-only, reads state, never mutates it).
        function renderStatsCard() {
            let html = '';
            for (let p of players) {
                let s = p.stats;
                let score = scoreRun(s, survivalTime);
                html += `<div class="stats-card-player${p.alive ? '' : ' dead'}" style="border-left-color:${toHex(p.color)}">` +
                    `<div class="stats-card-name">P${p.id}${p.isBot ? ' (Bot)' : ''} -- ${p.alive ? 'Survived' : 'Eliminated'} -- Score ${score}${p.isNewHighScore ? ' <span class="hs-new-best">New Best!</span>' : ''}</div>` +
                    `<div class="stats-card-row"><span>Generation reached</span><span>${s.maxGeneration}</span></div>` +
                    `<div class="stats-card-row"><span>Vesicles (mem/lys/mito)</span><span>${s.vesicles.membrane}/${s.vesicles.lysosome}/${s.vesicles.mitochondria}</span></div>` +
                    `<div class="stats-card-row"><span>Breaks (cluster/mass)</span><span>${s.clusterBreaks}/${s.massBreaks}</span></div>` +
                    `<div class="stats-card-row"><span>Mitosis events</span><span>${s.mitosisEvents}</span></div>` +
                    `<div class="stats-card-row"><span>Distance</span><span>${Math.round(s.distance)}px</span></div>` +
                    `</div>`;
            }
            statsCardElement.innerHTML = html;
            // T61: reveal the result-first block and collapse setup behind it
            // (item 3) -- see the .round-result/#setupDetails CSS/HTML.
            roundResultElement.classList.remove('hidden-round-result');
            setupDetailsElement.open = false;
        }

        window.startRound = function () {
            // 1. Clear previous round data
            roundResultElement.classList.add('hidden-round-result'); // T61 (was T53's statsCardElement toggle): hide the previous round's result
            setupDetailsElement.open = true; // T61: expand setup again for the round about to start
            uiBarsLayer.clear(); virusLayer.clear();
            vesicles = []; dynamicLayer.clear();
            atpGranules = []; atpLayer.clear(); calcifyPauseTimer = 0; // T51
            nucleusFeed.value = 0; nucleusFeedFlashTime = -Infinity; gen4EstablishTime = -Infinity; // T52
            nucleusChasers = []; chaserLayer.clear(); nucleusTransformTime = -Infinity; // T57
            nucleusChaserNextSpawn = Infinity; nucleusSiegeEnded = false; // T57
            particleCount = 0; particleLayer.clear(); // T17
            assemblyLiveCount.fill(0); // T56

            // 2. Reset the Virus Cycle (Set to 30s for testing)
            infection = {
                state: 'none',
                x: 0, y: 0, angle: 0,
                particles: [],
                nextWarningTime: 60,
                triggerTime: 0,
                warningVisible: false,
                breached: false // T60
            };
            shakeRoot.filters = null; // T18: a round ending mid-warning must not leave the next round filtered
            warningFilterActive = false;
            warningRamp = 0;
            // --- MITOSIS RESET ---
            mitosis.state = 'idle';
            mitosis.nextTriggerTime = MITOSIS_INTERVAL; // Production: 4 minutes
            mitosis.eventStartTime = 0;
            mitosis.revealPhase = 'none'; mitosis.phaseStartTime = 0; mitosis.countdownEndsAt = -Infinity; // T60
            cameraAtTarget = false; // T60
            mitosis.currentWidth = 600;
            mitosis.nucleusDestroyed = false;
            mitosis.generationCounted = false;
            activeCell.generation = 1; // T11
            activeCell.baseRadiusX = 1400; // T12: reset in case a previous round calcified
            activeCell.baseRadiusY = 1200;
            activeCell.radiusX = activeCell.baseRadiusX;
            activeCell.radiusY = activeCell.baseRadiusY;

            warningElement.innerText = "";
            warningElement.style.display = 'none';

            globalRotation = Math.random() * Math.PI * 2;
            survivalTime = 0;
            necrosisTimer = 0; // T13
            simAccumulator = 0; lastStepResult = null; // T28: never render into a new round with the previous round's leftovers
            malignantMass = { active: false, blockSize: 60, origin: { x: 0, y: 0 }, blocks: [], nextGrowTime: 0 }; // T14
            necroticClusters = new Map(); nextClusterId = 1; necroticDebris = []; // T38
            // T26: fresh adaptive-quality sampling window each round.
            qualitySampleElapsed = 0;
            qualitySampleTotalMs = 0;
            qualitySampleFrames = 0;
            qualitySampleDone = false;
            updateUI();

            world.scale.set(0.5);
            purgeSplitScreen();

            // Reset player array to avoid duplicates
            players = [];

            // T30: online play sources the roster from the lobby (host + peers,
            // in the fixed order every machine computed identically in
            // netBuildRoster()) instead of the local menu's currentMode/aiCount.
            let totalPlayers = netOnlineActive ? netState.roster.length : (currentMode + aiCount);

            // T55 design §2/§3: resolved ONCE here, into plain numbers on each
            // player object below -- nothing downstream calls hasUpgrade()
            // itself. Bots get the exact same owned set as the human (design
            // §3: "comparable loadout"), so a purchase never quietly makes the
            // round easier relative to the bots in it. resolvePlayerUpgrades()
            // already empties `owned` in local multiplayer (currentMode > 1).
            let resolvedUpgrades = resolvePlayerUpgrades();
            let owned = resolvedUpgrades.owned;
            // Player 0 (the sole human when currentMode === 1) spawns at its
            // preferred slot instead of slot 0; everyone else keeps filling the
            // remaining slots in their original order, so no two players ever
            // land on the same spawn point.
            let preferredSlot = owned.spawnChoice ? resolvedUpgrades.preferredSpawnSlot : 0;
            let spawnSlotForIndex = [preferredSlot, ...[0, 1, 2, 3].filter(s => s !== preferredSlot)];

            for (let i = 0; i < totalPlayers; i++) {
                let config = playerConfigs[i]; // identity (id/color/controls) always comes from the player's own slot
                let spawnCfg = playerConfigs[spawnSlotForIndex[i]]; // position/facing only
                let isBot = netOnlineActive ? netState.roster[i].isBot : (i >= currentMode);
                // T30: non-null only for a roster slot that is a human peer other
                // than this machine -- updatePlayers() reads netState.remoteInput
                // by this id instead of `keys` for exactly those players. Both the
                // host's own player and every client's own player keep it null
                // (their own local `keys` already drives them); bots keep it null too.
                let rosterPeerId = netOnlineActive ? netState.roster[i].peerId : null;
                let netPeerId = (netOnlineActive && !isBot && rosterPeerId !== netState.id) ? rosterPeerId : null;
                players.push({
                    id: config.id, x: activeCell.x + spawnCfg.dx, y: activeCell.y + spawnCfg.dy, angle: spawnCfg.angle,
                    color: config.color, coreColor: config.coreColor, targetMode: 'self',
                    controls: config.controls, isBot: isBot, netPeerId: netPeerId,
                    alive: true, traceSegments: [[]], isGap: false, gapDist: 0, distSinceGap: 0, nextGapAt: GAP_DISTANCE_MEAN * (0.5 + Math.random()), traceDist: 0, particleTick: 0, // T17; T28: gapDist/distSinceGap/nextGapAt replace the old frame-counted gapCounter
                    assemblyTick: 0, // T56
                    nextSegId: 1, // T58: stable per-segment id counter for isOwnNeck()
                    barX: 0, barY: 0, barGhostTimer: 0, barHunterTimer: 0, barGolgiTimer: 0, barSpeedTimer: 0, barSpeedLevel: 1, // T22 step 5: drawPlayerBars() snapshot
                    // T55: resolved once here (not read from `owned` anywhere
                    // else) -- pickupRadiusBonus is the only number the
                    // collision/pickup code reads; shedTail just gates the key
                    // handler/bot check below.
                    upgrades: {
                        pickupRadiusBonus: owned.pickupRadius ? PICKUP_RADIUS_BONUS : 0,
                        shedTail: !!owned.shedTail
                    },
                    effects: {
                        speedTimer: 0, golgiTimer: 0, speedLevel: 1, lastMitoHit: -10,
                        blueCount: 0, blueWindow: 0, ghostTimer: 0,
                        redCount: 0, redWindow: 0, hunterTimer: 0, lastMassHit: -10, // T14
                        lastClusterHit: -10, // T38
                        lastChaserHit: -10, // T57
                        lastShedTail: -Infinity // T55: usable immediately at round start
                    },
                    // T53: per-round counters, built alongside effects so the two can't
                    // drift apart. Incremented at the existing event sites (vesicle
                    // pickup, cluster/mass break, mitosis completion, movement) --
                    // see scoreRun()/renderStatsCard() below for how this is read.
                    stats: {
                        vesicles: { membrane: 0, lysosome: 0, mitochondria: 0 },
                        clusterBreaks: 0, massBreaks: 0, mitosisEvents: 0,
                        distance: 0, maxGeneration: 1
                    }
                });
                players[players.length - 1].traceSegments[0].id = 0; // T58: id 0 for the starting segment
            }

            // T25: (re)allocate the trace accumulation buffers around the
            // just-reset activeCell and blank them -- players[] above is
            // freshly rebuilt with empty traceSegments, so this draws nothing
            // and just sets each player's draw cursor to the empty state.
            rebuildTraceRT();

            generateMap();

            // T30: a client's own generateMap() just built a random, purely
            // local organelle/vesicle layout with no relation to the host's --
            // the host's periodic 'world' broadcast is authoritative, so drop
            // the local guess instead of showing it for one frame and then
            // jumping. ER/Golgi geometry and background art stay local and
            // unsynced (documented gap -- see docs/tasks/T30-host-authoritative-sync.md Findings).
            if (netOnlineActive && netState.role === 'client') {
                for (let o of organelles) destroyOrganelleSprite(o);
                organelles = [];
                vesicles = [];
            }

            isPlaying = true;
            paused = false; // T24: a restart from a paused menu must not stay frozen
            uiElement.classList.add('hidden-ui'); // AUTO-HIDE MENU ON START
            app.ticker.start(); // Unfreeze the engine!
            showPauseHint(); // T40: one-time nudge toward Esc/P/pauseMenuBtn
        };

        // Headless-driver hook (T11): jump straight to a generation without
        // running a mitosis event.
        window.setGeneration = n => { activeCell.generation = n; };

        // T22 step 7: advance the simulation with no PIXI draw call at all.
        // stepSimulation() reads deltaSec from app.ticker.deltaMS (not from its
        // own delta parameter -- see the top of that function), so a fake tick
        // must set deltaMS too, or survivalTime would advance by whatever the
        // last real render tick left behind instead of dt. delta (PIXI's
        // deltaTime) is dt seconds * 60, matching the engine's 60fps target
        // (targetFPMS 0.06) that the rest of the codebase already assumes --
        // see AGENT_CONDUCT.md's "3.5 * delta pixels per frame".
        window.stepHeadless = function (seconds, dt) {
            dt = dt || 1 / 60;
            let steps = 0;
            for (let t = 0; t < seconds; t += dt) {
                app.ticker.deltaMS = dt * 1000;
                let result = stepSimulation(dt * 60);
                steps++;
                if (result.ended) break;
            }
            return steps;
        };

        generateMap();
        world.scale.set(0.3);
        world.x = SCREEN_WIDTH / 2 - activeCell.x * 0.3;
        world.y = SCREEN_HEIGHT / 2 - activeCell.y * 0.3;

        function removeFrontPoints(traceSegments, pointsToRemove, player) {
            while (pointsToRemove > 0 && traceSegments.length > 0) {
                let firstSeg = traceSegments[0];
                if (firstSeg.length <= pointsToRemove) {
                    pointsToRemove -= firstSeg.length;
                    traceSegments.shift(); // Remove entire segment
                    // T58: the replacement placeholder still needs its own stable
                    // id -- it becomes the actively-growing segment isOwnNeck()
                    // checks against as soon as movement resumes.
                    if (traceSegments.length === 0) traceSegments.push(newTraceSegment(player));
                } else {
                    firstSeg.splice(0, pointsToRemove); // Remove partial segment
                    pointsToRemove = 0;
                }
            }
        }

        // T36: attack-mode ('red') redirects a picked-up vesicle's beneficial
        // effect to the nearest living opponent instead of the picker, matching
        // the head-aura colour and the legend text. Deterministic (nearest, not
        // random) so the choice is explainable in play. Falls back to self with
        // no living opponent so the pickup is never simply wasted.
        function boostTarget(p) {
            if (p.targetMode !== 'attack') return p;
            let opponents = players.filter(op => op.id !== p.id && op.alive);
            if (opponents.length === 0) return p;
            let nearest = opponents[0];
            let bestDistSq = (nearest.x - p.x) * (nearest.x - p.x) + (nearest.y - p.y) * (nearest.y - p.y);
            for (let k = 1; k < opponents.length; k++) {
                let dx = opponents[k].x - p.x, dy = opponents[k].y - p.y;
                let dSq = dx * dx + dy * dy;
                if (dSq < bestDistSq) { nearest = opponents[k]; bestDistSq = dSq; }
            }
            return nearest;
        }

        function deleteOldestTrace(player, percentage) {
            let totalPoints = 0;
            player.traceSegments.forEach(seg => totalPoints += seg.length);
            removeFrontPoints(player.traceSegments, Math.floor(totalPoints * percentage), player);
            traceRTNeedsFullRedraw = true; // T25: front geometry removed, RT must be redrawn
        }

        // Per-frame cap: keeps rebuildSpatialGrid()'s cost bounded independently of
        // round length. Never eats into the last (actively-growing) segment below
        // MIN_TAIL_POINTS - that segment's tail is what the self-immunity skip in
        // checkCollision()/raycast() depends on. If the cap can only be met by
        // cutting into it further, a temporary overshoot is accepted instead.
        function trimTraceToCap(player, maxPoints) {
            let segs = player.traceSegments;
            let totalPoints = 0;
            for (let i = 0; i < segs.length; i++) totalPoints += segs[i].length;

            let excess = totalPoints - maxPoints;
            if (excess <= 0) return;

            let protectedTail = Math.min(segs[segs.length - 1].length, MIN_TAIL_POINTS);
            let toRemove = Math.min(excess, totalPoints - protectedTail);
            if (toRemove <= 0) return;

            removeFrontPoints(segs, toRemove, player);
            while (segs.length > 1 && segs[0].length < 2) segs.shift();
            traceRTNeedsFullRedraw = true; // T25: front geometry removed, RT must be redrawn
        }

        // --- 9. Network transport and lobby (T29) ---
        // Host-authoritative transport for future multiplayer. T30 will carry
        // real game state over this channel; this task only proves peers can
        // find each other, agree on a protocol version, and exchange input /
        // heartbeat / RTT messages. Nothing here touches startRound(),
        // stepSimulation(), or gameLoop() -- see docs/tasks/T29-net-transport-lobby.md.
        //
        // Transport: a plain WebSocket relay (tools/relay_server.js), not
        // WebRTC DataChannels. The task's own design note sanctions this as
        // the v1 fallback "if signalling proves painful" -- see that task's
        // Findings for why real WebRTC (STUN/ICE negotiation, a signalling
        // library to vendor) was judged too risky to reliably verify inside
        // this sandbox and was deferred. Using a plain WebSocket also means
        // zero client-side library to vendor: `WebSocket` is a browser built-in.
        //
        // Message envelope (versioned in the handshake; one place, this table):
        //   { t:'create', v, name, cid }                 client -> relay: host a new room
        //   { t:'join',   v, name, room, cid }            client -> relay: join by code
        //   { t:'created', room, id }                    relay -> client: you are host
        //   { t:'joined',  room, id, host, rejoinedAs }    relay -> client: joined ok (T32: rejoinedAs is the old
        //       peerId this cid reclaimed, if the relay's rejoin window matched one -- see tools/relay_server.js)
        //   { t:'joinError', reason }                     relay -> client: refused (bad code/full/version)
        //   { t:'lobby',  players:[{id,name,isHost}] }    relay -> room: membership snapshot
        //   { t:'peerLeft', id }                          relay -> room: a non-host left
        //   { t:'hostLeft' }                              relay -> room: host left, round over
        //   { t:'peerRejoined', oldId, newId }            relay -> room (T32): a departed cid reconnected;
        //       host-only remap, see netHandlePeerRejoined()
        //   { t:'start',  config, seed, to? }             host -> room (relayed, optionally targeted): launches
        //       the round on every peer, or (T32, targeted) catches up one rejoining peer
        //   { t:'input',  seq, left, right, toggle }       client -> host (relayed): held-key state, sampled at NET_INPUT_HZ
        //   { t:'state', tick, ts, frozen, survivalTime, generation, players:[...] }  host -> room: T30 per-player
        //       snapshot at NET_STATE_HZ (x/y/angle/alive/isGap/targetMode/effect timers, T31's per-player input-ack
        //       seq, roster order -- see netBuildStateMessage()). Traces are never sent; clients reconstruct them
        //       from isGap + head position. The ack lets each client's own row rewind-and-replay its own predicted
        //       head (see netReconcileLocalPlayer()); every other row is interpolated ~100ms in the past instead
        //       (see netInterpolateRemotePlayers()).
        //   { t:'world', radiusX, radiusY, orgs:[...], ves:[...] }  host -> room: T30 organelle/vesicle full-list
        //       reconciliation at NET_WORLD_HZ (see netBuildWorldMessage() and this task's Findings for why this is a
        //       full-list replace rather than the task's literal spawn/collect *events* wording for vesicles).
        //   { t:'roundEnd' }                              host -> room: the host's round ended; clients show the menu
        //   { t:'ping', ts, to } / { t:'pong', ts, to }    either -> a specific peer (relayed, RTT probe)
        //   { t:'bg', hidden }                            client -> host (T32): visibilitychange -- distinguishes
        //       backgrounding from a real drop, see netUpdateStatusBar()
        //   { t:'requestSnapshot' }                       client -> host (T32): "I just came back, catch me up"
        //   { t:'rejoinSnapshot', to, players:[{pts,isGap}] }  host -> one peer (T32, targeted): downsampled trace
        //       history, sent after a rejoin's 'start' and after any 'requestSnapshot' -- see
        //       netBuildRejoinSnapshot()/netApplyRejoinSnapshot()
        //   { t:'bye' }                                    either -> relay: clean leave
        // Every relayed message is tagged with `from` (the sender's peer id)
        // by the relay before delivery.
        //
        // T30 scope note: ER/Golgi wall geometry, Gen2+ hazard systems
        // (necrosis, the malignant mass, nucleus chasers, ATP granules) and
        // full mitosis/infection state are NOT synced -- only the `frozen`
        // flag crosses the wire for those. Verified within short (pre-mitosis,
        // pre-infection, Gen 1) rounds; see docs/tasks/T30-host-authoritative-sync.md
        // Findings and docs/BACKLOG.md for the documented follow-up.
        //
        // T32 scope note: disconnect handling covers non-host clients (staged
        // lagging/dropped/gone classification, bot handoff, rejoin within
        // NET_GONE_MS) and a departed/hung host (match ends honestly, final
        // standings shown, back to the room picker). Host migration itself
        // stays out of scope -- see docs/tasks/T32-net-resilience.md §3 and
        // the existing docs/BACKLOG.md entry.
        const NET_PROTOCOL_VERSION = 1;
        const NET_INPUT_HZ = 30;  // matches the task's own ~1.5KB/s-at-4-players bandwidth note
        const NET_STATE_HZ = 20;  // T30: player snapshots -- design note recommends 20-30Hz
        const NET_WORLD_HZ = 5;   // T30: organelle/vesicle reconciliation -- cheap, doesn't need player-rate freshness
        const NET_PING_HZ = 1;
        // T31: remote players are rendered this far in the past so there is
        // always a bracketing pair of snapshots to interpolate between
        // (buffer covers several NET_STATE_HZ intervals -- see
        // netInterpolateRemotePlayers()). Small enough to still feel live.
        const NET_INTERP_DELAY_MS = 100;
        const NET_SNAP_BUFFER_MAX = 6; // per remote player -- ~300ms of history at NET_STATE_HZ
        // T31: below this, a client's rewind-and-replay reconciliation keeps
        // the existing prediction as-is rather than overwriting it with an
        // ~identical value -- avoids sub-pixel float jitter every snapshot.
        const NET_RECONCILE_SNAP_THRESHOLD_SQ = 4 * 4;
        const NET_PRED_BUFFER_MAX = 300; // ~5s at 60fps -- bounds growth if acks stop arriving entirely
        // T32: staged silence classification, per docs/tasks/T32-net-resilience.md's
        // design table -- shared by the host (classifying each client) and every
        // client (classifying the host). Driven by netState.lastSeenAt, updated
        // on ANY relayed message from that peer (ping/pong already run at 1Hz
        // continuously from room-join, so no separate heartbeat message type is
        // needed -- see netCheckHealth()).
        const NET_LAG_MS = 1000;
        const NET_DROP_MS = 5000;
        const NET_GONE_MS = 15000;
        const NET_HEALTH_HZ = 2;
        // T32: rejoin snapshot trace downsample -- every Nth point of each
        // player's trace, so a rejoining client's screen looks right without
        // sending the full (potentially thousands-of-points) trace history.
        const NET_REJOIN_TRACE_STRIDE = 8;

        let netState = null; // null only transiently inside resetNetState() itself

        // Fresh, disconnected state. Called on load and every time a room is
        // left/re-hosted/re-joined -- never partially reused, so a stale RTT
        // or player-list entry from a previous room can't leak into a new one.
        function resetNetState() {
            if (netState) {
                clearInterval(netState.inputTimer);
                clearInterval(netState.stateTimer);
                clearInterval(netState.worldTimer);
                clearInterval(netState.pingTimer);
                clearInterval(netState.healthTimer);
                if (netState.ws) { try { netState.ws.close(); } catch (e) { } }
            }
            netState = {
                ws: null, role: null, room: null, id: null, hostId: null,
                players: [], started: false,
                statusText: '', statusIsFinal: false, // statusIsFinal: the close handler must not overwrite it with a generic message
                rtt: {}, lastInputSeqSeen: {}, lastStateAt: null, mySeq: 0,
                inputTimer: null, stateTimer: null, worldTimer: null, pingTimer: null,
                // T30 additions below -- all rebuilt fresh per room, same as everything above.
                roster: null,       // [{peerId, isBot}], fixed for the round, built identically by every peer -- see netBuildRoster()
                myIndex: -1,        // client only: this machine's own index into players[]/roster -- T31: also picks out which row to predict/reconcile instead of interpolate
                remoteInput: {},    // host only: peerId -> {left, right, toggle} most recently received hold state
                lastAppliedTick: -1, // client only: highest 'state' tick applied -- discards stale/out-of-order snapshots
                frozen: false,      // client only: mirrors the host's isCellFrozen this frame
                // T31 additions below -- also cleared in netStarted() (not just here), since a room can host more
                // than one round and stale entries from a prior round must not leak into a new one.
                snapBuffer: [],     // client only: per-player-index array of {t,x,y,angle} samples, for netInterpolateRemotePlayers()
                predInputs: [],     // client only: ring buffer of {seq,left,right,dt} applied to the local head, for netReconcileLocalPlayer()
                // T32 additions below.
                lastSeenAt: {},        // peerId -> performance.now() of the last message received from them (any type)
                peerHealth: {},        // peerId -> 'ok'|'lagging'|'dropped'|'gone', see netCheckHealth()
                healthTimer: null,
                backgroundedPeers: {}, // host only: peerId -> true while that client reports itself hidden (see visibilitychange below)
                hostGoneHandled: false, // client only: guards netHandleHostGone() against firing twice (relay 'hostLeft' racing our own heartbeat)
                startConfig: null,     // host only: the config passed to the last 'start' broadcast, resent (targeted) to a rejoining peer
                confirmedGone: {}      // host only: peerId -> true once the relay reported an actual socket close (peerLeft/hostLeft) --
                // latches 'gone' against a straggler message (one already in flight when the socket closed) that would
                // otherwise refresh lastSeenAt and make netCheckHealth() briefly reclassify back to 'ok', silently
                // undoing the bot handoff. Cleared only by an explicit rejoin (netHandlePeerRejoined()).
            };
        }
        resetNetState();

        // T32: this browser's persistent identity across reconnects, independent
        // of the relay's per-connection peerId -- lets a client that actually
        // drops and reconnects (new WebSocket, new peerId) be recognised as the
        // same player and handed back its old roster slot. Generated once and
        // kept in localStorage, same pattern as netDefaultName().
        function netClientId() {
            let id = localStorage.getItem('cz_netClientId');
            if (!id) {
                id = 'c' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
                localStorage.setItem('cz_netClientId', id);
            }
            return id;
        }

        function netDefaultName() {
            return localStorage.getItem('cz_netName') || 'Player';
        }

        // ?relay=ws://host:port overrides the default so a real deployment
        // (the relay hosted somewhere other than this page's own origin) is
        // reachable without a code change. Falls back to localhost for
        // file:// -- there is no meaningful location.hostname there.
        function defaultRelayUrl() {
            let override = new URLSearchParams(location.search).get('relay');
            if (override) return override;
            let host = (location.protocol !== 'file:' && location.hostname) ? location.hostname : 'localhost';
            return 'ws://' + host + ':8090';
        }

        function netSend(obj) {
            if (netState.ws && netState.ws.readyState === WebSocket.OPEN) netState.ws.send(JSON.stringify(obj));
        }

        function netStopTimers() {
            clearInterval(netState.inputTimer);
            clearInterval(netState.stateTimer);
            clearInterval(netState.worldTimer);
            clearInterval(netState.pingTimer);
            clearInterval(netState.healthTimer);
            netState.inputTimer = netState.stateTimer = netState.worldTimer = netState.pingTimer = netState.healthTimer = null;
        }

        // Opens the socket and wires the message/close/error handlers, then
        // calls onOpen (which sends the actual create/join). Never called on
        // page load -- only from netHostRoom()/netJoinRoomClick() -- so the
        // entire networking path is inert until a player explicitly opts in.
        function netConnect(onOpen) {
            resetNetState();
            let url = defaultRelayUrl();
            netState.statusText = 'Connecting to ' + url + ' ...';
            renderNetPanel();
            let ws;
            try {
                ws = new WebSocket(url);
            } catch (e) {
                netState.statusText = 'Could not connect: ' + e.message;
                netState.statusIsFinal = true;
                renderNetPanel();
                return;
            }
            netState.ws = ws;
            ws.addEventListener('open', () => { onOpen(); });
            ws.addEventListener('message', e => {
                let msg;
                try { msg = JSON.parse(e.data); } catch (err) { return; }
                netHandleMessage(msg);
            });
            ws.addEventListener('close', () => {
                netStopTimers();
                if (!netState.statusIsFinal) netState.statusText = 'Disconnected from the relay.';
                netState.role = null;
                // T32: without this, renderNetPanel() keeps showing the dead-end
                // "Cancel"-only screen (its `!netState.ws` check sees a truthy,
                // just-closed socket) instead of the Host/Join form -- blocking
                // exactly the rejoin the design asks for after an involuntary
                // drop (wifi, sleep, crash -- anything that didn't go through
                // netLeaveRoom()'s own explicit resetNetState()).
                netState.ws = null;
                renderNetPanel();
            });
            ws.addEventListener('error', () => {
                netState.statusText = 'Relay unreachable at ' + url + '. Run tools/relay_server.js and pass ?relay=ws://host:port if it is not on localhost:8090.';
                netState.statusIsFinal = true;
                renderNetPanel();
            });
        }

        function netHandleMessage(msg) {
            // T32: generic liveness tracking -- every relayed message is tagged
            // with `from` by the relay, so this covers ping/pong (running at
            // 1Hz from the moment a room forms) plus, once a round is live,
            // input/state/world at their much higher rates. No separate
            // heartbeat message type is needed -- see netCheckHealth().
            if (msg.from != null) netState.lastSeenAt[msg.from] = performance.now();
            switch (msg.t) {
                case 'created':
                    netState.role = 'host'; netState.room = msg.room; netState.id = msg.id; netState.hostId = msg.id;
                    netState.statusText = 'Hosting.'; netState.statusIsFinal = false;
                    netStartPingTimer();
                    break;
                case 'joined':
                    netState.role = 'client'; netState.room = msg.room; netState.id = msg.id; netState.hostId = msg.host;
                    netState.statusText = 'Joined.'; netState.statusIsFinal = false;
                    netState.lastSeenAt[msg.host] = performance.now(); // T32: seed host liveness now, not on the first ping a second from now
                    netStartPingTimer();
                    break;
                case 'joinError':
                    netState.statusText = msg.reason; netState.statusIsFinal = true;
                    break;
                case 'lobby':
                    netState.players = msg.players;
                    break;
                case 'peerLeft':
                    delete netState.rtt[msg.id]; delete netState.lastInputSeqSeen[msg.id];
                    // T32: a relay-reported close is unambiguous -- don't wait out
                    // the staged lagging/dropped thresholds, apply the drop
                    // behaviour immediately (still within the "5s" test budget,
                    // just sooner and for a certain reason instead of a guess).
                    if (netState.role === 'host') {
                        netState.confirmedGone[msg.id] = true;
                        netState.peerHealth[msg.id] = 'gone'; netApplyClientDrop(msg.id); netUpdateStatusBar();
                    }
                    break;
                case 'hostLeft':
                    netHandleHostGone('Host disconnected -- match ended.');
                    break;
                case 'peerRejoined':
                    // T32: host-only. A departed peer's cid matched within the
                    // relay's rejoin window -- remap the fixed roster/player
                    // record from the old (now-dead) peerId to the new
                    // connection's peerId, hand control back, and catch the
                    // rejoiner up with a fresh 'start' + downsampled trace
                    // snapshot (see netHandlePeerRejoined()).
                    if (netState.role === 'host') netHandlePeerRejoined(msg.oldId, msg.newId);
                    return; // rebuilds its own UI state as needed; no generic repaint
                case 'bg':
                    // T32: host-only. Lets the status bar say "backgrounded"
                    // instead of "dropped/gone" for a client that told us it is
                    // merely hidden, not gone -- see the visibilitychange handler.
                    if (netState.role === 'host') { netState.backgroundedPeers[msg.from] = !!msg.hidden; netUpdateStatusBar(); }
                    return;
                case 'requestSnapshot':
                    // T32: host-only. A client just came back from being hidden
                    // and wants a full picture instead of catching up from
                    // whatever partial state it missed while backgrounded.
                    if (netState.role === 'host' && netOnlineActive) netSend(Object.assign({ t: 'rejoinSnapshot', to: msg.from }, netBuildRejoinSnapshot()));
                    return;
                case 'rejoinSnapshot':
                    if (netState.role === 'client') netApplyRejoinSnapshot(msg);
                    return;
                case 'start':
                    netStarted(msg.config);
                    return; // netStarted() already calls renderNetPanel() once, after closing the panel
                case 'input':
                    // T30: host-only. Edge-triggered targetMode toggle, mirroring
                    // the local keydown handler exactly (flips once per rising
                    // edge, not once per held-frame) -- then the hold state is
                    // stored for updatePlayers() to read every simulation step.
                    if (netState.role === 'host') {
                        netState.lastInputSeqSeen[msg.from] = msg.seq;
                        let prev = netState.remoteInput[msg.from] || { left: false, right: false, toggle: false };
                        if (msg.toggle && !prev.toggle) {
                            let p = players.find(pl => pl.netPeerId === msg.from);
                            if (p && p.alive && infection.state !== 'warning' && !isMitosisFreezeActive()) {
