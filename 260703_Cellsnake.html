            atpGranules.push({ x: gx, y: gy, radius: ATP_RADIUS, life: ATP_LIFETIME, phase: Math.random() * Math.PI * 2 });
        }

        // T51: draw only (§4.4a) -- reads atpGranules, never mutates it.
        function drawATP() {
            atpLayer.clear();
            for (let g of atpGranules) {
                let pulse = 0.7 + 0.3 * Math.sin(survivalTime * 4 + g.phase);
                atpLayer.beginFill(ATP_COLOR, pulse);
                atpLayer.lineStyle(1.5, 0xffffff, 0.5);
                atpLayer.drawCircle(g.x, g.y, g.radius);
                atpLayer.endFill();
            }
        }

        // T52: DOM HUD readout for the Gen 4+ nucleus feed meter -- draw only
        // (AGENT_CONDUCT 4.4a), reads nucleusFeed/generation and never writes
        // them; nucleusFeed.value is mutated exclusively in updateVesicles()'s
        // consume branch above.
        function updateNucleusFeedHUD() {
            let bar = document.getElementById('nucleusFeedBar');
            if (!genAtLeast(4)) { bar.style.display = 'none'; return; }
            bar.style.display = 'block';

            let frac = nucleusFeed.value / NUCLEUS_FEED_MAX;
            let fill = document.getElementById('nucleusFeedFill');
            fill.style.width = `${Math.min(100, frac * 100)}%`;
            fill.classList.toggle('critical', frac >= FREE_WINDOW_ZERO_FRAC);

            let sinceFlash = survivalTime - nucleusFeedFlashTime;
            fill.style.boxShadow = sinceFlash < NUCLEUS_FLASH_DURATION
                ? `0 0 ${Math.round(10 * (1 - sinceFlash / NUCLEUS_FLASH_DURATION))}px #d6a4ff`
                : '';
        }

        // T59: DOM HUD control for the touch Shed the Tail button -- draw only
        // (AGENT_CONDUCT 4.4a), reads players[0].upgrades/effects and
        // survivalTime, never mutates them. Mirrors updateNucleusFeedHUD()'s
        // show/hide idiom above.
        function updateShedTailButtonHUD() {
            if (!isTouchDevice) return;
            let p = players[0];
            let owned = !!(p && p.alive && p.upgrades.shedTail);
            shedTailBtn.style.display = owned ? 'flex' : 'none';
            if (!owned) return;

            let remaining = SHED_TAIL_COOLDOWN - (survivalTime - p.effects.lastShedTail);
            let onCooldown = remaining > 0;
            shedTailBtn.disabled = onCooldown;
            shedTailBtn.textContent = onCooldown ? String(Math.ceil(remaining)) : '✂';
        }

        // T57: spawns from the origin nucleus (activeCell) regardless of
        // mitosis state -- homing itself (below) tracks raw player x/y, which
        // is correct whether or not a player has crossed into mitosis.cellB,
        // so no cellB-aware spawn point is needed.
        function spawnNucleusChaser() {
            let ang = Math.random() * Math.PI * 2;
            nucleusChasers.push({
                x: activeCell.x + Math.cos(ang) * (NUCLEUS_RADIUS + CHASER_RADIUS + 10),
                y: activeCell.y + Math.sin(ang) * (NUCLEUS_RADIUS + CHASER_RADIUS + 10),
                angle: ang,
                spawnTime: survivalTime,
                radius: CHASER_RADIUS,
                dead: false
            });
        }

        // T57: shared teardown, mirroring destroyNecroticOrganelle() -- marks
        // `dead` first so this frame's already-built spatialGrid entry (trap
        // 4.1) is skipped by raycast(), then drops it from the live array.
        function destroyNucleusChaser(i) {
            let h = nucleusChasers[i];
            h.dead = true;
            nucleusChasers.splice(i, 1);
            emitParticles(h.x, h.y, 14, { speed: 2.6, spread: Math.PI * 2, life: 0.5, size: 3, color: 0xff6b81 }); // T17
        }

        // T57: state only (§4.4a) -- see drawNucleusChasers() for the render half.
        function updateNucleusChasers(delta, deltaSec) {
            if (nucleusTransformTime === -Infinity) return;

            // Survivability model (b, see docs/tasks/T57 Findings): once players
            // have weathered CHASER_SURVIVAL_TARGET seconds of the active state,
            // the siege ends -- no more spawns; existing chasers still run out
            // their own CHASER_LIFETIME rather than vanishing instantly.
            let activeSince = nucleusTransformTime + NUCLEUS_TRANSFORM_FREEZE + REVEAL_COUNTDOWN;
            if (!nucleusSiegeEnded && survivalTime - activeSince >= CHASER_SURVIVAL_TARGET) {
                nucleusSiegeEnded = true;
                addShake(0.6, 0.6); // T16
                warningElement.innerText = "THE CELL QUIETS -- THE NUCLEUS STOPS HUNTING";
                warningElement.style.color = "#7bed9f";
                warningElement.style.display = 'block';
                setTimeout(() => warningElement.style.display = 'none', 4000);
            }

            if (!nucleusSiegeEnded && nucleusChasers.length < CHASER_MAX && survivalTime >= nucleusChaserNextSpawn) {
                spawnNucleusChaser();
                nucleusChaserNextSpawn = survivalTime + CHASER_SPAWN_INTERVAL;
            }

            for (let i = nucleusChasers.length - 1; i >= 0; i--) {
                let h = nucleusChasers[i];
                if (survivalTime - h.spawnTime > CHASER_LIFETIME) {
                    nucleusChasers.splice(i, 1);
                    continue;
                }

                // Home toward the nearest living player at a turn-rate-limited
                // pace (not instant), so it stays outrunnable and steerable
                // around rather than an inescapable magnet -- see Findings.
                let target = null, bestDist = Infinity;
                for (let p of players) {
                    if (!p.alive) continue;
                    let d = Math.hypot(p.x - h.x, p.y - h.y);
                    if (d < bestDist) { bestDist = d; target = p; }
                }
                if (target) {
                    let targetAngle = Math.atan2(target.y - h.y, target.x - h.x);
                    let diff = Math.atan2(Math.sin(targetAngle - h.angle), Math.cos(targetAngle - h.angle));
                    let maxTurn = CHASER_TURN_RATE * delta;
                    h.angle += Math.max(-maxTurn, Math.min(maxTurn, diff));
                }
                h.x += Math.cos(h.angle) * CHASER_SPEED * delta;
                h.y += Math.sin(h.angle) * CHASER_SPEED * delta;

                // Containment: clamp back toward the origin nucleus if it ever
                // drifts outside all valid geometry (cell A, cell B, bridge).
                // Anchoring on activeCell rather than the nearer cell avoids
                // reading mitosis.cellB.radiusX/Y, which is never set (see
                // docs/BACKLOG.md's existing note on that field).
                if (isOutsideCell(h.x, h.y, CHASER_RADIUS)) {
                    let ang = Math.atan2(h.y - activeCell.y, h.x - activeCell.x);
                    h.x = activeCell.x + Math.cos(ang) * (activeCell.radiusX - CHASER_RADIUS - 6);
                    h.y = activeCell.y + Math.sin(ang) * (activeCell.radiusY - CHASER_RADIUS - 6);
                }
            }
        }

        // T57: draw only (§4.4a) -- one persistent Graphics, cleared+redrawn
        // from state every frame, never one Graphics per chaser.
        function drawNucleusChasers() {
            chaserLayer.clear();
            for (let h of nucleusChasers) {
                // Oriented, pulsing body so motion reads as "alive and directed"
                // at a glance -- must stay distinct from T38's grey crystalline
                // clusters and T39's soft amber aggregate (see Findings).
                let pulse = 1 + 0.15 * Math.sin(survivalTime * 8 + h.x);
                chaserLayer.beginFill(0xff4757, 0.85);
                chaserLayer.drawCircle(h.x, h.y, h.radius * pulse);
                chaserLayer.endFill();

                let tipX = h.x + Math.cos(h.angle) * h.radius * 1.8;
                let tipY = h.y + Math.sin(h.angle) * h.radius * 1.8;
                let baseA = h.angle + Math.PI * 0.6, baseB = h.angle - Math.PI * 0.6;
                chaserLayer.beginFill(0xff6b81, 0.9);
                chaserLayer.moveTo(tipX, tipY);
                chaserLayer.lineTo(h.x + Math.cos(baseA) * h.radius * 0.7, h.y + Math.sin(baseA) * h.radius * 0.7);
                chaserLayer.lineTo(h.x + Math.cos(baseB) * h.radius * 0.7, h.y + Math.sin(baseB) * h.radius * 0.7);
                chaserLayer.closePath();
                chaserLayer.endFill();
            }
        }

        // --- THE INFECTION EVENT SYSTEM ---
        // State only; see drawInfection() below for the render half of the split
        // (T22 step 2 / §4.4a).
        function updateInfection(delta, deltaSec) {
            if (survivalTime >= infection.nextWarningTime && infection.state === 'none') {
                infection.state = 'warning';
                infection.triggerTime = survivalTime;
                warningElement.innerText = "WARNING: VIRUS ATTACHED! BREACH IN " + INFECTION_WARNING + " SECONDS!";
                warningElement.style.display = 'block';

                let spawnAngle = Math.random() * Math.PI * 2;
                infection.x = activeCell.x + Math.cos(spawnAngle) * activeCell.radiusX;
                infection.y = activeCell.y + Math.sin(spawnAngle) * activeCell.radiusY;
                infection.angle = Math.atan2(activeCell.y - infection.y, activeCell.x - infection.x);
            }

            if (infection.state === 'warning') {
                infection.warningVisible = true;

                if (!infection.breached && survivalTime >= infection.triggerTime + INFECTION_WARNING) {
                    infection.breached = true;
                    warningElement.innerText = "VIRAL BREACH! HIDE BEHIND LYSOSOMES!";
                    warningElement.style.display = 'block';

                    let inwardAngle = Math.atan2(activeCell.y - infection.y, activeCell.x - infection.x);
                    let safeStartX = infection.x + Math.cos(inwardAngle) * 20;
                    let safeStartY = infection.y + Math.sin(inwardAngle) * 20;

                    for (let i = 0; i < 30; i++) {
                        let pAngle = Math.random() * Math.PI * 2;
                        let speed = (3.0 + Math.random() * 2.0);
                        infection.particles.push({
                            x: safeStartX, y: safeStartY,
                            vx: Math.cos(pAngle) * speed, vy: Math.sin(pAngle) * speed,
                            radius: 6
                        });
                    }

                    addShake(0.6, 0.5); // T16: virus explosion/breach
                    infection.nextWarningTime = survivalTime + INFECTION_INTERVAL;
                }

                // T60: the camera target never changes across the breach (still
                // centred on activeCell at the fixed viewSpan below), so there is
                // no zoomback sub-phase to wait for here -- just hold
                // REVEAL_COUNTDOWN seconds past the breach with a visible 3-2-1
                // before actually unfreezing (infection.state -> 'none').
                if (infection.breached) {
                    let remaining = (infection.triggerTime + INFECTION_WARNING + REVEAL_COUNTDOWN) - survivalTime;
                    if (remaining <= 0) {
                        infection.state = 'none';
                        infection.breached = false;
                        warningElement.innerText = "";
                        warningElement.style.display = 'none';
                    } else {
                        // Keep the "hide behind lysosomes" context on screen --
                        // unlike mitosis/nucleus (own hold phase before the
                        // countdown starts), the breach and the countdown start
                        // on the same frame here, so a bare digit would replace
                        // the warning before the player ever saw it.
                        warningElement.innerText = "VIRAL BREACH! HIDE BEHIND LYSOSOMES! " + Math.ceil(remaining);
                        warningElement.style.display = 'block';
                    }
                }
            } else {
                infection.warningVisible = false;
            }

            for (let i = infection.particles.length - 1; i >= 0; i--) {
                let vp = infection.particles[i];

                vp.vx += (Math.random() - 0.5) * 0.8;
                vp.vy += (Math.random() - 0.5) * 0.8;

                let speed = Math.hypot(vp.vx, vp.vy);
                let maxSpeed = 4.5;
                if (speed > maxSpeed) {
                    vp.vx = (vp.vx / speed) * maxSpeed; vp.vy = (vp.vy / speed) * maxSpeed;
                } else if (speed < 1.5) {
                    vp.vx = (vp.vx / Math.max(speed, 0.1)) * 1.5; vp.vy = (vp.vy / Math.max(speed, 0.1)) * 1.5;
                }

                vp.x += vp.vx * delta; vp.y += vp.vy * delta;

                let currSpeed = Math.hypot(vp.vx, vp.vy);

                let nearestCell = activeCell;
                if (mitosis.state !== 'idle') {
                    let distToA = Math.hypot(vp.x - activeCell.x, vp.y - activeCell.y);
                    let distToB = Math.hypot(vp.x - mitosis.cellB.x, vp.y - mitosis.cellB.y);
                    if (distToB < distToA) nearestCell = mitosis.cellB;
                }

                if (isOutsideCell(vp.x, vp.y, vp.radius)) {
                    let ang = Math.atan2(nearestCell.y - vp.y, nearestCell.x - vp.x);
                    ang += (Math.random() - 0.5) * 1.0;
                    vp.vx = Math.cos(ang) * currSpeed; vp.vy = Math.sin(ang) * currSpeed;
                    vp.x += Math.cos(ang) * 5; vp.y += Math.sin(ang) * 5;
                }

                if (Math.hypot(vp.x - nearestCell.x, vp.y - nearestCell.y) < 130 + vp.radius) {
                    let ang = Math.atan2(vp.y - nearestCell.y, vp.x - nearestCell.x);
                    vp.vx = Math.cos(ang) * currSpeed; vp.vy = Math.sin(ang) * currSpeed;
                }

                let destroyed = false;
                for (let o of organelles) {
                    if (Math.hypot(vp.x - o.x, vp.y - o.y) < o.radius + vp.radius) {
                        if (o.type === 'lysosome') {
                            destroyed = true; break;
                        } else {
                            let ang = Math.atan2(vp.y - o.y, vp.x - o.x);
                            vp.vx = Math.cos(ang) * currSpeed; vp.vy = Math.sin(ang) * currSpeed;
                        }
                    }
                }

                if (destroyed) {
                    infection.particles.splice(i, 1);
                    continue;
                }
            }
        }

        // Reads infection.warningVisible/.x/.y/.particles; never mutates them.
        // See updateInfection() above for the state half of the split (T22 step 2).
        function drawInfection() {
            virusLayer.clear();

            if (infection.warningVisible) {
                virusLayer.beginFill(0xe67e22);
                virusLayer.lineStyle(2, 0xd35400);
                let r = 50;
                virusLayer.drawPolygon([
                    infection.x + r, infection.y, infection.x + r / 2, infection.y + r * 0.866,
                    infection.x - r / 2, infection.y + r * 0.866, infection.x - r, infection.y,
                    infection.x - r / 2, infection.y - r * 0.866, infection.x + r / 2, infection.y - r * 0.866,
                ]);
                virusLayer.lineStyle(4, 0xffa502);
                for (let i = 0; i < 6; i++) {
                    let a = i * (Math.PI / 3) + globalRotation;
                    virusLayer.moveTo(infection.x + Math.cos(a) * r, infection.y + Math.sin(a) * r);
                    virusLayer.lineTo(infection.x + Math.cos(a) * (r + 25), infection.y + Math.sin(a) * (r + 25));
                    virusLayer.beginFill(0xff4757);
                    virusLayer.drawCircle(infection.x + Math.cos(a) * (r + 25), infection.y + Math.sin(a) * (r + 25), 8);
                    virusLayer.endFill();
                }
            }

            for (let i = 0; i < infection.particles.length; i++) {
                let vp = infection.particles[i];
                let moveAngle = Math.atan2(vp.vy, vp.vx);

                virusLayer.beginFill(0xff4757);
                let mouthWobble = Math.abs(Math.sin(survivalTime * 20)) * 0.6;
                let visualRadius = vp.radius * 1.4;
                virusLayer.moveTo(vp.x, vp.y);
                virusLayer.arc(vp.x, vp.y, visualRadius, moveAngle + 0.2 + mouthWobble, moveAngle - 0.2 - mouthWobble + Math.PI * 2);
                virusLayer.lineTo(vp.x, vp.y);
                virusLayer.endFill();
            }
        }

        function updateMitosis(deltaSec) {
            // 1. TRIGGER THE EVENT
            if (survivalTime >= mitosis.nextTriggerTime && mitosis.state === 'idle') {
                mitosis.state = 'forming';
                mitosis.eventStartTime = survivalTime;
                mitosis.generationCounted = false;
                mitosis.revealPhase = 'hold'; // T60: start the freeze/countdown sub-phase
                mitosis.phaseStartTime = survivalTime;
                mitosis.countdownEndsAt = -Infinity;

                warningElement.innerText = "CELL DIVISION INITIATED! PREPARE TO MIGRATE!";
                warningElement.style.color = "#00d2d3";
                warningElement.style.display = 'block';
                setTimeout(() => warningElement.style.display = 'none', 5000);

                let dir = Math.floor(Math.random() * 4);
                let offset = 3400; // Increased to create a distinct tunnel!

                mitosis.direction = dir;
                mitosis.cellB = { x: activeCell.x, y: activeCell.y };
                mitosis.bridge.maxWidth = 600;

                if (dir === 0) mitosis.cellB.x += offset;
                else if (dir === 1) mitosis.cellB.y += offset;
                else if (dir === 2) mitosis.cellB.x -= offset;
                else mitosis.cellB.y -= offset;

                // T33: cellB is fixed for this event -- widen the trace RT to
                // cover the bridge/Cell B before anything is drawn there.
                traceRTNeedsFullRedraw = true;

                // Draw Cell B base background in backgroundLayer (under cytosol)
                let cellBBg = new PIXI.Graphics();
                cellBBg.beginFill(0x0d0d1a);
                cellBBg.drawEllipse(mitosis.cellB.x, mitosis.cellB.y, activeCell.radiusX, activeCell.radiusY);
                cellBBg.endFill();

                cellBBg.lineStyle(15, 0x1e3799, 0.4);
                cellBBg.drawEllipse(mitosis.cellB.x, mitosis.cellB.y, activeCell.radiusX + 8, activeCell.radiusY + 8);

                cellBBg.lineStyle(8, 0x4a69bd, 0.8);
                cellBBg.drawEllipse(mitosis.cellB.x, mitosis.cellB.y, activeCell.radiusX, activeCell.radiusY);

                cellBBg.lineStyle(3, 0x82ccdd, 1.0);
                cellBBg.drawEllipse(mitosis.cellB.x, mitosis.cellB.y, activeCell.radiusX - 3, activeCell.radiusY - 3);

                backgroundLayer.addChildAt(cellBBg, 0); // Put it under cytosol!

                // Spawn cytosol particles in Cell B
                // T26: attempt count scales with quality tier, same as the primary spawn above.
                for (let i = 0; i < QUALITY_TIERS[quality].cytosolCount; i++) {
                    let px = mitosis.cellB.x + (Math.random() * 2 - 1) * activeCell.radiusX;
                    let py = mitosis.cellB.y + (Math.random() * 2 - 1) * activeCell.radiusY;

                    if ((Math.pow(px - mitosis.cellB.x, 2) / Math.pow(activeCell.radiusX, 2)) + (Math.pow(py - mitosis.cellB.y, 2) / Math.pow(activeCell.radiusY, 2)) <= 1) {
                        let blob = new PIXI.Graphics();
                        let radius = 10 + Math.random() * 50;

                        let colorRoll = Math.random();
                        let color = 0x1e3799; // Base blue
                        let alpha = 0.1 + Math.random() * 0.2;

                        if (colorRoll > 0.95) {
                            color = 0x82ccdd; // Bright Cyan
                            alpha = 0.4 + Math.random() * 0.3;
                            radius = 5 + Math.random() * 20;
                        } else if (colorRoll > 0.7) {
                            color = 0x6c5ce7; // Purple
                            alpha = 0.2 + Math.random() * 0.2;
                        } else if (colorRoll > 0.5) {
                            color = 0x4a69bd; // Medium blue
                        }

                        blob.beginFill(color, alpha);
                        blob.drawCircle(0, 0, radius);
                        blob.endFill();
                        blob.x = px;
                        blob.y = py;
                        blob.vx = (Math.random() - 0.5) * 0.6;
                        blob.vy = (Math.random() - 0.5) * 0.6;
                        blob.phase = Math.random() * Math.PI * 2;
                        blob.baseAlpha = alpha;
                        cytosolContainer.addChild(blob);
                        cytosolParticles.push(blob);
                    }
                }
                spawnCytosolFiller(mitosis.cellB.x, mitosis.cellB.y, activeCell.radiusX, activeCell.radiusY, QUALITY_TIERS[quality].cytosolFillerCount);

                // Spawn Organelles in Cell B
                let cellBOrganellesCount = 0;
                let cellBAttempts = 0;
                while (cellBOrganellesCount < 25 && cellBAttempts < 1000) {
                    cellBAttempts++;
                    let x = mitosis.cellB.x + (Math.random() * 2 - 1) * activeCell.radiusX * 0.85;
                    let y = mitosis.cellB.y + (Math.random() * 2 - 1) * activeCell.radiusY * 0.85;

                    let distToCenter = Math.hypot(x - mitosis.cellB.x, y - mitosis.cellB.y);
                    if (distToCenter < 400) continue;

                    let inCellB = ((Math.pow(x - mitosis.cellB.x, 2) / Math.pow(activeCell.radiusX - 50, 2)) + 
                                   (Math.pow(y - mitosis.cellB.y, 2) / Math.pow(activeCell.radiusY - 50, 2)) < 1);
                    if (!inCellB) continue;

                    let isMito = Math.random() > 0.4;
                    let sizeMult = isMito
                        ? [1, 2, 3][Math.floor(Math.random() * 3)]
                        : [0.5, 1.0, 1.5, 2.0][Math.floor(Math.random() * 4)];
                    let radius = (isMito ? 35 : 25) * sizeMult;

                    let overlap = false;
                    for (let o of organelles) {
                        if (Math.hypot(x - o.x, y - o.y) < o.radius + radius + 40) overlap = true;
                    }
                    if (overlap) continue;

                    let orgObj = {
                        type: isMito ? 'mitochondria' : 'lysosome',
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        radius: radius,
                        color: isMito ? C_MITO : C_LYSO,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.015
                    };
                    let sprite = createOrganelleGraphics(orgObj);
                    orgObj.sprite = sprite;
                    organellesLayer.addChild(sprite);
                    organelles.push(orgObj);
                    cellBOrganellesCount++;
                }

                // Initialize progenitor in sprouting phase
                mitosis.progenitor = {
                    active: true,
                    x: activeCell.x,
                    y: activeCell.y,
                    startX: activeCell.x,
                    startY: activeCell.y,
                    targetX: mitosis.cellB.x,
                    targetY: mitosis.cellB.y,
                    startTime: survivalTime,
                    state: 'sprouting',
                    scale: 0.0
                };

                // GENERATE MICROTUBULES
                mitosis.microtubules = [];
                let isHorizontal = (dir === 0 || dir === 2);
                let gapLength = 3400 - (activeCell.radiusX * 2); // Roughly the physical gap
                let numLanes = 3;
                let tubeLength = gapLength * 0.7; // Don't cover the very ends of the bridge

                for (let i = -1; i <= 1; i++) {
                    if (i === 0) continue; // Leave the dead center open

                    let laneOffset = i * 150; // Distance from center

                    if (isHorizontal) {
                        let startX = Math.min(activeCell.x, mitosis.cellB.x) + activeCell.radiusX + (gapLength * 0.15);
                        mitosis.microtubules.push({
                            x: startX,
                            y: activeCell.y + laneOffset - 10,
                            w: tubeLength,
                            h: 20 // Thickness
                        });
                    } else {
                        let startY = Math.min(activeCell.y, mitosis.cellB.y) + activeCell.radiusY + (gapLength * 0.15);
                        mitosis.microtubules.push({
                            x: activeCell.x + laneOffset - 10,
                            y: startY,
                            w: 20, // Thickness
                            h: tubeLength
                        });
                    }
                }
            }

            // T60: reveal freeze/countdown phase machine -- 'hold' (wide two-cell
            // framing) -> 'zoomback' (camera settles back to normal framing while
            // still frozen) -> 'countdown' (visible 3-2-1) -> 'none' (control
            // returns). cameraAtTarget is one render-step stale (set by
            // updateCamera(), which runs after this in the frame -- see its own
            // comment); that lag is harmless for a settle check running over
            // several seconds. See docs/tasks/T60-event-camera-and-countdown.md.
            if (mitosis.revealPhase === 'hold') {
                let heldFor = survivalTime - mitosis.eventStartTime;
                if (heldFor >= MITOSIS_REVEAL_HOLD_MIN &&
                    (cameraAtTarget || heldFor >= MITOSIS_REVEAL_HOLD_MIN + MITOSIS_REVEAL_SETTLE_TIMEOUT)) {
                    mitosis.revealPhase = 'zoomback';
                    mitosis.phaseStartTime = survivalTime;
                }
            } else if (mitosis.revealPhase === 'zoomback') {
                if (cameraAtTarget || survivalTime - mitosis.phaseStartTime >= MITOSIS_REVEAL_SETTLE_TIMEOUT) {
                    mitosis.revealPhase = 'countdown';
                    mitosis.countdownEndsAt = survivalTime + REVEAL_COUNTDOWN;
                }
            } else if (mitosis.revealPhase === 'countdown') {
                let remaining = mitosis.countdownEndsAt - survivalTime;
                if (remaining <= 0) {
                    mitosis.revealPhase = 'none';
                    mitosis.countdownEndsAt = -Infinity;
                    warningElement.innerText = "";
                    warningElement.style.display = 'none';
                } else {
                    warningElement.innerText = String(Math.ceil(remaining));
                    warningElement.style.color = "#f1f2f6";
                    warningElement.style.display = 'block';
                }
            }

            // 2. PHASE TIMERS & THE SNAP
            if (mitosis.state !== 'idle') {
                let timeInEvent = survivalTime - mitosis.eventStartTime;

                // Update Progenitor position & growth
                if (mitosis.progenitor && mitosis.progenitor.active) {
                    let p = mitosis.progenitor;
                    let dirAngle = 0;
                    if (mitosis.direction === 1) dirAngle = Math.PI / 2;
                    else if (mitosis.direction === 2) dirAngle = Math.PI;
                    else if (mitosis.direction === 3) dirAngle = -Math.PI / 2;

                    if (timeInEvent < 10) {
                        p.state = 'sprouting';
                        let tSprout = timeInEvent / 10.0;
                        let currDist = 130 + 100 * tSprout;
                        p.x = activeCell.x + Math.cos(dirAngle) * currDist;
                        p.y = activeCell.y + Math.sin(dirAngle) * currDist;
                        p.scale = 0.2 * tSprout;
                    } else if (timeInEvent < 40) {
                        if (p.state === 'sprouting') {
                            p.state = 'traveling';
                            p.startX = p.x;
                            p.startY = p.y;
                            p.travelStartTime = survivalTime;
                        }
                        let tTravel = (survivalTime - p.travelStartTime) / 30.0;
                        if (tTravel >= 1.0) tTravel = 1.0;
                        p.x = p.startX + (p.targetX - p.startX) * tTravel;
                        p.y = p.startY + (p.targetY - p.startY) * tTravel;
                        p.scale = 0.2;
                    } else {
                        if (p.state === 'traveling') {
                            p.state = 'growing';
                            p.growStartTime = survivalTime;
                        }
                        let tGrow = (survivalTime - p.growStartTime) / 30.0; // 30 seconds to grow
                        if (tGrow >= 1.0) {
                            tGrow = 1.0;
                            p.state = 'complete';
                        }
                        p.x = p.targetX;
                        p.y = p.targetY;
                        p.scale = 0.2 + 0.8 * tGrow;
                    }
                }

                // T22 step 4: nucleus-destruction trigger, moved here from
                // drawMitosisVisuals() -- clearing centralHitboxes, setting
                // mitosis.nucleusDestroyed and the spawnVesicles() call are all
                // simulation, not rendering (AGENT_CONDUCT.md §4.4a).
                // mitosis.nucleusDestroyed is the one-shot latch that used to be
                // nucleusLayer.visible; it is reset to false at the snap below
                // (mirroring the old generateMap()-driven reset of
                // nucleusLayer.visible) so the next mitosis event's nucleus can be
                // destroyed again.
                let sweepProgress = timeInEvent / MITOSIS_SWEEP_DURATION;
                let crossedCenter = false;
                if (mitosis.direction === 0) {
                    let ringX = activeCell.x - activeCell.radiusX + (activeCell.radiusX * 2 * sweepProgress);
                    crossedCenter = (ringX >= activeCell.x);
                } else if (mitosis.direction === 1) {
                    let ringY = activeCell.y - activeCell.radiusY + (activeCell.radiusY * 2 * sweepProgress);
                    crossedCenter = (ringY >= activeCell.y);
                } else if (mitosis.direction === 2) {
                    let ringX = activeCell.x + activeCell.radiusX - (activeCell.radiusX * 2 * sweepProgress);
                    crossedCenter = (ringX <= activeCell.x);
                } else {
                    let ringY = activeCell.y + activeCell.radiusY - (activeCell.radiusY * 2 * sweepProgress);
                    crossedCenter = (ringY <= activeCell.y);
                }

                if (crossedCenter && !mitosis.nucleusDestroyed) {
                    addShake(0.7, 0.6); // T16: nucleus destruction
                    // Spawn a massive burst of nuclear/membrane vesicles on destruction!
                    spawnVesicles(activeCell.x, activeCell.y, 15, 'membrane', 0x6c5ce7);
                    // sweepProgress (and thus crossedCenter) is monotonic within one
                    // mitosis event, so this can only fire once per event -- safe to
                    // drop the sensor/physics hitboxes here too.
                    centralHitboxes = [];
                    // The per-arc "Shatter Golgi Arcs" pass in gameLoop calls
                    // drawArcs() whenever it catches an unshattered arc, which
                    // repopulates centralHitboxes from whatever's left in
                    // activeArcs -- undoing this clear. This flag tells that call
                    // site to re-clear immediately after, every time.
                    mitosis.nucleusDestroyed = true;
                }

                // 60 seconds of a fully open bridge before it starts to close
                if (timeInEvent >= 60 && mitosis.state === 'forming') {
                    mitosis.state = 'narrowing';
                    warningElement.innerText = "BRIDGE NARROWING! CROSS NOW!";
                    warningElement.style.color = "#ff9f43";
                    warningElement.style.display = 'block';
                    setTimeout(() => warningElement.style.display = 'none', 4000);
                }

                // 120 seconds (2 minutes) total event time -> THE SNAP
                if (timeInEvent >= 120) {
                    // --- THE SNAP (WITH BRIDGE SURVIVORS) ---
                    addShake(1.0, 0.8); // T16: mitosis snap

                    // 1. Define the Bridge bounds so we know what to save
                    let isHorizontal = (mitosis.direction === 0 || mitosis.direction === 2);
                    let halfW = mitosis.currentWidth / 2;

                    let inBridge = (obj) => {
                        if (isHorizontal) {
                            let minX = Math.min(activeCell.x, mitosis.cellB.x);
                            let maxX = Math.max(activeCell.x, mitosis.cellB.x);
                            return (obj.x >= minX && obj.x <= maxX && obj.y >= activeCell.y - halfW && obj.y <= activeCell.y + halfW);
                        } else {
                            let minY = Math.min(activeCell.y, mitosis.cellB.y);
                            let maxY = Math.max(activeCell.y, mitosis.cellB.y);
                            return (obj.x >= activeCell.x - halfW && obj.x <= activeCell.x + halfW && obj.y >= minY && obj.y <= maxY);
                        }
                    };

                    // 2. Rescue the hazards currently trapped inside the bridge or Cell B!
                    let inCellB = (obj) => ((Math.pow(obj.x - mitosis.cellB.x, 2) / Math.pow(activeCell.radiusX, 2)) + (Math.pow(obj.y - mitosis.cellB.y, 2) / Math.pow(activeCell.radiusY, 2)) <= 1);
                    let survivingVesicles = vesicles.filter(v => inBridge(v) || inCellB(v));
                    let survivingViruses = infection.particles.filter(vp => inBridge(vp) || inCellB(vp));
                    let survivingOrganelles = organelles.filter(o => inBridge(o) || inCellB(o));

                    // 3. Shift the active coordinates to the new home
                    activeCell.x = mitosis.cellB.x;
                    activeCell.y = mitosis.cellB.y;

                    // 4. Kill players who didn't make it to Cell B (or teleport them if Dev Mode is on)
                    players.forEach(p => {
                        if (p.alive && isOutsideCell(p.x, p.y)) {
                            if (devMode) {
                                // Auto-Teleport the dev to the center of the new cell!
                                p.x = activeCell.x;
                                p.y = activeCell.y;
                            } else {
                                p.alive = false; // Normal players die
                            }
                        }
                    });

                    // 5. Vaporize old hazards, but keep the rescued bridge/cell B survivors!
                    vesicles = survivingVesicles;
                    infection.particles = survivingViruses;
                    if (infection.particles.length === 0) infection.state = 'none';

                    // 6. Rebuild the world! (This draws the Nucleus for the new activeCell)
                    generateMap(true);
                    // generateMap() resets nucleusLayer.visible for the new cell;
                    // mirror that on the state-side latch too (T22 step 4).
                    mitosis.nucleusDestroyed = false;

                    // 7. Inject the rescued organelles into the new cell
                    // Re-parent, not a teardown: survivingOrganelles keeps these sprites
                    // alive, so do NOT purgeContainer() here (T05) -- that would destroy
                    // sprites organelles[] still references and crash next frame.
                    organelles = survivingOrganelles;
                    organellesLayer.removeChildren();
                    organellesLayer.clear();
                    organelles.forEach(o => organellesLayer.addChild(o.sprite));

                    mitosisLayer.clear(); // Hide the bridge

                    // 8. Cell division complete -- advance the generation counter, once.
                    if (!mitosis.generationCounted) {
                        activeCell.generation++;
                        mitosis.generationCounted = true;
                        // T53: credited to whoever made it to Cell B (section 4 above
                        // already killed anyone who didn't) -- a survived mitosis, not
                        // just an elapsed one.
                        players.forEach(p => {
                            if (!p.alive) return;
                            p.stats.mitosisEvents++;
                            if (activeCell.generation > p.stats.maxGeneration) p.stats.maxGeneration = activeCell.generation;
                        });
                    }

                    // 9. Reset the cycle for another 4 minutes later
                    mitosis.state = 'idle';
                    mitosis.nextTriggerTime = survivalTime + MITOSIS_INTERVAL;
                    if (mitosis.progenitor) mitosis.progenitor.active = false;

                    // T33: activeCell just moved to Cell B -- shrink the trace
                    // RT back to single-cell bounds now that mitosis is idle.
                    traceRTNeedsFullRedraw = true;
                }
            }
        }

        function drawMitosisVisuals() {
            mitosisLayer.clear();
            if (mitosis.state === 'idle') {
                if (window.bgMask) {
                    window.bgMask.clear();
                    window.bgMask.beginFill(0xffffff);
                    window.bgMask.drawEllipse(activeCell.x, activeCell.y, activeCell.radiusX, activeCell.radiusY);
                    window.bgMask.endFill();
                }
                return;
            }

            // Update mask to cover both cells and the bridge
            if (window.bgMask) {
                window.bgMask.clear();
                window.bgMask.beginFill(0xffffff);
                window.bgMask.drawEllipse(activeCell.x, activeCell.y, activeCell.radiusX, activeCell.radiusY);
                window.bgMask.drawEllipse(mitosis.cellB.x, mitosis.cellB.y, activeCell.radiusX, activeCell.radiusY);
                
                let isHorizontal = (mitosis.direction === 0 || mitosis.direction === 2);
                let halfW = mitosis.currentWidth / 2;
                if (isHorizontal) {
                    let minX = Math.min(activeCell.x, mitosis.cellB.x);
                    let maxX = Math.max(activeCell.x, mitosis.cellB.x);
                    window.bgMask.drawRect(minX, activeCell.y - halfW, maxX - minX, mitosis.currentWidth);
                } else {
                    let minY = Math.min(activeCell.y, mitosis.cellB.y);
                    let maxY = Math.max(activeCell.y, mitosis.cellB.y);
                    window.bgMask.drawRect(activeCell.x - halfW, minY, mitosis.currentWidth, maxY - minY);
                }
                window.bgMask.endFill();
            }

            // T22 step 4: crossedCenter/nucleusDestroyed trigger moved to
            // updateMitosis(); this only mirrors the resulting state onto the
            // two display objects.
            nucleusLayer.visible = !mitosis.nucleusDestroyed;
            golgiERContainer.visible = !mitosis.nucleusDestroyed;

            let timeInEvent = survivalTime - mitosis.eventStartTime;

            if (mitosis.state === 'narrowing') {
                // Shrink from maxWidth to 0 over a 60-second window
                let narrowProgress = (timeInEvent - 60) / 60.0;
                mitosis.currentWidth = Math.max(0, mitosis.bridge.maxWidth * (1 - narrowProgress));
            } else {
                mitosis.currentWidth = mitosis.bridge.maxWidth;
            }

            // Draw Cell B background moved to backgroundLayer to allow cytosol rendering on top

            // 3. Draw the Seamless Bridge
            mitosisLayer.beginFill(0x0d0d1a);
            mitosisLayer.lineStyle(0);

            let isHorizontal = (mitosis.direction === 0 || mitosis.direction === 2);
            let gapStart, gapLength;
            let rx = activeCell.radiusX, ry = activeCell.radiusY;
            let halfW = mitosis.currentWidth / 2;
            // T62 section 3: gapStart/gapLength now land exactly where each cell's
            // own ellipse boundary is already at +/-halfW (instead of the old fixed
            // "-10" overlap), so the flat corridor sides begin with zero visual jump
            // against the membrane's own curve, and a short quadraticCurveTo flare at
            // each end rounds the tangent kink into a genuine neck (this is purely
            // cosmetic -- isOutsideCell()'s bridge rectangle, the actual hazard
            // geometry, is untouched and still spans cell-centre to cell-centre).
            const NECK_FILLET = 70;

            if (isHorizontal) {
                let minX = Math.min(activeCell.x, mitosis.cellB.x);
                let maxX = Math.max(activeCell.x, mitosis.cellB.x);
                let edgeOffset = rx * Math.sqrt(Math.max(0, 1 - (halfW * halfW) / (ry * ry)));

                gapStart = minX + edgeOffset;
                gapLength = (maxX - edgeOffset) - gapStart;

                // Floor
                mitosisLayer.drawRect(gapStart, activeCell.y - halfW, gapLength, mitosis.currentWidth);

                // Walls -- flare into each cell's own ellipse for a short distance
                // before the straight corridor run.
                let fillet = Math.min(NECK_FILLET, gapLength / 2, edgeOffset * 0.9);
                let flareY = ry * Math.sqrt(Math.max(0, 1 - Math.pow((edgeOffset - fillet) / rx, 2)));

                mitosisLayer.lineStyle(8, 0x4a69bd, 0.8);
                mitosisLayer.moveTo(gapStart - fillet, activeCell.y - flareY);
                mitosisLayer.quadraticCurveTo(gapStart, activeCell.y - halfW, gapStart + fillet, activeCell.y - halfW);
                mitosisLayer.lineTo(gapStart + gapLength - fillet, activeCell.y - halfW);
                mitosisLayer.quadraticCurveTo(gapStart + gapLength, activeCell.y - halfW, gapStart + gapLength + fillet, activeCell.y - flareY);

                mitosisLayer.moveTo(gapStart - fillet, activeCell.y + flareY);
                mitosisLayer.quadraticCurveTo(gapStart, activeCell.y + halfW, gapStart + fillet, activeCell.y + halfW);
                mitosisLayer.lineTo(gapStart + gapLength - fillet, activeCell.y + halfW);
                mitosisLayer.quadraticCurveTo(gapStart + gapLength, activeCell.y + halfW, gapStart + gapLength + fillet, activeCell.y + flareY);
            } else {
                let minY = Math.min(activeCell.y, mitosis.cellB.y);
                let maxY = Math.max(activeCell.y, mitosis.cellB.y);
                let edgeOffset = ry * Math.sqrt(Math.max(0, 1 - (halfW * halfW) / (rx * rx)));

                gapStart = minY + edgeOffset;
                gapLength = (maxY - edgeOffset) - gapStart;

                // Floor
                mitosisLayer.drawRect(activeCell.x - halfW, gapStart, mitosis.currentWidth, gapLength);

                // Walls -- same neck-flare treatment as the horizontal case.
                let fillet = Math.min(NECK_FILLET, gapLength / 2, edgeOffset * 0.9);
                let flareX = rx * Math.sqrt(Math.max(0, 1 - Math.pow((edgeOffset - fillet) / ry, 2)));

                mitosisLayer.lineStyle(8, 0x4a69bd, 0.8);
                mitosisLayer.moveTo(activeCell.x - flareX, gapStart - fillet);
                mitosisLayer.quadraticCurveTo(activeCell.x - halfW, gapStart, activeCell.x - halfW, gapStart + fillet);
                mitosisLayer.lineTo(activeCell.x - halfW, gapStart + gapLength - fillet);
                mitosisLayer.quadraticCurveTo(activeCell.x - halfW, gapStart + gapLength, activeCell.x - flareX, gapStart + gapLength + fillet);

                mitosisLayer.moveTo(activeCell.x + flareX, gapStart - fillet);
                mitosisLayer.quadraticCurveTo(activeCell.x + halfW, gapStart, activeCell.x + halfW, gapStart + fillet);
                mitosisLayer.lineTo(activeCell.x + halfW, gapStart + gapLength - fillet);
                mitosisLayer.quadraticCurveTo(activeCell.x + halfW, gapStart + gapLength, activeCell.x + flareX, gapStart + gapLength + fillet);
            }

            // Draw Microtubules (Static Obstacles)
            mitosisLayer.beginFill(0x2ecc71); // Green structural color
            mitosisLayer.lineStyle(2, 0x27ae60, 1);
            mitosis.microtubules.forEach(tube => {
                if (mitosis.currentWidth > 350) {
                    mitosisLayer.drawRect(tube.x, tube.y, tube.w, tube.h);
                }
            });
            mitosisLayer.endFill();

            // 4. Overlapping lines cleanup removed to prevent covering cytosol particles

            // 5. THE DEATH RING (Contractile Wave)
            let sweepProgress = timeInEvent / MITOSIS_SWEEP_DURATION; // Moves from 0.0 to 1.0 over the sweep

            // FIX: Set a bright red line style so the laser is actually visible!
            mitosisLayer.lineStyle(8, 0xff4757, 0.8);

            if (mitosis.direction === 0) { // Cell B is Right, laser moves Left to Right
                let ringX = activeCell.x - activeCell.radiusX + (activeCell.radiusX * 2 * sweepProgress);
                let dx = ringX - activeCell.x;
                let h = activeCell.radiusY * Math.sqrt(Math.max(0, 1 - (dx * dx) / (activeCell.radiusX * activeCell.radiusX)));
                mitosisLayer.moveTo(ringX, activeCell.y - h);
                mitosisLayer.lineTo(ringX, activeCell.y + h);
            } else if (mitosis.direction === 1) { // Cell B is Down, laser moves Top to Bottom
                let ringY = activeCell.y - activeCell.radiusY + (activeCell.radiusY * 2 * sweepProgress);
                let dy = ringY - activeCell.y;
                let w = activeCell.radiusX * Math.sqrt(Math.max(0, 1 - (dy * dy) / (activeCell.radiusY * activeCell.radiusY)));
                mitosisLayer.moveTo(activeCell.x - w, ringY);
                mitosisLayer.lineTo(activeCell.x + w, ringY);
            } else if (mitosis.direction === 2) { // Cell B is Left, laser moves Right to Left
                let ringX = activeCell.x + activeCell.radiusX - (activeCell.radiusX * 2 * sweepProgress);
                let dx = ringX - activeCell.x;
                let h = activeCell.radiusY * Math.sqrt(Math.max(0, 1 - (dx * dx) / (activeCell.radiusX * activeCell.radiusX)));
                mitosisLayer.moveTo(ringX, activeCell.y - h);
                mitosisLayer.lineTo(ringX, activeCell.y + h);
            } else { // Cell B is Up, laser moves Bottom to Top
                let ringY = activeCell.y + activeCell.radiusY - (activeCell.radiusY * 2 * sweepProgress);
                let dy = ringY - activeCell.y;
                let w = activeCell.radiusX * Math.sqrt(Math.max(0, 1 - (dy * dy) / (activeCell.radiusY * activeCell.radiusY)));
                mitosisLayer.moveTo(activeCell.x - w, ringY);
                mitosisLayer.lineTo(activeCell.x + w, ringY);
            }

            // Draw Traveling Progenitor
            if (mitosis.progenitor && mitosis.progenitor.active) {
                let p = mitosis.progenitor;
                let dirAngle = 0;
                if (mitosis.direction === 1) dirAngle = Math.PI / 2;
                else if (mitosis.direction === 2) dirAngle = Math.PI;
                else if (mitosis.direction === 3) dirAngle = -Math.PI / 2;

                // Draw connecting neck if sprouting
                if (p.state === 'sprouting') {
                    mitosisLayer.lineStyle(24 * p.scale, 0x6c5ce7, 0.8);
                    mitosisLayer.moveTo(activeCell.x + Math.cos(dirAngle) * 125, activeCell.y + Math.sin(dirAngle) * 125);
                    mitosisLayer.lineTo(p.x, p.y);
                }

                // Draw Progenitor Nucleus
                mitosisLayer.beginFill(0x130f26, 0.95);
                mitosisLayer.lineStyle(5 * p.scale, 0x6c5ce7, 0.8);
                mitosisLayer.drawCircle(p.x, p.y, 130 * p.scale);
                mitosisLayer.endFill();

                // Progenitor Nucleolus
                let nucX = p.x + Math.cos(0.5) * 30 * p.scale;
                let nucY = p.y + Math.sin(0.5) * 30 * p.scale;
                mitosisLayer.beginFill(0x4834d4, 0.9);
                mitosisLayer.lineStyle(3 * p.scale, 0x686de0, 0.8);
                mitosisLayer.drawCircle(nucX, nucY, 35 * p.scale);
                mitosisLayer.endFill();

                // Draw Progenitor Golgi & ER Arcs
                if (p.state === 'growing' || p.state === 'complete') {
                    ARCS.forEach(arc => {
                        let r = arc.r * p.scale;
                        let thick = arc.thick * p.scale;
                        let span = arc.span;
                        
                        mitosisLayer.lineStyle({ width: thick, color: arc.color, alpha: 0.85, cap: PIXI.LINE_CAP.ROUND });
                        
                        let startAng = globalRotation - span;
                        let endAng = globalRotation + span;
                        
                        mitosisLayer.arc(p.x, p.y, r, startAng, endAng);
                        
                        // Arcs ends
                        mitosisLayer.beginFill(arc.color, 0.9);
                        mitosisLayer.lineStyle(0);
                        mitosisLayer.drawCircle(p.x + Math.cos(startAng) * r, p.y + Math.sin(startAng) * r, thick / 2 + 3 * p.scale);
                        mitosisLayer.drawCircle(p.x + Math.cos(endAng) * r, p.y + Math.sin(endAng) * r, thick / 2 + 3 * p.scale);
                        mitosisLayer.endFill();
                    });
                }
            }
        }

        // T42/T56: stamps a "tubulin lattice" motif for one settled-trace edge,
        // replacing a plain lineTo. Was two offset dots (T42); at trace width
        // those merged into a single blob per step, reading as a bead chain
        // rather than a tube (owner report, 2026-08-09). Now draws
        // latticeLaneCount (2-4, tier-driven) longitudinal "protofilament"
        // lines spanning the band, each a short segment from A to B. Colour
        // alternates by distance travelled (distAtB, i.e. the edge's own
        // stored .d) same as before, but each lane's flip is phase-shifted
        // along that same distance axis so adjacent lanes change colour at
        // different points -- the staggered/diagonal seam a real microtubule
        // lattice has, instead of every lane flipping in a straight rung.
        // offsetScale lets the growing-tip caller pulse/flare the band without
        // a second code path. No allocation, no Math.random -- deterministic
        // from distAtB alone, so the baked texture never shimmers against itself.
        function stampDimer(gfx, ax, ay, bx, by, distAtB, colorA, colorB, offsetScale) {
            let dx = bx - ax, dy = by - ay;
            let len = Math.hypot(dx, dy) || 1;
            let px = -dy / len, py = dx / len;
            // Half-span deliberately reaches most of the way to the trailGlow
            // halo's own half-width (TRACE_WIDTH+4)/2 -- the T42 bead offset
            // (0.35) stayed close to the centreline and read as a bead chain,
            // not a tube wall, at these sizes (owner report, 2026-08-09).
            let halfSpan = TRACE_WIDTH * 0.9 * offsetScale;
            let lineW = Math.max(1.0, TRACE_WIDTH * 0.4 * offsetScale);
            let lanes = latticeLaneCount;
            let phaseStep = DIMER_SPACING / lanes;
            for (let lane = 0; lane < lanes; lane++) {
                let off = lanes === 1 ? 0 : ((lane / (lanes - 1)) * 2 - 1) * halfSpan;
                let parity = Math.floor((distAtB + lane * phaseStep) / DIMER_SPACING) & 1;
                gfx.lineStyle(lineW, parity ? colorA : colorB, 1);
                gfx.moveTo(ax + px * off, ay + py * off);
                gfx.lineTo(bx + px * off, by + py * off);
            }
        }

        // T25: (re)allocate trailGlowRT/trailCoreRT for activeCell's current
        // home/size and redraw every player's CURRENT traceSegments into them
        // from scratch. This is the only path that may resize or reposition
        // the RTs, so it is also what a forced full redraw (a front-trim) and
        // a round reset both funnel through. Not in the hot path -- only runs
        // on startRound() and on the rare frame a trace is trimmed.
        function rebuildTraceRT() {
            let minX, maxX, minY, maxY;
            if (mitosis.state !== 'idle') {
                // T33: mid-mitosis the bridge and Cell B must stay inside the
                // buffer too. Union bounding box of both cells, not a symmetric
                // expansion -- only the axis the split moved along grows.
                minX = Math.min(activeCell.x, mitosis.cellB.x) - activeCell.baseRadiusX - TRACE_RT_PADDING;
                maxX = Math.max(activeCell.x, mitosis.cellB.x) + activeCell.baseRadiusX + TRACE_RT_PADDING;
                minY = Math.min(activeCell.y, mitosis.cellB.y) - activeCell.baseRadiusY - TRACE_RT_PADDING;
                maxY = Math.max(activeCell.y, mitosis.cellB.y) + activeCell.baseRadiusY + TRACE_RT_PADDING;
            } else {
                let halfW = activeCell.baseRadiusX + TRACE_RT_PADDING;
                let halfH = activeCell.baseRadiusY + TRACE_RT_PADDING;
                minX = activeCell.x - halfW; maxX = activeCell.x + halfW;
                minY = activeCell.y - halfH; maxY = activeCell.y + halfH;
            }
            traceRTOriginX = minX;
            traceRTOriginY = minY;
            let texW = Math.ceil((maxX - minX) * TRACE_RT_SCALE);
            let texH = Math.ceil((maxY - minY) * TRACE_RT_SCALE);

            if (!trailGlowRT) {
                trailGlowRT = PIXI.RenderTexture.create({ width: texW, height: texH });
                trailCoreRT = PIXI.RenderTexture.create({ width: texW, height: texH });
                trailGlowSprite.texture = trailGlowRT;
                trailCoreSprite.texture = trailCoreRT;
            } else if (trailGlowRT.width !== texW || trailGlowRT.height !== texH) {
                trailGlowRT.resize(texW, texH);
                trailCoreRT.resize(texW, texH);
            }
            trailGlowSprite.position.set(traceRTOriginX, traceRTOriginY);
            trailGlowSprite.scale.set(1 / TRACE_RT_SCALE);
            trailCoreSprite.position.set(traceRTOriginX, traceRTOriginY);
            trailCoreSprite.scale.set(1 / TRACE_RT_SCALE);

            traceScratchGlow.clear();
            traceScratchCore.clear();
            let useDimerLOD = world.scale.x >= DIMER_LOD_ZOOM; // T42: LOD decided once for this (re)bake, from the current camera zoom
            players.forEach(p => {
                p.traceSegments.forEach(seg => {
                    if (seg.length < 2) return;
                    traceScratchGlow.lineStyle(TRACE_WIDTH + 4, p.color, 0.6);
                    traceScratchGlow.moveTo(seg[0].x, seg[0].y);
                    if (useDimerLOD) {
                        traceScratchCore.lineStyle(0);
                    } else {
                        traceScratchCore.lineStyle(TRACE_WIDTH, p.coreColor, 1);
                        traceScratchCore.moveTo(seg[0].x, seg[0].y);
                    }
                    for (let i = 1; i < seg.length; i++) {
                        traceScratchGlow.lineTo(seg[i].x, seg[i].y);
                        if (useDimerLOD) stampDimer(traceScratchCore, seg[i - 1].x, seg[i - 1].y, seg[i].x, seg[i].y, seg[i].d, p.color, p.coreColor, 1);
                        else traceScratchCore.lineTo(seg[i].x, seg[i].y);
                    }
                });
                // Mark every point currently on record as drawn, whether or not
                // this player actually had 2+ points (an empty/1-point segment
                // just means there is nothing to catch up on next frame).
                let last = p.traceSegments[p.traceSegments.length - 1];
                p.traceDrawSeg = p.traceSegments.length - 1;
                p.traceDrawPt = last.length - 1;
            });

            traceRTTransform.set(TRACE_RT_SCALE, 0, 0, TRACE_RT_SCALE,
                -traceRTOriginX * TRACE_RT_SCALE, -traceRTOriginY * TRACE_RT_SCALE);
            app.renderer.render(traceScratchGlow, { renderTexture: trailGlowRT, clear: true, transform: traceRTTransform });
            app.renderer.render(traceScratchCore, { renderTexture: trailCoreRT, clear: true, transform: traceRTTransform });
            traceRTNeedsFullRedraw = false;
        }

        // T25: draw only the trace points added since the last frame (per
        // player, tracked by traceDrawSeg/traceDrawPt) and composite that
        // delta into the accumulation RTs with clear:false. Segments are only
        // ever appended to at the end and points are only ever removed from
        // the front (which forces rebuildTraceRT() instead, see
        // trimTraceToCap/deleteOldestTrace/the lysosome pickup), so a stored
        // (segIdx, ptIdx) cursor stays valid between calls.
        function accumulateTraceRT() {
            let any = false;
            traceScratchGlow.clear();
            traceScratchCore.clear();
            let useDimerLOD = world.scale.x >= DIMER_LOD_ZOOM; // T42: LOD decided once per call, from the current camera zoom
            players.forEach(p => {
                for (let si = p.traceDrawSeg; si < p.traceSegments.length; si++) {
                    let seg = p.traceSegments[si];
                    let fromI = (si === p.traceDrawSeg) ? p.traceDrawPt : -1;
                    if (fromI + 1 >= seg.length) continue; // nothing new in this segment yet
                    if (fromI === -1) {
                        if (seg.length < 2) { p.traceDrawSeg = si; p.traceDrawPt = 0; continue; }
                        fromI = 0;
                    }
                    traceScratchGlow.lineStyle(TRACE_WIDTH + 4, p.color, 0.6);
                    traceScratchGlow.moveTo(seg[fromI].x, seg[fromI].y);
                    if (useDimerLOD) {
                        traceScratchCore.lineStyle(0);
                    } else {
                        traceScratchCore.lineStyle(TRACE_WIDTH, p.coreColor, 1);
                        traceScratchCore.moveTo(seg[fromI].x, seg[fromI].y);
                    }
                    for (let i = fromI + 1; i < seg.length; i++) {
                        traceScratchGlow.lineTo(seg[i].x, seg[i].y);
                        if (useDimerLOD) stampDimer(traceScratchCore, seg[i - 1].x, seg[i - 1].y, seg[i].x, seg[i].y, seg[i].d, p.color, p.coreColor, 1);
                        else traceScratchCore.lineTo(seg[i].x, seg[i].y);
                    }
                    any = true;
                    p.traceDrawSeg = si;
                    p.traceDrawPt = seg.length - 1;
                }
            });
            if (!any) return;
            traceRTTransform.set(TRACE_RT_SCALE, 0, 0, TRACE_RT_SCALE,
                -traceRTOriginX * TRACE_RT_SCALE, -traceRTOriginY * TRACE_RT_SCALE);
            app.renderer.render(traceScratchGlow, { renderTexture: trailGlowRT, clear: false, transform: traceRTTransform });
            app.renderer.render(traceScratchCore, { renderTexture: trailCoreRT, clear: false, transform: traceRTTransform });
        }

        function drawTraces() {
            if (traceRTNeedsFullRedraw) rebuildTraceRT();
            else accumulateTraceRT();

            // Heads, auras and the ghost pulse move every frame -- these stay
            // plain per-frame Graphics drawn on top of the accumulated sprites.
            trailGlow.clear();
            trailCore.clear();
            let useDimerLOD = world.scale.x >= DIMER_LOD_ZOOM; // T42: same LOD call as the bake, recomputed here since this runs every frame
            players.forEach(p => {
                if (!p.alive) return;

                // --- T42/T56: GROWING TIP -- last TIP_POINT_COUNT points of the
                // current segment, redrawn (not baked) every frame with a pulsing,
                // flaring offset so the tip visibly animates and splays outward
                // like an opening flower right at the end -- the single most
                // recognisable frame of a real assembly animation. Bounded per
                // player regardless of trace length -- never touches
                // traceScratchCore/the RT (T25's flat cost is untouched).
                if (useDimerLOD) {
                    let seg = p.traceSegments[p.traceSegments.length - 1];
                    let start = Math.max(1, seg.length - TIP_POINT_COUNT);
                    let span = Math.max(1, seg.length - 1 - start);
                    for (let i = start; i < seg.length; i++) {
                        let flareT = (i - start) / span; // 0 at the base of this window, 1 at the very tip
                        let pulse = 1 + 0.25 * Math.sin(survivalTime * 7 - i * 0.9);
                        let scale = pulse * (1 + flareT * TIP_FLARE_MAX);
                        stampDimer(trailCore, seg[i - 1].x, seg[i - 1].y, seg[i].x, seg[i].y, seg[i].d, p.color, p.coreColor, scale);
                    }
                }

                // --- TARGET MODE AURA ---
                let auraColor = p.targetMode === 'self' ? 0x2ecc71 : 0xe74c3c;
                trailGlow.beginFill(auraColor, 0.6);
                trailGlow.drawCircle(p.x, p.y, TRACE_WIDTH * 2.5);
                trailGlow.endFill();

                // T23: mirror Player 1's mode onto the touch toggle button --
                // physics state (targetMode) stays authoritative, this only reads it.
                if (isTouchDevice && p === players[0]) {
                    touchToggleBtn.classList.toggle('attack-mode', p.targetMode === 'attack');
                }

                if (p.effects.hunterTimer > 0) {
                    trailCore.beginFill(0xf1c40f); // Pacman yellow
                    let mouthAngle = Math.abs(Math.sin(survivalTime * 15)) * 0.6;
                    trailCore.moveTo(p.x, p.y);
                    trailCore.arc(p.x, p.y, TRACE_WIDTH * 2, p.angle + mouthAngle, p.angle + Math.PI * 2 - mouthAngle);
                    trailCore.lineTo(p.x, p.y);
                    trailCore.endFill();
                } else {
                    trailCore.beginFill(0xffffff);
                    trailCore.drawCircle(p.x, p.y, TRACE_WIDTH);
                    trailCore.endFill();
                }

                // Ghost Mode Visual Indicator (Pulsing Forcefield)
                if (p.effects.ghostTimer > 0) {
                    let pulse = Math.abs(Math.sin(survivalTime * 5)) * 5;
                    trailGlow.beginFill(p.color, 0.4);
                    trailGlow.drawCircle(p.x, p.y, TRACE_WIDTH * 4 + pulse);
                    trailGlow.endFill();
                }
            });
        }

        // T31: single implementation of "how a human head turns and steps
        // forward" -- used by the host below (for both a local `keys`-driven
        // player and a netPeerId'd remote player) and by the network client's
        // own local-head prediction/reconciliation (netPredictLocalPlayer()/
        // netReconcileLocalPlayer(), Section 7 networking code) so the two can
        // never drift apart, per the task's own warning against two copies of
        // movement code. Pure: reads p.angle/p.effects/currentSpeed but never
        // mutates p -- the caller commits the result (on the host, only after
        // checkCollision() clears it).
        function computeMovementStep(p, input, delta) {
            let angle = p.angle;
            if (input.left) angle -= 0.08 * delta;
            if (input.right) angle += 0.08 * delta;
            let effectSpeedBonus = p.effects.speedTimer > 0 ? (p.effects.speedLevel === 2 ? 2.0 : 1.0) : 0;
            let actualSpeed = currentSpeed + effectSpeedBonus;
            return {
                angle,
                x: p.x + Math.cos(angle) * actualSpeed * delta,
                y: p.y + Math.sin(angle) * actualSpeed * delta
            };
        }

        // T22 step 5: state half of the players/traces split. Moved verbatim out
        // of gameLoop's old fused `players.forEach` (bot AI, movement, every
        // swept collision check, vesicle/ATP pickup, trace append and gap
        // management, the mitosis death-ring sweep) -- only the uiBarsLayer bar
        // drawing was pulled out, into drawPlayerBars() below.
        //
        // Not PIXI-free: section 0.9's destroyNecroticOrganelle()/
        // breakClusterMember() calls touch organellesLayer/sprite internally.
        // That coupling predates this split (T13/T38/T50) and touching it is
        // out of scope here -- noted in docs/BACKLOG.md.
        function updatePlayers(delta, deltaSec, isCellFrozen) {
            players.forEach((p, pi) => {
                if (!p.alive) return;

                if (!isCellFrozen) {
                    if (p.effects.speedTimer > 0) p.effects.speedTimer -= deltaSec;
                    else p.effects.speedLevel = 1;

                    if (p.effects.golgiTimer > 0) p.effects.golgiTimer -= deltaSec;

                    // NEW: Ghost Mode Timer countdown!
                    if (p.effects.ghostTimer > 0) p.effects.ghostTimer -= deltaSec;

                    if (p.effects.hunterTimer > 0) p.effects.hunterTimer -= deltaSec;
                }

                // T22 step 5: snapshot the values drawPlayerBars() needs right
                // here -- before the collision/pickup logic below can change them
                // (a blue/red/mitochondria vesicle pickup mutates p.effects.*,
                // movement mutates p.x/p.y) -- so the bars keep reflecting this
                // frame's post-decrement, pre-pickup value exactly as the old
                // fused loop drew them (bar draw ran before any of that logic).
                p.barX = p.x; p.barY = p.y;
                p.barGhostTimer = p.effects.ghostTimer;
                p.barHunterTimer = p.effects.hunterTimer;
                p.barGolgiTimer = p.effects.golgiTimer;
                p.barSpeedTimer = p.effects.speedTimer;
                p.barSpeedLevel = p.effects.speedLevel;

                if (isCellFrozen) return;

                let nextX, nextY;
                if (p.isBot) {
                    updateBotAI(p, delta);
                    // T55: bots hold the same Shed the Tail upgrade as the human
                    // (design §3) and use it on their own the moment it's off
                    // cooldown -- a bot has no equivalent of a player choosing
                    // the moment, so "as soon as available" is its loadout.
                    if (p.upgrades.shedTail && survivalTime - p.effects.lastShedTail > SHED_TAIL_COOLDOWN) {
                        p.effects.lastShedTail = survivalTime;
                        deleteOldestTrace(p, SHED_TAIL_FRACTION);
                    }
                    let effectSpeedBonus = p.effects.speedTimer > 0 ? (p.effects.speedLevel === 2 ? 2.0 : 1.0) : 0;
                    let actualSpeed = currentSpeed + effectSpeedBonus;
                    nextX = p.x + Math.cos(p.angle) * actualSpeed * delta;
                    nextY = p.y + Math.sin(p.angle) * actualSpeed * delta;
                } else {
                    // T30/T31: a netPeerId'd player steers from the most recently
                    // received 'input' message instead of `keys` (only the host
                    // ever has a netPeerId'd player here; see startRound()).
                    // targetMode itself is flipped once, on receipt, in
                    // netHandleMessage()'s 'input' case -- not here. Both this
                    // and the local-`keys` branch now go through
                    // computeMovementStep(), the same function the network
                    // client uses to predict its own head -- see that function's
                    // comment.
                    let input = p.netPeerId != null
                        ? (netState.remoteInput[p.netPeerId] || { left: false, right: false })
                        : { left: keys[p.controls.left] || keys[p.controls.leftAlt], right: keys[p.controls.right] || keys[p.controls.rightAlt] };
                    let step = computeMovementStep(p, input, delta);
                    p.angle = step.angle;
                    nextX = step.x;
                    nextY = step.y;
                }
                let isGhost = p.effects.ghostTimer > 0;

                // 0.9 Necrotic Organelle Break (T38, extended by T50 to lone
                // necrotic organelles, not just cluster members). Runs BEFORE the
                // generic organelle check in section 1, which itself never kills
                // for a necrotic organelle touched in attack mode (see the
                // `org.necrotic` skip in checkCollision) -- so this loop's only
                // job is the cooldown-gated break/anti-strip bookkeeping. When the
                // cooldown has not elapsed, or the player is not in attack mode,
                // it does nothing and the player simply passes through unharmed
                // (attack mode) or dies normally in section 1 (self mode, same as
                // any other organelle).
                if (genAtLeast(2) && !p.isGap && !isGhost && !godMode) {
                    for (let o of organelles) {
                        if (!o.necrotic) continue;
                        if (!clusterMemberHit(o, p.x, p.y, nextX, nextY)) continue;
                        if (p.targetMode === 'attack' && survivalTime - p.effects.lastClusterHit > CLUSTER_HIT_COOLDOWN) {
                            if (o.clusterId != null) {
                                let cluster = necroticClusters.get(o.clusterId);
                                breakClusterMember(o.clusterId, cluster.members.indexOf(o));
                            } else {
                                destroyNecroticOrganelle(o);
                            }
                            p.effects.lastClusterHit = survivalTime;
                            p.stats.clusterBreaks++; // T53
                        }
                        break;
                    }
                }

                // 1. Trace and Organelle Collisions
                if (!p.isGap && !isGhost && !godMode && checkCollision(nextX, nextY, p)) { // <-- Added !godMode
                    if (isOutsideCell(nextX, nextY)) { // T17: membrane splash, distinct from trace/organelle deaths
                        emitParticles(nextX, nextY, 20, { speed: 3.0, spread: Math.PI * 2, life: 0.9, size: 3, color: C_MEMB });
                    }
                    p.alive = false;
                    addShake(0.5, 0.4); // T16: player elimination
                    return;
                }

                // 1.5 Microtubule Scaffolding Collision (swept: p.x,p.y -> nextX,nextY)
                if (mitosis.state !== 'idle' && !p.isGap && !isGhost && !godMode && mitosis.currentWidth > 350) { // <-- Added !godMode
                    for (let tube of mitosis.microtubules) {
                        if (segAabbT(p.x, p.y, nextX, nextY, tube.x, tube.y, tube.w, tube.h, TRACE_HITBOX) >= 0) {
                            p.alive = false;
                            addShake(0.5, 0.4); // T16: player elimination
                            return;
                        }
                    }
                }

                // 1.6 Malignant Mass Collision (swept; Gen 3+, T14). In 'attack'
                // targetMode the hit block shatters instead of killing, gated by
                // MASS_HIT_COOLDOWN so one pass can't clear a corridor in a frame.
                // Removing a block can disconnect the mass -- floating fragments
                // are accepted rather than flood-filling orphans (documented in
                // docs/tasks/T14-gen3-malignant-mass.md).
                if (malignantMass.blocks.length > 0 && !p.isGap && !isGhost && !godMode) {
                    let half = malignantMass.blockSize / 2;
                    for (let i = 0; i < malignantMass.blocks.length; i++) {
                        let block = malignantMass.blocks[i];
                        if (segAabbT(p.x, p.y, nextX, nextY, block.x - half, block.y - half, malignantMass.blockSize, malignantMass.blockSize, TRACE_HITBOX) < 0) continue;
                        if (p.targetMode === 'attack') {
                            if (survivalTime - p.effects.lastMassHit > MASS_HIT_COOLDOWN) {
                                malignantMass.blocks.splice(i, 1);
                                p.effects.lastMassHit = survivalTime;
                                p.stats.massBreaks++; // T53
                            }
                        } else {
                            p.alive = false;
                            addShake(0.5, 0.4); // T16: player elimination
                            return;
                        }
                        break;
                    }
                }

                // 1.7 Nucleus Chaser Collision (T57, swept against the player's
                // step; Gen4+ post-transformation homing enemies). Modelled on
                // 1.6 above: in 'attack' targetMode the hit chaser is destroyed
                // instead of killing the player, gated by CHASER_HIT_COOLDOWN so
                // one pass cannot clear the whole spawn cap in a frame. Not
                // routed through checkCollision()/spatialGrid, same as 1.6's
                // malignant mass -- see docs/tasks/T57 Findings.
                if (nucleusChasers.length > 0 && !p.isGap && !isGhost && !godMode) {
                    for (let i = 0; i < nucleusChasers.length; i++) {
                        let h = nucleusChasers[i];
                        let rSq = (h.radius + TRACE_HITBOX) * (h.radius + TRACE_HITBOX);
                        if (ptSegDistSq(h.x, h.y, p.x, p.y, nextX, nextY) >= rSq) continue;
                        if (p.targetMode === 'attack') {
                            if (survivalTime - p.effects.lastChaserHit > CHASER_HIT_COOLDOWN) {
                                destroyNucleusChaser(i);
                                p.effects.lastChaserHit = survivalTime;
                            }
                        } else {
                            p.alive = false;
                            addShake(0.6, 0.5); // T16: player elimination by chaser
                            return;
                        }
                        break;
                    }
                }

                // 2. Viral Swarm Collisions (Added Ghost & Dev Immunity)
                if (infection.particles.length > 0 && !isGhost && !godMode) { // <-- Added !godMode
                    for (let i = infection.particles.length - 1; i >= 0; i--) {
                        let vp = infection.particles[i];
                        if (Math.hypot(nextX - vp.x, nextY - vp.y) < (vp.radius * 1.4) + TRACE_HITBOX) {
                            if (p.effects.hunterTimer > 0) {
                                infection.particles.splice(i, 1);
                            } else {
                                p.alive = false;
                                addShake(0.5, 0.4); // T16: player elimination
                                return;
                            }
                        }
                    }
                }

                // 3. Vesicle Collection Logic
                for (let i = vesicles.length - 1; i >= 0; i--) {
                    let v = vesicles[i];
                    if (Math.hypot(nextX - v.x, nextY - v.y) < v.radius + TRACE_WIDTH + 6 + p.upgrades.pickupRadiusBonus) { // T55

                        // T36: 'attack' (red) sends the beneficial effect below to
                        // an opponent instead of the picker; see boostTarget().
                        let target = boostTarget(p);
                        p.stats.vesicles[v.type]++; // T53: credited to the picker, not the redirect target

                        if (v.type === 'membrane') {
                            if (target.effects.ghostTimer > 0) {
                                target.effects.ghostTimer = Math.min(10.0, target.effects.ghostTimer + 3.0);
                            } else {
                                if (survivalTime > target.effects.blueWindow) target.effects.blueCount = 0;
                                target.effects.blueCount++;
                                target.effects.blueWindow = survivalTime + 10.0;

                                if (target.effects.blueCount >= 3) {
                                    target.effects.ghostTimer = 10.0;
                                    target.effects.blueCount = 0;
                                }
                                target.effects.golgiTimer = Math.min(15.0, target.effects.golgiTimer + EFFECT_DURATION);
                            }
                        }
                        else if (v.type === 'lysosome') {
                            if (survivalTime > target.effects.redWindow) target.effects.redCount = 0;
                            target.effects.redCount++;
                            target.effects.redWindow = survivalTime + 10.0;
