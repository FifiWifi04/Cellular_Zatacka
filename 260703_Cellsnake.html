<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- T23: mobile viewport -- without this, phones lay out at a virtual
         ~980px width and scale the result down, and touch coordinates land wrong. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Cellular Zatacka - The Viral Infection</title>
    <!-- T27: PWA installability. The <link> fails harmlessly if fetched from
         file:// or a host with no manifest.webmanifest -- that must stay true. -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d0d1a">
    <!-- Vendored locally so the game runs offline, from file://, and inside
         sandboxes with no CDN egress. Same builds the CDNs served:
         pixi.js 7.3.2, pixi-filters 5.2.1. Keep these two versions in step. -->
    <script src="vendor/pixi.min.js"></script>
    <script src="vendor/pixi-filters.js"></script>
    <style>
        /* Force the page to fill the window and remove scrollbars */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d1a;
            /* T61: #ui's resting top offset (reserved for #liveHud above it,
               see #ui's own comment) -- a custom property so #ui.hidden-ui's
               transform (below) can subtract the same value it was pushed
               down by. Keeping the two in sync any other way (e.g. restating
               the offset as a literal in both places) silently drifts the
               moment one of them changes -- see the 46px landscape override
               in the @media block near the end of this stylesheet. */
            --ui-top-offset: max(72px, calc(env(safe-area-inset-top) + 64px));
            /* T23: no pan/zoom/pull-to-refresh gestures stolen from touch steering */
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-top: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Force the PixiJS canvas to act as a background layer */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        #game-container {
            touch-action: none;
            overscroll-behavior: none;
        }

        /* T23: on-screen boost-target toggle for touch devices, shown by JS
           when isTouchDevice is true. Mirrors the aura colours used in-game
           (green = self, red = attack). */
        .touch-toggle-btn {
            display: none;
            position: fixed;
            right: max(16px, env(safe-area-inset-right));
            bottom: max(16px, env(safe-area-inset-bottom));
            width: 56px;
            height: 56px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 50;
            font-size: 22px;
            padding: 0;
            background: #2ecc71;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .touch-toggle-btn.attack-mode {
            background: #e74c3c;
        }

        /* T59: touch-only Shed the Tail activation, shown by JS only when
           isTouchDevice and the upgrade is owned. Opposite corner from the
           T23 toggle so the two never collide. */
        .shed-tail-btn {
            display: none;
            position: fixed;
            left: max(16px, env(safe-area-inset-left));
            bottom: max(16px, env(safe-area-inset-bottom));
            width: 56px;
            height: 56px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 50;
            font-size: 20px;
            font-family: monospace;
            padding: 0;
            border: none;
            color: #ffffff;
            background: #2d3436;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .shed-tail-btn:disabled {
            opacity: 0.45;
        }

        /* T27: unobtrusive prompt shown when the service worker has a new
           version waiting -- never reload out from under the player. */
        .sw-update-banner {
            display: none;
            position: fixed;
            left: 50%;
            bottom: max(16px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 120;
            padding: 8px 16px;
            border-radius: 20px;
            background: #2d3436;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* T24: persistent menu/pause button -- explicit control since touch has
           no hover. Opposite corner from the T23 boost-target toggle. */
        .pause-menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 8px;
            z-index: 110;
            font-size: 20px;
            background: #2d3436;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .pause-menu-btn:hover {
            background: #636e72;
        }

        /* T40: one-time "look here" cue pointing at pauseMenuBtn, shown for the
           first round of a session only. Sits just under the button, same corner. */
        .pause-hint {
            display: none;
            position: fixed;
            top: max(60px, calc(env(safe-area-inset-top) + 60px));
            right: max(12px, env(safe-area-inset-right));
            z-index: 109;
            max-width: 180px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(13, 13, 26, 0.9);
            color: #ffffff;
            font-size: 12px;
            text-align: right;
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        .pause-hint.pause-hint-fade {
            opacity: 0;
        }

        /* T24: explicit close/resume affordance inside the menu itself. Sits at
           top-left -- top-right is the fixed, higher-stacked pauseMenuBtn, which
           would otherwise intercept clicks meant for this button. */
        .ui-close-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: max(6px, env(safe-area-inset-top));
            left: 6px;
            width: 44px;
            height: 44px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            font-size: 18px;
            z-index: 5;
        }

        .ui-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #ui {
            position: absolute;
            /* T61: #liveHud (scoreboard + nucleus meter, see its own CSS
               comment) is a sibling fixed at the very top, independent of
               #ui's own hidden-ui state -- #ui used to start at top:0 too, so
               expanding it (pause/menu/round-over) put its own first line
               directly under #liveHud's text. Reserve #liveHud's tallest case
               (scoreboard line + gap + nucleus meter) so the two never print
               on top of each other. */
            top: var(--ui-top-offset);
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            background: rgba(13, 13, 26, 0.9);
            padding: 15px 30px;
            padding-top: max(15px, env(safe-area-inset-top));
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border: 1px solid rgba(0, 210, 211, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: fit-content;
            /* T24: the flat 400px min-width overflowed off-screen with no way
               to scroll to the clipped part on any viewport narrower than
               ~410px (flagged during T23, confirmed as this task's scope) --
               min()/max() against the viewport keep it unchanged on desktop
               (still 400px there) while letting it shrink and let .controls'
               existing flex-wrap reflow the buttons on a narrow phone. */
            min-width: min(400px, 94vw);
            max-width: 94vw;
            /* keep the menu on-screen and scrollable in landscape on a short
               viewport -- dvh, not vh, so mobile browser chrome resizing
               doesn't clip it. */
            max-height: 90dvh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* T61: bottom-fade "more below" cue for the scrollable menu above --
           T24 added the scroll, but nothing on screen said it was scrollable.
           updateUiScrollCue() toggles this class from a scroll listener + a
           ResizeObserver, so the fade only shows when there is actually
           something to scroll to. position:sticky keeps it pinned to the
           bottom of the visible scroll area rather than the end of the
           (possibly much taller) content. */
        #ui.has-more-below::after {
            content: '';
            display: block;
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            height: 28px;
            margin-top: -28px;
            pointer-events: none;
            background: linear-gradient(to bottom, transparent, rgba(13, 13, 26, 0.95));
        }

        /* Slide the UI fully off-screen to hide it. T61: this used to stop at
           -90% on desktop, deliberately leaving a sliver showing #scoreboard
           -- but #scoreboard now lives in #liveHud (always visible on its
           own, independent of #ui), so that sliver would just be peeking at
           whatever now sits at the bottom of #ui instead. Push it fully away
           on every device, same as the old touch-only rule; the extra 24px
           clears the box-shadow's downward bleed. Must also subtract
           --ui-top-offset (#ui's own resting `top`, above) -- translate() is
           relative to #ui's own box, not the viewport, so without it the
           box only clears the viewport by (24px - top-offset), leaving the
           bottom top-offset-worth of the panel peeking in at y=0.
           #pauseMenuBtn is the affordance for getting the panel back. */
        #ui.hidden-ui {
            transform: translate(-50%, calc(-100% - var(--ui-top-offset) - 24px));
        }

        /* The invisible trigger area at the top of the screen */
        #ui-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            z-index: 90;
        }

        /* T45: with no hover listeners bound on touch this strip does nothing
           except swallow the top 30px of steering pointerdowns before they
           reach the canvas. */
        body.touch-ui #ui-trigger {
            display: none;
        }

        /* T61: lives in #liveHud now, so it stays visible even when #ui is
           hidden without needing the old sliver hack. T24: clamp() keeps it
           readable on a 390px-wide screen without growing past the original
           20px on desktop. */
        #scoreboard {
            margin: 0;
            font-size: clamp(16px, 4.5vw, 20px);
            color: #00d2d3;
            text-shadow: 0 0 10px rgba(0, 210, 211, 0.5);
        }

        /* T61: round-over result block (stats card + Play Again) -- shown
           first inside #ui, ahead of the setup controls, so the thing the
           player wants right after dying isn't buried under a wall of setup
           UI. Toggled by renderStatsCard()/startRound(), same idiom the old
           .hidden-stats toggle used, just one level up so the Play Again
           button hides/shows in lockstep with the card instead of needing
           its own separate toggle. */
        .round-result.hidden-round-result {
            display: none;
        }

        /* T53: end-of-round stats card. Lives inside #ui so it inherits its
           existing min-width/max-height/overflow-y clamp (T24) instead of
           becoming a second thing that might not fit on a phone. */
        .stats-card {
            margin-top: 6px;
            text-align: left;
        }

        /* T61: setup controls collapse behind this once a round has ended,
           so the result above doesn't compete with a wall of selects/buttons
           for the player's attention -- expands again for the next round via
           the native <details> disclosure triangle, or by tapping it. */
        .setup-summary {
            cursor: pointer;
            margin-top: 6px;
            padding: 4px 0;
            color: #a29bfe;
            font-size: 13px;
        }

        #setupDetails[open] .setup-summary {
            margin-bottom: 4px;
        }

        .stats-card-player {
            margin: 6px 0;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #636e72;
            font-size: clamp(11px, 3vw, 13px);
        }

        .stats-card-player.dead {
            opacity: 0.55;
        }

        .stats-card-name {
            font-weight: bold;
            margin-bottom: 3px;
        }

        .stats-card-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        /* T54: new-best callout on the end-of-round card. */
        .hs-new-best {
            color: #fdcb6e;
            font-weight: bold;
        }

        /* When full screen is active, strip away the borders and fill the monitor */
        :fullscreen #game-container {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            box-shadow: none;
        }

        .controls {
            margin-top: 5px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        select,
        button {
            background: #0984e3;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        select {
            background: #2d3436;
        }

        button:hover {
            background: #74b9ff;
        }

        /* T24: bigger tap targets on touch (>=44x44 CSS px), and de-emphasise
           the player-count selector -- Quick Play (1 human + 1 bot) is the
           only mode playable without a keyboard until Phase 7 networking. */
        body.touch-ui select,
        body.touch-ui button {
            padding: 14px 18px;
            font-size: 18px;
            min-height: 44px;
            box-sizing: border-box;
        }

        body.touch-ui #modeSelect {
            opacity: 0.6;
        }

        /* Keep Quick Play the visually dominant action on touch -- otherwise the
           generic body.touch-ui button rule above (higher specificity than
           .quick-play-btn alone) shrinks its font-size instead of growing it. */
        body.touch-ui .quick-play-btn {
            font-size: 22px;
            padding: 18px;
        }

        .fullscreen-btn {
            background: #6c5ce7;
        }

        .fullscreen-btn:hover {
            background: #a29bfe;
        }

        /* T19: prominent one-click entry point, sits above the config controls */
        .quick-play-btn {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0 0 8px;
            padding: 14px;
            font-size: 20px;
            font-weight: bold;
            background: #00b894;
            box-shadow: 0 0 15px rgba(0, 184, 148, 0.5);
        }

        .quick-play-btn:hover {
            background: #55efc4;
        }

        /* T20: control-mapping splash */
        .splash-toggle-btn {
            background: #636e72;
        }

        .splash-toggle-btn:hover {
            background: #b2bec3;
        }

        .control-splash {
            margin-top: 8px;
        }

        .control-splash.hidden-splash {
            display: none;
        }

        .splash-cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            max-width: min(600px, 88vw);
            margin: 0 auto;
        }

        .splash-card {
            width: 135px;
            box-sizing: border-box;
            text-align: left;
            font-size: 13px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .splash-card.dimmed {
            opacity: 0.35;
        }

        .splash-card-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .splash-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: none;
        }

        .splash-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 3px 0;
        }

        .splash-key {
            display: inline-block;
            min-width: 14px;
            padding: 1px 5px;
            border: 1px solid #636e72;
            border-radius: 4px;
            background: #2d3436;
            font-family: monospace;
            font-size: 12px;
            text-align: center;
        }

        .splash-hint {
            max-width: 500px;
            margin: 8px auto 0;
            font-size: 12px;
            color: #a29bfe;
        }

        /* T41: How-to-Play panel. Its own overlay, above #ui (z-index 100). */
        .help-btn {
            background: #636e72;
        }

        .help-btn:hover {
            background: #b2bec3;
        }

        .help-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 150;
            background: rgba(0, 0, 0, 0.6);
        }

        .help-overlay.hidden-help {
            display: none;
        }

        .help-panel {
            position: relative;
            box-sizing: border-box;
            text-align: left;
            background: rgba(13, 13, 26, 0.97);
            border: 1px solid rgba(0, 210, 211, 0.3);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
            padding: 20px 24px;
            padding-top: max(56px, env(safe-area-inset-top) + 46px);
            max-width: min(720px, 92vw);
            max-height: 90dvh;
            overflow-y: auto;
        }

        .help-close-btn {
            top: max(6px, env(safe-area-inset-top));
            right: 6px;
            left: auto;
        }

        /* T54: destructive action inside the high-score panel -- red like the
           existing attack-mode accent (.touch-toggle-btn.attack-mode) so it
           reads as dangerous without inventing a new palette entry. */
        .hs-clear-btn {
            display: block;
            margin: 16px auto 0;
            background: #e74c3c;
        }

        .hs-clear-btn:hover {
            background: #ff7675;
        }

        /* T55: one row per upgrade in the Shop panel. */
        .shop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .shop-row-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 14px;
        }

        .shop-row-info span {
            color: #b2bec3;
            font-size: 13px;
        }

        .shop-buy-btn {
            flex: none;
            background: #00b894;
        }

        .shop-buy-btn:hover:not(:disabled) {
            background: #55efc4;
        }

        .shop-buy-btn:disabled {
            background: #636e72;
            opacity: 0.6;
            cursor: not-allowed;
        }

        .shop-owned {
            flex: none;
            color: #00d2d3;
            font-size: 13px;
        }

        .shop-spawn-select {
            width: 100%;
            margin: 4px 0 12px;
        }

        .shop-note {
            color: #b2bec3;
            font-size: 12px;
        }

        /* T29: the online lobby's name/room-code fields -- no <input> existed
           in the UI before this task, so give them a dark-theme look matching
           the existing select/button styling instead of the browser default. */
        .net-field {
            display: block;
            text-align: left;
            font-size: 13px;
            color: #b2bec3;
            margin: 10px 0;
        }

        .net-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 10px 0;
        }

        .net-field input,
        .net-row input {
            background: #2d3436;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            padding: 8px 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .net-field input {
            display: block;
            width: 100%;
            margin-top: 4px;
        }

        .net-row input {
            flex: 1;
            min-width: 0;
        }

        /* T32: see netUpdateStatusBar() -- display:none by default, toggled to
           block only while at least one peer/the host is not 'ok'. */
        #netStatusBar {
            display: none;
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 500;
            background: rgba(20, 20, 25, 0.75);
            color: #ffeaa7;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
        }

        .help-panel h2 {
            text-align: center;
            margin-top: 0;
            color: #00d2d3;
        }

        /* T61: Help/Scores/Shop/Online reuse the same overlay shape (T41
           design, correctly) but were otherwise identical apart from the
           heading text. A per-panel accent on the border + heading -- each
           colour borrowed from that panel's own existing button/callout
           colour elsewhere in the UI, not a new palette entry -- plus a
           leading icon in the heading itself (see the HTML) makes the four
           identifiable at a glance. Help keeps the original teal untouched. */
        .help-panel-scores {
            border-color: rgba(253, 203, 110, 0.4);
        }

        .help-panel-scores h2 {
            color: #fdcb6e;
        }

        .help-panel-shop {
            border-color: rgba(0, 184, 148, 0.4);
        }

        .help-panel-shop h2 {
            color: #00b894;
        }

        .help-panel-online {
            border-color: rgba(9, 132, 227, 0.4);
        }

        .help-panel-online h2 {
            color: #0984e3;
        }

        .help-panel h3 {
            color: #a29bfe;
            margin: 18px 0 6px;
            font-size: 16px;
        }

        .help-panel p,
        .help-panel li {
            font-size: 14px;
            line-height: 1.5;
        }

        .help-panel ul {
            margin: 4px 0;
            padding-left: 20px;
        }

        .help-swatch-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 6px 0;
            font-size: 14px;
            line-height: 1.4;
        }

        .help-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex: none;
            margin-top: 3px;
        }

        .help-swatch.round {
            border-radius: 50%;
        }

        .help-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin: 6px 0 14px;
        }

        .help-table td,
        .help-table th {
            padding: 4px 6px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* T41 reuses T20's control-splash cards inside the Help panel --
           give them a bit more breathing room than the compact menu popover. */
        #helpContent .splash-cards {
            max-width: 100%;
        }

        h3 {
            margin: 5px 0;
            font-weight: normal;
            color: #b2bec3;
        }

        h2 {
            margin: 5px 0;
        }

        #globalWarning {
            height: 28px;
            color: #ff4757;
            text-shadow: 0 0 10px #ff4757;
            font-weight: bold;
            margin: 0;
        }

        /* T61: single top-centre HUD stack -- #scoreboard and #nucleusFeedBar
           used to be positioned independently (the scoreboard inside #ui, the
           nucleus meter as its own fixed element) and could land on top of
           each other. Both now live here, in a defined flex-column order, so
           a future addition to this stack just becomes another child instead
           of another independently-positioned element to collide with. Always
           visible (not tied to #ui's hidden-ui state) since the scoreboard
           timer/result and the nucleus meter both need to read during play,
           when #ui itself is hidden. */
        #liveHud {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            position: absolute;
            top: max(8px, env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 150;
            pointer-events: none;
        }

        /* T61: hidden while any of the Help/Scores/Shop/Online overlays is
           open -- see updateLiveHudVisibility(). Those overlays share
           #liveHud's z-index, so without this its text bled through their
           semi-transparent scrim above the modal panel. */
        #liveHud.hidden-hud {
            display: none;
        }

        /* T52: Gen 4+ nucleus feed meter -- fixed HUD (not world-space), so it
           reads at any zoom/camera mode and survives the T24 mobile layouts.
           Shown/updated from gameLoop; hidden pre-Gen4. */
        #nucleusFeedBar {
            display: none;
            width: min(220px, 55vw);
            font-family: monospace;
            text-align: center;
        }

        #nucleusFeedLabel {
            font-size: clamp(9px, 2.4vw, 12px);
            color: #a29bfe;
            text-shadow: 0 0 4px rgba(162, 155, 254, 0.8);
            margin-bottom: 2px;
        }

        #nucleusFeedTrack {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid #a29bfe;
            border-radius: 4px;
            overflow: hidden;
        }

        #nucleusFeedFill {
            height: 100%;
            width: 0%;
            background: #a29bfe;
        }

        /* T52: the direct-feed phase (window shrunk to 0) -- distinct visual
           state so the ending is felt coming, not just read off a number. */
        #nucleusFeedFill.critical {
            background: #ff4757;
            box-shadow: 0 0 8px #ff4757;
        }

        /* T61 item 4: a short landscape phone (844x390 is the reported case)
           is exactly where the desktop-tuned spacing above doesn't fit --
           Quality/Start Game were sliced by the panel edge with no hint that
           scrolling would reveal them. #ui already scrolls (T24) and now
           shows a fade when it does (.has-more-below, above); this reclaims
           enough vertical space that the primary actions sit above the fold
           in the first place instead of relying on the scroll cue alone. */
        @media (max-height: 420px) and (orientation: landscape) {
            html,
            body {
                /* T61: keep #ui.hidden-ui's transform (which reads this same
                   variable) in sync with the shorter reservation below --
                   restating 46px only in #ui's own `top` would silently
                   under-hide the panel by the difference, same bug this
                   variable was introduced to prevent. */
                --ui-top-offset: 46px;
            }

            #liveHud {
                top: 4px;
                gap: 2px;
            }

            #scoreboard {
                font-size: 13px;
            }

            #nucleusFeedBar {
                width: min(150px, 40vw);
            }

            #ui {
                padding: 8px 20px;
                padding-top: 8px;
            }

            #ui .quick-play-btn {
                padding: 8px;
                font-size: 16px;
                margin-bottom: 4px;
            }

            #ui .controls {
                margin-top: 2px;
                gap: 6px;
            }

            body.touch-ui #ui select,
            body.touch-ui #ui button {
                padding: 8px 12px;
                font-size: 15px;
                min-height: 36px;
            }
        }
    </style>
</head>

<body>

    <div id="ui-trigger"></div>
    <!-- T24: explicit menu/pause control -- hover-to-peek has no touch equivalent. -->
    <button id="pauseMenuBtn" class="pause-menu-btn" onclick="togglePauseMenu()" aria-label="Menu / Pause">&#9776;</button>
    <!-- T40: one-time hint pointing at the pause button/shortcuts, shown on the first round of a session. -->
    <div id="pauseHint" class="pause-hint">Esc or P or &#9776; to pause</div>
    <div id="devIndicator"
        style="display: none; position: absolute; top: 10px; right: 20px; color: #00ff00; font-weight: bold; font-family: monospace; font-size: 13px; line-height: 1.4; white-space: pre; z-index: 1000; text-shadow: 0 0 5px #00ff00; pointer-events: none;">
    </div>

    <h2 id="globalWarning"
        style="display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%); color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.8); font-size: clamp(20px, 6vw, 28px); z-index: 200; pointer-events: none;">
    </h2>

    <!-- T61: single top-centre HUD stack -- see the #liveHud CSS comment.
         Always visible, independent of #ui's own show/hide. -->
    <div id="liveHud">
        <h2 id="scoreboard"></h2>
        <!-- T52: Gen 4+ nucleus feed meter -- see updateNucleusFeedHUD(). -->
        <div id="nucleusFeedBar">
            <div id="nucleusFeedLabel">NUCLEUS</div>
            <div id="nucleusFeedTrack">
                <div id="nucleusFeedFill"></div>
            </div>
        </div>
    </div>

    <div id="ui">
        <!-- T61: the only close affordance #ui needs -- #pauseMenuBtn (top
             right, always on screen) already toggles this panel open/closed;
             the in-panel &#10005; duplicated it (item 6b). The four overlay
             panels below keep their own close buttons -- pauseMenuBtn only
             toggles #ui, not those. -->
        <!-- T61: result-first on round-over -- see .round-result CSS and
             renderStatsCard()/startRound() for the show/hide toggle. Empty
             (hidden) until a round has ended. -->
        <div id="roundResult" class="round-result hidden-round-result">
            <div id="statsCard" class="stats-card"></div>
            <button id="playAgainBtn" class="quick-play-btn" onclick="startRound()">&#9654; Play Again</button>
        </div>
        <!-- T61: setup collapses behind a disclosure once a round has ended
             (open by default pre-round) so it doesn't compete with the
             result above -- see renderStatsCard()/startRound(). -->
        <details id="setupDetails" open>
            <summary class="setup-summary">Setup</summary>
            <button id="quickPlayBtn" class="quick-play-btn" onclick="quickPlay()">⚡ Quick Play</button>
            <div class="controls">
            <select id="modeSelect" onchange="updateUI()">
                <option value="1">1 Player (Solo)</option>
                <option value="2">2 Players (Versus)</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
            </select>

            <select id="aiSelect" onchange="updateUI()">
                <option value="0">AI Competitors: None</option>
                <option value="1">1 AI Bot</option>
                <option value="2">2 AI Bots</option>
                <option value="3">3 AI Bots</option>
            </select>

            <select id="cameraSelect" onchange="updateUI()">
                <option value="shared">Camera: Shared View</option>
                <option value="split">Camera: Split Screen</option>
            </select>

            <select id="speedSelect" onchange="updateUI()">
                <option value="1.5" selected>Speed: Normal</option>
                <option value="2.5">Speed: Fast</option>
                <option value="3.5">Speed: Very Fast</option>
            </select>

            <select id="qualitySelect" onchange="updateUI()">
                <option value="auto" selected>Quality: Auto</option>
                <option value="low">Quality: Low</option>
                <option value="medium">Quality: Medium</option>
                <option value="high">Quality: High</option>
            </select>
            <button onclick="startRound()">Start Game</button>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">Fullscreen</button>
            <button class="splash-toggle-btn" onclick="toggleControlSplash()">Controls</button>
            <!-- T41: reachable from here both before a round (main menu) and
                 during one (this same #ui doubles as the pause menu, T24). -->
            <button class="help-btn" onclick="toggleHelpPanel(true)">? Help</button>
            <!-- T54: reachable from here both before a round (main menu) and
                 during one (pause menu), mirrors T41's Help button above. -->
            <button class="help-btn" onclick="toggleHighScorePanel(true)">Scores</button>
            <!-- T55: reachable from here both before a round (main menu) and
                 during one (pause menu), mirrors T41/T54's buttons above. -->
            <button class="help-btn" onclick="toggleShopPanel(true)">Shop</button>
            <!-- T29: reachable from here both before a round (main menu) and
                 during one (pause menu), mirrors T41/T54/T55's buttons above. -->
            <button class="help-btn" onclick="toggleNetPanel(true)">Online</button>
        </div>
        <div id="controlSplash" class="control-splash">
            <div id="splashCards" class="splash-cards"></div>
            <p class="splash-hint" id="splashHint">3rd key toggles boost target.</p>
        </div>
        <h3 id="controlsText">P1 (Blue): Left/Right Arrows</h3>
        </details>
    </div>

    <!-- T41: static How-to-Play guide, closable, reachable from the menu above. -->
    <div id="helpOverlay" class="help-overlay hidden-help" onclick="if (event.target === this) toggleHelpPanel(false)">
        <div class="help-panel">
            <button class="ui-close-btn help-close-btn" onclick="toggleHelpPanel(false)" aria-label="Close help">&#10005;</button>
            <h2>&#10067; How to Play</h2>
            <div id="helpContent"></div>
        </div>
    </div>

    <!-- T54: per-run history + lifetime totals, mirrors T41's help overlay
         structure exactly (task design §3) -- same close button, outside-click
         close, and pause interaction, rebuilt into highScoreContent on open. -->
    <div id="highScoreOverlay" class="help-overlay hidden-help" onclick="if (event.target === this) toggleHighScorePanel(false)">
        <div class="help-panel help-panel-scores">
            <button class="ui-close-btn help-close-btn" onclick="toggleHighScorePanel(false)" aria-label="Close high scores">&#10005;</button>
            <h2>&#127942; High Scores</h2>
            <div id="highScoreContent"></div>
            <button class="hs-clear-btn" onclick="confirmClearHighScores()">Clear History</button>
        </div>
    </div>

    <!-- T55: spend points banked from run scores on microtubule upgrades,
         mirrors T41/T54's overlay structure exactly (task design §5) -- same
         close button, outside-click close, and pause interaction, rebuilt
         into shopContent on open since balance/ownership can change between
         opens. -->
    <div id="shopOverlay" class="help-overlay hidden-help" onclick="if (event.target === this) toggleShopPanel(false)">
        <div class="help-panel help-panel-shop">
            <button class="ui-close-btn help-close-btn" onclick="toggleShopPanel(false)" aria-label="Close shop">&#10005;</button>
            <h2>&#129516; Microtubule Upgrades</h2>
            <div id="shopContent"></div>
        </div>
    </div>

    <!-- T29: online lobby -- WebSocket-relay transport, mirrors T41/T54/T55's
         overlay structure exactly (same close button, outside-click close,
         pause interaction). No gameplay crosses the wire yet -- T30. -->
    <div id="netOverlay" class="help-overlay hidden-help" onclick="if (event.target === this) toggleNetPanel(false)">
        <div class="help-panel help-panel-online">
            <button class="ui-close-btn help-close-btn" onclick="toggleNetPanel(false)" aria-label="Close online menu">&#10005;</button>
            <h2>&#127760; Online (beta)</h2>
            <div id="netContent"></div>
        </div>
    </div>

    <!-- T32: connection-health readout for the peers/host currently not 'ok'
         (lagging/dropped/gone/backgrounded) -- see netUpdateStatusBar(). Empty
         and hidden through ordinary online play; only ever visible during
         disconnect handling. -->
    <div id="netStatusBar"></div>

    <div id="game-container"></div>

    <!-- T23: touch-only boost-target toggle; shown by JS when isTouchDevice -->
    <button id="touchToggleBtn" class="touch-toggle-btn" onclick="toggleTouchTargetMode()">&#8644;</button>

    <!-- T59: touch-only Shed the Tail activation; shown by JS only when
         isTouchDevice and the upgrade is owned -- see updateShedTailButtonHUD(). -->
    <button id="shedTailBtn" class="shed-tail-btn" onclick="touchShedTail()">&#9986;</button>

    <!-- T27: shown by the service worker registration when an update is waiting -->
    <div id="swUpdateBanner" class="sw-update-banner" onclick="applySwUpdate()">New version available — tap to reload</div>

    <script>
        // --- 0. Fuzzer instrumentation (T04) ---
        // Declared before anything else can throw, so the error trap catches
        // init-time failures too.
        let fuzzStats = {
            rounds: 0, elapsed: 0, tracePoints: 0, gridCells: 0, worldChildren: 0,
            vesicles: 0, organelles: 0, virusParticles: 0, heapMB: null, errors: 0
        };
        window.fuzzStats = fuzzStats;
        window.addEventListener('error', e => { fuzzStats.errors++; console.error('[FUZZ]', e.message); });
        window.addEventListener('unhandledrejection', e => { fuzzStats.errors++; });

        // Recursive display-object count under a PIXI container -- the leak canary
        // for startRound()'s removeChildren() calls (T05).
        function countDisplayObjects(container) {
            let count = container.children.length;
            for (let i = 0; i < container.children.length; i++) {
                let child = container.children[i];
                if (child.children) count += countDisplayObjects(child);
            }
            return count;
        }

        // --- 0b. PWA service worker registration (T27) ---
        // Registering over file:// throws (not a secure context) or silently
        // fails depending on the browser, so gate on the same check the spec
        // uses for "secure context": https, localhost, or 127.0.0.1. This must
        // stay a no-op from file://, which is a supported way to run the game.
        if ('serviceWorker' in navigator && window.isSecureContext &&
            (location.protocol === 'https:' || location.hostname === 'localhost' ||
                location.hostname === '127.0.0.1')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.addEventListener('updatefound', () => {
                        const installing = reg.installing;
                        if (!installing) return;
                        installing.addEventListener('statechange', () => {
                            // installed + an existing controller means this is an
                            // update, not the first install -- the first install has
                            // nothing to hand off to, so there is nothing to prompt.
                            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                                document.getElementById('swUpdateBanner').style.display = 'block';
                            }
                        });
                    });
                }).catch(err => console.error('[PWA] service worker registration failed', err));

                let reloadedForUpdate = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloadedForUpdate) return;
                    reloadedForUpdate = true;
                    location.reload();
                });
            });
        }

        window.applySwUpdate = () => {
            navigator.serviceWorker.getRegistration().then(reg => {
                if (reg && reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
            });
        };

        // --- 1. Init PixiJS ---
        // Grab the initial container size instead of hardcoding 800x600
        const gameContainer = document.getElementById('game-container');
        let SCREEN_WIDTH = window.innerWidth;
        let SCREEN_HEIGHT = window.innerHeight;

        // T23: a touchscreen laptop also reports a coarse pointer, so this only
        // ever *enables* touch controls -- keyboard input must keep working too.
        const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;

        const app = new PIXI.Application({
            resizeTo: window, // keep Pixi synced with the browser window
            backgroundColor: 0x0a0a14,
            antialias: true
        });

        app.view.style.position = 'absolute';
        app.view.style.top = '0';
        app.view.style.left = '0';
        app.view.style.width = '100vw';
        app.view.style.height = '100vh';
        app.view.style.zIndex = '1';

        document.body.appendChild(app.view);

        // Listen for window size changes so the UI and camera math stay in sync.
        // T23: also bound to orientationchange -- some mobile browsers fire it
        // ahead of (or instead of) a timely resize event.
        function handleViewportResize() {
            SCREEN_WIDTH = window.innerWidth;
            SCREEN_HEIGHT = window.innerHeight;
            app.renderer.resize(SCREEN_WIDTH, SCREEN_HEIGHT);
            // Split-screen viewports were sized for the old window; drop them so
            // updateCamera() rebuilds fresh RenderTextures at the new size (T05).
            purgeSplitScreen();
        }
        window.addEventListener('resize', handleViewportResize);
        window.addEventListener('orientationchange', handleViewportResize);

        // --- 2. Layers & World Camera ---
        const world = new PIXI.Container();
        // T16: shakeRoot sits between stage and world so screenshake never touches
        // world.x/y/scale -- those stay owned by updateCamera() (AGENT_CONDUCT 4.5).
        // Split-screen renders `world` directly into RenderTextures, so shake does
        // not apply per-viewport there; that is an accepted scope limit (T16).
        const shakeRoot = new PIXI.Container();
        shakeRoot.addChild(world);
        app.stage.addChild(shakeRoot);

        // T34: holds the split-screen viewport sprites. Bloom is applied here
        // once, on the composite, instead of once per viewport -- see the
        // world.filters save/restore in updateCamera()'s split branch and the
        // mirrored assignment in applyQuality() below.
        const splitScreenLayer = new PIXI.Container();
        app.stage.addChild(splitScreenLayer);

        const backgroundLayer = new PIXI.Container();
        const calcifyLayer = new PIXI.Graphics(); // T12: redrawn shrinking membrane, Gen 2+
        const mitosisLayer = new PIXI.Graphics();
        const nucleusLayer = new PIXI.Graphics();
        const golgiERContainer = new PIXI.Container();
        const rotatingContainer = new PIXI.Container();
        const organellesLayer = new PIXI.Graphics();
        const necroticClusterLayer = new PIXI.Graphics(); // T38: fused necrotic clusters, cleared+redrawn every frame
        const massLayer = new PIXI.Graphics(); // T14: protein aggregate (T39), cleared+redrawn every frame
        const necroticDebrisLayer = new PIXI.Graphics(); // T38: lethal shed fragments, cleared+redrawn every frame
        const particleLayer = new PIXI.Graphics(); // T17: splash particle pool, single Graphics for the whole pool
        particleLayer.blendMode = PIXI.BLEND_MODES.ADD;
        const trailLayer = new PIXI.Container();
        // T21: one switch for the bioluminescent additive-glow look; set to
        // PIXI.BLEND_MODES.NORMAL to revert organelles/vesicles/virus to the
        // pre-T21 vector rendering wholesale.
        const GLOW_BLEND = PIXI.BLEND_MODES.ADD;
        const dynamicLayer = new PIXI.Graphics(); // Vesicles
        dynamicLayer.blendMode = GLOW_BLEND;
        const atpLayer = new PIXI.Graphics(); // T51: ATP granules
        atpLayer.blendMode = GLOW_BLEND;
        const virusLayer = new PIXI.Graphics();   // New layer for the Infection event
        virusLayer.blendMode = GLOW_BLEND;
        const chaserLayer = new PIXI.Graphics(); // T57: nucleus-spawned homing enemies, cleared+redrawn every frame
        chaserLayer.blendMode = GLOW_BLEND;
        const uiBarsLayer = new PIXI.Graphics();

        world.addChild(backgroundLayer);
        world.addChild(calcifyLayer);
        world.addChild(mitosisLayer);
        world.addChild(nucleusLayer);
        world.addChild(golgiERContainer);
        golgiERContainer.addChild(rotatingContainer);
        world.addChild(organellesLayer);
        world.addChild(necroticClusterLayer);
        world.addChild(massLayer);
        world.addChild(particleLayer);
        world.addChild(trailLayer);
        world.addChild(dynamicLayer);
        world.addChild(atpLayer);
        world.addChild(virusLayer);
        world.addChild(necroticDebrisLayer);
        world.addChild(chaserLayer);
        world.addChild(uiBarsLayer);

        // Detach and fully release every child of a container (T05).
        // texture:false is deliberate -- nothing here owns a texture except the
        // split-screen RenderTextures, which are handled separately in startRound().
        function purgeContainer(container) {
            for (let i = container.children.length - 1; i >= 0; i--) {
                let child = container.children[i];
                container.removeChild(child);
                if (child && !child.destroyed) {
                    child.destroy({ children: true, texture: false, baseTexture: false });
                }
            }
        }

        // T25: traces are append-only, so the bulk of each trace (everything
        // drawn on a previous frame) is accumulated once into a persistent
        // RenderTexture instead of being re-emitted as `lineTo` calls every
        // frame. `trailGlow`/`trailCore` remain live per-frame Graphics, but
        // now hold only the moving bits that are NOT append-only: the head
        // circle/mouth, the target-mode aura and the ghost-mode pulse.
        // `traceScratchGlow`/`traceScratchCore` are the write side: cleared
        // and refilled each frame with just the new segment geometry (or,
        // on a forced full redraw, everything), then rendered into the RTs
        // and never themselves added to the display tree.
        const trailGlow = new PIXI.Graphics();
        const blurFilter = new PIXI.BlurFilter();
        blurFilter.blur = 4;
        trailGlow.filters = [blurFilter];
        trailGlow.blendMode = PIXI.BLEND_MODES.ADD;
        const trailCore = new PIXI.Graphics();
        trailCore.blendMode = PIXI.BLEND_MODES.ADD;

        const traceScratchGlow = new PIXI.Graphics();
        traceScratchGlow.filters = [blurFilter]; // same filter instance as trailGlow -- see applyQuality (T26)
        const traceScratchCore = new PIXI.Graphics();

        // Render at half world resolution: trace strokes are thin glowing
        // lines, so the softness is invisible next to the memory saved (see
        // T25 task file "The size problem"). Bumped to `1 / TRACE_RT_SCALE` on
        // the sprites below so world-space size is unaffected.
        // T26: mutable so applyQuality() can retune it per tier (0.4/0.5/0.75);
        // rebuildTraceRT() re-reads it whenever called, so no other change needed.
        let TRACE_RT_SCALE = 0.5;
        // World px of padding beyond activeCell's ellipse the buffer must
        // cover -- glow blur bleed, the aura/pulse circles drawn past the
        // trace line itself.
        const TRACE_RT_PADDING = 150;
        let trailGlowRT = null, trailCoreRT = null;
        const trailGlowSprite = new PIXI.Sprite(PIXI.Texture.EMPTY);
        trailGlowSprite.blendMode = PIXI.BLEND_MODES.ADD;
        const trailCoreSprite = new PIXI.Sprite(PIXI.Texture.EMPTY);
        trailCoreSprite.blendMode = PIXI.BLEND_MODES.ADD;
        // World-space top-left the RTs currently cover, and the matrix that
        // maps a world point into RT-pixel space (reused every frame -- no
        // per-frame allocation).
        let traceRTOriginX = 0, traceRTOriginY = 0;
        let traceRTNeedsFullRedraw = true; // forces (re)allocation on the first drawTraces()
        const traceRTTransform = new PIXI.Matrix();

        trailLayer.addChild(trailGlowSprite);
        trailLayer.addChild(trailCoreSprite);
        trailLayer.addChild(trailGlow);
        trailLayer.addChild(trailCore);

        // --- GLOBAL BLOOM FILTER + GLOW QUALITY TIERS ---
        // High is the original tuning. Low is the default: the bloom threshold is
        // raised so fewer pixels bloom at all, and both the bloom and the trail
        // halo are cheaper (lower `quality` and `blur` are the two settings that
        // actually cost frame time). Medium sits midway on every value.
        // T44: splitMultisample/splitRenderScale govern the split-screen viewport
        // RenderTextures (see updateCamera()'s split branch) -- MSAA fixes the
        // "lower resolution" look (RenderTexture does not inherit the app's
        // antialias), renderScale is the fill-rate lever (render below on-screen
        // size, let the sprite upscale). High keeps renderScale at 1.0 so split
        // stays pixel-comparable to shared mode; low skips MSAA entirely since a
        // weak device needs the fill-rate saving more than the smoothing.
        // T56: protoLanes is the number of longitudinal protofilament lines the
        // lattice band draws (2-4, see stampDimer); assemblyInterval is the
        // frame gap between a player's incoming-dimer spawns (larger = fewer).
        // At ASSEMBLY_LIFE=0.35s (21 frames @60fps) these keep the worst-case
        // concurrent count per player at interval=3 (high) around 7, under
        // ASSEMBLY_DIMERS_MAX=8; assemblyLiveCount enforces the cap directly
        // regardless, this is just why "low" spawns noticeably less often.
        const QUALITY_TIERS = {
            low:    { threshold: 0.6,  bloomScale: 0.6, brightness: 1.0, blur: 4, quality: 2, trailBlur: 2,
                      bloomEnabled: false, trailBlurEnabled: false, traceScale: 0.4,  particleBudget: 0,   warningLevel: 0, cytosolCount: 300, cytosolFillerCount: 0,
                      splitMultisample: PIXI.MSAA_QUALITY.NONE,   splitRenderScale: 0.6, protoLanes: 2, assemblyInterval: 8, membraneGlowSteps: 0 },
            medium: { threshold: 0.45, bloomScale: 1.0, brightness: 1.1, blur: 6, quality: 3, trailBlur: 3,
                      bloomEnabled: true,  trailBlurEnabled: true,  traceScale: 0.5,  particleBudget: 150, warningLevel: 1, cytosolCount: 800, cytosolFillerCount: 400,
                      splitMultisample: PIXI.MSAA_QUALITY.MEDIUM, splitRenderScale: 0.8, protoLanes: 3, assemblyInterval: 4, membraneGlowSteps: 2 },
            high:   { threshold: 0.3,  bloomScale: 1.5, brightness: 1.2, blur: 8, quality: 4, trailBlur: 4,
                      bloomEnabled: true,  trailBlurEnabled: true,  traceScale: 0.75, particleBudget: 400, warningLevel: 2, cytosolCount: 800, cytosolFillerCount: 600,
                      splitMultisample: PIXI.MSAA_QUALITY.HIGH,   splitRenderScale: 1.0, protoLanes: 4, assemblyInterval: 3, membraneGlowSteps: 3 }
        };
        let quality = 'low';      // current tier name; set for real by applyQuality() near the end of the T18 section
        let bloomFilter = null;   // module-scope so applyQuality can retune it
        // T44: split-screen viewport state. Declared here (not alongside
        // purgeSplitScreen()/updateCamera() below) because applyQuality() -- which
        // reads/writes them and calls purgeSplitScreen() -- runs its first pass
        // before those functions' original declaration point; a `let` that far
        // down would still be in its TDZ at that first call.

        })();

            [warningColorMatrix],

        let warningFilterActive = false; // whether shakeRoot.filters currently holds a WARNING_FILTER_STACKS entry

            if (warningNow && !warningFilterActive) {

            }
            let target = warningNow ? 1 : 0;

        // Sampler state, reset per round in startRound(). Judges only the first

        // round -- wide hysteresis so auto-quality never oscillates.
        const QUALITY_SAMPLE_WINDOW = 3.0; // seconds

        let cytosolContainer;
        let cellBgSprite; // T49: persistent membrane-fill Graphics, redrawn as radii shrink
        let lastMembraneRadiusX = null, lastMembraneRadiusY = null; // T49: early-out cache for the re-anchor below

        const DIMER_SPACING = 6;     // world px between alpha/beta colour flips, keyed off each point's stored .d so the pattern is stable regardless of how many points a frame appends

        const DEBRIS_SPEED = 0.6;          // px/tick outward drift

        const CHASER_SPEED = 1.0;              // px/tick -- below every player speed setting (1.5/2.5/3.5), see Findings
        const CHASER_TURN_RATE = 0.03;         // rad/tick turn-rate cap -- keeps it steerable-around, not instant-homing

        const MAX_PARTICLES = 400;

        let particlePool = [];
        for (let i = 0; i < MAX_PARTICLES; i++) {

        let particleBudget = MAX_PARTICLES;

        let latticeLaneCount = 3;
        let assemblyDimerInterval = 4;

        // emitParticles() when a slot tagged with assemblyOwner is actually

        let assemblyLiveCount = [0, 0, 0, 0];

        // above) because applyQuality() writes particleBudget, just declared above.
        applyQuality(detectInitialQuality());

        // incremented for each particle actually allocated below -- never for a

        function emitParticles(x, y, count, opts) {
            let speed = opts.speed || 0;
            let spread = opts.spread !== undefined ? opts.spread : Math.PI * 2;
            let angle = opts.angle || 0;
            let life = opts.life || 0.5;
            let size = opts.size || 3;
            let color = opts.color !== undefined ? opts.color : 0xffffff;
            let assemblyOwner = opts.assemblyOwner !== undefined ? opts.assemblyOwner : -1;

            let cap = Math.min(MAX_PARTICLES, particleBudget);
            for (let i = 0; i < count; i++) {
                if (particleCount >= cap) return;
                let p = particlePool[particleCount++];
                let a = angle + (Math.random() - 0.5) * spread;
                let s = speed * (0.5 + Math.random() * 0.5);

                p.vx = Math.cos(a) * s;
                p.vy = Math.sin(a) * s;

                p.maxLife = life;
                p.size = size;

                p.assemblyOwner = assemblyOwner;

            }
        }

        function updateParticles(delta, deltaSec) {
            for (let i = particleCount - 1; i >= 0; i--) {
                let p = particlePool[i];
                p.x += p.vx * delta;
                p.y += p.vy * delta;

        let isPlaying = false;

        let paused = false;

        function drawArcs() {
            rotatingContainer.removeChildren();

            const structGraph = new PIXI.Graphics();

            // Generate Rough Endoplasmic Reticulum (RER)
            const ER_COLOR = 0x0abde3;
            const RIBO_COLOR = 0xff4757;

            let erActive = activeArcs.some(a => a.type === 'ER');
            if (erActive) {
                if (!window.erData) window.erData = [];
                for (let erGroup = 0; erGroup < 4; erGroup++) {
                    let erPath, thick;

                    if (!window.erData[erGroup]) {
                        let currentAngle = (erGroup * Math.PI * 2 / 4) + (Math.random() * 0.4);
                        let currentR = 150 + Math.random() * 10;
                        thick = 14 + Math.random() * 6;

                        erPath = [];
                        let numLayers = 3 + Math.floor(Math.random() * 2);

                        for (let i = 0; i < numLayers; i++) {
                            let span = 0.8 + Math.random() * 0.6;
                            let dir = (i % 2 === 0) ? 1 : -1;
                            let endAngle = currentAngle + dir * span;

                            let steps = Math.floor(span / 0.05);
                            for (let j = 0; j <= steps; j++) {
                                let a = currentAngle + dir * (j / steps) * span;
                                erPath.push({ x: Math.cos(a) * currentR, y: Math.sin(a) * currentR, r: currentR, a: a });
                            }

                            currentAngle = endAngle;

                            if (i < numLayers - 1) {
                                let nextR = currentR + 25 + Math.random() * 10;
                                let midR = (currentR + nextR) / 2;
                                let cpAngle = currentAngle + dir * 0.2;

                                let startX = Math.cos(currentAngle) * currentR;
                                let startY = Math.sin(currentAngle) * currentR;
                                let cpX = Math.cos(cpAngle) * midR;
                                let cpY = Math.sin(cpAngle) * midR;
                                let endX = Math.cos(currentAngle) * nextR;
                                let endY = Math.sin(currentAngle) * nextR;

                                for (let t = 0.2; t <= 1.0; t += 0.2) {
                                    let bx = Math.pow(1 - t, 2) * startX + 2 * (1 - t) * t * cpX + Math.pow(t, 2) * endX;
                                    let by = Math.pow(1 - t, 2) * startY + 2 * (1 - t) * t * cpY + Math.pow(t, 2) * endY;
                                    erPath.push({ x: bx, y: by, r: midR, a: cpAngle });
                                }

                                currentR = nextR;
                            }
                        }

                        window.erData[erGroup] = { erPath: erPath, thick: thick };
                    } else {
                        erPath = window.erData[erGroup].erPath;
                        thick = window.erData[erGroup].thick;
                    }

                    structGraph.lineStyle({ width: thick, color: ER_COLOR, alpha: 0.7, cap: PIXI.LINE_CAP.ROUND, join: PIXI.LINE_JOIN.ROUND });
                    structGraph.moveTo(erPath[0].x, erPath[0].y);
                    for (let k = 1; k < erPath.length; k++) {
                        structGraph.lineTo(erPath[k].x, erPath[k].y);
                    }

                    centralHitboxes.push({ type: 'path', points: erPath.map(p => ({ x: p.x, y: p.y })), thick: thick });

                    // Draw Ribosomes
                    structGraph.lineStyle(0);
                    structGraph.beginFill(RIBO_COLOR, 0.9);
                    for (let pt of erPath) {
                        let rOuter = pt.r + thick / 2 + 2;
                        let rInner = pt.r - thick / 2 - 2;
                        if (Math.random() > 0.4) structGraph.drawCircle(Math.cos(pt.a) * rOuter, Math.sin(pt.a) * rOuter, 2 + Math.random() * 1.5);
                        if (Math.random() > 0.4) structGraph.drawCircle(Math.cos(pt.a) * rInner, Math.sin(pt.a) * rInner, 2 + Math.random() * 1.5);
                    }
                    structGraph.endFill();

            const VESICLE_COLOR = 0x00d2d3;

                if (!window.golgiData) {
                    let gAngle = Math.random() * Math.PI * 2;
                    let gDist = 330 + Math.random() * 10;
                    let gX = Math.cos(gAngle) * gDist;
                    let gY = Math.sin(gAngle) * gDist;
                    let gRot = gAngle + Math.PI / 2;
                    window.golgiData = { x: gX, y: gY, angle: gAngle, rot: gRot, layers: [] };
                } else {

                let gX = window.golgiData.x;
                let gY = window.golgiData.y;
                let gRot = window.golgiData.rot;

                let golgiCont = new PIXI.Container();
                golgiCont.x = gX;
                golgiCont.y = gY;
                golgiCont.rotation = gRot;
                let golgiGraph = new PIXI.Graphics();
                golgiGraph.blendMode = PIXI.BLEND_MODES.ADD;

                for (let layer = 0; layer < 4; layer++) {
                    let layerRadius = 230 + Math.min(2, layer) * 50; // maps layer 0,1,2,3 to 230, 280, 330, 330
                    if (!activeArcs.some(a => a.type === 'Golgi' && a.r === layerRadius)) continue;

                    let yOffset = (layer - 1.5) * 45; // 45px gaps

                    golgiGraph.lineStyle({ width: thick, color: GOLGI_COLOR, alpha: 0.85, cap: PIXI.LINE_CAP.ROUND });

                    let sacPoints = [];

                        let ly = Math.pow(1 - t, 2) * yOffset + 2 * (1 - t) * t * (yOffset + 20) + Math.pow(t, 2) * yOffset;
                        sacPoints.push({ lx: lx, ly: ly });

                    // Re-calculate global points for centralHitboxes

                        let rx = pt.lx * Math.cos(gRot) - pt.ly * Math.sin(gRot) + gX;

        function createOrganelleGraphics(orgObj, necrotic = false) {
            let sprite = new PIXI.Graphics();
            let isMito = (orgObj.type === 'mitochondria');
            let radius = orgObj.radius;
            let sizeMult = isMito ? radius / 35 : radius / 25;

            // T13: stone-grey palette for necrotic organelles. A multiplicative
            // tint on the normal palette washes out to a dim version of the
            // original hue instead of grey, so the necrotic rebuild uses these
            // colors directly rather than tinting the live sprite.
            const mitoOuter = necrotic ? 0x707070 : C_MITO;
            const mitoCore = necrotic ? 0x9a9a9a : 0x55efc4;
            const lysoRing = necrotic ? 0x707070 : 0xff4757;
            const lysoBubble = necrotic ? 0x9a9a9a : 0xff6b81;
            const lysoHighlight = necrotic ? 0xc0c0c0 : 0xffffff;
            // T21: near-black (0x0d0d1a) vanishes under GLOW_BLEND=ADD, so the
            // lysosome body fill uses a dim version of lysoRing instead -- keeps
            // a visible body rather than becoming a hollow ring.
            const lysoDarkBody = necrotic ? 0x161616 : 0x330e11;

            if (isMito) {
                let w = radius * 0.9; 
                let L = radius * 1.6;
                let bendY = orgObj.bendY !== undefined ? orgObj.bendY : (Math.random() - 0.5) * L * 0.5;
                orgObj.bendY = bendY;

                const drawPill = (thick, color, alpha) => {
                    if (thick <= 0) return;
                    sprite.lineStyle({width: thick, color: color, alpha: alpha, cap: PIXI.LINE_CAP.ROUND, join: PIXI.LINE_JOIN.ROUND});
                    sprite.moveTo(-L/2, 0);
                    sprite.quadraticCurveTo(0, bendY, L/2, 0);
                };

                // T21: the two 0x0d0d1a separator strokes that used to carve a dark
                // groove between the outer ring and the core are dropped -- under
                // GLOW_BLEND=ADD, src*alpha adds to dst, so near-black at any alpha
                // contributes nothing and the groove silently vanished, leaving the
                // three colour strokes below to stack additively into a whiteout.
                // The remaining alphas are lowered so the pill still reads as a
                // graded green-to-mint glow instead of blowing out to solid white.
                drawPill(w + 10, mitoOuter, 0.15);
                drawPill(w, mitoOuter, 0.32);
                drawPill(w - 10, mitoCore, 0.55);

                sprite.lineStyle({width: 2 + sizeMult, color: mitoCore, alpha: 0.9, cap: PIXI.LINE_CAP.ROUND});
                let numCristae = 4 + Math.floor(L / 15); 
                for (let j = 1; j <= numCristae; j++) {
                    let t = j / (numCristae + 1);
                    t += (Math.random() - 0.5) * (0.6 / numCristae); 
                    
                    let p0x = -L/2, p0y = 0;
                    let p1x = 0, p1y = bendY;
                    let p2x = L/2, p2y = 0;
                    
                    let bx = Math.pow(1-t, 2)*p0x + 2*(1-t)*t*p1x + Math.pow(t, 2)*p2x;
                    let by = Math.pow(1-t, 2)*p0y + 2*(1-t)*t*p1y + Math.pow(t, 2)*p2y;
                    
                    let tx = 2*(1-t)*(p1x - p0x) + 2*t*(p2x - p1x);
                    let ty = 2*(1-t)*(p1y - p0y) + 2*t*(p2y - p1y);
                    let len = Math.hypot(tx, ty);
                    let nx = -ty / len; 
                    let ny = tx / len;
                    
                    let side = Math.random() > 0.5 ? 1 : -1;
                    let startDist = (w - 12) / 2; 
                    if (startDist <= 0) continue;
                    let endDist = (Math.random() > 0.3) ? -startDist * (0.1 + Math.random()*0.3) : startDist * (0.2 + Math.random()*0.3);
                    
                    let startX = bx + nx * startDist * side;
                    let startY = by + ny * startDist * side;
                    let endX = bx + nx * endDist * side;
                    let endY = by + ny * endDist * side;
                    
                    let midX = (startX + endX) / 2;
                    let midY = (startY + endY) / 2;
                    let curveOffset = (Math.random() - 0.5) * 8 * sizeMult;
                    midX += (tx/len) * curveOffset;
                    midY += (ty/len) * curveOffset;
                    
                    sprite.moveTo(startX, startY);
                    sprite.quadraticCurveTo(midX, midY, endX, endY);
                }
            } else {
                let w = radius;
                sprite.beginFill(lysoDarkBody, 0.6);
                sprite.lineStyle(3 * sizeMult, lysoRing, 0.6);
                sprite.drawCircle(0, 0, w);
                sprite.endFill();
                
                let numBubbles = Math.floor((8 + Math.random() * 6) * sizeMult);
                for(let j=0; j<numBubbles; j++) {
                    let br = Math.random() * (w - 6 * sizeMult);
                    let ba = Math.random() * Math.PI * 2;
                    let bubR = (3 + Math.random() * 5) * sizeMult;
                    sprite.beginFill(lysoBubble, 0.8);
                    sprite.lineStyle(1 * sizeMult, lysoRing, 1);
                    sprite.drawCircle(Math.cos(ba) * br, Math.sin(ba) * br, bubR);
                    sprite.endFill();
                    
                    sprite.beginFill(lysoHighlight, 0.9);
                    sprite.lineStyle(0);
                    sprite.drawCircle(Math.cos(ba) * br, Math.sin(ba) * br, bubR * 0.4);
                    sprite.endFill();
                }
            }

            sprite.x = orgObj.x;
            sprite.y = orgObj.y;
            sprite.rotation = orgObj.rotation;
            sprite.blendMode = GLOW_BLEND; // T21: per-sprite -- blendMode does not inherit from organellesLayer
            return sprite;
        }

        // T62 §1: small, dense filler blobs between the existing sparse large
        // cytosol blobs, so the gaps aren't flat near-black at playing zoom
        // (0.5-0.6). Pushed into the same cytosolParticles array/update loop as
        // the large blobs below -- no new per-frame code needed. quality='low'
        // gets cytosolFillerCount=0, so the low tier drops this detail entirely.
        function spawnCytosolFiller(cx, cy, rx, ry, count) {
            for (let i = 0; i < count; i++) {
                let px = cx + (Math.random() * 2 - 1) * rx;
                let py = cy + (Math.random() * 2 - 1) * ry;
                if ((Math.pow(px - cx, 2) / Math.pow(rx, 2)) + (Math.pow(py - cy, 2) / Math.pow(ry, 2)) > 1) continue;

                let blob = new PIXI.Graphics();
                let radius = 3 + Math.random() * 9;
                let color = Math.random() > 0.75 ? 0x4a69bd : 0x1e3799;
                let alpha = 0.06 + Math.random() * 0.1;

                blob.beginFill(color, alpha);
                blob.drawCircle(0, 0, radius);
                blob.endFill();
                blob.x = px;
                blob.y = py;
                blob.vx = (Math.random() - 0.5) * 0.6;
                blob.vy = (Math.random() - 0.5) * 0.6;
                blob.phase = Math.random() * Math.PI * 2;
                blob.baseAlpha = alpha;
                cytosolContainer.addChild(blob);
                cytosolParticles.push(blob);
            }
        }

        function generateMap(keepOrganelles = false) {
            purgeContainer(backgroundLayer);
            nucleusLayer.clear();
            nucleusLayer.visible = true;
            golgiERContainer.visible = true;
            purgeContainer(rotatingContainer);
            window.golgiData = null; // Reset Golgi layout parameters for a fresh round!
            window.erData = null; // Reset ER layout parameters for a fresh round!

            cellBgSprite = new PIXI.Graphics();

            // 1. Fill base dark color
            cellBgSprite.beginFill(0x0d0d1a);
            cellBgSprite.drawEllipse(activeCell.x, activeCell.y, activeCell.radiusX, activeCell.radiusY);
            cellBgSprite.endFill();

            // T37: the membrane ring itself is owned entirely by calcifyLayer
            // (drawn every frame in gameLoop, at every generation) so there is
            // never a second, stale ring baked in here alongside it.

            backgroundLayer.addChild(cellBgSprite);

            // T49: cellBgSprite and the protrusions below are baked from the radii
            // in force right now -- reset the re-anchor cache so gameLoop treats
            // this as already in sync and does not immediately redo the same work.
            lastMembraneRadiusX = activeCell.radiusX;
            lastMembraneRadiusY = activeCell.radiusY;

            // Membrane Protrusions (Drawn on top of membrane to look fused)
            const membraneProtrusionsContainer = new PIXI.Container();
            backgroundLayer.addChild(membraneProtrusionsContainer);
            membraneProtrusionsList = [];

            let validProtrusions = [];
            let maxAttempts = 300;
            let placed = 0;

            for (let i = 0; i < maxAttempts && placed < 28; i++) {
                let maxR = 25 + Math.random() * 40;

                // Calculate required angular space to prevent overlap
                // Fillet is 0.6 * R, padding is 5. Total half-width = R * 1.6 + 5
                let halfWidth = maxR * 1.6 + 5;
                // Conservative angular width using the minor axis (1200)
                let requiredAngularSpace = halfWidth / 1200.0;

                let t = Math.random() * Math.PI * 2;
                let isValid = true;

                for (let existing of validProtrusions) {
                    let diff = Math.abs(t - existing.t);
                    if (diff > Math.PI) diff = Math.PI * 2 - diff;

                    // Ensure distance is greater than their combined radii + 5% padding
                    if (diff < (requiredAngularSpace + existing.requiredAngularSpace) * 1.05) {
                        isValid = false;
                        break;
                    }
                }

                if (!isValid) continue;

                validProtrusions.push({ t: t, requiredAngularSpace: requiredAngularSpace });
                placed++;

                let p = new PIXI.Graphics();
                p.redraw = function (currentR) {
                    this.clear();
                    if (currentR < 1) return;

                    let rc = this.rc;
                    let fillet = currentR * 0.6;
                    let eraseY = currentR + fillet + 5;

                    // 1. Dark patch to erase cellBg line
                    this.beginFill(0x0d0d1a);
                    this.lineStyle(0);
                    this.drawRect(-20, -eraseY, 40, eraseY * 2);
                    this.endFill();

                    // Helper to compute local X on the curved ellipse using osculating parabola
                    const getX = (baseX, y) => baseX - (y * y) / (2 * rc);

                    // 2. Outer Layer
                    this.lineStyle({ width: 15, color: 0x1e3799, alpha: 0.4, join: PIXI.LINE_JOIN.ROUND });
                    this.moveTo(getX(8, -eraseY), -eraseY);
                    let outStart = -(currentR + fillet);
                    this.lineTo(getX(8, outStart), outStart);
                    this.quadraticCurveTo(getX(8, -currentR), -currentR, 8 + fillet, -currentR);
                    this.arc(8 + fillet, 0, currentR, -Math.PI / 2, Math.PI / 2);
                    this.quadraticCurveTo(getX(8, currentR), currentR, getX(8, -outStart), -outStart);
                    this.lineTo(getX(8, eraseY), eraseY);

                    // 3. Middle Layer
                    let midR = Math.max(0, currentR - 8);
                    let midFillet = midR * 0.6;
                    this.lineStyle({ width: 8, color: 0x4a69bd, alpha: 0.8, join: PIXI.LINE_JOIN.ROUND });
                    this.moveTo(getX(0, -eraseY), -eraseY);
                    if (midR > 0) {
                        let midStart = -(midR + midFillet);
                        this.lineTo(getX(0, midStart), midStart);
                        this.quadraticCurveTo(getX(0, -midR), -midR, 0 + midFillet, -midR);
                        this.arc(0 + midFillet, 0, midR, -Math.PI / 2, Math.PI / 2);
                        this.quadraticCurveTo(getX(0, midR), midR, getX(0, -midStart), -midStart);
                    } else {
                        this.lineTo(getX(0, 0), 0);
                    }
                    this.lineTo(getX(0, eraseY), eraseY);

                    // 4. Inner Layer
                    let inR = Math.max(0, currentR - 11);
                    let inFillet = inR * 0.6;
                    this.lineStyle({ width: 3, color: 0x82ccdd, alpha: 1.0, join: PIXI.LINE_JOIN.ROUND });
                    this.moveTo(getX(-3, -eraseY), -eraseY);
                    if (inR > 0) {
                        let inStart = -(inR + inFillet);
                        this.lineTo(getX(-3, inStart), inStart);
                        this.quadraticCurveTo(getX(-3, -inR), -inR, -3 + inFillet, -inR);
                        this.arc(-3 + inFillet, 0, inR, -Math.PI / 2, Math.PI / 2);
                        this.quadraticCurveTo(getX(-3, inR), inR, getX(-3, -inStart), -inStart);
                    } else {
                        this.lineTo(getX(-3, 0), 0);
                    }
                    this.lineTo(getX(-3, eraseY), eraseY);
                };

                let a = activeCell.radiusX;
                let b = activeCell.radiusY;
                p.angleRad = t;
                p.maxRadius = maxR;
