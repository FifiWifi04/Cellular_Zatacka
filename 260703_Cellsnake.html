                p.phase = Math.random() * Math.PI * 2;
                p.speed = 0.5 + Math.random() * 1.5;

                // Normal angle for ellipse points perfectly outward
                p.normAngle = Math.atan2(a * Math.sin(t), b * Math.cos(t));
                p.rotation = p.normAngle;

                // Radius of curvature
                let a2_sin2 = Math.pow(a * Math.sin(t), 2);
                let b2_cos2 = Math.pow(b * Math.cos(t), 2);
                p.rc = Math.pow(a2_sin2 + b2_cos2, 1.5) / (a * b);

                p.x = activeCell.x + a * Math.cos(t);
                p.y = activeCell.y + b * Math.sin(t);

                p.redraw(0); // Initial transparent state

                membraneProtrusionsContainer.addChild(p);
                membraneProtrusionsList.push(p);
            }

            // 3. Cytosol Fluid (Drifting organic blobs)
            cytosolContainer = new PIXI.Container();
            backgroundLayer.addChild(cytosolContainer);

            cytosolParticles = [];
            // T26: attempt count scales with quality tier (LOW: reduced, MEDIUM/HIGH: full).
            for (let i = 0; i < QUALITY_TIERS[quality].cytosolCount; i++) {
                let px = activeCell.x + (Math.random() * 2 - 1) * activeCell.radiusX;
                let py = activeCell.y + (Math.random() * 2 - 1) * activeCell.radiusY;

                // Only spawn them roughly inside the cell
                if ((Math.pow(px - activeCell.x, 2) / Math.pow(activeCell.radiusX, 2)) + (Math.pow(py - activeCell.y, 2) / Math.pow(activeCell.radiusY, 2)) <= 1) {
                    let blob = new PIXI.Graphics();
                    let radius = 10 + Math.random() * 50;

                    let colorRoll = Math.random();
                    let color = 0x1e3799; // Base blue
                    let alpha = 0.1 + Math.random() * 0.2;

                    if (colorRoll > 0.95) {
                        color = 0x82ccdd; // Bright Cyan
                        alpha = 0.4 + Math.random() * 0.3; // Much brighter
                        radius = 5 + Math.random() * 20; // Brighter ones are smaller
                    } else if (colorRoll > 0.7) {
                        color = 0x6c5ce7; // Purple
                        alpha = 0.2 + Math.random() * 0.2;
                    } else if (colorRoll > 0.5) {
                        color = 0x4a69bd; // Medium blue
                    }

                    blob.beginFill(color, alpha);
                    blob.drawCircle(0, 0, radius);
                    blob.endFill();
                    blob.x = px;
                    blob.y = py;
                    blob.vx = (Math.random() - 0.5) * 0.6;
                    blob.vy = (Math.random() - 0.5) * 0.6;
                    blob.phase = Math.random() * Math.PI * 2;
                    blob.baseAlpha = alpha;
                    cytosolContainer.addChild(blob);
                    cytosolParticles.push(blob);
                }
            }
            spawnCytosolFiller(activeCell.x, activeCell.y, activeCell.radiusX, activeCell.radiusY, QUALITY_TIERS[quality].cytosolFillerCount);

            // Mask correctly reapplied so particles don't bleed out freely
            window.bgMask = new PIXI.Graphics();
            window.bgMask.beginFill(0xffffff);
            window.bgMask.drawEllipse(activeCell.x, activeCell.y, activeCell.radiusX, activeCell.radiusY);
            window.bgMask.endFill();

            backgroundLayer.addChild(window.bgMask);
            cytosolContainer.mask = window.bgMask;

            // Nucleus Redesign
            // Outer envelope
            nucleusLayer.beginFill(0x130f26, 0.95);
            nucleusLayer.lineStyle(5, 0x6c5ce7, 0.8);
            nucleusLayer.drawCircle(activeCell.x, activeCell.y, 130);
            nucleusLayer.endFill();

            // Nucleolus (Dense, off-center inner core)
            let nucAngle = Math.random() * Math.PI * 2;
            let nucDist = 30 + Math.random() * 30;
            let nucX = activeCell.x + Math.cos(nucAngle) * nucDist;
            let nucY = activeCell.y + Math.sin(nucAngle) * nucDist;
            nucleusLayer.beginFill(0x4834d4, 0.9);
            nucleusLayer.lineStyle(3, 0x686de0, 0.8);
            nucleusLayer.drawCircle(nucX, nucY, 35);
            nucleusLayer.endFill();

            // Chromatin (Procedural squiggly lines)
            nucleusLayer.lineStyle(2, 0xa29bfe, 0.5);
            for (let i = 0; i < 20; i++) {
                let startX = activeCell.x + (Math.random() - 0.5) * 180;
                let startY = activeCell.y + (Math.random() - 0.5) * 180;
                if (Math.hypot(startX - activeCell.x, startY - activeCell.y) > 115) continue;
                if (Math.hypot(startX - nucX, startY - nucY) < 40) continue; // avoid nucleolus

                nucleusLayer.moveTo(startX, startY);
                let currentX = startX;
                let currentY = startY;
                for (let j = 0; j < 6; j++) {
                    let angle = Math.random() * Math.PI * 2;
                    let len = 10 + Math.random() * 20;
                    let nextX = currentX + Math.cos(angle) * len;
                    let nextY = currentY + Math.sin(angle) * len;
                    if (Math.hypot(nextX - activeCell.x, nextY - activeCell.y) > 115) break;
                    let cpX = currentX + Math.cos(angle + 0.5) * len * 0.5;
                    let cpY = currentY + Math.sin(angle + 0.5) * len * 0.5;
                    nucleusLayer.quadraticCurveTo(cpX, cpY, nextX, nextY);
                    currentX = nextX;
                    currentY = nextY;
                }
            }

            // Nuclear Pores
            nucleusLayer.lineStyle(3, 0xa29bfe, 0.8);
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 6 + Math.random() * 0.1) {
                nucleusLayer.beginFill(0x0d0d1a);
                nucleusLayer.drawCircle(activeCell.x + Math.cos(a) * 130, activeCell.y + Math.sin(a) * 130, 6);
                nucleusLayer.endFill();
            }

            rotatingContainer.position.set(activeCell.x, activeCell.y);

            activeArcs = JSON.parse(JSON.stringify(ARCS));
            drawArcs(activeArcs);

            // Rebuild/reset the nucleus mask
            if (window.nucleusMask) {
                world.removeChild(window.nucleusMask);
                window.nucleusMask.destroy();
            }
            window.nucleusMask = null;
            nucleusLayer.mask = null;
            golgiERContainer.mask = null;

            if (!keepOrganelles) {
                purgeContainer(organellesLayer); // Clean up old sprites
                organellesLayer.clear();

                organelles = [];
                let attempts = 0;
                let p1Spawn = { x: activeCell.x - 600, y: activeCell.y };
                let p2Spawn = { x: activeCell.x + 600, y: activeCell.y };

                while (organelles.length < 25 && attempts < 1000) {
                    attempts++;
                    let x = activeCell.x + (Math.random() * 2 - 1) * activeCell.radiusX * 0.85;
                    let y = activeCell.y + (Math.random() * 2 - 1) * activeCell.radiusY * 0.85;

                    let distToCenter = Math.hypot(x - activeCell.x, y - activeCell.y);
                    if (distToCenter < 400) continue;
                    if (isOutsideCell(x, y, 50)) continue;

                    if (Math.hypot(x - p1Spawn.x, y - p1Spawn.y) < 200) continue;
                    if (Math.hypot(x - p2Spawn.x, y - p2Spawn.y) < 200) continue;

                    let isMito = Math.random() > 0.4;
                    let sizeMult = isMito
                        ? [1, 2, 3][Math.floor(Math.random() * 3)]
                        : [0.5, 1.0, 1.5, 2.0][Math.floor(Math.random() * 4)];
                    let radius = (isMito ? 35 : 25) * sizeMult;

                    let overlap = false;
                    for (let o of organelles) {
                        if (Math.hypot(x - o.x, y - o.y) < o.radius + radius + 40) overlap = true;
                    }
                    if (overlap) continue;

                    let orgObj = {
                        type: isMito ? 'mitochondria' : 'lysosome',
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        radius: radius,
                        color: isMito ? C_MITO : C_LYSO,
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.015,
                        necrotic: false // T13
                    };
                    let sprite = createOrganelleGraphics(orgObj);
                    orgObj.sprite = sprite;
                    organellesLayer.addChild(sprite);
                    organelles.push(orgObj);
                }
            }
        }

        // --- 5. Collision Math ---
        // Upgraded to support elliptical boundaries and hitbox padding
        function isOutsideCell(x, y, padding = 0) {
            // 1. Check original Cell A
            let dxA = x - activeCell.x;
            let dyA = y - activeCell.y;
            let rxA = activeCell.radiusX - padding;
            let ryA = activeCell.radiusY - padding;
            let inCellA = ((dxA * dxA) / (rxA * rxA)) + ((dyA * dyA) / (ryA * ryA)) < 1;
            if (inCellA) return false;

            if (mitosis.state !== 'idle') {
                // 2. Check new Cell B
                let dxB = x - mitosis.cellB.x;
                let dyB = y - mitosis.cellB.y;
                let rxB = activeCell.radiusX - padding;
                let ryB = activeCell.radiusY - padding;
                let inCellB = ((dxB * dxB) / (rxB * rxB)) + ((dyB * dyB) / (ryB * ryB)) < 1;
                if (inCellB) return false;

                // 3. Check the Bridge (Rectangle Collision)
                let isHorizontal = (mitosis.direction === 0 || mitosis.direction === 2);
                let halfW = mitosis.currentWidth / 2 - padding;

                if (isHorizontal) {
                    let minX = Math.min(activeCell.x, mitosis.cellB.x);
                    let maxX = Math.max(activeCell.x, mitosis.cellB.x);
                    if (x >= minX && x <= maxX && y >= activeCell.y - halfW && y <= activeCell.y + halfW) return false;
                } else {
                    let minY = Math.min(activeCell.y, mitosis.cellB.y);
                    let maxY = Math.max(activeCell.y, mitosis.cellB.y);
                    if (x >= activeCell.x - halfW && x <= activeCell.x + halfW && y >= minY && y <= maxY) return false;
                }
            }

            return true;
        }

        class SpatialGrid {
            constructor(cellSize = 128) {
                this.cellSize = cellSize;
                this.cells = new Map();
                this.stamp = 0;
            }

            clear() {
                this.cells.clear();
            }

            getCell(cx, cy) {
                return this.cells.get(cx + ',' + cy);
            }

            getKey(x, y) {
                let cx = Math.floor(x / this.cellSize);
                let cy = Math.floor(y / this.cellSize);
                return `${cx},${cy}`;
            }

            insertSegment(x1, y1, x2, y2, item) {
                let minX = Math.min(x1, x2);
                let maxX = Math.max(x1, x2);
                let minY = Math.min(y1, y2);
                let maxY = Math.max(y1, y2);

                let startCx = Math.floor(minX / this.cellSize);
                let endCx = Math.floor(maxX / this.cellSize);
                let startCy = Math.floor(minY / this.cellSize);
                let endCy = Math.floor(maxY / this.cellSize);

                for (let cx = startCx; cx <= endCx; cx++) {
                    for (let cy = startCy; cy <= endCy; cy++) {
                        let key = `${cx},${cy}`;
                        if (!this.cells.has(key)) this.cells.set(key, []);
                        this.cells.get(key).push(item);
                    }
                }
            }

            insertCircle(x, y, r, item) {
                let startCx = Math.floor((x - r) / this.cellSize);
                let endCx = Math.floor((x + r) / this.cellSize);
                let startCy = Math.floor((y - r) / this.cellSize);
                let endCy = Math.floor((y + r) / this.cellSize);

                for (let cx = startCx; cx <= endCx; cx++) {
                    for (let cy = startCy; cy <= endCy; cy++) {
                        let key = `${cx},${cy}`;
                        if (!this.cells.has(key)) this.cells.set(key, []);
                        this.cells.get(key).push(item);
                    }
                }
            }

            queryRange(x, y, range) {
                let startCx = Math.floor((x - range) / this.cellSize);
                let endCx = Math.floor((x + range) / this.cellSize);
                let startCy = Math.floor((y - range) / this.cellSize);
                let endCy = Math.floor((y + range) / this.cellSize);

                let results = [];
                let seen = new Set();
                for (let cx = startCx; cx <= endCx; cx++) {
                    for (let cy = startCy; cy <= endCy; cy++) {
                        let key = `${cx},${cy}`;
                        let items = this.cells.get(key);
                        if (items) {
                            for (let item of items) {
                                if (!seen.has(item)) {
                                    seen.add(item);
                                    results.push(item);
                                }
                            }
                        }
                    }
                }
                return results;
            }
        }

        const spatialGrid = new SpatialGrid(128);

        // --- shared swept-collision geometry ---
        function ptSegDistSq(px, py, x1, y1, x2, y2) {
            let l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
            if (l2 === 0) return (px - x1) * (px - x1) + (py - y1) * (py - y1);
            let t = Math.max(0, Math.min(1, ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2));
            let projX = x1 + t * (x2 - x1), projY = y1 + t * (y2 - y1);
            return (px - projX) * (px - projX) + (py - projY) * (py - projY);
        }
        function segsCross(ax, ay, bx, by, cx, cy, dx, dy) {
            let d1 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
            let d2 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
            let d3 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
            let d4 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
            return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
        }
        function segSegDistSq(ax, ay, bx, by, cx, cy, dx, dy) {
            if (segsCross(ax, ay, bx, by, cx, cy, dx, dy)) return 0;
            return Math.min(
                ptSegDistSq(ax, ay, cx, cy, dx, dy), ptSegDistSq(bx, by, cx, cy, dx, dy),
                ptSegDistSq(cx, cy, ax, ay, bx, by), ptSegDistSq(dx, dy, ax, ay, bx, by)
            );
        }
        // Smallest t in [0,1] at which segment (ax,ay)->(bx,by) comes within `r`
        // of segment (cx,cy)->(dx,dy), or -1 if it never does. Pass cx==dx,cy==dy
        // for a point target. Cheap-rejects on the full-segment distance; the
        // distance from a point moving along (ax,ay)->(bx,by) to the fixed
        // segment (cx,cy)->(dx,dy) is convex in t, so the closest approach can
        // fall strictly inside (0,1) with BOTH endpoints outside `r` (this is
        // the common case for a thick target like a mitochondrion spine cutting
        // across the middle of a grid cell) — ternary-search the minimum first,
        // then bisect from t=0 down to it for the entry parameter.
        function raySegT(ax, ay, bx, by, cx, cy, dx, dy, r) {
            let rSq = r * r;
            if (segSegDistSq(ax, ay, bx, by, cx, cy, dx, dy) >= rSq) return -1;
            if (ptSegDistSq(ax, ay, cx, cy, dx, dy) < rSq) return 0;
            let lo = 0, hi = 1;
            for (let iter = 0; iter < 16; iter++) {
                let m1 = lo + (hi - lo) / 3;
                let m2 = hi - (hi - lo) / 3;
                let d1 = ptSegDistSq(ax + (bx - ax) * m1, ay + (by - ay) * m1, cx, cy, dx, dy);
                let d2 = ptSegDistSq(ax + (bx - ax) * m2, ay + (by - ay) * m2, cx, cy, dx, dy);
                if (d1 < d2) hi = m2; else lo = m1;
            }
            let tMin = (lo + hi) / 2;
            let eLo = 0, eHi = tMin;
            for (let iter = 0; iter < 10; iter++) {
                let mid = (eLo + eHi) / 2;
                let mx = ax + (bx - ax) * mid;
                let my = ay + (by - ay) * mid;
                if (ptSegDistSq(mx, my, cx, cy, dx, dy) < rSq) eHi = mid;
                else eLo = mid;
            }
            return eHi;
        }

        // Smallest t in [0,1] where segment (ax,ay)->(bx,by) enters the AABB
        // {rx,ry,rw,rh} (rx,ry = top-left corner) expanded by `pad`, or -1 if
        // it never does. Standard slab test.
        function segAabbT(ax, ay, bx, by, rx, ry, rw, rh, pad) {
            let minX = rx - pad, maxX = rx + rw + pad;
            let minY = ry - pad, maxY = ry + rh + pad;
            let dx = bx - ax, dy = by - ay;
            let tMin = 0, tMax = 1;
            if (dx === 0) {
                if (ax < minX || ax > maxX) return -1;
            } else {
                let tx1 = (minX - ax) / dx, tx2 = (maxX - ax) / dx;
                if (tx1 > tx2) { let tmp = tx1; tx1 = tx2; tx2 = tmp; }
                if (tx1 > tMin) tMin = tx1;
                if (tx2 < tMax) tMax = tx2;
                if (tMin > tMax) return -1;
            }
            if (dy === 0) {
                if (ay < minY || ay > maxY) return -1;
            } else {
                let ty1 = (minY - ay) / dy, ty2 = (maxY - ay) / dy;
                if (ty1 > ty2) { let tmp = ty1; ty1 = ty2; ty2 = tmp; }
                if (ty1 > tMin) tMin = ty1;
                if (ty2 < tMax) tMax = ty2;
                if (tMin > tMax) return -1;
            }
            return tMin;
        }

        // Shared by checkCollision() and raycast() so physics and the bot's sensor
        // can never disagree about the self-immunity neck (T08). `item` is a
        // spatial-grid trace item (needs .playerId, .segId, .d); `owner` is the
        // caster whose trace it might be (needs .id, .traceSegments, .traceDist).
        //
        // T58: segId is a stable id stamped on the segment array at creation
        // (see newTraceSegment()), not its index in traceSegments. shift()/splice()
        // elsewhere (deleteOldestTrace, trimTraceToCap/removeFrontPoints) renumber
        // indices every time they fire; comparing ids instead means the currently-
        // growing segment is still recognised as "own neck" no matter how many
        // older segments got dropped from the front this frame.
        function isOwnNeck(item, owner) {
            return item.playerId === owner.id
                && item.segId === owner.traceSegments[owner.traceSegments.length - 1].id
                && (owner.traceDist - item.d) < NECK_LENGTH;
        }

        // T58: fresh trace segment with a stable, per-player-monotonic id.
        function newTraceSegment(player) {
            let seg = [];
            seg.id = player.nextSegId++;
            return seg;
        }

        function rebuildSpatialGrid() {
            spatialGrid.clear();

            // 1. Insert player traces
            players.forEach(p => {
                p.traceSegments.forEach(seg => {
                    for (let i = 0; i < seg.length - 1; i++) {
                        spatialGrid.insertSegment(seg[i].x, seg[i].y, seg[i + 1].x, seg[i + 1].y, {
                            type: 'trace',
                            x1: seg[i].x, y1: seg[i].y,
                            x2: seg[i + 1].x, y2: seg[i + 1].y,
                            playerId: p.id,
                            segId: seg.id,
                            d: seg[i].d,
                            _seen: -1
                        });
                    }
                });
            });

            // 2. Insert drifting organelles
            organelles.forEach(org => {
                let r = org.radius;
                if (org.type === 'mitochondria') r = org.radius * 1.6;
                spatialGrid.insertCircle(org.x, org.y, r, {
                    type: 'organelle',
                    raw: org,
                    _seen: -1
                });
            });

            // 3. Insert vesicles
            vesicles.forEach(v => {
                spatialGrid.insertCircle(v.x, v.y, v.radius, {
                    type: 'vesicle',
                    raw: v,
                    _seen: -1
                });
            });

            // 3.5 Insert ATP granules (T51; Gen 2+ reward channel, same treatment as vesicles)
            atpGranules.forEach(g => {
                spatialGrid.insertCircle(g.x, g.y, g.radius, {
                    type: 'atp',
                    raw: g,
                    _seen: -1
                });
            });

            // 4. Insert virus particles
            if (infection.particles) {
                infection.particles.forEach(vp => {
                    spatialGrid.insertCircle(vp.x, vp.y, vp.radius, {
                        type: 'virus',
                        raw: vp,
                        _seen: -1
                    });
                });
            }

            // 5. Insert malignant mass blocks (T14; Gen 3+). insertCircle's bounding
            // box with r = half block size covers exactly the block's own AABB.
            if (malignantMass.blocks.length > 0) {
                let half = malignantMass.blockSize / 2;
                malignantMass.blocks.forEach(b => {
                    spatialGrid.insertCircle(b.x, b.y, half, {
                        type: 'mass',
                        x: b.x, y: b.y,
                        size: malignantMass.blockSize,
                        _seen: -1
                    });
                });
            }

            // 6. Insert necrotic debris (T38; Gen 2+ cluster shedding). Lethal and
            // swept just like a virus particle -- both paths (§4.1) must see it.
            necroticDebris.forEach(d => {
                spatialGrid.insertCircle(d.x, d.y, d.radius, {
                    type: 'debris',
                    raw: d,
                    _seen: -1
                });
            });

            // 7. Insert nucleus chasers (T57; Gen4+ post-transformation homing
            // enemies). Sensor-path only -- the physics path is gameLoop's own
            // inline sweep (section 1.7), the same shape as 'mass' below it,
            // not read through this grid.
            nucleusChasers.forEach(h => {
                spatialGrid.insertCircle(h.x, h.y, h.radius, {
                    type: 'chaser',
                    raw: h,
                    _seen: -1
                });
            });
        }

        function raycast(startX, startY, angle, maxDist, casterId = null) {
            let dirX = Math.cos(angle);
            let dirY = Math.sin(angle);
            let cellSize = spatialGrid.cellSize;

            let cx = Math.floor(startX / cellSize);
            let cy = Math.floor(startY / cellSize);

            let stepX, tDeltaX, tMaxX;
            if (dirX > 0) {
                stepX = 1;
                tDeltaX = cellSize / dirX;
                tMaxX = ((cx + 1) * cellSize - startX) / dirX;
            } else if (dirX < 0) {
                stepX = -1;
                tDeltaX = cellSize / -dirX;
                tMaxX = (cx * cellSize - startX) / dirX;
            } else {
                stepX = 0;
                tDeltaX = Infinity;
                tMaxX = Infinity;
            }

            let stepY, tDeltaY, tMaxY;
            if (dirY > 0) {
                stepY = 1;
                tDeltaY = cellSize / dirY;
                tMaxY = ((cy + 1) * cellSize - startY) / dirY;
            } else if (dirY < 0) {
                stepY = -1;
                tDeltaY = cellSize / -dirY;
                tMaxY = (cy * cellSize - startY) / dirY;
            } else {
                stepY = 0;
                tDeltaY = Infinity;
                tMaxY = Infinity;
            }

            let caster = casterId !== null ? players.find(p => p.id === casterId) : null;

            spatialGrid.stamp++;
            let stamp = spatialGrid.stamp;

            const ANALYTIC_STEP = 8;
            let t = 0;

            // Items are tested against the FULL ray (start -> maxDist), not the
            // local sub-segment of the cell where they are first encountered: a
            // wide object (e.g. a mitochondrion spine, ~180px) is inserted into
            // several cells via its bounding box, and its true intersection may
            // fall in a LATER cell than the one that first sees it. Since dedup
            // (`_seen`) only tests an item once per ray, testing only the local
            // sub-segment would permanently miss that later intersection.
            // Consequently a hit found while visiting one cell is not necessarily
            // the nearest hit overall (an unvisited, nearer cell may still hold a
            // closer item), so results are collected into a running best and
            // only returned once no unvisited cell can beat it (t >= bestDist).
            let endX = startX + dirX * maxDist, endY = startY + dirY * maxDist;
            let bestDist = maxDist, bestType = null, bestRaw = undefined;
            // Nearest vesicle seen so far, tracked independently of bestDist:
            // a reward is not an obstacle and must not clamp how far the ray
            // marches. Filtered against the final hazard distance below, since
            // a closer hazard discovered later can still occlude it.
            let rewardDist = Infinity, rewardRaw = undefined;

            // Analytic pre-pass: microtubules + ER/Golgi walls, each tested once
            // per ray against the full segment (not per DDA step). Whichever hit
            // is nearest clamps bestDist before the DDA loop below even starts,
            // so it only needs to march up to that clamp.
            const tubesLive = (mitosis.state !== 'idle' && mitosis.currentWidth > 350);
            if (tubesLive) {
                for (let i = 0; i < mitosis.microtubules.length; i++) {
                    let tube = mitosis.microtubules[i];
                    let hitT = segAabbT(startX, startY, endX, endY, tube.x, tube.y, tube.w, tube.h, TRACE_HITBOX);
                    if (hitT >= 0) {
                        let hitDist = hitT * maxDist;
                        if (hitDist < bestDist) { bestDist = hitDist; bestType = 'microtubule'; bestRaw = undefined; }
                    }
                }
            }

            if (centralHitboxes.length > 0 && !(caster !== null && caster.effects.golgiTimer > 0)) {
                // centralHitboxes (ER/Golgi) live in the cell-local, un-rotated
                // frame (trap §4.3) — un-rotate the ray endpoints, not the walls.
                let cosG = Math.cos(-globalRotation), sinG = Math.sin(-globalRotation);
                let dxA = startX - activeCell.x, dyA = startY - activeCell.y;
                let uAx = dxA * cosG - dyA * sinG, uAy = dxA * sinG + dyA * cosG;
                let dxB = endX - activeCell.x, dyB = endY - activeCell.y;
                let uBx = dxB * cosG - dyB * sinG, uBy = dxB * sinG + dyB * cosG;

                for (let i = 0; i < centralHitboxes.length; i++) {
                    let hb = centralHitboxes[i];
                    if (hb.type !== 'path') continue;
                    let r = hb.thick / 2 + TRACE_HITBOX;
                    for (let j = 0; j < hb.points.length - 1; j++) {
                        let p1 = hb.points[j], p2 = hb.points[j + 1];
                        let hitT = raySegT(uAx, uAy, uBx, uBy, p1.x, p1.y, p2.x, p2.y, r);
                        if (hitT >= 0) {
                            let hitDist = hitT * maxDist;
                            if (hitDist < bestDist) { bestDist = hitDist; bestType = 'wall'; bestRaw = undefined; }
                        }
                    }
                }
            }

            while (t < bestDist) {
                let tExit = Math.min(tMaxX, tMaxY, maxDist);

                // Cheap analytic checks (smooth fields, coarse sampling is fine)
                let analyticEnd = Math.min(tExit, bestDist);
                let sampleT = t;
                while (true) {
                    let rx = startX + dirX * sampleT;
                    let ry = startY + dirY * sampleT;

                    if (isOutsideCell(rx, ry)) {
                        if (sampleT < bestDist) { bestDist = sampleT; bestType = 'boundary'; bestRaw = undefined; }
                        break;
                    }
                    if (Math.hypot(rx - activeCell.x, ry - activeCell.y) < NUCLEUS_RADIUS + TRACE_HITBOX) {
                        if (sampleT < bestDist) { bestDist = sampleT; bestType = 'nucleus'; bestRaw = undefined; }
                        break;
                    }
                    if (mitosis.state !== 'idle') {
                        let sweepProgress = (survivalTime - mitosis.eventStartTime) / MITOSIS_SWEEP_DURATION;
                        let caught = false;
                        if (mitosis.direction === 0) {
                            let ringX = activeCell.x - activeCell.radiusX + (activeCell.radiusX * 2 * sweepProgress);
                            if (rx < ringX) caught = true;
                        } else if (mitosis.direction === 1) {
                            let ringY = activeCell.y - activeCell.radiusY + (activeCell.radiusY * 2 * sweepProgress);
                            if (ry < ringY) caught = true;
                        } else if (mitosis.direction === 2) {
                            let ringX = activeCell.x + activeCell.radiusX - (activeCell.radiusX * 2 * sweepProgress);
                            if (rx > ringX) caught = true;
                        } else {
                            let ringY = activeCell.y + activeCell.radiusY - (activeCell.radiusY * 2 * sweepProgress);
                            if (ry > ringY) caught = true;
                        }
                        if (caught) {
                            if (sampleT < bestDist) { bestDist = sampleT; bestType = 'boundary'; bestRaw = undefined; }
                            break;
                        }
                    }

                    if (sampleT >= analyticEnd) break;
                    sampleT = Math.min(sampleT + ANALYTIC_STEP, analyticEnd);
                }

                // Grid items in this cell, tested against the full ray
                let cellItems = spatialGrid.getCell(cx, cy);
                if (cellItems) {
                    for (let k = 0; k < cellItems.length; k++) {
                        let item = cellItems[k];
                        if (item._seen === stamp) continue;
                        item._seen = stamp;

                        if (item.type === 'trace') {
                            if (caster !== null && isOwnNeck(item, caster)) {
                                continue;
                            }
                            let hitT = raySegT(startX, startY, endX, endY, item.x1, item.y1, item.x2, item.y2, TRACE_HITBOX);
                            if (hitT >= 0) {
                                let hitDist = hitT * maxDist;
                                if (hitDist < bestDist) { bestDist = hitDist; bestType = 'trace'; bestRaw = undefined; }
                            }
                        } else if (item.type === 'organelle') {
                            let org = item.raw;
                            if (org.dead) continue; // T38: cluster member broken this frame, stale grid entry (trap 4.1)
                            if (org.type === 'mitochondria') {
                                let cosA = Math.cos(-org.rotation);
                                let sinA = Math.sin(-org.rotation);
                                let halfL = (org.radius * 1.6) / 2;
                                let halfW = (org.radius * 0.9) / 2;
                                let r = halfW + TRACE_HITBOX;

                                let dxA = startX - org.x, dyA = startY - org.y;
                                let lxA = dxA * cosA - dyA * sinA;
                                let lyA = dxA * sinA + dyA * cosA;
                                let dxB = endX - org.x, dyB = endY - org.y;
                                let lxB = dxB * cosA - dyB * sinA;
                                let lyB = dxB * sinA + dyB * cosA;

                                let prevX = -halfL, prevY = 0;
                                for (let s = 1; s <= 5; s++) {
                                    let tt = s / 5;
                                    let bx = Math.pow(1 - tt, 2) * (-halfL) + Math.pow(tt, 2) * (halfL);
                                    let by = 2 * (1 - tt) * tt * (org.bendY || 0);
                                    let hitT = raySegT(lxA, lyA, lxB, lyB, prevX, prevY, bx, by, r);
                                    if (hitT >= 0) {
                                        let hitDist = hitT * maxDist;
                                        if (hitDist < bestDist) { bestDist = hitDist; bestType = 'organelle'; bestRaw = undefined; }
                                    }
                                    prevX = bx; prevY = by;
                                }
                            } else {
                                let hitT = raySegT(startX, startY, endX, endY, org.x, org.y, org.x, org.y, org.radius + TRACE_HITBOX);
                                if (hitT >= 0) {
                                    let hitDist = hitT * maxDist;
                                    if (hitDist < bestDist) { bestDist = hitDist; bestType = 'organelle'; bestRaw = undefined; }
                                }
                            }
                        } else if (item.type === 'virus') {
                            let vp = item.raw;
                            let hitT = raySegT(startX, startY, endX, endY, vp.x, vp.y, vp.x, vp.y, (vp.radius * 1.4) + TRACE_HITBOX);
                            if (hitT >= 0) {
                                let hitDist = hitT * maxDist;
                                if (hitDist < bestDist) { bestDist = hitDist; bestType = 'virus'; bestRaw = undefined; }
                            }
                        } else if (item.type === 'vesicle') {
                            let v = item.raw;
                            let hitT = raySegT(startX, startY, endX, endY, v.x, v.y, v.x, v.y, v.radius + TRACE_WIDTH + 6);
                            if (hitT >= 0) {
                                let hitDist = hitT * maxDist;
                                if (hitDist < rewardDist) { rewardDist = hitDist; rewardRaw = v; }
                            }
                        } else if (item.type === 'atp') {
                            // T51: same reward channel as vesicles -- bots must see these
                            // or the difficulty balance shifts to the human from Gen 2 on.
                            let g = item.raw;
                            let hitT = raySegT(startX, startY, endX, endY, g.x, g.y, g.x, g.y, g.radius + TRACE_WIDTH + 6);
                            if (hitT >= 0) {
                                let hitDist = hitT * maxDist;
                                if (hitDist < rewardDist) { rewardDist = hitDist; rewardRaw = g; }
                            }
                        } else if (item.type === 'mass') {
                            // T14: block is axis-aligned, so test with segAabbT (same
                            // helper as the microtubule pre-pass) rather than raySegT.
                            let half = item.size / 2;
                            let hitT = segAabbT(startX, startY, endX, endY, item.x - half, item.y - half, item.size, item.size, TRACE_HITBOX);
                            if (hitT >= 0) {
                                let hitDist = hitT * maxDist;
                                if (hitDist < bestDist) { bestDist = hitDist; bestType = 'mass'; bestRaw = undefined; }
                            }
                        } else if (item.type === 'debris') {
                            // T38: necrotic cluster shrapnel -- same point+radius test as virus.
                            let d = item.raw;
                            let hitT = raySegT(startX, startY, endX, endY, d.x, d.y, d.x, d.y, d.radius + TRACE_HITBOX);
                            if (hitT >= 0) {
                                let hitDist = hitT * maxDist;
                                if (hitDist < bestDist) { bestDist = hitDist; bestType = 'debris'; bestRaw = undefined; }
                            }
                        } else if (item.type === 'chaser') {
                            // T57: homing nucleus enemy -- same point+radius test as debris/virus.
                            let h = item.raw;
                            if (h.dead) continue; // stale grid entry, broken this frame (trap 4.1)
                            let hitT = raySegT(startX, startY, endX, endY, h.x, h.y, h.x, h.y, h.radius + TRACE_HITBOX);
                            if (hitT >= 0) {
                                let hitDist = hitT * maxDist;
                                if (hitDist < bestDist) { bestDist = hitDist; bestType = 'chaser'; bestRaw = undefined; }
                            }
                        }
                    }
                }

                if (tExit >= maxDist || tExit >= bestDist) break;

                if (tMaxX < tMaxY) {
                    t = tMaxX;
                    tMaxX += tDeltaX;
                    cx += stepX;
                } else {
                    t = tMaxY;
                    tMaxY += tDeltaY;
                    cy += stepY;
                }
            }

            let hazard = (bestType !== null) ? { dist: bestDist, type: bestType } : { dist: maxDist, type: 'clear' };
            let reward = (rewardRaw !== undefined && rewardDist < bestDist) ? { dist: rewardDist, raw: rewardRaw } : null;
            return { hazard, reward };
        }

        function updateBotAI(bot, delta) {
            const W_AVOID   = 1.0;   // lateral hazard asymmetry
            const W_FORWARD = 1.6;   // forward hazard escape
            const W_REWARD  = 0.35;  // vesicle attraction
            const W_BRIDGE  = 0.5;   // mitosis pull
            const PANIC     = 0.25;  // below this forward hazard score, rewards are ignored
            const MAX_TURN  = 0.08;  // must equal the human turn rate (gameLoop: p.angle -= 0.08 * delta) — keep in sync if that ever changes

            let fAngle = bot.angle;
            let lAngle = bot.angle - 0.5; // Left diagonal
            let rAngle = bot.angle + 0.5; // Right diagonal

            let maxSense = 350;

            let fRay = raycast(bot.x, bot.y, fAngle, maxSense, bot.id);
            let lRay = raycast(bot.x, bot.y, lAngle, maxSense, bot.id);
            let rRay = raycast(bot.x, bot.y, rAngle, maxSense, bot.id);

            let fHazard = hazardScore(fRay.hazard, maxSense);
            let lHazard = hazardScore(lRay.hazard, maxSense);
            let rHazard = hazardScore(rRay.hazard, maxSense);

            let force = 0;

            // 1. Lateral avoidance — positive force turns right
            force += (rHazard - lHazard) * W_AVOID;

            // 2. Forward escape — push toward whichever side is clearer
            if (fHazard < 1) {
                let push = (1 - fHazard) * W_FORWARD;
                force += (rHazard >= lHazard) ? push : -push;
            }

            // 3. Reward pull — only when clear of immediate danger on all three rays
            if (fHazard > PANIC && lHazard > PANIC && rHazard > PANIC) {
                let lReward = rewardScore(lRay.reward, maxSense);
                let rReward = rewardScore(rRay.reward, maxSense);
                force += (rReward - lReward) * W_REWARD;
            }

            // 4. Mitosis bridge attraction
            if (mitosis.state !== 'idle') {
                let angleToB = Math.atan2(mitosis.cellB.y - bot.y, mitosis.cellB.x - bot.x);
                let diff = angleToB - bot.angle;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                force += (diff / Math.PI) * W_BRIDGE;
            }

            // Proportional steering with a dead-zone to kill wobble
            let turn = Math.max(-1, Math.min(1, force));
            if (Math.abs(turn) > 0.05) {
                bot.angle += turn * MAX_TURN * delta;
            }

            // Toggle targetMode dynamically based on the forward ray
            if (fRay.reward && fRay.reward.dist < fRay.hazard.dist) {
                bot.targetMode = 'self';
            } else if (fRay.hazard.type === 'trace' && fRay.hazard.dist < 150) {
                if (bot.effects.speedTimer > 0) {
                    bot.targetMode = 'attack';
                }
            }
        }

        // 0 = wall in your face, 1 = nothing within maxSense
        function hazardScore(hazard, maxSense) {
            if (hazard.type === 'clear') return 1;
            let n = Math.min(1, hazard.dist / maxSense);
            return n * n; // quadratic: cheap far away, urgent up close
        }

        // 0 = no reward, 1 = reward touching the head
        function rewardScore(reward, maxSense) {
            if (!reward) return 0;
            return 1 - Math.min(1, reward.dist / maxSense);
        }

        function checkArcCollision(x, y, player) {
            // Un-rotate BOTH the previous and candidate head positions into the
            // static (globalRotation) frame, then sweep the whole step.
            let cosG = Math.cos(-globalRotation), sinG = Math.sin(-globalRotation);
            let dx2 = x - activeCell.x, dy2 = y - activeCell.y;
            let ux2 = dx2 * cosG - dy2 * sinG, uy2 = dx2 * sinG + dy2 * cosG; // candidate
            let dx1 = player.x - activeCell.x, dy1 = player.y - activeCell.y;
            let ux1 = dx1 * cosG - dy1 * sinG, uy1 = dx1 * sinG + dy1 * cosG; // previous

            const HITBOX_SQ = TRACE_HITBOX * TRACE_HITBOX;

            for (let hb of centralHitboxes) {
                if (hb.type === 'path') {
                    let rSq = Math.pow(hb.thick / 2 + TRACE_HITBOX, 2);
                    for (let i = 0; i < hb.points.length - 1; i++) {
                        let p1 = hb.points[i], p2 = hb.points[i + 1];
                        if (segSegDistSq(ux1, uy1, ux2, uy2, p1.x, p1.y, p2.x, p2.y) < rSq) return true;
                    }
                } else if (hb.type === 'poly') {
                    // Collide if the candidate lands inside, OR the swept step passes
                    // within one trace radius of any edge (covers tunnelling + grazing).
                    let inside = false;
                    for (let i = 0, j = hb.points.length - 1; i < hb.points.length; j = i++) {
                        let xi = hb.points[i].x, yi = hb.points[i].y;
                        let xj = hb.points[j].x, yj = hb.points[j].y;
                        if (((yi > uy2) !== (yj > uy2)) && (ux2 < (xj - xi) * (uy2 - yi) / (yj - yi) + xi)) inside = !inside;
                        if (segSegDistSq(ux1, uy1, ux2, uy2, xi, yi, xj, yj) < HITBOX_SQ) return true;
                    }
                    if (inside) return true;
                }
            }
            return false;
        }

        function isInsideNucleus(x, y) {
            // If distance to center is >= NUCLEUS_RADIUS, it's not inside the nucleus at all
            if (Math.hypot(x - activeCell.x, y - activeCell.y) >= NUCLEUS_RADIUS + TRACE_HITBOX) return false;

            // If mitosis is not active, it's always inside
            if (mitosis.state === 'idle') return true;

            // If mitosis is active, check if it's on the destroyed side of the laser line
            let timeInEvent = survivalTime - mitosis.eventStartTime;
            let sweepProgress = timeInEvent / MITOSIS_SWEEP_DURATION;

            if (mitosis.direction === 0) { // Sweeps Left to Right (destroying left, keeping right)
                let ringX = activeCell.x - activeCell.radiusX + (activeCell.radiusX * 2 * sweepProgress);
                return x >= ringX; // only collides if it hasn't been crossed by the laser yet
            } else if (mitosis.direction === 1) { // Sweeps Top to Bottom
                let ringY = activeCell.y - activeCell.radiusY + (activeCell.radiusY * 2 * sweepProgress);
                return y >= ringY;
            } else if (mitosis.direction === 2) { // Sweeps Right to Left
                let ringX = activeCell.x + activeCell.radiusX - (activeCell.radiusX * 2 * sweepProgress);
                return x <= ringX;
            } else { // Sweeps Bottom to Top
                let ringY = activeCell.y + activeCell.radiusY - (activeCell.radiusY * 2 * sweepProgress);
                return y <= ringY;
            }
        }

        // T38: precise per-type sweep test against one cluster member -- mirrors
        // the organelle branch of checkCollision() (mitochondria spine vs. lysosome
        // circle) so a break only registers where the real hitbox actually is.
        function clusterMemberHit(org, x1, y1, x2, y2) {
            if (org.type === 'mitochondria') {
                let cosA = Math.cos(-org.rotation), sinA = Math.sin(-org.rotation);
                let dx1 = x1 - org.x, dy1 = y1 - org.y;
                let lx1 = dx1 * cosA - dy1 * sinA, ly1 = dx1 * sinA + dy1 * cosA;
                let dx2 = x2 - org.x, dy2 = y2 - org.y;
                let lx2 = dx2 * cosA - dy2 * sinA, ly2 = dx2 * sinA + dy2 * cosA;
                let halfL = (org.radius * 1.6) / 2;
                let halfW = (org.radius * 0.9) / 2;
                let rSq = (halfW + TRACE_HITBOX) * (halfW + TRACE_HITBOX);
                let prevX = -halfL, prevY = 0;
                for (let i = 1; i <= 5; i++) {
                    let t = i / 5;
                    let bx = Math.pow(1 - t, 2) * (-halfL) + Math.pow(t, 2) * (halfL);
                    let by = 2 * (1 - t) * t * (org.bendY || 0);
                    if (segSegDistSq(lx1, ly1, lx2, ly2, prevX, prevY, bx, by) < rSq) return true;
                    prevX = bx; prevY = by;
                }
                return false;
            }
            let rSq = (org.radius + TRACE_HITBOX) * (org.radius + TRACE_HITBOX);
            return ptSegDistSq(org.x, org.y, x1, y1, x2, y2) < rSq;
        }

        // T50: shared teardown for ANY broken necrotic organelle, lone or
        // clustered -- drops it from `organelles` (so the next
        // rebuildSpatialGrid() forgets it), releases its sprite (§2 PixiJS
        // lifecycle), and marks it dead so THIS frame's already-built
        // spatialGrid entry is skipped by checkCollision()/raycast() (trap 4.1)
        // instead of killing someone off a stale reference. Cluster bookkeeping
        // (splicing out of `members`, clearing `clusterId`) is the caller's job.
        function destroyNecroticOrganelle(o) {
            o.dead = true;
            let idx = organelles.indexOf(o);
            if (idx >= 0) organelles.splice(idx, 1);
            if (o.sprite) {
                organellesLayer.removeChild(o.sprite);
                o.sprite.destroy();
            }
            emitParticles(o.x, o.y, 10, { speed: 2.2, spread: Math.PI * 2, life: 0.5, size: 3, color: 0x8899aa }); // T17
        }

        // Destroys one cluster member: drops it from its cluster and tears it
        // down via destroyNecroticOrganelle(). A cluster reduced to one member
        // is just a lone necrotic organelle again.
        function breakClusterMember(clusterId, memberIndex) {
            let cluster = necroticClusters.get(clusterId);
            let member = cluster.members[memberIndex];
            cluster.members.splice(memberIndex, 1);
            member.clusterId = null;
            destroyNecroticOrganelle(member);

            if (cluster.members.length <= 1) {
                for (let m of cluster.members) m.clusterId = null;
                necroticClusters.delete(clusterId);
            }
        }

        function checkCollision(x, y, player) {
            // 1. ALWAYS check physical boundaries
            if (isOutsideCell(x, y)) return true;
            if (isInsideNucleus(x, y)) return true;

            // 2. If Ghost Mode is active, bypass traces and organelles!
            if (player.effects.ghostTimer > 0) return false;

            // 3. Normal Collision Logic — Golgi pass bypasses the ER/Golgi walls only.
            if (player.effects.golgiTimer <= 0 && checkArcCollision(x, y, player)) return true;

            // Query spatial grid for nearby obstacles
            let stepLen = Math.hypot(x - player.x, y - player.y);
            let qx = (player.x + x) / 2;
            let qy = (player.y + y) / 2;
            let queryRadius = stepLen / 2 + 100;
            let localItems = spatialGrid.queryRange(qx, qy, queryRadius);

            const hx1 = player.x, hy1 = player.y; // head's previous position
            const hx2 = x, hy2 = y;               // head's candidate position (nextX, nextY)
            const HITBOX_SQ = TRACE_HITBOX * TRACE_HITBOX;

            for (let item of localItems) {
                if (item.type === 'organelle') {
                    let org = item.raw;
                    if (org.dead) continue; // T38: cluster member broken this frame, stale grid entry (trap 4.1)
                    if (org.necrotic && player.targetMode === 'attack') continue; // T50: grey matter is never lethal in attack mode -- section 0.9 handles breaking it
                    if (org.type === 'mitochondria') {
                        // Transform BOTH head endpoints into the mitochondrion's local space
                        let cosA = Math.cos(-org.rotation), sinA = Math.sin(-org.rotation);
                        let dx2 = x - org.x, dy2 = y - org.y;
                        let lx2 = dx2 * cosA - dy2 * sinA, ly2 = dx2 * sinA + dy2 * cosA; // candidate
                        let dx1 = player.x - org.x, dy1 = player.y - org.y;
                        let lx1 = dx1 * cosA - dy1 * sinA, ly1 = dx1 * sinA + dy1 * cosA; // previous

                        let halfL = (org.radius * 1.6) / 2;
                        let halfW = (org.radius * 0.9) / 2;
                        let rSq = (halfW + TRACE_HITBOX) * (halfW + TRACE_HITBOX);

                        // Sweep the head segment against the 5-segment curved spine
                        let prevX = -halfL, prevY = 0;
                        for (let i = 1; i <= 5; i++) {
                            let t = i / 5;
                            let bx = Math.pow(1 - t, 2) * (-halfL) + Math.pow(t, 2) * (halfL);
                            let by = 2 * (1 - t) * t * (org.bendY || 0);
                            if (segSegDistSq(lx1, ly1, lx2, ly2, prevX, prevY, bx, by) < rSq) return true;
                            prevX = bx; prevY = by;
                        }
                    } else {
                        // Circles: distance from the centre to the swept head segment
                        let rSq = (org.radius + TRACE_HITBOX) * (org.radius + TRACE_HITBOX);
                        if (ptSegDistSq(org.x, org.y, player.x, player.y, x, y) < rSq) return true;
                    }
                } else if (item.type === 'trace') {
                    // Hunters pass straight through opponent traces
                    if (player.effects.hunterTimer > 0 && item.playerId !== player.id) continue;

                    if (isOwnNeck(item, player)) continue;

                    if (segSegDistSq(hx1, hy1, hx2, hy2, item.x1, item.y1, item.x2, item.y2) < HITBOX_SQ) {
                        return true;
                    }
                } else if (item.type === 'debris') {
                    // T38: necrotic cluster shrapnel -- lethal, not breakable.
                    let d = item.raw;
                    let rSq = (d.radius + TRACE_HITBOX) * (d.radius + TRACE_HITBOX);
                    if (ptSegDistSq(d.x, d.y, hx1, hy1, hx2, hy2) < rSq) return true;
                }
            }

            // Hunter eating opponent heads
            if (player.effects.hunterTimer > 0) {
                for (let other of players) {
                    if (other.id !== player.id && other.alive) {
                        if (Math.hypot(x - other.x, y - other.y) < TRACE_HITBOX * 2.5) {
                            other.alive = false; // Chomp the opponent's head!
                            addShake(0.5, 0.4); // T16: player elimination
                        }
                    }
                }
            }

            return false;
        }
        // T38: fuse two touching necrotic organelles into one cluster, or grow an
        // existing cluster, or merge two clusters. Members keep their own hitbox
        // unchanged -- checkCollision() and raycast() need no change for the
        // cluster itself, since it stays exactly the union of members already in
        // organelles[] (see docs/tasks/T38-make-necrosis-matter.md).
        function fuseNecroticPair(o, o2) {
            if (o.clusterId != null && o.clusterId === o2.clusterId) return;
            let clusterA = o.clusterId != null ? necroticClusters.get(o.clusterId) : null;
            let clusterB = o2.clusterId != null ? necroticClusters.get(o2.clusterId) : null;

            if (!clusterA && !clusterB) {
                let id = nextClusterId++;
                necroticClusters.set(id, { members: [o, o2], nextEmitTime: survivalTime + DEBRIS_BASE_INTERVAL / 2 });
                o.clusterId = id; o2.clusterId = id;
            } else if (clusterA && !clusterB) {
                if (clusterA.members.length >= CLUSTER_MAX_MEMBERS) return;
                clusterA.members.push(o2);
                o2.clusterId = o.clusterId;
            } else if (!clusterA && clusterB) {
                if (clusterB.members.length >= CLUSTER_MAX_MEMBERS) return;
                clusterB.members.push(o);
                o.clusterId = o2.clusterId;
            } else {
                let smallId = clusterA.members.length <= clusterB.members.length ? o.clusterId : o2.clusterId;
                let largeId = smallId === o.clusterId ? o2.clusterId : o.clusterId;
                let small = necroticClusters.get(smallId), large = necroticClusters.get(largeId);
                if (large.members.length + small.members.length > CLUSTER_MAX_MEMBERS) return;
                for (let m of small.members) { m.clusterId = largeId; large.members.push(m); }
                necroticClusters.delete(smallId);
            }
        }

        // --- 6. AI, Viruses, & Camera Updates ---
        function updateDriftingOrganelles(delta) {
            for (let i = 0; i < organelles.length; i++) {
                let o = organelles[i];

                if (!o.necrotic) {
                    o.vx += (Math.random() - 0.5) * 0.05;
                    o.vy += (Math.random() - 0.5) * 0.05;

                    let speed = Math.hypot(o.vx, o.vy);
                    if (speed > 0.3) {
                        o.vx = (o.vx / speed) * 0.3; o.vy = (o.vy / speed) * 0.3;
                    }

                    o.x += o.vx * delta; o.y += o.vy * delta;

                    let nearestCell = activeCell;
                    if (mitosis.state !== 'idle') {
                        let distToA = Math.hypot(o.x - activeCell.x, o.y - activeCell.y);
                        let distToB = Math.hypot(o.x - mitosis.cellB.x, o.y - mitosis.cellB.y);
                        if (distToB < distToA) nearestCell = mitosis.cellB;
                    }

                    if (isOutsideCell(o.x, o.y, o.radius)) {
                        // T37: with calcification the wall itself can be sliding inward,
                        // re-triggering this clamp every frame; an unconditional vx/vy
                        // flip made that read as jitter. Reflect about the (approximate,
                        // radial) surface normal, and only when the organelle is actually
                        // moving outward through it -- a wall-driven clamp then just
                        // repositions without perturbing velocity. The wider inward
                        // margin keeps the organelle's own drift from re-triggering next frame.
                        let ang = Math.atan2(o.y - nearestCell.y, o.x - nearestCell.x);
                        let nx = Math.cos(ang), ny = Math.sin(ang);
                        let outward = o.vx * nx + o.vy * ny;
                        if (outward > 0) {
                            o.vx -= 2 * outward * nx;
                            o.vy -= 2 * outward * ny;
                        }
                        o.x = nearestCell.x + nx * (nearestCell.radiusX - o.radius - 6);
                        o.y = nearestCell.y + ny * (nearestCell.radiusY - o.radius - 6);
                    }

                    // Failsafe: If physics broke and it's completely out of the world, snap it to center
                    if (Math.hypot(o.x - nearestCell.x, o.y - nearestCell.y) > nearestCell.radiusX + 1000) {
                        o.x = nearestCell.x;
                        o.y = nearestCell.y;
                    }

                    let distToCenter = Math.hypot(o.x - nearestCell.x, o.y - nearestCell.y);
                    if (distToCenter < 380 + o.radius) {
                        let ang = Math.atan2(o.y - nearestCell.y, o.x - nearestCell.x);
                        o.vx = Math.cos(ang) * 0.4; o.vy = Math.sin(ang) * 0.4;
                        o.x = nearestCell.x + Math.cos(ang) * (380 + o.radius);
                        o.y = nearestCell.y + Math.sin(ang) * (380 + o.radius);
                    }
                }

                // T13: pair resolution still runs for a necrotic o so drifting
                // organelles keep bouncing off it -- but the necrotic side never
                // moves (one-sided resolution instead of the symmetric split).
                for (let j = i + 1; j < organelles.length; j++) {
                    let o2 = organelles[j];
                    let dist = Math.hypot(o.x - o2.x, o.y - o2.y);
                    let minDist = o.radius + o2.radius + 10;
                    if (dist < minDist) {
                        let ang = Math.atan2(o.y - o2.y, o.x - o2.x);
                        let overlap = minDist - dist;

                        if (!o.necrotic) {
                            o.vx = Math.cos(ang) * 0.3; o.vy = Math.sin(ang) * 0.3;
                        }
                        if (!o2.necrotic) {
                            o2.vx = -Math.cos(ang) * 0.3; o2.vy = -Math.sin(ang) * 0.3;
                        }

                        if (o.necrotic && !o2.necrotic) {
                            o2.x -= Math.cos(ang) * overlap; o2.y -= Math.sin(ang) * overlap;
                        } else if (!o.necrotic && o2.necrotic) {
                            o.x += Math.cos(ang) * overlap; o.y += Math.sin(ang) * overlap;
                        } else if (!o.necrotic && !o2.necrotic) {
                            o.x += Math.cos(ang) * overlap / 2; o.y += Math.sin(ang) * overlap / 2;
                            o2.x -= Math.cos(ang) * overlap / 2; o2.y -= Math.sin(ang) * overlap / 2;
                        } else {
                            // T38: both necrotic and touching -- neither moves (unchanged
                            // from T13), but they fuse into one cluster.
                            fuseNecroticPair(o, o2);
                        }
                    }
                }

                if (!o.necrotic) {
                    o.rotation += o.rotSpeed * delta;   // advance the value the hitbox reads
                }
            }
        }

        // T22 step 3: drawOrganelles() -- pure reads of organelles[]. Mirrors
        // o.x/o.y/o.rotation onto o.sprite exactly as the old fused tail of
        // updateDriftingOrganelles() did, plus the necrotic freeze-flicker
        // alpha (itself a pure function of survivalTime/o.freezeTime, not
        // state). Never mutates an organelle's plain-object fields (§4.4).
        function drawOrganelles() {
            for (let i = 0; i < organelles.length; i++) {
                let o = organelles[i];
                if (o.sprite) {
                    o.sprite.x = o.x;
                    o.sprite.y = o.y;
                    if (!o.necrotic) {
                        o.sprite.rotation = o.rotation;     // sprite mirrors it exactly
                    }

                    // T13: one-shot flicker on freeze, decaying to the resting grey alpha
                    if (o.necrotic) {
                        let sinceFreeze = survivalTime - o.freezeTime;
                        if (sinceFreeze < NECROSIS_PULSE_DURATION) {
                            let decay = 1 - (sinceFreeze / NECROSIS_PULSE_DURATION);
                            o.sprite.alpha = NECROSIS_ALPHA + decay * 0.25 * Math.abs(Math.sin(sinceFreeze * 40));
                        } else {
                            o.sprite.alpha = NECROSIS_ALPHA;
                        }
                    }
                }
            }
        }

        // T22 step 1: state only (§4.4a) -- no PIXI/Layer/sprite references.
        // Movement, spawn, consumption and fusion all live here; drawVesicles()
        // below reads the surviving vesicles[] this leaves behind and the Gen 4+
        // well/flash/establish timers this sets, and never mutates either.
        function updateVesicles(delta) {
            if (Math.random() < VESICLE_SPAWN_CHANCE && vesicles.length < 25 && window.golgiData) {
                let types = ['mitochondria', 'lysosome', 'membrane'];
                let targetType = types[Math.floor(Math.random() * types.length)];
                
                let gx = window.golgiData.x;
                let gy = window.golgiData.y;
                let worldX = activeCell.x + gx * Math.cos(globalRotation) - gy * Math.sin(globalRotation);
                let worldY = activeCell.y + gx * Math.sin(globalRotation) + gy * Math.cos(globalRotation);
                
                let spawnAngle = window.golgiData.angle + globalRotation + (Math.random() * 0.8 - 0.4);
                
                let vColor = C_MEMB;
                if (targetType === 'mitochondria') vColor = C_MITO;
                if (targetType === 'lysosome') vColor = C_LYSO;

                vesicles.push({
                    x: worldX,
                    y: worldY,
                    vx: Math.cos(spawnAngle) * 0.8,
                    vy: Math.sin(spawnAngle) * 0.8,
                    type: targetType,
                    radius: 12,
                    color: vColor,
                    rotation: Math.random() * Math.PI * 2,
                    freeUntil: survivalTime + freeWindowDuration() // T52: Gen 4+ interception window; inert before then
                });
            }

            // Spawn vesicles from progenitor in Cell B during mitosis
            if (mitosis.state !== 'idle' && mitosis.progenitor && mitosis.progenitor.active && 
                (mitosis.progenitor.state === 'growing' || mitosis.progenitor.state === 'complete') &&
                Math.random() < VESICLE_SPAWN_CHANCE && vesicles.length < 25 && window.golgiData) {
                
                let types = ['mitochondria', 'lysosome', 'membrane'];
                let targetType = types[Math.floor(Math.random() * types.length)];
                
                let p = mitosis.progenitor;
                let gx = window.golgiData.x * p.scale;
                let gy = window.golgiData.y * p.scale;
                let worldX = p.x + gx * Math.cos(globalRotation) - gy * Math.sin(globalRotation);
                let worldY = p.y + gx * Math.sin(globalRotation) + gy * Math.cos(globalRotation);
                
                let spawnAngle = window.golgiData.angle + globalRotation + (Math.random() * 0.8 - 0.4);
                
                let vColor = C_MEMB;
                if (targetType === 'mitochondria') vColor = C_MITO;
                if (targetType === 'lysosome') vColor = C_LYSO;
                
                vesicles.push({
                    x: worldX,
                    y: worldY,
                    vx: Math.cos(spawnAngle) * 0.8,
                    vy: Math.sin(spawnAngle) * 0.8,
                    type: targetType,
                    radius: 12,
                    color: vColor,
                    rotation: Math.random() * Math.PI * 2,
                    freeUntil: survivalTime + freeWindowDuration() // T52: Gen 4+ interception window; inert before then
                });
            }

            // T15/T52: Gen 4+ well establish-time latch -- state only. The rings,
            // flash and establishing-pulse themselves are pure reads of this and
            // survivalTime/nucleusFeedFlashTime, so they moved to drawVesicles().
            if (genAtLeast(4) && gen4EstablishTime === -Infinity) gen4EstablishTime = survivalTime; // T52: one-off start pulse, fires once per round

            for (let i = vesicles.length - 1; i >= 0; i--) {
                let v = vesicles[i];

                // T15: Gen 4+ angiogenesis -- constant inward pull on vesicles only,
                // toward whichever cell centre is nearest (mirrors the nearestCell
                // pattern in updateDriftingOrganelles()). Vesicles consumed near the
                // centre despawn rather than pile up inside the lethal nucleus core.
                // T52: the pull itself is withheld until v.freeUntil -- that window is
                // the player's whole chance to intercept before the nucleus gets it.
                if (genAtLeast(4)) {
                    let nearestCell = activeCell;
                    if (mitosis.state !== 'idle') {
                        let distToA = Math.hypot(v.x - activeCell.x, v.y - activeCell.y);
                        let distToB = Math.hypot(v.x - mitosis.cellB.x, v.y - mitosis.cellB.y);
                        if (distToB < distToA) nearestCell = mitosis.cellB;
                    }
                    let dx = nearestCell.x - v.x, dy = nearestCell.y - v.y;
                    let distToCenter = Math.hypot(dx, dy);
                    if (distToCenter < GRAVITY_CONSUME_RADIUS) {
                        // T52: the nucleus just ate it -- feed meter rises by this
                        // vesicle's type weight (never falls), plus the consume event
                        // (inward burst, nucleus flare, HUD tick) so it reads as
                        // mattering instead of just fading.
                        nucleusFeed.value = Math.min(NUCLEUS_FEED_MAX, nucleusFeed.value + NUCLEUS_FEED_WEIGHTS[v.type]);
                        nucleusFeedFlashTime = survivalTime;
                        // T57: meter maxed -- one-shot transformation trigger. The
                        // freeze/reveal itself is driven by nucleusTransformTime
                        // through isCellFrozen (gameLoop, alongside isMitosisReveal);
                        // this only ever fires once per round.
                        if (nucleusFeed.value >= NUCLEUS_FEED_MAX && nucleusTransformTime === -Infinity) {
                            nucleusTransformTime = survivalTime;
                            // T60: chasers used to become spawn-eligible after a
                            // separate NUCLEUS_TRANSFORM_GRACE unfrozen buffer --
                            // folded into the freeze+countdown itself now, so
                            // they're eligible the instant control returns.
                            nucleusChaserNextSpawn = survivalTime + NUCLEUS_TRANSFORM_FREEZE + REVEAL_COUNTDOWN;
                            addShake(1.0, 1.0); // T16
                            emitParticles(nearestCell.x, nearestCell.y, 30, { speed: 4.0, spread: Math.PI * 2, life: 1.0, size: 4, color: 0xff4757 }); // T17
                            warningElement.innerText = "THE CELL HAS TURNED -- THE NUCLEUS IS HUNTING";
                            warningElement.style.color = "#ff4757";
                            warningElement.style.display = 'block';
                            setTimeout(() => warningElement.style.display = 'none', (NUCLEUS_TRANSFORM_FREEZE + REVEAL_COUNTDOWN) * 1000);
                        }
                        emitParticles(v.x, v.y, 10, { speed: 3.0, spread: 0.5, angle: Math.atan2(dy, dx), life: 0.4, size: 3, color: v.color }); // T52
                        vesicles.splice(i, 1);
                        continue;
                    }
                    if (survivalTime >= v.freeUntil) {
                        let ux = dx / distToCenter, uy = dy / distToCenter;
                        v.vx += ux * GRAVITY_ACCEL_PER_TICK * delta;
                        v.vy += uy * GRAVITY_ACCEL_PER_TICK * delta;
                        let speed = Math.hypot(v.vx, v.vy);
                        if (speed > GRAVITY_MAX_V_PER_TICK) {
                            let scale = GRAVITY_MAX_V_PER_TICK / speed;
                            v.vx *= scale;
                            v.vy *= scale;
                        }
                    }
                }

                v.x += v.vx * delta;
                v.y += v.vy * delta;
                v.rotation += 0.02 * delta;

                let fused = false;
                
                if (isOutsideCell(v.x, v.y, v.radius)) {
                    if (v.type === 'membrane') fused = true;
                    else {
                        let nearestCell = activeCell;
                        if (mitosis.state !== 'idle') {
                            let distToA = Math.hypot(v.x - activeCell.x, v.y - activeCell.y);
                            let distToB = Math.hypot(v.x - mitosis.cellB.x, v.y - mitosis.cellB.y);
                            if (distToB < distToA) nearestCell = mitosis.cellB;
                        }
                        let ang = Math.atan2(v.y - nearestCell.y, v.x - nearestCell.x);
                        v.x = nearestCell.x + Math.cos(ang) * (nearestCell.radiusX - v.radius - 2);
                        v.y = nearestCell.y + Math.sin(ang) * (nearestCell.radiusY - v.radius - 2);
                        v.vx *= -1;
                        v.vy *= -1;
                    }
                }

                for (let org of organelles) {
                    if (Math.hypot(v.x - org.x, v.y - org.y) < org.radius + v.radius) {
                        if (org.type === v.type) fused = true;
                        else {
                            let ang = Math.atan2(v.y - org.y, v.x - org.x);
                            v.vx = Math.cos(ang); v.vy = Math.sin(ang);
                        }
                    }
                }

                if (fused) {
                    let fuseAng = Math.atan2(v.y - activeCell.y, v.x - activeCell.x);
                    // The vesicle has fused with the membrane!
                    // (Splash particles logic removed to prevent them from becoming deadly pac-man viruses)
                    vesicles.splice(i, 1);
                }
                // else: the vesicle survives this frame -- drawVesicles() reads
                // vesicles[] afterward and draws it by v.type.
            }
        }

        // T22 step 1: draw only (§4.4a) -- reads vesicles[]/gen4EstablishTime/
        // nucleusFeedFlashTime as left by updateVesicles() above, never mutates
        // them. Same reverse-index iteration as the old fused single loop, so
        // draw order (z-stacking of overlapping vesicles) is unchanged.
        function drawVesicles() {
            dynamicLayer.clear();

            // T15: Gen 4+ angiogenesis well -- faint pulsing rings at each cell
            // centre, drawn into the same layer/frame this function already owns.
            if (genAtLeast(4)) {
                let wellCenters = [activeCell];
                if (mitosis.state !== 'idle') wellCenters.push(mitosis.cellB);

                // T52: at the shared-camera zoom floor (T47's DIMER_LOD_ZOOM=0.5) a
                // flat 1.5px world-space stroke is under a screen pixel and reads as
                // nothing -- scale stroke/alpha up as zoom falls below 1.0 so the
                // well stays legible at the floor, not just at zoom 1.0.
                let zoomBoost = Math.max(1, 1 / world.scale.x);
                for (let c of wellCenters) {
                    for (let ring = 0; ring < 3; ring++) {
                        let r = 40 + ring * 35 + Math.sin(survivalTime * 1.5 + ring) * 6;
                        dynamicLayer.lineStyle(1.5 * zoomBoost, 0xa29bfe, Math.min(0.6, (0.18 - ring * 0.03) * zoomBoost));
                        dynamicLayer.drawCircle(c.x, c.y, r);
                    }

                    // T52: per-consume flare -- brief bright ring at the nucleus edge.
                    let sinceFlash = survivalTime - nucleusFeedFlashTime;
                    if (sinceFlash < NUCLEUS_FLASH_DURATION) {
                        let flash = 1 - sinceFlash / NUCLEUS_FLASH_DURATION;
                        dynamicLayer.lineStyle(4 * zoomBoost, 0xd6a4ff, flash * 0.8);
                        dynamicLayer.drawCircle(c.x, c.y, NUCLEUS_RADIUS + 6 + flash * 20);
                    }

                    // T52: one-off establishing pulse -- an expanding, fading ring the
                    // first frame Gen 4 is reached, so cause (well appears) and effect
                    // (vesicles start pulling in) read as connected.
                    let sinceEstablish = survivalTime - gen4EstablishTime;
                    if (sinceEstablish < GEN4_ESTABLISH_DURATION) {
                        let t = sinceEstablish / GEN4_ESTABLISH_DURATION;
                        dynamicLayer.lineStyle(6 * zoomBoost, 0xa29bfe, (1 - t) * 0.9);
                        dynamicLayer.drawCircle(c.x, c.y, NUCLEUS_RADIUS + t * 300);
                    }
                }
            }

            for (let i = vesicles.length - 1; i >= 0; i--) {
                let v = vesicles[i];
                if (v.type === 'mitochondria') {
                    dynamicLayer.lineStyle({width: v.radius*0.8, color: C_MITO, alpha: 0.6, cap: PIXI.LINE_CAP.ROUND});
                    let px1 = v.x + Math.cos(v.rotation)*v.radius*0.5;
                    let py1 = v.y + Math.sin(v.rotation)*v.radius*0.5;
                    let px2 = v.x - Math.cos(v.rotation)*v.radius*0.5;
                    let py2 = v.y - Math.sin(v.rotation)*v.radius*0.5;
                    dynamicLayer.moveTo(px1, py1);
                    dynamicLayer.lineTo(px2, py2);
                    dynamicLayer.lineStyle({width: v.radius*0.4, color: 0x55efc4, alpha: 0.9, cap: PIXI.LINE_CAP.ROUND});
                    dynamicLayer.moveTo(px1, py1);
                    dynamicLayer.lineTo(px2, py2);
                } else if (v.type === 'lysosome') {
                    // T21: near-black vanishes under GLOW_BLEND=ADD on dynamicLayer;
                    // dim red keeps the vesicle a visible body, not a hollow ring.
                    dynamicLayer.beginFill(0x330e11, 0.6);
                    dynamicLayer.lineStyle(2, 0xff4757, 0.6);
                    dynamicLayer.drawCircle(v.x, v.y, v.radius);
                    dynamicLayer.endFill();
                    dynamicLayer.beginFill(0xffffff, 0.9);
                    dynamicLayer.lineStyle(0);
                    dynamicLayer.drawCircle(v.x - 2, v.y - 2, v.radius * 0.3);
                    dynamicLayer.drawCircle(v.x + 3, v.y + 1, v.radius * 0.2);
                    dynamicLayer.endFill();
                } else {
                    dynamicLayer.beginFill(v.color, 0.8);
                    dynamicLayer.lineStyle(2, 0x1e3799, 0.9);
                    dynamicLayer.drawCircle(v.x, v.y, v.radius);
                    dynamicLayer.endFill();
                }
            }
        }

        function spawnVesicles(x, y, count, type, color) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 2.0 + Math.random() * 2.0;
                vesicles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    type: type, radius: 10, color: color,
                    rotation: Math.random() * Math.PI * 2
                });
            }
        }

        // T51: ATP granules -- state only (§4.4a). Spawn is biased to the outer
        // ATP_ANNULUS_FRAC band of the CURRENT radius (the ground closest to
        // being lost, not the already-shrunk-away region toward baseRadiusX),
        // and rejects positions inside the nucleus or the protein aggregate.
        function updateATP(deltaSec) {
            for (let i = atpGranules.length - 1; i >= 0; i--) {
                atpGranules[i].life -= deltaSec;
                if (atpGranules[i].life <= 0) atpGranules.splice(i, 1);
            }

            if (!genAtLeast(2)) return;
            if (atpGranules.length >= ATP_MAX) return;
            if (Math.random() >= ATP_SPAWN_CHANCE) return;

            let t = Math.random() * Math.PI * 2;
            let frac = ATP_ANNULUS_FRAC + Math.random() * (1 - ATP_ANNULUS_FRAC);
            let gx = activeCell.x + Math.cos(t) * activeCell.radiusX * frac;
            let gy = activeCell.y + Math.sin(t) * activeCell.radiusY * frac;

            if (Math.hypot(gx - activeCell.x, gy - activeCell.y) < NUCLEUS_RADIUS + ATP_RADIUS) return;
            for (let b of malignantMass.blocks) {
                if (Math.hypot(gx - b.x, gy - b.y) < malignantMass.blockSize / 2 + ATP_RADIUS) return;
            }
