<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cellular Zatacka - The Viral Infection</title>
    <!-- Vendored locally so the game runs offline, from file://, and inside
         sandboxes with no CDN egress. Same builds the CDNs served:
         pixi.js 7.3.2, pixi-filters 5.2.1. Keep these two versions in step. -->
    <script src="vendor/pixi.min.js"></script>
    <script src="vendor/pixi-filters.js"></script>
    <style>
        /* Force the page to fill the window and remove scrollbars */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d1a;
        }

        body {
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-top: 10px;
            overflow: hidden;
            position: relative;
        }

        /* Force the PixiJS canvas to act as a background layer */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            background: rgba(13, 13, 26, 0.9);
            padding: 15px 30px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            border: 1px solid rgba(0, 210, 211, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: fit-content;
            min-width: 400px;
        }

        /* Slide the UI up to hide it */
        #ui.hidden-ui {
            transform: translate(-50%, -90%);
            /* Leaves a tiny sliver visible */
        }

        /* The invisible trigger area at the top of the screen */
        #ui-trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            z-index: 90;
        }

        /* Scoreboard remains visible even when menu is hidden */
        #scoreboard {
            margin: 5px 0;
            font-size: 20px;
            color: #00d2d3;
            text-shadow: 0 0 10px rgba(0, 210, 211, 0.5);
        }

        /* When full screen is active, strip away the borders and fill the monitor */
        :fullscreen #game-container {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            box-shadow: none;
        }

        .controls {
            margin-top: 5px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        select,
        button {
            background: #0984e3;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        select {
            background: #2d3436;
        }

        button:hover {
            background: #74b9ff;
        }

        .fullscreen-btn {
            background: #6c5ce7;
        }

        .fullscreen-btn:hover {
            background: #a29bfe;
        }

        h3 {
            margin: 5px 0;
            font-weight: normal;
            color: #b2bec3;
        }

        h2 {
            margin: 5px 0;
        }

        #globalWarning {
            height: 28px;
            color: #ff4757;
            text-shadow: 0 0 10px #ff4757;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>

<body>

    <div id="ui-trigger"></div>
    <div id="devIndicator"
        style="display: none; position: absolute; top: 10px; right: 20px; color: #00ff00; font-weight: bold; font-family: monospace; font-size: 13px; line-height: 1.4; white-space: pre; z-index: 1000; text-shadow: 0 0 5px #00ff00; pointer-events: none;">
    </div>

    <h2 id="globalWarning"
        style="display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%); color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.8); font-size: 28px; z-index: 200; pointer-events: none;">
    </h2>

    <div id="ui">
        <div class="controls">
            <select id="modeSelect" onchange="updateUI()">
                <option value="1">1 Player (Solo)</option>
                <option value="2">2 Players (Versus)</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
            </select>

            <select id="aiSelect" onchange="updateUI()">
                <option value="0">AI Competitors: None</option>
                <option value="1">1 AI Bot</option>
                <option value="2">2 AI Bots</option>
                <option value="3">3 AI Bots</option>
            </select>

            <select id="cameraSelect" onchange="updateUI()">
                <option value="shared">Camera: Shared View</option>
                <option value="split">Camera: Split Screen</option>
            </select>

            <select id="speedSelect" onchange="updateUI()">
                <option value="1.5" selected>Speed: Normal</option>
                <option value="2.5">Speed: Fast</option>
                <option value="3.5">Speed: Very Fast</option>
            </select>

            <select id="qualitySelect" onchange="updateUI()">
                <option value="low" selected>Glow: Low</option>
                <option value="medium">Glow: Medium</option>
                <option value="high">Glow: High</option>
            </select>
            <button onclick="startRound()">Start Game</button>
            <button class="fullscreen-btn" onclick="toggleFullScreen()">Fullscreen</button>
        </div>
        <h3 id="controlsText">P1 (Blue): Left/Right Arrows</h3>
        <h2 id="scoreboard">Survival Time: 0.0s</h2>
    </div>

    <div id="game-container"></div>

    <script>
        // --- 0. Fuzzer instrumentation (T04) ---
        // Declared before anything else can throw, so the error trap catches
        // init-time failures too.
        let fuzzStats = {
            rounds: 0, elapsed: 0, tracePoints: 0, gridCells: 0, worldChildren: 0,
            vesicles: 0, organelles: 0, virusParticles: 0, heapMB: null, errors: 0
        };
        window.fuzzStats = fuzzStats;
        window.addEventListener('error', e => { fuzzStats.errors++; console.error('[FUZZ]', e.message); });
        window.addEventListener('unhandledrejection', e => { fuzzStats.errors++; });

        // Recursive display-object count under a PIXI container -- the leak canary
        // for startRound()'s removeChildren() calls (T05).
        function countDisplayObjects(container) {
            let count = container.children.length;
            for (let i = 0; i < container.children.length; i++) {
                let child = container.children[i];
                if (child.children) count += countDisplayObjects(child);
            }
            return count;
        }

        // --- 1. Init PixiJS ---
        // Grab the initial container size instead of hardcoding 800x600
        const gameContainer = document.getElementById('game-container');
        let SCREEN_WIDTH = window.innerWidth;
        let SCREEN_HEIGHT = window.innerHeight;

        const app = new PIXI.Application({
            resizeTo: window, // keep Pixi synced with the browser window
            backgroundColor: 0x0a0a14,
            antialias: true
        });

        app.view.style.position = 'absolute';
        app.view.style.top = '0';
        app.view.style.left = '0';
        app.view.style.width = '100vw';
        app.view.style.height = '100vh';
        app.view.style.zIndex = '1';

        document.body.appendChild(app.view);

        // Listen for window size changes so the UI and camera math stay in sync.
        window.addEventListener('resize', () => {
            SCREEN_WIDTH = window.innerWidth;
            SCREEN_HEIGHT = window.innerHeight;
            app.renderer.resize(SCREEN_WIDTH, SCREEN_HEIGHT);
            // Split-screen viewports were sized for the old window; drop them so
            // updateCamera() rebuilds fresh RenderTextures at the new size (T05).
            purgeSplitScreen();
        });

        // --- 2. Layers & World Camera ---
        const world = new PIXI.Container();
        app.stage.addChild(world);

        const backgroundLayer = new PIXI.Container();
        const mitosisLayer = new PIXI.Graphics();
        const nucleusLayer = new PIXI.Graphics();
        const golgiERContainer = new PIXI.Container();
        const rotatingContainer = new PIXI.Container();
        const organellesLayer = new PIXI.Graphics();
        const trailLayer = new PIXI.Container();
        const dynamicLayer = new PIXI.Graphics(); // Vesicles
        const virusLayer = new PIXI.Graphics();   // New layer for the Infection event
        const uiBarsLayer = new PIXI.Graphics();

        world.addChild(backgroundLayer);
        world.addChild(mitosisLayer); 
        world.addChild(nucleusLayer);
        world.addChild(golgiERContainer);
        golgiERContainer.addChild(rotatingContainer);
        world.addChild(organellesLayer);
        world.addChild(trailLayer);
        world.addChild(dynamicLayer);
        world.addChild(virusLayer);
        world.addChild(uiBarsLayer);

        // Detach and fully release every child of a container (T05).
        // texture:false is deliberate -- nothing here owns a texture except the
        // split-screen RenderTextures, which are handled separately in startRound().
        function purgeContainer(container) {
            for (let i = container.children.length - 1; i >= 0; i--) {
                let child = container.children[i];
                container.removeChild(child);
                if (child && !child.destroyed) {
                    child.destroy({ children: true, texture: false, baseTexture: false });
                }
            }
        }

        const trailGlow = new PIXI.Graphics();
        const blurFilter = new PIXI.BlurFilter();
        blurFilter.blur = 4;
        trailGlow.filters = [blurFilter];
        trailGlow.blendMode = PIXI.BLEND_MODES.ADD;
        const trailCore = new PIXI.Graphics();
        trailCore.blendMode = PIXI.BLEND_MODES.ADD;
        trailLayer.addChild(trailGlow);
        trailLayer.addChild(trailCore);

        // --- GLOBAL BLOOM FILTER + GLOW QUALITY TIERS ---
        // High is the original tuning. Low is the default: the bloom threshold is
        // raised so fewer pixels bloom at all, and both the bloom and the trail
        // halo are cheaper (lower `quality` and `blur` are the two settings that
        // actually cost frame time). Medium sits midway on every value.
        const QUALITY_TIERS = {
            low:    { threshold: 0.6,  bloomScale: 0.6, brightness: 1.0, blur: 4, quality: 2, trailBlur: 2 },
            medium: { threshold: 0.45, bloomScale: 1.0, brightness: 1.1, blur: 6, quality: 3, trailBlur: 3 },
            high:   { threshold: 0.3,  bloomScale: 1.5, brightness: 1.2, blur: 8, quality: 4, trailBlur: 4 }
        };
        let glowQuality = 'low';
        let bloomFilter = null;   // module-scope so applyGlowQuality can retune it

        if (typeof PIXI.filters.AdvancedBloomFilter !== 'undefined') {
            bloomFilter = new PIXI.filters.AdvancedBloomFilter(QUALITY_TIERS.low);
            world.filters = [bloomFilter];
        }

        // Visual only — never touches gameplay, collision or timing.
        window.applyGlowQuality = function (tier) {
            let t = QUALITY_TIERS[tier];
            if (!t) return;
            glowQuality = tier;
            if (bloomFilter) {
                bloomFilter.threshold = t.threshold;
                bloomFilter.bloomScale = t.bloomScale;
                bloomFilter.brightness = t.brightness;
                bloomFilter.blur = t.blur;
                bloomFilter.quality = t.quality;
            }
            blurFilter.blur = t.trailBlur;
        };

        // updateUI() is not called at startup, so apply the default tier here or
        // the trail halo would stay at the High value until a dropdown is touched.
        applyGlowQuality('low');

        // --- 3. Game State & Constants ---
        let activeCell = { x: 1500, y: 1500, radiusX: 1400, radiusY: 1200, radius: 1400, generation: 1 };

        // T11: single gating point for Phase 3 mechanics -- all of them must call
        // this rather than reading activeCell.generation directly.
        function genAtLeast(n) { return activeCell.generation >= n; }

        let cytosolParticles = []; // Fluid background particles
        let membraneProtrusionsList = []; // Animated membrane blobs
        let cytosolContainer;


        const TRACE_WIDTH = 4;
        const TRACE_HITBOX = TRACE_WIDTH * 0.6;

        const MAX_TRACE_POINTS = 20000; // per-player memory/perf bound, not a gameplay cap; see T07 commit message
        const NECK_LENGTH = 35; // px of own trace (measured along the current segment) that cannot kill you; replaces the old 15/16-frame skip so the immune neck is the same physical length at every speed (T08)
        const MIN_TAIL_POINTS = 48; // never trim the growing last segment below this; must cover NECK_LENGTH px at the slowest speed (1.5px/frame -> ~24 points), doubled for safety margin like the constant it replaces

        const GAP_CHANCE = 0.008;
        const GAP_LENGTH = 12;
        const EFFECT_DURATION = 10.0;

        let isPlaying = false;
        let currentMode = 1;
        let aiCount = 0;
        let currentSpeed = 1.5;
        let survivalTime = 0;
        let playerWins = [0, 0, 0, 0, 0]; // Index matches player ID (1 to 4, index 0 is unused)

        let players = [];
        let organelles = [];
        let vesicles = [];
        let splitTextures = [];
        let splitSprites = [];
        let globalRotation = 0;

        // Destroy the split-screen sprites/RenderTextures and empty both arrays.
        // updateCamera() recreates them on demand (T05). Safe to call twice.
        function purgeSplitScreen() {
            for (let i = 0; i < splitSprites.length; i++) {
                let sprite = splitSprites[i];
                let rt = splitTextures[i];
                if (sprite && !sprite.destroyed) sprite.destroy({ texture: false });
                if (rt && !rt.destroyed) rt.destroy(true);
            }
            splitSprites = [];
            splitTextures = [];
        }

        // INFECTION STATE OBJECT
        let infection = {
            state: 'none',
            x: 0, y: 0, angle: 0,
            particles: [],
            nextWarningTime: 60, // The first warning triggers at 60
            triggerTime: 0
        };

        // THE MITOSIS EVENT SYSTEM
        let mitosis = {
            state: 'idle', // 'idle', 'forming', 'narrowing'
            nextTriggerTime: 240, // Production: 4 minutes
            eventStartTime: 0,
            cellB: { x: 0, y: 0 },
            bridge: { x: 0, y: 0, width: 0, height: 0, maxWidth: 600 },
            direction: 0,
            currentWidth: 600,
            microtubules: [],
            progenitor: { active: false },
            nucleusDestroyed: false,
            generationCounted: false // T11: guards the Gen++ at the snap to once per event
        };

        let devMode = false;      // master switch: enables the hotkeys + the HUD, nothing else
        let godMode = false;      // disables death checks
        let fuzzActive = false;   // runs the soak loop
        let legendVisible = true; // shows/hides the dev HUD panel while devMode is on
        let fuzzStartWallTime = null;
        let fuzzTopUpTimer = 0;
        let fuzzToggleTimer = 0;
        let fuzzStatsTimer = 0;
        const scoreText = document.getElementById('scoreboard');
        const warningElement = document.getElementById('globalWarning');
        const modeSelect = document.getElementById('modeSelect');
        const aiSelect = document.getElementById('aiSelect');
        const speedSelect = document.getElementById('speedSelect');
        const uiElement = document.getElementById('ui');
        const uiTrigger = document.getElementById('ui-trigger');

        const ARCS = [
            { type: 'ER', r: 160, thick: 20, span: 1.05, color: 0x0097e6 },
            { type: 'Golgi', r: 230, thick: 14, span: 0.5, color: 0x8c7ae6 },
            { type: 'Golgi', r: 280, thick: 14, span: 0.7, color: 0x8c7ae6 },
            { type: 'Golgi', r: 330, thick: 14, span: 0.9, color: 0x8c7ae6 }
        ];

        const C_MITO = 0x2ecc71;
        const C_LYSO = 0xe84393;
        const C_MEMB = 0x487eb0;

        // --- 4. Environment Generation ---
        let activeArcs = [];
        let centralHitboxes = [];

        function drawArcs() {
            rotatingContainer.removeChildren();
            centralHitboxes = [];
            const structGraph = new PIXI.Graphics();

            // Generate Rough Endoplasmic Reticulum (RER)
            const ER_COLOR = 0x0abde3;
            const RIBO_COLOR = 0xff4757;

            let erActive = activeArcs.some(a => a.type === 'ER');
            if (erActive) {
                if (!window.erData) window.erData = [];
                for (let erGroup = 0; erGroup < 4; erGroup++) {
                    let erPath, thick;

                    if (!window.erData[erGroup]) {
                        let currentAngle = (erGroup * Math.PI * 2 / 4) + (Math.random() * 0.4);
                        let currentR = 150 + Math.random() * 10;
                        thick = 14 + Math.random() * 6;

                        erPath = [];
                        let numLayers = 3 + Math.floor(Math.random() * 2);

                        for (let i = 0; i < numLayers; i++) {
                            let span = 0.8 + Math.random() * 0.6;
                            let dir = (i % 2 === 0) ? 1 : -1;
                            let endAngle = currentAngle + dir * span;

                            let steps = Math.floor(span / 0.05);
                            for (let j = 0; j <= steps; j++) {
                                let a = currentAngle + dir * (j / steps) * span;
                                erPath.push({ x: Math.cos(a) * currentR, y: Math.sin(a) * currentR, r: currentR, a: a });
                            }

                            currentAngle = endAngle;

                            if (i < numLayers - 1) {
                                let nextR = currentR + 25 + Math.random() * 10;
                                let midR = (currentR + nextR) / 2;
                                let cpAngle = currentAngle + dir * 0.2;

                                let startX = Math.cos(currentAngle) * currentR;
                                let startY = Math.sin(currentAngle) * currentR;
                                let cpX = Math.cos(cpAngle) * midR;
                                let cpY = Math.sin(cpAngle) * midR;
                                let endX = Math.cos(currentAngle) * nextR;
                                let endY = Math.sin(currentAngle) * nextR;

                                for (let t = 0.2; t <= 1.0; t += 0.2) {
                                    let bx = Math.pow(1 - t, 2) * startX + 2 * (1 - t) * t * cpX + Math.pow(t, 2) * endX;
                                    let by = Math.pow(1 - t, 2) * startY + 2 * (1 - t) * t * cpY + Math.pow(t, 2) * endY;
                                    erPath.push({ x: bx, y: by, r: midR, a: cpAngle });
                                }

                                currentR = nextR;
                            }
                        }

                        window.erData[erGroup] = { erPath: erPath, thick: thick };
                    } else {
                        erPath = window.erData[erGroup].erPath;
                        thick = window.erData[erGroup].thick;
                    }

                    structGraph.lineStyle({ width: thick, color: ER_COLOR, alpha: 0.7, cap: PIXI.LINE_CAP.ROUND, join: PIXI.LINE_JOIN.ROUND });
                    structGraph.moveTo(erPath[0].x, erPath[0].y);
                    for (let k = 1; k < erPath.length; k++) {
                        structGraph.lineTo(erPath[k].x, erPath[k].y);
                    }

                    centralHitboxes.push({ type: 'path', points: erPath.map(p => ({ x: p.x, y: p.y })), thick: thick });

                    // Draw Ribosomes
                    structGraph.lineStyle(0);
                    structGraph.beginFill(RIBO_COLOR, 0.9);
                    for (let pt of erPath) {
                        let rOuter = pt.r + thick / 2 + 2;
                        let rInner = pt.r - thick / 2 - 2;
                        if (Math.random() > 0.4) structGraph.drawCircle(Math.cos(pt.a) * rOuter, Math.sin(pt.a) * rOuter, 2 + Math.random() * 1.5);
                        if (Math.random() > 0.4) structGraph.drawCircle(Math.cos(pt.a) * rInner, Math.sin(pt.a) * rInner, 2 + Math.random() * 1.5);
                    }
                    structGraph.endFill();
                }
            }

            // Generate ONE Massive Golgi Apparatus
            const GOLGI_COLOR = 0x8c7ae6;
            const VESICLE_COLOR = 0x00d2d3;

            let golgiActive = activeArcs.some(a => a.type === 'Golgi');
            if (golgiActive) {
                if (!window.golgiData) {
                    let gAngle = Math.random() * Math.PI * 2;
                    let gDist = 330 + Math.random() * 10;
                    let gX = Math.cos(gAngle) * gDist;
                    let gY = Math.sin(gAngle) * gDist;
                    let gRot = gAngle + Math.PI / 2;
                    window.golgiData = { x: gX, y: gY, angle: gAngle, rot: gRot, layers: [] };
                } else {
                    window.golgiData.layers = [];
                }

                let gX = window.golgiData.x;
                let gY = window.golgiData.y;
                let gRot = window.golgiData.rot;

                let golgiCont = new PIXI.Container();
                golgiCont.x = gX;
                golgiCont.y = gY;
                golgiCont.rotation = gRot;
                let golgiGraph = new PIXI.Graphics();
                golgiGraph.blendMode = PIXI.BLEND_MODES.ADD;

                for (let layer = 0; layer < 4; layer++) {
                    let layerRadius = 230 + Math.min(2, layer) * 50; // maps layer 0,1,2,3 to 230, 280, 330, 330
                    if (!activeArcs.some(a => a.type === 'Golgi' && a.r === layerRadius)) continue;

                    let yOffset = (layer - 1.5) * 45; // 45px gaps
                    let width = 240 - Math.abs(layer - 1.5) * 40; // varying width
                    let thick = 12 + Math.random() * 3;

                    golgiGraph.lineStyle({ width: thick, color: GOLGI_COLOR, alpha: 0.85, cap: PIXI.LINE_CAP.ROUND });
                    golgiGraph.moveTo(-width / 2, yOffset);
                    golgiGraph.quadraticCurveTo(0, yOffset + 20, width / 2, yOffset);

                    let sacPoints = [];
                    for (let t = 0; t <= 1; t += 0.1) {
                        let lx = Math.pow(1 - t, 2) * (-width / 2) * (1 - t) + 2 * (1 - t) * t * 0 + Math.pow(t, 2) * (width / 2);
                        let ly = Math.pow(1 - t, 2) * yOffset + 2 * (1 - t) * t * (yOffset + 20) + Math.pow(t, 2) * yOffset;
                        sacPoints.push({ lx: lx, ly: ly });
                    }

                    window.golgiData.layers.push({ radius: layerRadius, points: sacPoints });

                    // Re-calculate global points for centralHitboxes
                    let rxPoints = sacPoints.map(pt => {
                        let rx = pt.lx * Math.cos(gRot) - pt.ly * Math.sin(gRot) + gX;
                        let ry = pt.lx * Math.sin(gRot) + pt.ly * Math.cos(gRot) + gY;
                        return { x: rx, y: ry };
                    });
                    centralHitboxes.push({ type: 'path', points: rxPoints, thick: thick });

                    // Swollen cisternae edges
                    golgiGraph.lineStyle(0);
                    golgiGraph.beginFill(GOLGI_COLOR, 0.9);
                    golgiGraph.drawCircle(-width / 2, yOffset, thick / 2 + 5);
                    golgiGraph.drawCircle(width / 2, yOffset, thick / 2 + 5);
                    golgiGraph.endFill();
                }
                golgiCont.addChild(golgiGraph);
                rotatingContainer.addChild(golgiCont);
            }

            if (erActive) {
                rotatingContainer.addChild(structGraph);
            }
        }

        function createOrganelleGraphics(orgObj) {
            let sprite = new PIXI.Graphics();
            let isMito = (orgObj.type === 'mitochondria');
            let radius = orgObj.radius;
            let sizeMult = isMito ? radius / 35 : radius / 25;

            if (isMito) {
                let w = radius * 0.9; 
                let L = radius * 1.6;
                let bendY = orgObj.bendY !== undefined ? orgObj.bendY : (Math.random() - 0.5) * L * 0.5;
                orgObj.bendY = bendY;

                const drawPill = (thick, color, alpha) => {
                    if (thick <= 0) return;
                    sprite.lineStyle({width: thick, color: color, alpha: alpha, cap: PIXI.LINE_CAP.ROUND, join: PIXI.LINE_JOIN.ROUND});
                    sprite.moveTo(-L/2, 0);
                    sprite.quadraticCurveTo(0, bendY, L/2, 0);
                };

                drawPill(w + 10, C_MITO, 0.2); 
                drawPill(w, C_MITO, 0.6);      
                drawPill(w - 6, 0x0d0d1a, 1.0); 
                drawPill(w - 10, 0x55efc4, 0.8); 
                drawPill(w - 14, 0x0d0d1a, 1.0); 

                sprite.lineStyle({width: 2 + sizeMult, color: 0x55efc4, alpha: 0.9, cap: PIXI.LINE_CAP.ROUND});
                let numCristae = 4 + Math.floor(L / 15); 
                for (let j = 1; j <= numCristae; j++) {
                    let t = j / (numCristae + 1);
                    t += (Math.random() - 0.5) * (0.6 / numCristae); 
                    
                    let p0x = -L/2, p0y = 0;
                    let p1x = 0, p1y = bendY;
                    let p2x = L/2, p2y = 0;
                    
                    let bx = Math.pow(1-t, 2)*p0x + 2*(1-t)*t*p1x + Math.pow(t, 2)*p2x;
                    let by = Math.pow(1-t, 2)*p0y + 2*(1-t)*t*p1y + Math.pow(t, 2)*p2y;
                    
                    let tx = 2*(1-t)*(p1x - p0x) + 2*t*(p2x - p1x);
                    let ty = 2*(1-t)*(p1y - p0y) + 2*t*(p2y - p1y);
                    let len = Math.hypot(tx, ty);
                    let nx = -ty / len; 
                    let ny = tx / len;
                    
                    let side = Math.random() > 0.5 ? 1 : -1;
                    let startDist = (w - 12) / 2; 
                    if (startDist <= 0) continue;
                    let endDist = (Math.random() > 0.3) ? -startDist * (0.1 + Math.random()*0.3) : startDist * (0.2 + Math.random()*0.3);
                    
                    let startX = bx + nx * startDist * side;
                    let startY = by + ny * startDist * side;
                    let endX = bx + nx * endDist * side;
                    let endY = by + ny * endDist * side;
                    
                    let midX = (startX + endX) / 2;
                    let midY = (startY + endY) / 2;
                    let curveOffset = (Math.random() - 0.5) * 8 * sizeMult;
                    midX += (tx/len) * curveOffset;
                    midY += (ty/len) * curveOffset;
                    
                    sprite.moveTo(startX, startY);
                    sprite.quadraticCurveTo(midX, midY, endX, endY);
                }
            } else {
                let w = radius;
                sprite.beginFill(0x0d0d1a, 0.6);
                sprite.lineStyle(3 * sizeMult, 0xff4757, 0.6);
                sprite.drawCircle(0, 0, w);
                sprite.endFill();
                
                let numBubbles = Math.floor((8 + Math.random() * 6) * sizeMult);
                for(let j=0; j<numBubbles; j++) {
                    let br = Math.random() * (w - 6 * sizeMult);
                    let ba = Math.random() * Math.PI * 2;
                    let bubR = (3 + Math.random() * 5) * sizeMult;
                    sprite.beginFill(0xff6b81, 0.8);
                    sprite.lineStyle(1 * sizeMult, 0xff4757, 1);
                    sprite.drawCircle(Math.cos(ba) * br, Math.sin(ba) * br, bubR);
                    sprite.endFill();
                    
                    sprite.beginFill(0xffffff, 0.9);
                    sprite.lineStyle(0);
                    sprite.drawCircle(Math.cos(ba) * br, Math.sin(ba) * br, bubR * 0.4);
                    sprite.endFill();
                }
            }

            sprite.x = orgObj.x;
            sprite.y = orgObj.y;
            sprite.rotation = orgObj.rotation;
            return sprite;
        }

        function generateMap(keepOrganelles = false) {
            purgeContainer(backgroundLayer);
            nucleusLayer.clear();
            nucleusLayer.visible = true;
            golgiERContainer.visible = true;
            purgeContainer(rotatingContainer);
            window.golgiData = null; // Reset Golgi layout parameters for a fresh round!
            window.erData = null; // Reset ER layout parameters for a fresh round!

            const cellBg = new PIXI.Graphics();

            cellBg.beginFill(0x0d0d1a);

            // 2. Thick layered glowing membrane
            cellBg.lineStyle(15, 0x1e3799, 0.4);
            cellBg.drawEllipse(activeCell.x, activeCell.y, activeCell.radiusX + 8, activeCell.radiusY + 8);

            cellBg.lineStyle(8, 0x4a69bd, 0.8);
            cellBg.drawEllipse(activeCell.x, activeCell.y, activeCell.radiusX, activeCell.radiusY);

            membraneProtrusionsList = [];

            let validProtrusions = [];
            let maxAttempts = 300;
            let placed = 0;

            for (let i = 0; i < maxAttempts && placed < 28; i++) {

                // Calculate required angular space to prevent overlap
                // Fillet is 0.6 * R, padding is 5. Total half-width = R * 1.6 + 5
                let halfWidth = maxR * 1.6 + 5;
                // Conservative angular width using the minor axis (1200)
                let requiredAngularSpace = halfWidth / 1200.0;

                let t = Math.random() * Math.PI * 2;
                let isValid = true;

                for (let existing of validProtrusions) {
                    let diff = Math.abs(t - existing.t);
                    if (diff > Math.PI) diff = Math.PI * 2 - diff;

                    // Ensure distance is greater than their combined radii + 5% padding
                    if (diff < (requiredAngularSpace + existing.requiredAngularSpace) * 1.05) {
                        isValid = false;
                        break;
                    }
                }

                if (!isValid) continue;

                validProtrusions.push({ t: t, requiredAngularSpace: requiredAngularSpace });
                placed++;

                let p = new PIXI.Graphics();
                p.redraw = function (currentR) {
                    this.clear();
                    if (currentR < 1) return;

                    let rc = this.rc;
                    let fillet = currentR * 0.6;
                    let eraseY = currentR + fillet + 5;

                    // 1. Dark patch to erase cellBg line
                    this.beginFill(0x0d0d1a);
                    this.lineStyle(0);
                    this.drawRect(-20, -eraseY, 40, eraseY * 2);
                    this.endFill();

                    // Helper to compute local X on the curved ellipse using osculating parabola
                    const getX = (baseX, y) => baseX - (y * y) / (2 * rc);

                    // 2. Outer Layer
                    this.lineStyle({ width: 15, color: 0x1e3799, alpha: 0.4, join: PIXI.LINE_JOIN.ROUND });
                    this.moveTo(getX(8, -eraseY), -eraseY);
                    let outStart = -(currentR + fillet);
                    this.lineTo(getX(8, outStart), outStart);
                    this.quadraticCurveTo(getX(8, -currentR), -currentR, 8 + fillet, -currentR);
                    this.arc(8 + fillet, 0, currentR, -Math.PI / 2, Math.PI / 2);
                    this.quadraticCurveTo(getX(8, currentR), currentR, getX(8, -outStart), -outStart);
                    this.lineTo(getX(8, eraseY), eraseY);

                    // 3. Middle Layer
                    let midR = Math.max(0, currentR - 8);
                    let midFillet = midR * 0.6;
                    this.lineStyle({ width: 8, color: 0x4a69bd, alpha: 0.8, join: PIXI.LINE_JOIN.ROUND });
                    this.moveTo(getX(0, -eraseY), -eraseY);
                    if (midR > 0) {
                        let midStart = -(midR + midFillet);
                        this.lineTo(getX(0, midStart), midStart);
                        this.quadraticCurveTo(getX(0, -midR), -midR, 0 + midFillet, -midR);
                        this.arc(0 + midFillet, 0, midR, -Math.PI / 2, Math.PI / 2);
                        this.quadraticCurveTo(getX(0, midR), midR, getX(0, -midStart), -midStart);
                    } else {
                        this.lineTo(getX(0, 0), 0);
                    }
                    this.lineTo(getX(0, eraseY), eraseY);

                    // 4. Inner Layer
                    let inR = Math.max(0, currentR - 11);
                    let inFillet = inR * 0.6;
                    this.lineStyle({ width: 3, color: 0x82ccdd, alpha: 1.0, join: PIXI.LINE_JOIN.ROUND });
                    this.moveTo(getX(-3, -eraseY), -eraseY);
                    if (inR > 0) {
                        let inStart = -(inR + inFillet);
                        this.lineTo(getX(-3, inStart), inStart);
                        this.quadraticCurveTo(getX(-3, -inR), -inR, -3 + inFillet, -inR);
                        this.arc(-3 + inFillet, 0, inR, -Math.PI / 2, Math.PI / 2);
                        this.quadraticCurveTo(getX(-3, inR), inR, getX(-3, -inStart), -inStart);
                    } else {
                        this.lineTo(getX(-3, 0), 0);
                    }
                    this.lineTo(getX(-3, eraseY), eraseY);
                };

                let a = activeCell.radiusX;
                let b = activeCell.radiusY;
                p.angleRad = t;
                p.maxRadius = maxR;
                p.phase = Math.random() * Math.PI * 2;
                p.speed = 0.5 + Math.random() * 1.5;

                // Normal angle for ellipse points perfectly outward
                p.normAngle = Math.atan2(a * Math.sin(t), b * Math.cos(t));
                p.rotation = p.normAngle;

                // Radius of curvature
                let a2_sin2 = Math.pow(a * Math.sin(t), 2);
                let b2_cos2 = Math.pow(b * Math.cos(t), 2);
                p.rc = Math.pow(a2_sin2 + b2_cos2, 1.5) / (a * b);

                p.x = activeCell.x + a * Math.cos(t);
                p.y = activeCell.y + b * Math.sin(t);

                p.redraw(0); // Initial transparent state

                membraneProtrusionsContainer.addChild(p);
                membraneProtrusionsList.push(p);
            }

            // 3. Cytosol Fluid (Drifting organic blobs)
            cytosolContainer = new PIXI.Container();
            backgroundLayer.addChild(cytosolContainer);

            cytosolParticles = [];
            for (let i = 0; i < 800; i++) {
                let px = activeCell.x + (Math.random() * 2 - 1) * activeCell.radiusX;
                let py = activeCell.y + (Math.random() * 2 - 1) * activeCell.radiusY;

                // Only spawn them roughly inside the cell
                if ((Math.pow(px - activeCell.x, 2) / Math.pow(activeCell.radiusX, 2)) + (Math.pow(py - activeCell.y, 2) / Math.pow(activeCell.radiusY, 2)) <= 1) {
                    let blob = new PIXI.Graphics();

                    let color = 0x1e3799; // Base blue

                        color = 0x82ccdd; // Bright Cyan
                        alpha = 0.4 + Math.random() * 0.3; // Much brighter
                        radius = 5 + Math.random() * 20; // Brighter ones are smaller
                    } else if (colorRoll > 0.7) {
                        color = 0x6c5ce7; // Purple
                        alpha = 0.2 + Math.random() * 0.2;
                    } else if (colorRoll > 0.5) {
                        color = 0x4a69bd; // Medium blue
                    }

                    blob.beginFill(color, alpha);
                    blob.drawCircle(0, 0, radius);
                    blob.endFill();
                    blob.x = px;
                    blob.y = py;
                    blob.vx = (Math.random() - 0.5) * 0.6;
                    blob.vy = (Math.random() - 0.5) * 0.6;
                    blob.phase = Math.random() * Math.PI * 2;
                    blob.baseAlpha = alpha;
                    cytosolContainer.addChild(blob);
                    cytosolParticles.push(blob);
                }
            }

            // Mask correctly reapplied so particles don't bleed out freely
            window.bgMask = new PIXI.Graphics();
            window.bgMask.beginFill(0xffffff);
            window.bgMask.drawEllipse(activeCell.x, activeCell.y, activeCell.radiusX, activeCell.radiusY);

            backgroundLayer.addChild(window.bgMask);
            cytosolContainer.mask = window.bgMask;

            // Nucleus Redesign

            nucleusLayer.lineStyle(5, 0x6c5ce7, 0.8);
            nucleusLayer.drawCircle(activeCell.x, activeCell.y, 130);
            nucleusLayer.endFill();

            // Nucleolus (Dense, off-center inner core)
            let nucAngle = Math.random() * Math.PI * 2;
            let nucDist = 30 + Math.random() * 30;
            let nucX = activeCell.x + Math.cos(nucAngle) * nucDist;
            let nucY = activeCell.y + Math.sin(nucAngle) * nucDist;
            nucleusLayer.beginFill(0x4834d4, 0.9);
            nucleusLayer.lineStyle(3, 0x686de0, 0.8);
            nucleusLayer.drawCircle(nucX, nucY, 35);
            nucleusLayer.endFill();

            // Chromatin (Procedural squiggly lines)
            nucleusLayer.lineStyle(2, 0xa29bfe, 0.5);
            for (let i = 0; i < 20; i++) {
                let startX = activeCell.x + (Math.random() - 0.5) * 180;
                let startY = activeCell.y + (Math.random() - 0.5) * 180;
                if (Math.hypot(startX - activeCell.x, startY - activeCell.y) > 115) continue;
                if (Math.hypot(startX - nucX, startY - nucY) < 40) continue; // avoid nucleolus

                nucleusLayer.moveTo(startX, startY);
                let currentX = startX;
                let currentY = startY;
                for (let j = 0; j < 6; j++) {
                    let angle = Math.random() * Math.PI * 2;
                    let len = 10 + Math.random() * 20;
                    let nextX = currentX + Math.cos(angle) * len;
                    let nextY = currentY + Math.sin(angle) * len;
                    if (Math.hypot(nextX - activeCell.x, nextY - activeCell.y) > 115) break;
                    let cpX = currentX + Math.cos(angle + 0.5) * len * 0.5;
                    let cpY = currentY + Math.sin(angle + 0.5) * len * 0.5;
                    nucleusLayer.quadraticCurveTo(cpX, cpY, nextX, nextY);
                    currentX = nextX;
                    currentY = nextY;
                }
            }

            nucleusLayer.lineStyle(3, 0xa29bfe, 0.8);
            for (let a = 0; a < Math.PI * 2; a += Math.PI / 6 + Math.random() * 0.1) {
                nucleusLayer.beginFill(0x0d0d1a);
                nucleusLayer.drawCircle(activeCell.x + Math.cos(a) * 130, activeCell.y + Math.sin(a) * 130, 6);
                nucleusLayer.endFill();

            rotatingContainer.position.set(activeCell.x, activeCell.y);

            activeArcs = JSON.parse(JSON.stringify(ARCS));
            drawArcs(activeArcs);

            window.nucleusMask = null;
            nucleusLayer.mask = null;

            if (!keepOrganelles) {
                purgeContainer(organellesLayer); // Clean up old sprites
                organellesLayer.clear();

                organelles = [];
                let attempts = 0;
                let p1Spawn = { x: activeCell.x - 600, y: activeCell.y };
                let p2Spawn = { x: activeCell.x + 600, y: activeCell.y };

                while (organelles.length < 25 && attempts < 1000) {
                    attempts++;
                    let x = activeCell.x + (Math.random() * 2 - 1) * activeCell.radiusX * 0.85;
                    let y = activeCell.y + (Math.random() * 2 - 1) * activeCell.radiusY * 0.85;

                    let distToCenter = Math.hypot(x - activeCell.x, y - activeCell.y);
                    if (distToCenter < 400) continue;
                    if (isOutsideCell(x, y, 50)) continue;

                    if (Math.hypot(x - p1Spawn.x, y - p1Spawn.y) < 200) continue;
                    if (Math.hypot(x - p2Spawn.x, y - p2Spawn.y) < 200) continue;

                    let isMito = Math.random() > 0.4;

                        : [0.5, 1.0, 1.5, 2.0][Math.floor(Math.random() * 4)];
